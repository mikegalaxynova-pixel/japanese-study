<!DOCTYPE html>
<html lang="zh-CN" data-theme="n2" data-level="n2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JLPT N2 单词朗读｜按五十音</title>
<meta name="description" content="JLPT N2 动词、形容词、名词按五十音统一朗读，点开可看读音、意思、词性和例句。">
<meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1b4b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日语复习">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../js/dekiru-words.css?v=10">
</head>
<body>
<a class="skip" href="#main">跳到内容</a>
<header>
  <div class="topnav">
    <a class="site-home" href="../index.html">← 首页</a>
  </div>
  <h1 id="page-title">JLPT N2 单词</h1>
  <p class="lead" id="lead">N2 动词、形容词、名词共 1,901 个单词，按五十音统一复习。也可以只看某一词性。点一类的 ▶ 播放会慢慢读完；点单词可看详情。</p>
  <div class="level-filters" role="tablist" aria-label="词性">
    <button type="button" data-level="all" class="on" aria-pressed="true">全部</button>
    <button type="button" data-level="verb" aria-pressed="false">动词</button>
    <button type="button" data-level="adj" aria-pressed="false">形容词</button>
    <button type="button" data-level="noun" aria-pressed="false">名词</button>
  </div>
  <p class="hint hint-head">注意：手机锁屏或切到后台后，朗读一般会停止。请保持屏幕亮着（播放时本页会尽量防止自动锁屏）。</p>
</header>

<div class="player-wrap" id="player-wrap">
  <div class="now" aria-live="polite">
    <div class="now-word" id="now-word">—</div>
    <div class="now-reading" id="now-reading">请选择一个类别</div>
    <div class="now-zh" id="now-zh"></div>
    <div class="now-meta"><span id="now-progress">0 / 0</span></div>
  </div>
  <div class="controls">
    <button type="button" id="btn-prev" aria-label="上一词">上一词</button>
    <button type="button" id="btn-play" aria-label="播放或暂停">▶ 播放</button>
    <button type="button" id="btn-stop" aria-label="停止">停止</button>
    <button type="button" id="btn-next" aria-label="下一词">下一词</button>
  </div>
  <div class="opts" role="group" aria-label="朗读选项">
    <button type="button" id="opt-slow" class="on" aria-pressed="true">慢</button>
    <button type="button" id="opt-normal" aria-pressed="false">正常</button>
    <button type="button" id="opt-twice" aria-pressed="false">读两遍</button>
    <button type="button" id="opt-loop" aria-pressed="false">循环</button>
    <button type="button" id="opt-random" aria-pressed="false">随机顺序</button>
    <button type="button" id="opt-restart">从头</button>
  </div>
</div>

<main id="main">
  <div class="toolbar">
    <input type="search" id="search" placeholder="搜索汉字、读音、中文或英语" enterkeyhint="search" autocomplete="off" aria-label="搜索汉字、读音、中文或英语">
  </div>
  <div class="cats" id="cats" role="list"></div>
  <div class="list-head">
    <span id="list-title">全部类别</span>
    <span class="sub" id="list-count"></span>
  </div>
  <div class="list" id="list"></div>
  <p class="status" id="status">正在载入词表…</p>
</main>
<footer>
  <p>词表来自本站已有的 JLPT N2 动词、形容词、名词复习页（302＋127＋1,472），按读音的第一个假名分组。同一词、同一读音只保留一条。没有另外编造词条或意思。中文释义若来自原页的自译，会标「自译」；例句沿用原页标签（多为「新例句」）。</p>
</footer>

<div class="backdrop" id="backdrop" hidden aria-hidden="true"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="单词详情" hidden aria-hidden="true"></div>

<script>
window.DEKIRU_CONFIG = {
  dataUrl: "words.json",
  storageKey: "n2_words_v1",
  swUrl: "../sw.js",
  theme: "n2",
  filters: [
    { id: "all", label: "全部" },
    { id: "verb", label: "动词" },
    { id: "adj", label: "形容词" },
    { id: "noun", label: "名词" }
  ],
  levelBadges: {
    verb: { label: "动词", cls: "lv-verb" },
    adj: { label: "形容词", cls: "lv-adj" },
    noun: { label: "名词", cls: "lv-noun" }
  },
  titles: {
    all: "JLPT N2 单词",
    verb: "JLPT N2 动词",
    adj: "JLPT N2 形容词",
    noun: "JLPT N2 名词"
  },
  leads: {
    all: "N2 动词、形容词、名词共 {n} 个单词，按五十音统一复习。也可以只看某一词性。点一类的 ▶ 播放会慢慢读完；点单词可看详情。",
    verb: "N2 动词 {n} 个，按五十音分组。点一类的 ▶ 播放，会慢慢把这类词全部读出来；点单词可看详情。",
    adj: "N2 形容词 {n} 个，按五十音分组。点一类的 ▶ 播放，会慢慢把这类词全部读出来；点单词可看详情。",
    noun: "N2 名词（含副词、寒暄等）{n} 个，按五十音分组。点一类的 ▶ 播放，会慢慢把这类词全部读出来；点单词可看详情。"
  }
};
</script>
<script src="../js/dekiru-words.js?v=10" defer></script>
</body>
</html>
