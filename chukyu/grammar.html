<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --ink:#172033; --muted:#5f6b7a; --line:#e2e6ef;
  --accent:#4f46e5; --accent-ink:#fff; --soft:#eef2ff;
  --tb:#047857; --tb-bg:#ecfdf5; --warn:#b45309; --warn-bg:#fff7ed;
  --shadow:0 8px 24px rgba(23,32,51,.06); --tap:46px; color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f172a; --panel:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
    --accent:#a5b4fc; --accent-ink:#1e1b4b; --soft:#172554;
    --tb:#6ee7b7; --tb-bg:#063b2c; --warn:#fdba74; --warn-bg:#3b2714;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK JP","PingFang SC","Noto Sans SC",sans-serif}
button,input{font:inherit}
header{padding:22px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));background:linear-gradient(135deg,#0f766e 0%,#0e7490 50%,#4f46e5 100%);color:#fff}
h1{font-size:clamp(22px,6.4vw,32px);line-height:1.25;margin:0 0 6px}
header p{margin:0;opacity:.92;font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:#ffffff22;border:1px solid #ffffff3a;border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px max(12px,env(safe-area-inset-left)) 0;background:var(--bg)}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;min-height:48px;cursor:pointer;font-size:14px;font-weight:650;padding:4px}
.tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toolbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left)) 6px}
.search{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:10px 14px;outline:none;font-size:16px}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chips{display:flex;gap:7px;overflow:auto;padding:7px 0 1px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:999px;white-space:nowrap;min-height:40px;cursor:pointer;font-size:15px}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:750}
.chip.lc{min-width:44px;font-weight:700}
.controls{display:flex;align-items:center;justify-content:space-between;gap:4px 12px;padding-top:4px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.toggles{display:flex;gap:2px 14px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px;min-height:38px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-left)) 40px}
.hidden{display:none!important}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.8}
.legend b{color:var(--ink)}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin:0 0 14px;box-shadow:var(--shadow);overflow:hidden}
.lesson>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;min-height:56px}
.lesson>summary::-webkit-details-marker{display:none}
.lnum{flex:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:3px 10px;font-weight:800}
.ltitle{font-weight:800;font-size:19px;line-height:1.35}
.ltitle small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.count{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.inside{padding:0 12px 12px}
.st{margin:6px 0 12px}
.sthead{font-size:14px;color:var(--muted);border-left:4px solid var(--accent);padding:4px 10px;margin:8px 0;background:var(--soft);border-radius:0 10px 10px 0}
.sthead b{color:var(--ink);font-size:15px}
.grid{display:grid;gap:12px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 13px;scroll-margin-top:170px}
.card.flash{outline:3px solid var(--accent)}
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--muted);background:var(--panel);white-space:nowrap}
.badge.cat{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.badge.tb{color:var(--tb);background:var(--tb-bg);border-color:color-mix(in srgb,var(--tb) 35%,transparent)}
.badge.id{background:var(--c);color:#fff;border-color:var(--c)}
@media (prefers-color-scheme:dark){.badge.id{color:#0f172a}}
.pattern{font-size:22px;font-weight:800;line-height:1.9;margin:2px 0;color:var(--ink)}
.conn{font-size:14px;color:var(--muted);background:var(--panel);border-radius:8px;padding:4px 8px;margin:4px 0}
.conn b{color:var(--c);white-space:nowrap}
.mean{font-size:16px;margin:6px 0}
.exs{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.ex{padding:6px 0}
.ex+.ex{border-top:1px dotted var(--line)}
.jp{font-size:19px;line-height:2.05}
.exz{font-size:15px;color:var(--muted)}
.tips{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:14.5px;line-height:1.95}
.tips div::before{content:"⚠️ ";}
.cando{font-size:13px;color:var(--muted);margin-top:6px}
ruby rt{font-size:.55em;color:var(--muted);font-weight:500}
body.hide-ex .exs{display:none}
.empty{text-align:center;color:var(--muted);padding:40px 0}
/* particles & conj */
.pblock{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.pname{font-size:28px;font-weight:900;color:var(--accent);margin-right:8px}
.prom{color:var(--muted);font-size:14px}
.puse{padding:8px 0;border-top:1px dotted var(--line)}
.puse .u{font-weight:700;font-size:15px}
.ljump{border:1px solid var(--line);background:var(--soft);color:var(--accent);border-radius:999px;padding:0 9px;font-size:12px;font-weight:800;cursor:pointer;min-height:26px;margin-left:6px}
table.conj{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
table.conj td{border-top:1px solid var(--line);padding:7px 5px;vertical-align:top;line-height:2}
table.conj td:first-child{white-space:nowrap;font-weight:700;color:var(--muted);font-size:14px}
table.conj td:last-child{color:var(--muted);font-size:13px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 30px}

.top .badge.use{color:var(--c)}
.pex{margin:6px 0 2px;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px dashed color-mix(in srgb,var(--c) 40%,var(--line))}
.pex .lab{font-size:12px;font-weight:800;color:var(--c)}
.line{display:flex;align-items:flex-start;gap:6px}
.line .jp{flex:1;min-width:0}
.pex .jp{font-size:18px}
.spk{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:19px;line-height:1;cursor:pointer;padding:0;margin-top:3px;-webkit-tap-highlight-color:transparent}
.spk:active{transform:scale(.92)}
.speaking{background:color-mix(in srgb,#facc15 32%,transparent);border-radius:8px;box-shadow:0 0 0 2px #facc15}
.speaking .spk,.spk.speaking{background:#facc15;border-color:#eab308;box-shadow:none}
.badge.nw{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.goal{font-size:14px;color:var(--muted);margin:2px 0 6px;padding:6px 10px;background:var(--soft);border-radius:10px}
.rate{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.rate button{border:0;background:transparent;color:var(--ink);min-height:38px;padding:0 12px;cursor:pointer;font-size:14px;font-weight:700}
.rate button.active{background:var(--accent);color:var(--accent-ink)}
.ctitle{font-size:19px;font-weight:850;line-height:1.9}
.crow{padding:8px 0;border-top:1px dotted var(--line)}
.crow .pat{font-weight:800;font-size:17px;line-height:1.9}
.crow .pt{font-size:14.5px;color:var(--ink);margin:2px 0}
.cpoint{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14.5px;line-height:1.95}
.cpoint::before{content:"💡 "}
table.conj td.cx{line-height:2}
table.conj .line .jp{font-size:16px;line-height:2}
.notice{position:fixed;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));z-index:60;background:#1e293b;color:#fff;border-radius:14px;padding:12px 44px 12px 14px;font-size:15px;line-height:1.7;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.notice button{position:absolute;right:8px;top:8px;border:0;background:#ffffff22;color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer}

/* site chrome: home link + prevent horizontal overflow */
html{overflow-x:hidden;max-width:100%}
body{max-width:100%}
img,svg,video,canvas{max-width:100%;height:auto}
.site-home{display:inline-flex;align-items:center;min-height:48px;padding:0 8px 0 0;margin:0 0 2px;color:#fff;font-weight:700;font-size:16px;line-height:1.2;text-decoration:none;letter-spacing:.02em}
.site-home:hover{text-decoration:underline}
.site-home:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:4px}

</style>

和气候。"},{"name":"2 {耳|みみ}でキャッチ","cando":"能够听说明，了解配合气候建造的建筑有什么特点。"},{"name":"3 こんなときどうする？","cando":"朋友因为气候不适应而生病时，能够听对方说并给出建议。"},{"name":"4 {見|み}つけた!","cando":"能够通过阅读说明，了解城镇的特点和历史等。"},{"name":"5 {伝|つた}えてみよう","cando":"能够介绍利用国家或故乡的地形、气候而有的特产和风物。"}]},{"n":7,"title":"{世代|せだい}を{超|こ}えた{交流|こうりゅう}","zh":"跨越世代的交流","goal":"能够通过和背景不同的人交流，拓宽自己的视野。","tasks":[{"name":"1 {見|み}つけた！","cando":"参加新活动之前，能够阅读参加者的体验，了解活动的内容和情况。"},{"name":"2 こんなときどうする？","cando":"能够一边考虑对方是否方便、喜不喜欢，一边邀请对方参加自己感兴趣的活动。"},{"name":"3 {耳|みみ}でキャッチ","cando":"能够听懂因世代、性别而不同的说法。"},{"name":"4 {伝|つた}えてみよう","cando":"能够谈论和遇到的人之间的交流。"}]},{"n":8,"title":"{気持|きも}ちを{伝|つた}える","zh":"传达心情","goal":"能够看场合表达自己的心情、接住对方的心情，和周围的人愉快地沟通。","tasks":[{"name":"1 こんなときどうする？","cando":"能够说明理由，礼貌地向对方请求许可。"},{"name":"2 {見|み}つけた!","cando":"能够了解传递消息的方法，并用到自己的生活里。"},{"name":"3 {耳|みみ}でキャッチ","cando":"能够听对方发牢骚，并理解对方的心情。"},{"name":"4 こんなときどうする?","cando":"能够读邮件，理解发信人想鼓励自己的心情。"},{"name":"5 {伝|つた}えてみよう","cando":"能够连同理由一起说出自己对“怎样表达心情”的想法。"}]},{"n":9,"title":"{言葉|ことば}を{楽|たの}しむ","zh":"享受语言","goal":"能够了解日语丰富的表达，一边和自己国家相近的说法比较、介绍，一边和周围的人愉快地沟通。","tasks":[{"name":"1 {見|み}つけた!","cando":"为了品味一首诗，能够阅读别人写的感想，从而了解那首诗。"},{"name":"2 {耳|みみ}でキャッチ","cando":"能够听谐音、双关的说明，知道语言有趣在哪里。"},{"name":"3 こんなときどうする?","cando":"能够通过拟声词、拟态词，体会日语表达的趣味。"},{"name":"4 {伝|つた}えてみよう","cando":"能够根据自己的经验，谈论用日语的快乐和困难。"},{"name":"5 {耳|みみ}でキャッチ","cando":"就日常生活里听到的日语提问时，能够听懂回答。"}]},{"n":10,"title":"{日本|にほん}を{旅|たび}する","zh":"在日本旅行","goal":"能够在旅行地获得各种信息，愉快、舒适地旅行。也能够分享旅行的回忆。","tasks":[{"name":"1 {見|み}つけた!","cando":"为了选择符合自己兴趣的旅行团，能够阅读旅行宣传册。"},{"name":"2 {耳|みみ}でキャッチ","cando":"能够听导游的说明，理解看点和需要注意的事。"},{"name":"3 こんなときどうする?","cando":"能够一边回忆地点和当时的情况，一边打电话询问落下的东西。"},{"name":"4 {耳|みみ}でキャッチ","cando":"能够听车内广播并获得信息。"},{"name":"5 {伝|つた}えてみよう","cando":"能够向周围的人介绍留在心里的那次旅行。"}]},{"n":11,"title":"ライフスタイル","zh":"生活方式","goal":"能够了解各种各样的人的生活方式，重新思考自己的生活观，拓宽视野。","tasks":[{"name":"1 {耳|みみ}でキャッチ","cando":"能够听电视新闻对调查结果的解说，了解日本大学生大致的生活。"},{"name":"2 {見|み}つけた！","cando":"能够读信息杂志，了解衣食住方面最近在谈什么。"},{"name":"3 こんなときどうする?","cando":"能够向亲 えてみよう","cando":"能够听别人对工作的想法，并说出自己的意见。"},{"name":"2 {見|み}つけた!","cando":"能够阅读面向留学生的求职小册子，理解内容并获得信息。"},{"name":"3 {耳|みみ}でキャッチ","cando":"能够听学长学姐的话，获得找工作的信息。"},{"name":"4 こんなときどうする?","cando":"能够用邮件礼貌地向长辈提出请求。"},{"name":"5 こんなときどうする?","cando":"能够给初次见面的人打电话，一边问对方是否方便，一边约好见面。"}]},{"n":18,"title":"{地球|ちきゅう}に{生|い}きる","zh":"生活在地球上","goal":"能够理解环境方面正在成为问题的事情，思考并实践自己能为环境做的事。","tasks":[{"name":"1 {耳|みみ}でキャッチ","cando":"能够听新闻，了解身边的环境问题和对策。"},{"name":"2 こんなときどうする?","cando":"处理不再需要的东西时，能够向想要的人清楚地说明，并把东西让给对方。"},{"name":"3 {見|み}つけた!","cando":"能够阅读关于受环境变化影响的动植物的文章并理解。"},{"name":"4 {伝|つた}えてみよう","cando":"能够讲述自己身边想保护的自然。"}]},{"n":19,"title":"{科学|かがく}の{力|ちから}","zh":"科学的力量","goal":"能够接触科学技术方面的话题，思考科学的力量在社会中起什么作用，并具有问题意识。","tasks":[{"name":"1 {見|み}つけた!","cando":"能够阅读并了解生活中有用的科学有什么有趣的地方。"},{"name":"2 {伝|つた}えてみよう","cando":"能够读文章，从不同的立场和条件思考护理机器人，并说出意见。"},{"name":"3 こんなときどうする?","cando":"能够说明情况并请求修理。"},{"name":"4 {耳|みみ}でキャッチ","cando":"能够听某个国家能源政策的现状，获得基本信息。"},{"name":"5 {見|み}つけた!","cando":"能够阅读正在被讨论的医疗方面的文章，获得基本知识。"}]},{"n":20,"title":"{豊|ゆた}かさと{幸|しあわ}せ","zh":"富足与幸福","goal":"能够了解关于富足的多种价值观和想法，客观地回顾自己的想法，并和周围的人交换意见。","tasks":[{"name":"1 {伝|つた}えてみよう","cando":"为了传达自己的价值观，能够一边考虑优先顺序，一边谈论“有了就会觉得幸福”的事物。"},{"name":"2 {見|み}つけた!","cando":"能够读文章，得到一个契机去思考“把幸福变成数字”。"},{"name":"3 {耳|みみ}でキャッチ","cando":"能够听对经营者的采访，了解对方的理念。"},{"name":"4 {見|み}つけた!","cando":"能够读人物介绍，理解那个人的决心和行动。"},{"name":"5 こんなときどうする?","cando":"团体使用店铺时，能够作为联系人说出愿望并预约。"}]}],"categories":[{"id":"written","name":"书面・通知","icon":"📰","color":"#0369a1"},{"id":"request","name":"请求・许可","icon":"🙏","color":"#0d9488"},{"id":"talk","name":"会话语气","icon":"💬","color":"#7c3aed"},{"id":"example","name":"列举・限定","icon":"📌","color":"#b45309"},{"id":"guess","name":"推测・判断","icon":"🔮","color":"#db2777"},{"id":"time","name":"时间・变化","icon":"⏱️","color":"#dc2626"},{"id":"cond","name":"条件・假设","icon":"🔀","color":"#0284c7"},{"id":"reason","name":"原因・结果","icon":"💡","color":"#0891b2"},{"id":"manner","name":"样子・程度","icon":"📏","color":"#be123c"},{"id":"contrast","name":"转折・对比","icon":"⚖️","color":"#9333ea"},{"id":"scope","name":"范围・对象","icon":"🎯","color":"#059669"},{"id":"keigo","name":"敬语礼貌","icon":"🎩","color":"#4f46e5"},{"id":"emotion","name":"感情评价","icon":"💛","color":"#d97706"},{"id":"explain","name":"说明传闻","icon":"📖","color":"#2563eb"},{"id":"ability","name":"可能义务","icon":"🔤","color":"#ea580c"}],"cards":[{"id":"1-1","lesson":1,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"written","pattern":"〜において／〜における","official":"〜において／〜における","usage":"イベントのお知らせでよく見ることば","usageR":"イベントのお{知|し}らせでよく{見|み}ることば","conn":"N＋において／N＋における＋N","zh":"在某个场所、时间或领域。书面语，通知和新闻里常见，比「で」郑重。","pex":[],"ex":[{"jp":"このイベントは{東京|とうきょう}において{開|ひら}かれます。","zh":"这个活动将在东京举办。","src":"","say":"このイベントは東京においてひらかれます。"},{"jp":"{教育|きょういく}における{問題|もんだい}について、{記事|きじ}を{読|よ}みました。","zh":"读了一篇关于教育方面问题的报道。","src":"","say":"教育における問題について、記事を読みました。"}],"tips":["「における」后面直接接名词，不能结句。口语一般说「で」。"]},{"id":"1-2","lesson":1,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"written","pattern":"〜{上|うえ}（で）","official":"〜上（で）","usage":"イベントのお知らせでよく見ることば","usageR":"イベントのお{知|し}らせでよく{見|み}ることば","conn":"Vた／Vる／Nの＋上（で）","zh":"在做完…的基础上；在…之上（再做决定、再行动）。通知里常见「ご{予約|よやく}の{上|うえ}」。","pex":[],"ex":[{"jp":"{内容|ないよう}を{確認|かくにん}した{上|うえ}で、{申|もう}し{込|こ}みます。","zh":"确认内容之后再报名。","src":"","say":"内容を確認したうえで、申し込みます。"},{"jp":"{予約|よやく}の{上|うえ}、{会場|かいじょう}にお{越|こ}しください。","zh":"请预约之后再来会场。","src":"","say":"予約のうえ、会場にお越しください。"}],"tips":["读音是「うえ」，不是「じょう」。法律上的「じょう」见第19课。"]},{"id":"1-3","lesson":1,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"request","pattern":"〜てほしい／〜てもらいたい","official":"〜てほしい／〜てもらいたい","usage":"イベントのお知らせでよく見ることば","usageR":"イベントのお{知|し}らせでよく{見|み}ることば","conn":"Vて＋ほしい／Vて＋もらいたい","zh":"希望别人为我做某事。「もらいたい」更强调“想承蒙对方做”。通知、邀请里很常见。","pex":[],"ex":[{"jp":"{多|おお}くの{人|ひと}に{参加|さんか}してほしいです。","zh":"希望很多人来参加。","src":"","say":"多くのひとに参加してほしいです。"},{"jp":"できれば、{写真|しゃしん}を{撮|と}ってもらいたいです。","zh":"如果可以的话，想请你帮我拍照。","src":"","say":"できれば、写真を撮ってもらいたいです。"}],"tips":["对不太熟的人，用第4课的「ていただきたい」更礼貌。"]},{"id":"1-4","lesson":1,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"talk","pattern":"よね","official":"よね","usage":"友達を誘うときに使う表現","usageR":"{友達|ともだち}を{誘|さそ}うときに{使|つか}う{表現|ひょうげん}","conn":"普通形／N＋だ＋よね（口语）","zh":"向对方确认，希望对方同意：“对吧”。朋友之间邀请时常用。","pex":[],"ex":[{"jp":"このイベント、おもしろそうだよね。","zh":"这个活动看起来挺有意思的吧。","src":"","say":"このイベント、おもしろそうだよね。"},{"jp":"{明日|あした}の{天気|てんき}、いいよね。","zh":"明天天气不错吧。","src":"","say":"あしたの天気、いいよね。"}],"tips":["对上级不要用「よね」，可改成「ですね」。"]},{"id":"1-5","lesson":1,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"example","pattern":"〜とか〜とか","official":"〜とか〜とか","usage":"友達を誘うときに使う表現","usageR":"{友達|ともだち}を{誘|さそ}うときに{使|つか}う{表現|ひょうげん}","conn":"N／Vる＋とか、N／Vる＋とか","zh":"列举几个例子，暗示还有别的，不是全部。","pex":[],"ex":[{"jp":"{音楽|おんがく}とか{映画|えいが}とかが{好|す}きです。","zh":"喜欢音乐啦、电影啦之类的。","src":"","say":"音楽とか映画とかが好きです。"},{"jp":"{週末|しゅうまつ}は{走|はし}るとか、{映画|えいが}を{見|み}るとかしています。","zh":"周末会跑步、游泳什么的。","src":"","say":"週末は走るとか、映画を見るとかしています。"}],"tips":["句尾的「とか」（听说）是第5课，意思不同。"]},{"id":"1-6","lesson":1,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"example","pattern":"〜だけ／〜だけの","official":"〜だけ／〜だけの","usage":"友達を誘うときに使う表現","usageR":"{友達|ともだち}を{誘|さそ}うときに{使|つか}う{表現|ひょうげん}","conn":"N／Vる＋だけ；Vる＋だけの＋N","zh":"只…；仅仅…的量。「だけの」后面接名词，表示“足够…的”。","pex":[],"ex":[{"jp":"{見学|けんがく}だけなら、お{金|かね}はいりません。","zh":"如果只是参观，不需要钱。","src":"","say":"見学だけなら、お金はいりません。"},{"jp":"{一日|いちにち}で{行|い}けるだけの{計画|けいかく}にしましょう。","zh":"定一个一天就能去完的计划吧。","src":"","say":"いちにちで行けるだけの計画にしましょう。"}],"tips":["「だけあって」（不愧）是第10课，不要和「だけ」混。"]},{"id":"1-7","lesson":1,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"guess","pattern":"〜でしょう／〜だろう","official":"〜でしょう／〜だろう","usage":"天気予報でよく聞くことば・表現","usageR":"{天気|てんき}{予報|よほう}でよく{聞|き}くことば・{表現|ひょうげん}","conn":"普通形＋でしょう／だろう（ナA・N：だ＋でしょう）","zh":"大概、可能。天气预报里很常见。「でしょう」较礼貌，「だろう」是普通体。","pex":[],"ex":[{"jp":"{明日|あした}は{雨|あめ}でしょう。","zh":"明天大概会下雨。","src":"","say":"あしたは雨でしょう。"},{"jp":"{今夜|こんや}は{冷|ひ}えるだろう。","zh":"今晚大概会变冷。","src":"","say":"今夜は冷えるだろう。"}],"tips":["升调的「でしょう？」用来确认，见第9课，不是推测。"]},{"id":"1-8","lesson":1,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"time","pattern":"〜から〜にかけて","official":"〜から〜にかけて","usage":"天気予報でよく聞くことば・表現","usageR":"{天気|てんき}{予報|よほう}でよく{聞|き}くことば・{表現|ひょうげん}","conn":"N＋から＋N＋にかけて","zh":"从…一直到…（一段时间或一片区域，不是一个点）。","pex":[],"ex":[{"jp":"{今夜|こんや}から{明日|あした}の{朝|あさ}にかけて、{雨|あめ}が{降|ふ}るでしょう。","zh":"从今晚到明天早上大概会下雨。","src":"","say":"今夜からあしたの朝にかけて、雨が降るでしょう。"},{"jp":"{関東|かんとう}から{東北|とうほく}にかけて、{風|かぜ}が{強|つよ}くなります。","zh":"从关东到东北，风会变大。","src":"","say":"関東から東北にかけて、風が強くなります。"}],"tips":["只说一个时间点时用「に」，不用「にかけて」。"]},{"id":"1-9","lesson":1,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"cond","pattern":"〜と、A／V","official":"〜と、A／V","usage":"天気予報でよく聞くことば・表現","usageR":"{天気|てんき}{予報|よほう}でよく{聞|き}くことば・{表現|ひょうげん}","conn":"Vる／Aい＋と、～","zh":"一…就…。表示自然结果、习惯，天气预报里说明“变成这样就会…”。","pex":[],"ex":[{"jp":"{春|はる}になると、{暖|あたた}かくなります。","zh":"一到春天就会变暖。","src":"","say":"春になると、暖かくなります。"},{"jp":"このボタンを{押|お}すと、ドアが{開|あ}きます。","zh":"一按这个按钮，门就开。","src":"","say":"このボタンを押すと、ドアがあきます。"}],"tips":["后项一般不能是命令、邀请、意志。那种时候用「たら」。"]},{"id":"1-10","lesson":1,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"reason","pattern":"〜がきっかけで","official":"〜がきっかけで","usage":"自己紹介で使える表現／性格を表すことば・表現","usageR":"{自己|じこ}{紹介|しょうかい}で{使|つか}える{表現|ひょうげん}／{性格|せいかく}を{表|あらわ}すことば・{表現|ひょうげん}","conn":"N＋がきっかけで／をきっかけに","zh":"以…为契机。说明某件事是开始的原因。","pex":[],"ex":[{"jp":"{日本|にほん}のアニメがきっかけで、{日本語|にほんご}を{始|はじ}めました。","zh":"以日本动漫为契机，开始学日语。","src":"","say":"にほんのアニメがきっかけで、日本語を始めました。"},{"jp":"{旅行|りょこう}をきっかけに、{写真|しゃしん}が{好|す}きになりました。","zh":"以旅行为契机，喜欢上了拍照。","src":"","say":"旅行をきっかけに、写真が好きになりました。"}],"tips":["「きっかけ」是契机，不是坏的原因。坏结果用「せいで」。"]},{"id":"1-11","lesson":1,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"manner","pattern":"〜っぽい","official":"〜っぽい","usage":"自己紹介で使える表現／性格を表すことば・表現","usageR":"{自己|じこ}{紹介|しょうかい}で{使|つか}える{表現|ひょうげん}／{性格|せいかく}を{表|あらわ}すことば・{表現|ひょうげん}","conn":"N／Vます词干／A词干＋っぽい","zh":"带有…的样子，像…似的。口语，有时带一点评价。","pex":[],"ex":[{"jp":"{彼|かれ}はまだ{子|こ}どもっぽいです。","zh":"他还带着孩子气。","src":"","say":"彼はまだ子どもっぽいです。"},{"jp":"{今日|きょう}は{雨|あめ}っぽい{天気|てんき}ですね。","zh":"今天这天气像要下雨似的。","src":"","say":"今日は雨っぽい天気ですね。"}],"tips":["ナ形容词直接去「な」：子どもっぽい。い形容词用词干：安い→安っぽい。"]},{"id":"1-12","lesson":1,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"example","pattern":"〜でも（{極端|きょくたん}な{例|れい}）","official":"〜でも（極端な例）","usage":"自己紹介で使える表現／性格を表すことば・表現","usageR":"{自己|じこ}{紹介|しょうかい}で{使|つか}える{表現|ひょうげん}／{性格|せいかく}を{表|あらわ}すことば・{表現|ひょうげん}","conn":"N＋でも（举一个极端的例子）","zh":"就连…也。举一个最极端、最小或最不像的例子，强调程度。","pex":[],"ex":[{"jp":"{忙|いそが}しい{人|ひと}でも、{一|いち}{日|にち}{五|ご}{分|ふん}ならできます。","zh":"就连忙的人，一天五分钟的话也做得到。","src":"","say":"忙しいひとでも、一にち五分ならできます。"},{"jp":"{子|こ}どもでも{分|わ}かる{説明|せつめい}にしてください。","zh":"请做成连孩子也听得懂的说明。","src":"","say":"子どもでも分かる説明にしてください。"}],"tips":["「お{茶|ちゃ}でも」这种随便举个例子，是第3课的「{例示|れいじ}」，不是极端。"]},{"id":"2-1","lesson":2,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"manner","pattern":"〜ている","official":"〜ている","usage":"飲食店のメニューの特徴を紹介するときに使われる表現","usageR":"{飲食|いんしょく}{店|てん}のメニューの{特徴|とくちょう}を{紹介|しょうかい}するときに{使|つか}われる{表現|ひょうげん}","conn":"Vて＋いる","zh":"表示状态或一贯的特征，不只是“正在做”。介绍店的特色时常用。","pex":[],"ex":[{"jp":"この{店|みせ}は、{地元|じもと}の{野菜|やさい}を{使|つか}っています。","zh":"这家店用的是当地的蔬菜。","src":"","say":"この店は、地元の野菜を使っています。"},{"jp":"{彼|かれ}は{東京|とうきょう}に{十|じゅう}{年|ねん}{住|す}んでいます。","zh":"他在东京住了十年。","src":"","say":"彼は東京に十年住んでいます。"}],"tips":["动作正在进行，和“一直如此的特色”，都是「ている」。看上下文。"]},{"id":"2-2","lesson":2,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"scope","pattern":"〜によって（さまざまだ）","official":"〜によって（さまざまだ）","usage":"飲食店のメニューの特徴を紹介するときに使われる表現","usageR":"{飲食|いんしょく}{店|てん}のメニューの{特徴|とくちょう}を{紹介|しょうかい}するときに{使|つか}われる{表現|ひょうげん}","conn":"N＋によって＋さまざまだ／異なる","zh":"因…而不同，各种各样。","pex":[],"ex":[{"jp":"{味|あじ}は{店|みせ}によってさまざまです。","zh":"味道因店而异。","src":"","say":"味は店によってさまざまです。"},{"jp":"{値段|ねだん}は{季節|きせつ}によって{違|ちが}います。","zh":"价格随季节不同。","src":"","say":"値段は季節によって違います。"}],"tips":["第5课的「によって」是原因，第13课多用于方式或依据。"]},{"id":"2-3","lesson":2,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"time","pattern":"〜うちに","official":"〜うちに","usage":"飲食店のメニューの特徴を紹介するときに使われる表現","usageR":"{飲食|いんしょく}{店|てん}のメニューの{特徴|とくちょう}を{紹介|しょうかい}するときに{使|つか}われる{表現|ひょうげん}","conn":"Vている／Vない／Aい／Nの＋うちに","zh":"趁着还…的时候（不做就会变化）。","pex":[],"ex":[{"jp":"{熱|あつ}いうちに{食|た}べてください。","zh":"请趁热吃。","src":"","say":"熱いうちに食べてください。"},{"jp":"{忘|わす}れないうちに、メモしておきましょう。","zh":"趁还没忘，记下来吧。","src":"","say":"忘れないうちに、メモしておきましょう。"}],"tips":["第7课还会再出现。和「{最中|さいちゅう}に」（正在进行中）不同，这里强调趁变化之前。"]},{"id":"2-4","lesson":2,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"contrast","pattern":"〜わりに","official":"〜わりに","usage":"飲食店のメニューの特徴を紹介するときに使われる表現","usageR":"{飲食|いんしょく}{店|てん}のメニューの{特徴|とくちょう}を{紹介|しょうかい}するときに{使|つか}われる{表現|ひょうげん}","conn":"Vる／Aい／Nの＋わりに","zh":"比起…来说，却…。实际和预期不匹配。","pex":[],"ex":[{"jp":"この{店|みせ}は{値段|ねだん}のわりに、{量|りょう}が{多|おお}いです。","zh":"这家店就价格来说，量很多。","src":"","say":"この店は値段のわりに、量が多いです。"},{"jp":"{初|はじ}めてのわりに、{上手|じょうず}ですね。","zh":"就第一次来说，挺好的。","src":"","say":"初めてのわりに、上手ですね。"}],"tips":["和「にしては」接近。评价人的身份、年龄时，「にしては」更常用。"]},{"id":"2-5","lesson":2,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"talk","pattern":"〜（が）いいんじゃない？","official":"〜（が）いいんじゃない？","usage":"お得な情報を薦めるときに使える表現","usageR":"お{得|とく}な{情報|じょうほう}を{薦|すす}めるときに{使|つか}える{表現|ひょうげん}","conn":"Vた／Vる／Nの＋（が）いいんじゃない？","zh":"…不就好了吗？口语里柔和的建议。","pex":[],"ex":[{"jp":"この{店|みせ}がいいんじゃない？","zh":"这家店不就挺好的吗？","src":"","say":"この店がいいんじゃない？"},{"jp":"ネットで{調|しら}べたらいいんじゃない？","zh":"上网查一下不就好了吗？","src":"","say":"ネットで調べたらいいんじゃない？"}],"tips":["对上级太随意。对上级用「てはいかがですか」。"]},{"id":"2-6","lesson":2,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"manner","pattern":"〜ようになっている","official":"〜ようになっている","usage":"お得な情報を薦めるときに使える表現","usageR":"お{得|とく}な{情報|じょうほう}を{薦|すす}めるときに{使|つか}える{表現|ひょうげん}","conn":"Vる／Vない＋ようになっている","zh":"做成了会…的结构；自然就会变成这样。","pex":[],"ex":[{"jp":"ボタンを{押|お}すと、ドアが{開|あ}くようになっています。","zh":"一按按钮，门就会开。","src":"","say":"ボタンを押すと、ドアがあくようになっています。"},{"jp":"{会員|かいいん}なら、{安|やす}く{買|か}えるようになっています。","zh":"如果是会员，就能买得便宜。","src":"","say":"会員なら、安く買えるようになっています。"}],"tips":["不是“为了”（目的的「ように」），而是已经具备的功能或安排。"]},{"id":"2-7","lesson":2,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"example","pattern":"〜に{限|かぎ}り","official":"〜に限り","usage":"セールのチラシや看板でよく使われることば","usageR":"セールのチラシや{看板|かんばん}でよく{使|つか}われることば","conn":"N＋に限り","zh":"仅限…。传单、告示里限定对象。","pex":[],"ex":[{"jp":"{本日|ほんじつ}に{限|かぎ}り、{全品|ぜんぴん}{半額|はんがく}です。","zh":"仅限今天，全部半价。","src":"","say":"本日にかぎり、全品半額です。"},{"jp":"{会員|かいいん}の{方|ほう}に{限|かぎ}り、ご{案内|あんない}します。","zh":"仅限会员，为您介绍。","src":"","say":"会員のほうにかぎり、ご案内します。"}],"tips":["「に{限|かぎ}る」是“最好是”，“に限らず”是“不限于”。"]},{"id":"2-8","lesson":2,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"reason","pattern":"〜こそ／〜からこそ","official":"〜こそ／〜からこそ","usage":"セールのチラシや看板でよく使われることば","usageR":"セールのチラシや{看板|かんばん}でよく{使|つか}われることば","conn":"N＋こそ／普通形＋からこそ","zh":"正是…；正因为…（强调原因，带积极语气）。","pex":[],"ex":[{"jp":"{今|いま}こそ、{新|あたら}しい{店|みせ}を{試|ため}す{時|とき}です。","zh":"现在正是试试新店的时候。","src":"","say":"今こそ、新しい店を試す時です。"},{"jp":"{安|やす}いからこそ、{品質|ひんしつ}を{確認|かくにん}した{方|ほう}がいいです。","zh":"正因为便宜，更应该确认质量。","src":"","say":"安いからこそ、品質を確認したほうがいいです。"}],"tips":["「からこそ」后面常接意志、判断，不太接单纯的坏结果。"]},{"id":"2-9","lesson":2,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"written","pattern":"〜につき","official":"〜につき","usage":"セールのチラシや看板でよく使われることば","usageR":"セールのチラシや{看板|かんばん}でよく{使|つか}われることば","conn":"N＋につき","zh":"每…就…。广告、告示里算数量。","pex":[],"ex":[{"jp":"お{一人|ひとり}につき、{一個|いっこ}までです。","zh":"每人限一个。","src":"","say":"お一人につき、いっこまでです。"},{"jp":"{二千|にせん}{円|えん}につき、{一点|いってん}プレゼントします。","zh":"每两千日元赠送一件。","src":"","say":"二千円につき、いってんプレゼントします。"}],"tips":["第7课的邀请场景里，同一形式也可能用于“关于／因为”。本课先记“每”。"]},{"id":"2-10","lesson":2,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"explain","pattern":"ということだ","official":"ということだ","usage":"店の人にやわらかく希望を伝えるときに使える表現","usageR":"{店|みせ}の{人|ひと}にやわらかく{希望|きぼう}を{伝|つた}えるときに{使|つか}える{表現|ひょうげん}","conn":"普通形＋ということだ","zh":"也就是说…；转述成“是这么回事”。对店员说明情况时，可以不那么直接。","pex":[],"ex":[{"jp":"{卵|たまご}が{食|た}べられないので、{使|つか}わないでほしいということです。","zh":"因为不能吃鸡蛋，所以希望不要用。","src":"","say":"卵が食べられないので、使わないでほしいということです。"},{"jp":"{今日|きょう}は{休|やす}みということですね。","zh":"也就是说今天休息，对吧。","src":"","say":"今日は休みということですね。"}],"tips":["第11课的「ということだ」重点是“听说”。本课先记“也就是／转述情况”。"]},{"id":"2-11","lesson":2,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"keigo","pattern":"〜でしょうか","official":"〜でしょうか","usage":"店の人にやわらかく希望を伝えるときに使える表現","usageR":"{店|みせ}の{人|ひと}にやわらかく{希望|きぼう}を{伝|つた}えるときに{使|つか}える{表現|ひょうげん}","conn":"普通形＋でしょうか（ナA・N：でしょうか）","zh":"…吗？比「ですか」更柔和，对店员提问时常用。","pex":[],"ex":[{"jp":"この{色|いろ}はありますでしょうか。","zh":"这个颜色有吗？","src":"","say":"この色はありますでしょうか。"},{"jp":"もう{少|すこ}し{安|やす}くしていただけるでしょうか。","zh":"能再便宜一点吗？","src":"","say":"もう少し安くしていただけるでしょうか。"}],"tips":["不要和推测的「でしょう」搞混。这里是提问。"]},{"id":"2-12","lesson":2,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"guess","pattern":"〜はずだ","official":"〜はずだ","usage":"経験したときの気持ちを伝える表現","usageR":"{経験|けいけん}したときの{気持|きも}ちを{伝|つた}える{表現|ひょうげん}","conn":"普通形＋はずだ（ナA・N：のはずだ）","zh":"按理说应该…。有依据的判断，不是随便猜。","pex":[],"ex":[{"jp":"{予約|よやく}したので、{席|せき}があるはずです。","zh":"预约了，所以按理说有座位。","src":"","say":"予約したので、席があるはずです。"},{"jp":"{彼|かれ}は{今日|きょう}{来|く}るはずです。","zh":"他今天应该会来。","src":"","say":"彼は今日来るはずです。"}],"tips":["没有依据的感觉用「ようだ／みたいだ」。否定是第3课「はずがない」。"]},{"id":"2-13","lesson":2,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"scope","pattern":"〜{向|む}け","official":"〜向け","usage":"経験したときの気持ちを伝える表現","usageR":"{経験|けいけん}したときの{気持|きも}ちを{伝|つた}える{表現|ひょうげん}","conn":"N＋向け／N＋向けの＋N","zh":"面向…（的）。产品、信息的对象。","pex":[],"ex":[{"jp":"これは{学生|がくせい}{向|む}けのサービスです。","zh":"这是面向学生的服务。","src":"","say":"これは学生向けのサービスです。"},{"jp":"{外国人|がいこくじん}{向|む}けに、{英語|えいご}の{案内|あんない}もあります。","zh":"面向外国人，也有英语说明。","src":"","say":"がいこくじん向けに、英語の案内もあります。"}],"tips":["「{向|む}き」是“适合…的人”（第18课），「{向|む}け」是制作者设定的对象。"]},{"id":"3-1","lesson":3,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"guess","pattern":"〜はずがない","official":"〜はずがない","usage":"時間の使い方に関係がある表現／時間の使い方や大切さを表すことわざ","usageR":"{時間|じかん}の{使|つか}い{方|かた}に{関係|かんけい}がある{表現|ひょうげん}／{時間|じかん}の{使|つか}い{方|かた}や{大切|たいせつ}さを{表|あらわ}すことわざ","conn":"普通形＋はずがない（ナA・N：のはずがない）","zh":"不可能…；不会…。根据常理强烈否定。","pex":[],"ex":[{"jp":"{一日|いちにち}で{全部|ぜんぶ}{覚|おぼ}えるはずがありません。","zh":"不可能一天全部记住。","src":"","say":"いちにちで全部覚えるはずがありません。"},{"jp":"{彼|かれ}が{時間|じかん}をむだにするはずがない。","zh":"他不可能浪费时间。","src":"","say":"彼が時間をむだにするはずがない。"}],"tips":["「はずだ」是应该，「はずがない」是不可能。"]},{"id":"3-2","lesson":3,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"emotion","pattern":"〜なんて（{驚|おどろ}き）","official":"〜なんて（驚き）","usage":"時間の使い方に関係がある表現／時間の使い方や大切さを表すことわざ","usageR":"{時間|じかん}の{使|つか}い{方|かた}に{関係|かんけい}がある{表現|ひょうげん}／{時間|じかん}の{使|つか}い{方|かた}や{大切|たいせつ}さを{表|あらわ}すことわざ","conn":"N／普通形＋なんて","zh":"竟然…！表示吃惊，有时带轻视。","pex":[],"ex":[{"jp":"{五|ご}{時|じ}に{起|お}きるなんて、すごいですね。","zh":"竟然五点起床，真厉害。","src":"","say":"五時に起きるなんて、すごいですね。"},{"jp":"まだ{学生|がくせい}なのに、{会社|かいしゃ}を{作|つく}ったなんて。","zh":"还是学生，竟然开了公司。","src":"","say":"まだ学生なのに、会社を作ったなんて。"}],"tips":["第12课的「なんて／なんか」更偏向“之类的、算不上”。本课重点是吃惊。"]},{"id":"3-3","lesson":3,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"manner","pattern":"（〜ば）〜ほど","official":"（〜ば）〜ほど","usage":"時間の使い方に関係がある表現／時間の使い方や大切さを表すことわざ","usageR":"{時間|じかん}の{使|つか}い{方|かた}に{関係|かんけい}がある{表現|ひょうげん}／{時間|じかん}の{使|つか}い{方|かた}や{大切|たいせつ}さを{表|あらわ}すことわざ","conn":"Vば＋Vる＋ほど／Aければ＋Aい＋ほど","zh":"越…越…。","pex":[],"ex":[{"jp":"{勉強|べんきょう}すればするほど、おもしろくなる。","zh":"越学越有意思。","src":"","say":"勉強すればするほど、おもしろくなる。"},{"jp":"{早|はや}いほどいいです。","zh":"越早越好。","src":"","say":"早いほどいいです。"}],"tips":["也可以只说「Vるほど」，意思一样。"]},{"id":"3-4","lesson":3,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"example","pattern":"〜でも（{例示|れいじ}）","official":"〜でも（例示）","usage":"時間の使い方に関係がある表現／時間の使い方や大切さを表すことわざ","usageR":"{時間|じかん}の{使|つか}い{方|かた}に{関係|かんけい}がある{表現|ひょうげん}／{時間|じかん}の{使|つか}い{方|かた}や{大切|たいせつ}さを{表|あらわ}すことわざ","conn":"N＋でも（举一个轻松的例子）","zh":"…之类的也行。随便举一个例子，语气轻，常用来提议。","pex":[],"ex":[{"jp":"お{茶|ちゃ}でも{飲|の}みながら{話|はな}しませんか。","zh":"喝杯茶什么的，聊聊吧。","src":"","say":"お茶でも飲みながら話しませんか。"},{"jp":"{音楽|おんがく}でも{聞|き}きながら{勉強|べんきょう}しています。","zh":"边听着音乐什么的边学习。","src":"","say":"音楽でも聞きながら勉強しています。"}],"tips":["第1课的「でも」是“就连极端的例子也”。本课不是极端。"]},{"id":"3-5","lesson":3,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"manner","pattern":"こんな〜／そんな〜／あんな〜／どんな〜","official":"こんな〜／そんな〜／あんな〜／どんな〜","usage":"生活のリズムのためにしている工夫について話すときの表現","usageR":"{生活|せいかつ}のリズムのためにしている{工夫|くふう}について{話|はな}すときの{表現|ひょうげん}","conn":"こんな／そんな／あんな／どんな＋N","zh":"这样的／那样的／那样的（远指）／什么样的。","pex":[],"ex":[{"jp":"こんな{生活|せいかつ}は{初|はじ}めてです。","zh":"这样的生活还是第一次。","src":"","say":"こんな生活は初めてです。"},{"jp":"どんな{工夫|くふう}をしていますか。","zh":"你在做什么样的办法？","src":"","say":"どんな工夫をしていますか。"}],"tips":["「こんな」离自己近，「そんな」离对方近或刚提到，「あんな」双方都远。"]},{"id":"3-6","lesson":3,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"manner","pattern":"〜ふうに","official":"〜ふうに","usage":"生活のリズムのためにしている工夫について話すときの表現","usageR":"{生活|せいかつ}のリズムのためにしている{工夫|くふう}について{話|はな}すときの{表現|ひょうげん}","conn":"こんな／そんな＋ふうに；Vる／Vない＋ふうに","zh":"以…的方式。","pex":[],"ex":[{"jp":"こんなふうに{時間|じかん}を{使|つか}っています。","zh":"我是这样使用时间的。","src":"","say":"こんなふうに時間を使っています。"},{"jp":"{忘|わす}れないふうに、{紙|かみ}に{書|か}いてください。","zh":"请写在纸上，免得忘掉。","src":"","say":"忘れないふうに、紙に書いてください。"}],"tips":["「ふうに」前面可以是指示词，也可以是句子。"]},{"id":"3-7","lesson":3,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"reason","pattern":"〜ことで","official":"〜ことで","usage":"生活のリズムのためにしている工夫について話すときの表現","usageR":"{生活|せいかつ}のリズムのためにしている{工夫|くふう}について{話|はな}すときの{表現|ひょうげん}","conn":"Vる／Aい＋ことで","zh":"通过做…，从而…。把动作当成手段或原因。","pex":[],"ex":[{"jp":"{朝|あさ}{早|はや}く{起|お}きることで、{時間|じかん}に{余裕|よゆう}ができます。","zh":"通过早起，时间就会宽裕。","src":"","say":"朝早く起きることで、時間に余裕ができます。"},{"jp":"{書|か}くことで、{頭|あたま}の{中|なか}が{整理|せいり}されます。","zh":"通过写下来，脑子里就整理清楚了。","src":"","say":"書くことで、頭のなかが整理されます。"}],"tips":["「ことで」偏手段、原因。「ときに」是时候。"]},{"id":"3-8","lesson":3,"taskN":3,"task":"3 伝えてみよう","stTitle":"3 伝えてみよう","cat":"talk","pattern":"なあ","official":"なあ","usage":"将来のことを考えて準備していることを伝える表現","usageR":"{将来|しょうらい}のことを{考|かんが}えて{準備|じゅんび}していることを{伝|つた}える{表現|ひょうげん}","conn":"普通形＋なあ（口语，男性或自言自语较多）","zh":"…啊。一个人感叹，或轻轻说出愿望。","pex":[],"ex":[{"jp":"{毎日|まいにち}{五|ご}{時|じ}に{起|お}きるのは{大変|たいへん}だなあ。","zh":"每天五点起床可真够呛啊。","src":"","say":"毎日五時に起きるのは大変だなあ。"},{"jp":"{来年|らいねん}はもう{少|すこ}し{旅|たび}をしたいなあ。","zh":"明年想再多去旅旅行一点啊。","src":"","say":"来年はもう少し旅をしたいなあ。"}],"tips":["对上级不合适。女性朋友之间也有人用，但「ね」更常见。"]},{"id":"3-9","lesson":3,"taskN":3,"task":"3 伝えてみよう","stTitle":"3 伝えてみよう","cat":"time","pattern":"〜ことがある／〜こともある","official":"〜ことがある／〜こともある","usage":"将来のことを考えて準備していることを伝える表現","usageR":"{将来|しょうらい}のことを{考|かんが}えて{準備|じゅんび}していることを{伝|つた}える{表現|ひょうげん}","conn":"Vる／Vない＋ことがある；こともある","zh":"有时会…。不是“曾经”（那是「たことがある」）。","pex":[],"ex":[{"jp":"{夜中|よなか}に{目|め}が{覚|さ}めることがあります。","zh":"有时半夜会醒来。","src":"","say":"夜中に目が覚めることがあります。"},{"jp":"{計画|けいかく}どおりにいかないこともあります。","zh":"也有不按计划进行的时候。","src":"","say":"計画どおりにいかないこともあります。"}],"tips":["「こともある」强调“也有那样的时候”。"]},{"id":"3-10","lesson":3,"taskN":3,"task":"3 伝えてみよう","stTitle":"3 伝えてみよう","cat":"scope","pattern":"〜にとって","official":"〜にとって","usage":"将来のことを考えて準備していることを伝える表現","usageR":"{将来|しょうらい}のことを{考|かんが}えて{準備|じゅんび}していることを{伝|つた}える{表現|ひょうげん}","conn":"N＋にとって","zh":"对…来说。评价对谁有意义。","pex":[],"ex":[{"jp":"{学生|がくせい}にとって、{時間|じかん}は{大切|たいせつ}です。","zh":"对学生来说，时间很重要。","src":"","say":"学生にとって、時間は大切です。"},{"jp":"{私|わたし}にとって、{朝|あさ}の{一|いち}{時間|じかん}は{勉強|べんきょう}の{時間|じかん}です。","zh":"对我来说，早上的一小时是学习时间。","src":"","say":"わたしにとって、朝の一時間は勉強の時間です。"}],"tips":["后面多是评价，不是动作的对象。「には」才能接“必须、很难”。"]},{"id":"3-11","lesson":3,"taskN":4,"task":"4 こんなときどうする？","stTitle":"4 こんなときどうする？","cat":"reason","pattern":"〜ことだし","official":"〜ことだし","usage":"自分がしたいことについての情報を友達にもらうときの表現","usageR":"{自分|じぶん}がしたいことについての{情報|じょうほう}を{友達|ともだち}にもらうときの{表現|ひょうげん}","conn":"普通形＋ことだし（ナA・N：だ＋ことだし）","zh":"既然…，而且…。用来补充理由，然后提议或决定。口语。","pex":[],"ex":[{"jp":"{近|ちか}いことだし、{歩|ある}いて{行|い}きましょう。","zh":"反正很近，走着去吧。","src":"","say":"近いことだし、歩いて行きましょう。"},{"jp":"{雨|あめ}も{止|や}んだことだし、{出|で}かけませんか。","zh":"雨也停了，出门吧。","src":"","say":"雨も止んだことだし、出かけませんか。"}],"tips":["常和「し」一样，暗示还有别的理由。"]},{"id":"3-12","lesson":3,"taskN":4,"task":"4 こんなときどうする？","stTitle":"4 こんなときどうする？","cat":"request","pattern":"〜てくれない?／〜てくれる?","official":"〜てくれない?／〜てくれる?","usage":"自分がしたいことについての情報を友達にもらうときの表現","usageR":"{自分|じぶん}がしたいことについての{情報|じょうほう}を{友達|ともだち}にもらうときの{表現|ひょうげん}","conn":"Vて＋くれない？／Vて＋くれる？（对朋友）","zh":"帮我…好吗？「くれない？」比「くれる？」稍强一点，都是口语请求。","pex":[],"ex":[{"jp":"その{本|ほん}、{貸|か}してくれない？","zh":"那本书借我一下好吗？","src":"","say":"その本、貸してくれない？"},{"jp":"{駅|えき}まで{来|き}てくれる？","zh":"能到车站来一下吗？","src":"","say":"駅まで来てくれる？"}],"tips":["对上级用「ていただけませんか」。"]},{"id":"3-13","lesson":3,"taskN":4,"task":"4 こんなときどうする？","stTitle":"4 こんなときどうする？","cat":"talk","pattern":"〜じゃない?／〜んじゃない?","official":"〜じゃない?／〜んじゃない?","usage":"自分がしたいことについての情報を友達にもらうときの表現","usageR":"{自分|じぶん}がしたいことについての{情報|じょうほう}を{友達|ともだち}にもらうときの{表現|ひょうげん}","conn":"普通形＋じゃない？／んじゃない？（口语）","zh":"…不是吗？征求同意，或不太确定地推测。","pex":[],"ex":[{"jp":"この{方法|ほうほう}がいいんじゃない？","zh":"这个办法不错吧？","src":"","say":"この方法がいいんじゃない？"},{"jp":"{明日|あした}は{晴|は}れるんじゃない？","zh":"明天会放晴吧？","src":"","say":"あしたは晴れるんじゃない？"}],"tips":["「んじゃない？」推测的语气更强一点。"]},{"id":"4-1","lesson":4,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"keigo","pattern":"お・ご〜です／お・ご〜でしょう","official":"お・ご〜です／お・ご〜でしょう","usage":"施設の利用方法の説明で使われることば・表現","usageR":"{施設|しせつ}の{利用|りよう}{方法|ほうほう}の{説明|せつめい}で{使|つか}われることば・{表現|ひょうげん}","conn":"お＋Vます词干＋です／ご＋漢語词干＋です；でしょう 也可以","zh":"尊敬语：“您…”。介绍设施用法时，职员用来指对方的动作。","pex":[],"ex":[{"jp":"{次|つぎ}の{方|かた}、お{待|ま}ちです。","zh":"下一位，请您稍等（轮到您了）。","src":"","say":"次のかた、お待ちです。"},{"jp":"こちらのカードをご{利用|りよう}でしょうか。","zh":"您是使用这张卡吗？","src":"","say":"こちらのカードをご利用でしょうか。"}],"tips":["ご is used with 汉语动词，如「ご{利用|りよう}」「ご{案内|あんない}」。和语多用「お{待|ま}ちです」。"]},{"id":"4-2","lesson":4,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"cond","pattern":"〜{場合|ばあい}","official":"〜場合","usage":"施設の利用方法の説明で使われることば・表現","usageR":"{施設|しせつ}の{利用|りよう}{方法|ほうほう}の{説明|せつめい}で{使|つか}われることば・{表現|ひょうげん}","conn":"Vる／Vた／Aい／Nの＋場合","zh":"在…的情况下。比「とき」更正式，说明规则时常用。","pex":[],"ex":[{"jp":"{遅|おく}れる{場合|ばあい}は、{電話|でんわ}してください。","zh":"如果要迟到，请打电话。","src":"","say":"遅れる場合は、電話してください。"},{"jp":"{雨|あめ}の{場合|ばあい}、イベントは{中止|ちゅうし}です。","zh":"如果下雨，活动取消。","src":"","say":"雨の場合、イベントは中止です。"}],"tips":["「{場合|ばあい}」偏条件和场合，「とき」只是时候。"]},{"id":"4-3","lesson":4,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"cond","pattern":"〜ないことには〜ない","official":"〜ないことには〜ない","usage":"施設の利用方法の説明で使われることば・表現","usageR":"{施設|しせつ}の{利用|りよう}{方法|ほうほう}の{説明|せつめい}で{使|つか}われることば・{表現|ひょうげん}","conn":"Vない＋ことには、Vない","zh":"如果不…，就不能…。强调前提。","pex":[],"ex":[{"jp":"{会員|かいいん}にならないことには、{借|か}りられません。","zh":"不成为会员就不能借。","src":"","say":"会員にならないことには、借りられません。"},{"jp":"{自分|じぶん}でやってみないことには、{分|わ}かりません。","zh":"自己不试一下，就不会明白。","src":"","say":"自分でやってみないことには、分かりません。"}],"tips":["后项必须是否定，或“说不清、不知道”这类消极表达。"]},{"id":"4-4","lesson":4,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"keigo","pattern":"〜たいことがあるんですが","official":"〜たいことがあるんですが","usage":"言い出しにくいことを言うときの表現","usageR":"{言|い}い{出|だ}しにくいことを{言|い}うときの{表現|ひょうげん}","conn":"Vます词干＋たいことがあるんですが","zh":"有件事想…。不好开口时，先这样起头。","pex":[],"ex":[{"jp":"ちょっと{相談|そうだん}したいことがあるんですが。","zh":"有件事想跟您商量一下。","src":"","say":"ちょっと相談したいことがあるんですが。"},{"jp":"{予約|よやく}を{変|か}えたいことがあるんですが、いいですか。","zh":"有件事，想改一下预约，可以吗？","src":"","say":"予約を変えたいことがあるんですが、いいですか。"}],"tips":["后面常常再接请求，不要只说半句就停住。"]},{"id":"4-5","lesson":4,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"time","pattern":"〜（よ）うとする","official":"〜（よ）うとする","usage":"言い出しにくいことを言うときの表現","usageR":"{言|い}い{出|だ}しにくいことを{言|い}うときの{表現|ひょうげん}","conn":"V意向形＋とする","zh":"想要做…；正要做…。","pex":[],"ex":[{"jp":"{部屋|へや}を{出|で}ようとしたとき、{電話|でんわ}が{鳴|な}りました。","zh":"正要出房间的时候，电话响了。","src":"","say":"部屋を出ようとしたとき、電話が鳴りました。"},{"jp":"{何|なん}{度|ど}も{説明|せつめい}しようとしましたが、{時間|じかん}がありませんでした。","zh":"想说明好几次，可是没有时间。","src":"","say":"なん度も説明しようとしましたが、時間がありませんでした。"}],"tips":["「しようとしたとき」＝正要做的时候。「{入|はい}ろうとする」是试图进去。"]},{"id":"4-6","lesson":4,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"explain","pattern":"〜みたいなんですが／〜ようなんですが","official":"〜みたいなんですが／〜ようなんですが","usage":"言い出しにくいことを言うときの表現","usageR":"{言|い}い{出|だ}しにくいことを{言|い}うときの{表現|ひょうげん}","conn":"普通形＋みたいなんですが／ようなんですが","zh":"好像是…。不太确定，或不好直说问题时，用来把语气放软。","pex":[],"ex":[{"jp":"{鍵|かぎ}が{見|み}つからないみたいなんですが。","zh":"好像找不到钥匙了。","src":"","say":"鍵が見つからないみたいなんですが。"},{"jp":"{予約|よやく}が{取|と}れていないようなんですが。","zh":"好像没有预约上。","src":"","say":"予約が取れていないようなんですが。"}],"tips":["「ようなんですが」比「みたい」稍郑重。"]},{"id":"4-7","lesson":4,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"request","pattern":"〜ていただきたいんですが","official":"〜ていただきたいんですが","usage":"言い出しにくいことを言うときの表現","usageR":"{言|い}い{出|だ}しにくいことを{言|い}うときの{表現|ひょうげん}","conn":"Vて＋いただきたいんですが","zh":"想请您…。比「てください」柔和，是谦让的请求。","pex":[],"ex":[{"jp":"もう{一|いち}{度|ど}{説明|せつめい}していただきたいんですが。","zh":"想请您再说明一次。","src":"","say":"もう一度説明していただきたいんですが。"},{"jp":"ここを{見|み}ていただきたいんですが、よろしいですか。","zh":"想请您看一下这里，可以吗？","src":"","say":"ここを見ていただきたいんですが、よろしいですか。"}],"tips":["再礼貌一点是第17课的「ていただけないでしょうか」。"]},{"id":"4-8","lesson":4,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"scope","pattern":"〜には","official":"〜には","usage":"施設の利用案内でよく見ることば","usageR":"{施設|しせつ}の{利用|りよう}{案内|あんない}でよく{見|み}ることば","conn":"Vる＋には","zh":"要做…的话，就需要…。表示目的所需的条件。","pex":[],"ex":[{"jp":"この{施設|しせつ}を{使|つか}うには、カードが{必要|ひつよう}です。","zh":"要用这个设施，需要卡。","src":"","say":"この施設を使うには、カードが必要です。"},{"jp":"{上手|じょうず}になるには、{毎日|まいにち}{練習|れんしゅう}することです。","zh":"要变好，就得每天练习。","src":"","say":"上手になるには、毎日練習することです。"}],"tips":["和「ために」不同：「には」后面多是必要条件，不是动作。"]},{"id":"4-9","lesson":4,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"contrast","pattern":"〜にかかわらず／〜にかかわりなく","official":"〜にかかわらず／〜にかかわりなく","usage":"施設の利用案内でよく見ることば","usageR":"{施設|しせつ}の{利用|りよう}{案内|あんない}でよく{見|み}ることば","conn":"N＋にかかわらず；Vる＋Vない＋にかかわらず；にかかわりなく","zh":"不管…；不论…。","pex":[],"ex":[{"jp":"{年齢|ねんれい}にかかわらず、だれでも{参加|さんか}できます。","zh":"不论年龄，谁都可以参加。","src":"","say":"年齢にかかわらず、だれでも参加できます。"},{"jp":"{天気|てんき}にかかわりなく、{行|おこな}います。","zh":"不论天气，都举行。","src":"","say":"天気にかかわりなく、行います。"}],"tips":["「にかかわりなく」意思相同，更书面。"]},{"id":"4-10","lesson":4,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"time","pattern":"〜{次第|しだい}","official":"〜次第","usage":"施設の利用案内でよく見ることば","usageR":"{施設|しせつ}の{利用|りよう}{案内|あんない}でよく{見|み}ることば","conn":"Vます词干＋次第","zh":"一…就立刻…。准备好就马上做。告示、事务联系里常用。","pex":[],"ex":[{"jp":"{決|き}まり{次第|しだい}、ご{連絡|れんらく}します。","zh":"一定下来就跟您联系。","src":"","say":"決まり次第、ご連絡します。"},{"jp":"{着|つ}き{次第|しだい}、{電話|でんわ}してください。","zh":"一到就请打电话。","src":"","say":"着き次第、電話してください。"}],"tips":["第16课的「{次第|しだい}だ／{次第|しだい}で」是“要看…而定”，不是“立刻”。"]},{"id":"4-11","lesson":4,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"time","pattern":"〜{途中|とちゅう}（で）／〜{途中|とちゅう}（に）","official":"〜途中（で）／〜途中（に）","usage":"施設のよさについて紹介するときの表現","usageR":"{施設|しせつ}のよさについて{紹介|しょうかい}するときの{表現|ひょうげん}","conn":"Vます词干／Nの＋途中（で）／途中（に）","zh":"在…的途中。「で」多接“中断、发生了别的事”，「に」多接途中的一个点。","pex":[],"ex":[{"jp":"{映画|えいが}の{途中|とちゅう}で、{電話|でんわ}が{鳴|な}りました。","zh":"电影放到一半，电话响了。","src":"","say":"映画の途中で、電話が鳴りました。"},{"jp":"{家|いえ}へ{帰|かえ}る{途中|とちゅう}に、この{店|みせ}を{見|み}つけました。","zh":"回家的路上发现了这家店。","src":"","say":"家へ帰る途中に、この店を見つけました。"}],"tips":["「{途中|とちゅう}で{帰|かえ}る」是做到一半回去。「{途中|とちゅう}に{寄|よ}る」是中途顺便去。"]},{"id":"4-12","lesson":4,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"scope","pattern":"〜を〜として","official":"〜を〜として","usage":"施設のよさについて紹介するときの表現","usageR":"{施設|しせつ}のよさについて{紹介|しょうかい}するときの{表現|ひょうげん}","conn":"N＋を＋N＋として","zh":"把…当作…。","pex":[],"ex":[{"jp":"この{部屋|へや}を{会議|かいぎ}{室|しつ}として{使|つか}っています。","zh":"把这个房间当作会议室使用。","src":"","say":"この部屋を会議室として使っています。"},{"jp":"{失敗|しっぱい}を{経験|けいけん}として{生|い}かしたいです。","zh":"想把失败当作经验来用。","src":"","say":"失敗を経験としていかしたいです。"}],"tips":["「として」单独表示身份，见第6课。"]},{"id":"4-13","lesson":4,"taskN":5,"task":"5 耳でキャッチ","stTitle":"5 耳でキャッチ","cat":"scope","pattern":"〜を{背|せ}にして","official":"〜を背にして","usage":"道を案内するときに使うことば","usageR":"{道|みち}を{案内|あんない}するときに{使|つか}うことば","conn":"N＋を背にして","zh":"背对着…。指路时用来说明位置。","pex":[],"ex":[{"jp":"{駅|えき}を{背|せ}にして、{右|みぎ}に{曲|ま}がってください。","zh":"请背对车站向右拐。","src":"","say":"駅を背にして、右に曲がってください。"},{"jp":"{山|やま}を{背|せ}にして{写真|しゃしん}を{撮|と}りました。","zh":"背对着山拍了照。","src":"","say":"山を背にして写真を撮りました。"}],"tips":["是“背对”，不是“面对”。面对用「に{向|む}かって」。"]},{"id":"4-14","lesson":4,"taskN":5,"task":"5 耳でキャッチ","stTitle":"5 耳でキャッチ","cat":"scope","pattern":"〜に{沿|そ}って／〜に{沿|そ}う／〜に{沿|そ}った","official":"〜に沿って／〜に沿う／〜に沿った","usage":"道を案内するときに使うことば","usageR":"{道|みち}を{案内|あんない}するときに{使|つか}うことば","conn":"N＋に沿って／に沿う／に沿った＋N","zh":"沿着…；按照…。","pex":[],"ex":[{"jp":"この{道|みち}に{沿|そ}って{行|い}くと、{図書|としょ}{館|かん}があります。","zh":"沿着这条路走，就有图书馆。","src":"","say":"この道に沿って行くと、図書館があります。"},{"jp":"{希望|きぼう}に{沿|そ}ったプランを{考|かんが}えましょう。","zh":"按您的希望来考虑方案吧。","src":"","say":"希望に沿ったプランを考えましょう。"}],"tips":["道路用“沿着”，规则、希望用“按照”。"]},{"id":"5-1","lesson":5,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"reason","pattern":"〜によって／〜により／〜による（{原因|げんいん}）","official":"〜によって／〜により／〜による（原因）","usage":"地震や台風などの速報でよく使われることば","usageR":"{地震|じしん}や{台風|たいふう}などの{速報|そくほう}でよく{使|つか}われることば","conn":"N＋によって／により／による＋N（原因）","zh":"由于…。新闻、速报里说原因。书面。","pex":[],"ex":[{"jp":"{台風|たいふう}によって、{電車|でんしゃ}が{止|と}まりました。","zh":"由于台风，电车停了。","src":"","say":"台風によって、電車が止まりました。"},{"jp":"{地震|じしん}による{被害|ひがい}をニュースで{見|み}ました。","zh":"在新闻里看到了地震造成的损害。","src":"","say":"地震による被害をニュースで見ました。"}],"tips":["第2课是“因…而不同”，第13课多是方式。本课是原因。"]},{"id":"5-2","lesson":5,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"guess","pattern":"〜おそれがある","official":"〜おそれがある","usage":"地震や台風などの速報でよく使われることば","usageR":"{地震|じしん}や{台風|たいふう}などの{速報|そくほう}でよく{使|つか}われることば","conn":"Vる／Nの＋おそれがある","zh":"有…的危险、可能发生不好的事。新闻书面语。","pex":[],"ex":[{"jp":"{大|おお}きい{地震|じしん}が{起|お}きるおそれがあります。","zh":"有发生大地震的危险。","src":"","say":"大きい地震が起きるおそれがあります。"},{"jp":"{川|かわ}の{水|みず}が{増|ふ}えるおそれがあるので、{近|ちか}づかないでください。","zh":"河水可能上涨，请不要靠近。","src":"","say":"川の水が増えるおそれがあるので、近づかないでください。"}],"tips":["不用于好的可能。好的可能用「かもしれない」。"]},{"id":"5-3","lesson":5,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"guess","pattern":"〜そうにないんですが","official":"〜そうにないんですが","usage":"交通機関が止まっている状況を説明するときの表現","usageR":"{交通|こうつう}{機関|きかん}が{止|と}まっている{状況|じょうきょう}を{説明|せつめい}するときの{表現|ひょうげん}","conn":"Vます词干＋そうにない＋んですが","zh":"看起来不会…。说明“赶不上、来不了”时把语气放软。","pex":[],"ex":[{"jp":"{電車|でんしゃ}が{動|うご}きそうにないんですが、どうしましょうか。","zh":"电车好像不会开了，怎么办呢？","src":"","say":"電車が動きそうにないんですが、どうしましょうか。"},{"jp":"{約束|やくそく}の{時間|じかん}に{間|ま}に{合|あ}いそうにないんです。","zh":"看来赶不上约定的时间了。","src":"","say":"約束の時間にまに合いそうにないんです。"}],"tips":["「そうだ」是样态。「そうにない」是否定：不像会发生。"]},{"id":"5-4","lesson":5,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"explain","pattern":"とか","official":"とか","usage":"交通機関が止まっている状況を説明するときの表現","usageR":"{交通|こうつう}{機関|きかん}が{止|と}まっている{状況|じょうきょう}を{説明|せつめい}するときの{表現|ひょうげん}","conn":"普通形＋とか","zh":"听说好像…，但说话人也不太确定。口语。","pex":[],"ex":[{"jp":"{事故|じこ}で{道|みち}が{閉|し}まっているとか。","zh":"听说因为事故，路封了。","src":"","say":"事故で道が閉まっているとか。"},{"jp":"{今日|きょう}の{電車|でんしゃ}は{全部|ぜんぶ}{止|と}まるらしいとか。","zh":"好像说今天的电车全部停运。","src":"","say":"今日の電車は全部止まるらしいとか。"}],"tips":["第1课「とかとか」是列举例子。本课的「とか」在句尾，是传闻。"]},{"id":"5-5","lesson":5,"taskN":3,"task":"3 こんなときどうする？","stTitle":"3 こんなときどうする？","cat":"explain","pattern":"〜てしまったようなんです","official":"〜てしまったようなんです","usage":"事故の状況とけがの説明をするときのことば・表現","usageR":"{事故|じこ}の{状況|じょうきょう}とけがの{説明|せつめい}をするときのことば・{表現|ひょうげん}","conn":"Vて＋しまった＋ようなんです","zh":"不小心…了。说明事故、受伤时，既表达遗憾，又把判断说得委婉。","pex":[],"ex":[{"jp":"{転|ころ}んで、{足|あし}をけがしてしまったようなんです。","zh":"摔倒了，腿好像受伤了。","src":"","say":"転んで、足をけがしてしまったようなんです。"},{"jp":"{荷物|にもつ}を{電車|でんしゃ}に{忘|わす}れてしまったんです。","zh":"不小心把行李忘在电车上了。","src":"","say":"荷物を電車に忘れてしまったんです。"}],"tips":["「しまった」是后悔已经发生。「ようなんです」表示“看起来是这样”。"]},{"id":"5-6","lesson":5,"taskN":3,"task":"3 こんなときどうする？","stTitle":"3 こんなときどうする？","cat":"time","pattern":"〜ところへ／〜ところに／〜ところを","official":"〜ところへ／〜ところに／〜ところを","usage":"事故の状況とけがの説明をするときのことば・表現","usageR":"{事故|じこ}の{状況|じょうきょう}とけがの{説明|せつめい}をするときのことば・{表現|ひょうげん}","conn":"Vた／Vている＋ところへ／ところに／ところを","zh":"正当…的时候。「へ／に」多接人来了；「を」多接正在做的事被打断、被看到。","pex":[],"ex":[{"jp":"{出|で}かけるところに、{友|とも}だちが{来|き}ました。","zh":"正要出门的时候，朋友来了。","src":"","say":"出かけるところに、友だちが来ました。"},{"jp":"{寝|ね}ているところを{起|お}こされました。","zh":"正睡着的时候被叫起来了。","src":"","say":"寝ているところを起こされました。"}],"tips":["和「たところ」（一做就发现结果，第7课）不是同一个句型。"]},{"id":"5-7","lesson":5,"taskN":3,"task":"3 こんなときどうする？","stTitle":"3 こんなときどうする？","cat":"time","pattern":"〜につれて","official":"〜につれて","usage":"事故の状況とけがの説明をするときのことば・表現","usageR":"{事故|じこ}の{状況|じょうきょう}とけがの{説明|せつめい}をするときのことば・{表現|ひょうげん}","conn":"Vる＋につれて","zh":"随着…，…也跟着变化。前后都是变化。","pex":[],"ex":[{"jp":"{時間|じかん}がたつにつれて、{痛|いた}くなってきました。","zh":"随着时间过去，越来越疼了。","src":"","say":"時間がたつにつれて、痛くなってきました。"},{"jp":"{夜|よる}になるにつれて、{風|かぜ}が{強|つよ}くなりました。","zh":"随着入夜，风变大了。","src":"","say":"夜になるにつれて、風が強くなりました。"}],"tips":["一边不变就不能用。比较：第18课「にしたがって」还可以表示“按照规则”。"]},{"id":"5-8","lesson":5,"taskN":4,"task":"4 見つけた!","stTitle":"4 見つけた!","cat":"ability","pattern":"〜ものだ／〜ものではない（{当然|とうぜん}）","official":"〜ものだ／〜ものではない（当然）","usage":"災害時の避難に関係があることば・表現","usageR":"{災害|さいがい}{時|じ}の{避難|ひなん}に{関係|かんけい}があることば・{表現|ひょうげん}","conn":"Vる＋ものだ／ものではない","zh":"按常理就该…／不该…。提醒人们本来应该怎样做。","pex":[],"ex":[{"jp":"{非常|ひじょう}のときは、ドアの{前|まえ}に{物|もの}を{置|お}かないものです。","zh":"紧急的时候，不该在梯子下面放东西。","src":"","say":"非常のときは、ドアの前に物を置かないものです。"},{"jp":"{約束|やくそく}は{守|まも}るものです。","zh":"约定就该遵守。","src":"","say":"約束は守るものです。"}],"tips":["第16课的「たものだ」是怀念“以前常常”。本课是当然、应该。"]},{"id":"5-9","lesson":5,"taskN":4,"task":"4 見つけた!","stTitle":"4 見つけた!","cat":"manner","pattern":"〜とおり（に）／〜どおり（に）","official":"〜とおり（に）／〜どおり（に）","usage":"災害時の避難に関係があることば・表現","usageR":"{災害|さいがい}{時|じ}の{避難|ひなん}に{関係|かんけい}があることば・{表現|ひょうげん}","conn":"Vる／Vた＋とおり（に）；N＋どおり（に）","zh":"按照…那样。","pex":[],"ex":[{"jp":"{先生|せんせい}が{言|い}ったとおりにやりました。","zh":"按老师说的做了。","src":"","say":"先生が言ったとおりにやりました。"},{"jp":"{計画|けいかく}どおりに{進|すす}んでいます。","zh":"在按计划进行。","src":"","say":"計画どおりに進んでいます。"}],"tips":["名词用「どおり」：予定どおり、時間どおり。动词用「とおり」。"]},{"id":"5-10","lesson":5,"taskN":4,"task":"4 見つけた!","stTitle":"4 見つけた!","cat":"time","pattern":"〜{際|さい}（に）","official":"〜際（に）","usage":"災害時の避難に関係があることば・表現","usageR":"{災害|さいがい}{時|じ}の{避難|ひなん}に{関係|かんけい}があることば・{表現|ひょうげん}","conn":"Vる／Nの＋際（に）","zh":"在…的时候。比「とき」正式，告示、说明里常用。","pex":[],"ex":[{"jp":"{避難|ひなん}する{際|さい}は、エレベーターを{使|つか}わないでください。","zh":"避难时请不要使用电梯。","src":"","say":"避難する際は、エレベーターを使わないでください。"},{"jp":"お{帰|かえ}りの{際|さい}に、カードを{返|かえ}してください。","zh":"回去的时候请把卡还回来。","src":"","say":"お帰りの際に、カードを返してください。"}],"tips":["口语说「とき」即可。"]},{"id":"5-11","lesson":5,"taskN":4,"task":"4 見つけた!","stTitle":"4 見つけた!","cat":"ability","pattern":"〜こと（{指示|しじ}）","official":"〜こと（指示）","usage":"災害時の避難に関係があることば・表現","usageR":"{災害|さいがい}{時|じ}の{避難|ひなん}に{関係|かんけい}があることば・{表現|ひょうげん}","conn":"Vる／Vない＋こと。（句尾，告示）","zh":"必须…／禁止…。书面指示，不是建议的「ことだ」（第15课）。","pex":[],"ex":[{"jp":"ここでたばこを{吸|す}わないこと。","zh":"此处禁止吸烟。","src":"","say":"ここでたばこを吸わないこと。"},{"jp":"{非常口|ひじょうぐち}を{確認|かくにん}すること。","zh":"必须确认紧急出口。","src":"","say":"ひじょうぐちを確認すること。"}],"tips":["句号常常直接结束，没有「です」。"]},{"id":"5-12","lesson":5,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"manner","pattern":"〜まま","official":"〜まま","usage":"けがや急病に関係があることば・表現","usageR":"けがや{急病|きゅうびょう}に{関係|かんけい}があることば・{表現|ひょうげん}","conn":"Vた／Vない／Nの＋まま","zh":"保持…的状态不变。","pex":[],"ex":[{"jp":"{靴|くつ}をはいたまま、{部屋|へや}に{入|はい}らないでください。","zh":"请不要穿着鞋进房间。","src":"","say":"靴をはいたまま、部屋に入らないでください。"},{"jp":"{電気|でんき}をつけたまま{寝|ね}てしまいました。","zh":"灯开着就睡着了。","src":"","say":"電気をつけたまま寝てしまいました。"}],"tips":["「ないまま」是一直没做。「たまま」是做了之后就那么放着。"]},{"id":"5-13","lesson":5,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"manner","pattern":"〜だらけ","official":"〜だらけ","usage":"けがや急病に関係があることば・表現","usageR":"けがや{急病|きゅうびょう}に{関係|かんけい}があることば・{表現|ひょうげん}","conn":"N＋だらけ","zh":"满是…；净是…。多用于不好的东西。","pex":[],"ex":[{"jp":"{服|ふく}が{泥|どろ}だらけになりました。","zh":"衣服上全是泥。","src":"","say":"服が泥だらけになりました。"},{"jp":"この{作文|さくぶん}は{間違|まちが}いだらけです。","zh":"这篇作文净是错。","src":"","say":"この作文は間違いだらけです。"}],"tips":["好的、漂亮的东西一般不用「だらけ」。"]},{"id":"5-14","lesson":5,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"guess","pattern":"～んだろう／～のだろう","official":"～んだろう／～のだろう","usage":"けがや急病に関係があることば・表現","usageR":"けがや{急病|きゅうびょう}に{関係|かんけい}があることば・{表現|ひょうげん}","conn":"普通形＋んだろう／のだろう","zh":"是…吧；到底为什么…呢。带推测，也用来寻思原因。","pex":[],"ex":[{"jp":"どうしてこんなに{人|ひと}が{多|おお}いんだろう。","zh":"为什么人会这么多呢。","src":"","say":"どうしてこんなにひとが多いんだろう。"},{"jp":"{彼|かれ}はかなり{痛|いた}かったのだろう。","zh":"他当时大概相当疼吧。","src":"","say":"彼はかなり痛かったのだろう。"}],"tips":["「のだろう」更书面一点。「んだろう」是口语。"]},{"id":"6-1","lesson":6,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"scope","pattern":"〜に{囲|かこ}まれている／〜に{囲|かこ}まれた","official":"〜に囲まれている／〜に囲まれた","usage":"地形や町の様子、気候を説明するときのことば・表現","usageR":"{地形|ちけい}や{町|まち}の{様子|ようす}、{気候|きこう}を{説明|せつめい}するときのことば・{表現|ひょうげん}","conn":"N＋に囲まれている／に囲まれた＋N","zh":"被…包围着。说明地形、城镇时常用。","pex":[],"ex":[{"jp":"この{町|まち}は{山|やま}に{囲|かこ}まれています。","zh":"这座城镇被山围着。","src":"","say":"この町は山に囲まれています。"},{"jp":"{海|うみ}に{囲|かこ}まれた{国|くに}について{読|よ}みました。","zh":"读了关于被海包围的国家的内容。","src":"","say":"海に囲まれた国について読みました。"}],"tips":["「{囲|かこ}まれた」直接接名词：「{山|やま}に{囲|かこ}まれた{町|まち}」。"]},{"id":"6-2","lesson":6,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"scope","pattern":"（〜が）〜を{占|し}める／〜が{占|し}める","official":"（〜が）〜を占める／〜が占める","usage":"地形や町の様子、気候を説明するときのことば・表現","usageR":"{地形|ちけい}や{町|まち}の{様子|ようす}、{気候|きこう}を{説明|せつめい}するときのことば・{表現|ひょうげん}","conn":"N＋が＋N＋を占める／N＋が占める","zh":"占…（比例、面积、部分）。","pex":[],"ex":[{"jp":"{森林|しんりん}が{国土|こくど}の{多|おお}くを{占|し}めています。","zh":"森林占国土的很大一部分。","src":"","say":"森林が国土の多くを占めています。"},{"jp":"この{仕事|しごと}は、{一|いち}{日|にち}の{半分|はんぶん}を{占|し}めます。","zh":"这项工作占去一天的一半。","src":"","say":"この仕事は、一にちの半分を占めます。"}],"tips":["主语用「が」，所占的东西用「を」。"]},{"id":"6-3","lesson":6,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"manner","pattern":"〜がち","official":"〜がち","usage":"地形や町の様子、気候を説明するときのことば・表現","usageR":"{地形|ちけい}や{町|まち}の{様子|ようす}、{気候|きこう}を{説明|せつめい}するときのことば・{表現|ひょうげん}","conn":"Vます词干／N＋がち","zh":"容易…；往往会…。多指不太好的倾向。","pex":[],"ex":[{"jp":"{冬|ふゆ}は{曇|くも}りがちです。","zh":"冬天往往是阴天。","src":"","say":"冬は曇りがちです。"},{"jp":"{最近|さいきん}、{遅|おく}れがちなので、{気|き}をつけます。","zh":"最近容易迟到，我会注意。","src":"","say":"最近、遅れがちなので、きをつけます。"}],"tips":["「{気味|きみ}」是“有点那种感觉”，程度更轻、更一时。"]},{"id":"6-4","lesson":6,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"contrast","pattern":"〜に{比|くら}べ（て）","official":"〜に比べ（て）","usage":"地形や町の様子、気候を説明するときのことば・表現","usageR":"{地形|ちけい}や{町|まち}の{様子|ようす}、{気候|きこう}を{説明|せつめい}するときのことば・{表現|ひょうげん}","conn":"N＋に比べ（て）","zh":"和…相比。","pex":[],"ex":[{"jp":"{北|きた}は{南|みなみ}に{比|くら}べて、{冬|ふゆ}が{長|なが}いです。","zh":"北部和南部相比，冬天更长。","src":"","say":"北は南に比べて、冬が長いです。"},{"jp":"{去年|きょねん}に{比|くら}べて、{雨|あめ}が{多|おお}いです。","zh":"和去年相比，雨更多。","src":"","say":"去年に比べて、雨が多いです。"}],"tips":["后面说出比较的结果。"]},{"id":"6-5","lesson":6,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"reason","pattern":"〜に{備|そな}えて","official":"〜に備えて","usage":"工夫を加えて作られている建物について説明するときのことば・表現","usageR":"{工夫|くふう}を{加|くわ}えて{作|つく}られている{建物|たてもの}について{説明|せつめい}するときのことば・{表現|ひょうげん}","conn":"N／Vる＋に備えて","zh":"为…做准备。","pex":[],"ex":[{"jp":"{地震|じしん}に{備|そな}えて、{水|みず}を{準備|じゅんび}しています。","zh":"为了防备地震，准备着水。","src":"","say":"地震に備えて、水を準備しています。"},{"jp":"{寒|さむ}い{冬|ふゆ}に{備|そな}えて、{窓|まど}を{二|に}{重|じゅう}にしました。","zh":"为了应对寒冷的冬天，把窗户做成了双层。","src":"","say":"寒い冬に備えて、窓を二重にしました。"}],"tips":["「{備|そな}える」的对象用「に」。"]},{"id":"6-6","lesson":6,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"scope","pattern":"〜に{代|か}わって／〜に{代|か}わり","official":"〜に代わって／〜に代わり","usage":"工夫を加えて作られている建物について説明するときのことば・表現","usageR":"{工夫|くふう}を{加|くわ}えて{作|つく}られている{建物|たてもの}について{説明|せつめい}するときのことば・{表現|ひょうげん}","conn":"N＋に代わって／に代わり","zh":"代替…。","pex":[],"ex":[{"jp":"{父|ちち}に{代|か}わって、{私|わたし}がご{挨拶|あいさつ}します。","zh":"我代替父亲向您问好。","src":"","say":"父に代わって、わたしがご挨拶します。"},{"jp":"{人|ひと}に{代|か}わり、{機械|きかい}がこの{仕事|しごと}をしています。","zh":"机器代替人在做这项工作。","src":"","say":"ひとに代わり、機械がこの仕事をしています。"}],"tips":["第8课还有「の{代|か}わりに」，口语里更常说。"]},{"id":"6-7","lesson":6,"taskN":3,"task":"3 こんなときどうする？","stTitle":"3 こんなときどうする？","cat":"example","pattern":"〜のような／〜のように（{例示|れいじ}）","official":"〜のような／〜のように（例示）","usage":"友達の体調に合わせてアドバイスするときのことば・表現","usageR":"{友達|ともだち}の{体調|たいちょう}に{合|あ}わせてアドバイスするときのことば・{表現|ひょうげん}","conn":"N＋のような／のように＋N／V","zh":"像…那样的（举例）。","pex":[],"ex":[{"jp":"スープのような{温|あたた}かい{物|もの}がいいですよ。","zh":"像汤这样热的东西比较好。","src":"","say":"スープのような温かい物がいいですよ。"},{"jp":"{子|こ}どものように、{早|はや}く{寝|ね}た{方|ほう}がいいです。","zh":"最好像孩子那样早点睡。","src":"","say":"子どものように、早く寝たほうがいいです。"}],"tips":["第9课的「ように」是“和…同样”。本课是举例子。"]},{"id":"6-8","lesson":6,"taskN":3,"task":"3 こんなときどうする？","stTitle":"3 こんなときどうする？","cat":"scope","pattern":"〜として","official":"〜として","usage":"友達の体調に合わせてアドバイスするときのことば・表現","usageR":"{友達|ともだち}の{体調|たいちょう}に{合|あ}わせてアドバイスするときのことば・{表現|ひょうげん}","conn":"N＋として","zh":"作为…（身份、立场）。","pex":[],"ex":[{"jp":"{留学|りゅうがく}{生|せい}として、{日本|にほん}の{生活|せいかつ}を{紹介|しょうかい}しました。","zh":"作为留学生，介绍了在日本的生活。","src":"","say":"留学せいとして、にほんの生活を紹介しました。"},{"jp":"{初|はじ}めての{経験|けいけん}として、{心|こころ}に{残|のこ}っています。","zh":"作为第一次的经历，留在心里。","src":"","say":"初めての経験として、心に残っています。"}],"tips":["「をNとして」是“把A当作B”。这里只是“以…的身份”。"]},{"id":"6-9","lesson":6,"taskN":3,"task":"3 こんなときどうする？","stTitle":"3 こんなときどうする？","cat":"emotion","pattern":"〜に{限|かぎ}る","official":"〜に限る","usage":"友達の体調に合わせてアドバイスするときのことば・表現","usageR":"{友達|ともだち}の{体調|たいちょう}に{合|あ}わせてアドバイスするときのことば・{表現|ひょうげん}","conn":"Vる／N＋に限る","zh":"最好是…；没有比…更好的。主观推荐。","pex":[],"ex":[{"jp":"{疲|つか}れたときは、{早|はや}く{寝|ね}るに{限|かぎ}ります。","zh":"累的时候，最好早点睡。","src":"","say":"疲れたときは、早く寝るにかぎります。"},{"jp":"{暑|あつ}い{日|ひ}は{冷|つめ}たい{物|もの}に{限|かぎ}ります。","zh":"热天最好来点凉的。","src":"","say":"暑いひは冷たい物にかぎります。"}],"tips":["「に{限|かぎ}り」是“仅限”，不要看错。"]},{"id":"6-10","lesson":6,"taskN":4,"task":"4 見つけた!","stTitle":"4 見つけた!","cat":"scope","pattern":"〜を{中心|ちゅうしん}に（して）／〜を{中心|ちゅうしん}として","official":"〜を中心に（して）／〜を中心として","usage":"町の特徴や歴史を説明するときのことば・表現","usageR":"{町|まち}の{特徴|とくちょう}や{歴史|れきし}を{説明|せつめい}するときのことば・{表現|ひょうげん}","conn":"N＋を中心に（して）／を中心として","zh":"以…为中心。","pex":[],"ex":[{"jp":"{駅|えき}を{中心|ちゅうしん}に、{店|みせ}が{並|なら}んでいます。","zh":"以车站为中心，商店排成一排。","src":"","say":"駅を中心に、店が並んでいます。"},{"jp":"この{町|まち}は{港|みなと}を{中心|ちゅうしん}として{発展|はってん}しました。","zh":"这座城镇以港口为中心发展起来。","src":"","say":"この町は港を中心として発展しました。"}],"tips":["范围围绕这个中心展开。"]},{"id":"6-11","lesson":6,"taskN":4,"task":"4 見つけた!","stTitle":"4 見つけた!","cat":"scope","pattern":"〜を{通|つう}じて／〜を{通|とお}して","official":"〜を通じて／〜を通して","usage":"町の特徴や歴史を説明するときのことば・表現","usageR":"{町|まち}の{特徴|とくちょう}や{歴史|れきし}を{説明|せつめい}するときのことば・{表現|ひょうげん}","conn":"N＋を通じて／を通して","zh":"通过…；在整个…期间。","pex":[],"ex":[{"jp":"{友達|ともだち}を{通|つう}じて、その{話|はなし}を{知|し}りました。","zh":"通过朋友知道了那件事。","src":"","say":"友達をつうじて、その話を知りました。"},{"jp":"{一|いち}{年|ねん}を{通|とお}して、{雨|あめ}が{多|おお}い{地域|ちいき}です。","zh":"是一整年雨水都多的地区。","src":"","say":"一年をとおして、雨が多い地域です。"}],"tips":["第15课用它说媒体。期间：「{一|いち}{年|ねん}を{通|とお}して」。"]},{"id":"6-12","lesson":6,"taskN":4,"task":"4 見つけた!","stTitle":"4 見つけた!","cat":"example","pattern":"〜をはじめ（として）／〜をはじめとする","official":"〜をはじめ（として）／〜をはじめとする","usage":"町の特徴や歴史を説明するときのことば・表現","usageR":"{町|まち}の{特徴|とくちょう}や{歴史|れきし}を{説明|せつめい}するときのことば・{表現|ひょうげん}","conn":"N＋をはじめ（として）／をはじめとする＋N","zh":"以…为首；…以及…。先举一个代表，再带出同类。","pex":[],"ex":[{"jp":"{東京|とうきょう}をはじめ、{大|おお}きい{都市|とし}に{人|ひと}が{集中|しゅうちゅう}しています。","zh":"以东京为首，人口集中在大城市。","src":"","say":"東京をはじめ、大きい都市にひとが集中しています。"},{"jp":"{社長|しゃちょう}をはじめとするメンバーが{来|き}ました。","zh":"以社长为首的成员来了。","src":"","say":"社長をはじめとするメンバーが来ました。"}],"tips":["代表放在「をはじめ」前面。"]},{"id":"6-13","lesson":6,"taskN":4,"task":"4 見つけた!","stTitle":"4 見つけた!","cat":"reason","pattern":"〜ことから","official":"〜ことから","usage":"町の特徴や歴史を説明するときのことば・表現","usageR":"{町|まち}の{特徴|とくちょう}や{歴史|れきし}を{説明|せつめい}するときのことば・{表現|ひょうげん}","conn":"普通形＋ことから","zh":"由于…这一点，因而…。常用来说明名称、结论的由来。","pex":[],"ex":[{"jp":"{桜|さくら}が{多|おお}いことから、{桜町|さくらまち}という{名前|なまえ}がつきました。","zh":"因为樱花多，所以起了樱町这个名字。","src":"","say":"桜が多いことから、桜町という名前がつきました。"},{"jp":"よく{地震|じしん}が{起|お}きることから、{準備|じゅんび}が{必要|ひつよう}です。","zh":"由于经常发生地震，所以需要做准备。","src":"","say":"よく地震が起きることから、準備が必要です。"}],"tips":["不是口语的「から」。书面，从事实推出名称或判断。"]},{"id":"6-14","lesson":6,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"explain","pattern":"〜といえば／〜というと","official":"〜といえば／〜というと","usage":"地形や気候を利用した行事や、特産物などについて説明するときの表現","usageR":"{地形|ちけい}や{気候|きこう}を{利用|りよう}した{行事|ぎょうじ}や、{特産|とくさん}{物|ぶつ}などについて{説明|せつめい}するときの{表現|ひょうげん}","conn":"N＋といえば／というと","zh":"说到…的话。由一个话题联想到代表事物。","pex":[],"ex":[{"jp":"{北海道|ほっかいどう}といえば、{寒|さむ}い{冬|ふゆ}を{思|おも}い{浮|う}かべます。","zh":"说到北海道，就会想到寒冷的冬天。","src":"","say":"北海道といえば、寒い冬を思い浮かべます。"},{"jp":"{日本|にほん}の{夏|なつ}というと、{祭|まつ}りですね。","zh":"说到日本的夏天，就是祭典吧。","src":"","say":"にほんの夏というと、祭りですね。"}],"tips":["第19课会再出现。回答时常说大家最先想到的东西。"]},{"id":"7-1","lesson":7,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"contrast","pattern":"〜どころではない／〜どころじゃない","official":"〜どころではない／〜どころじゃない","usage":"活動に参加する前とあとでの気持ちの変化を表すときの表現","usageR":"{活動|かつどう}に{参加|さんか}する{前|まえ}とあとでの{気持|きも}ちの{変化|へんか}を{表|あらわ}すときの{表現|ひょうげん}","conn":"Vる／N＋どころではない／どころじゃない","zh":"哪顾得上…；根本不是…的时候。因为别的事，完全做不到。","pex":[],"ex":[{"jp":"{試験|しけん}の{前|まえ}で、{旅行|りょこう}どころではありません。","zh":"考试在即，哪顾得上去旅行。","src":"","say":"試験の前で、旅行どころではありません。"},{"jp":"{忙|いそが}しくて、テレビどころじゃなかった。","zh":"忙得根本顾不上看电视。","src":"","say":"忙しくて、テレビどころじゃなかった。"}],"tips":["「どころか」（第14课）是“岂止、相反”。这里是“顾不上”。"]},{"id":"7-2","lesson":7,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"time","pattern":"〜たところ","official":"〜たところ","usage":"活動に参加する前とあとでの気持ちの変化を表すときの表現","usageR":"{活動|かつどう}に{参加|さんか}する{前|まえ}とあとでの{気持|きも}ちの{変化|へんか}を{表|あらわ}すときの{表現|ひょうげん}","conn":"Vた＋ところ","zh":"一…，结果发现…。后项是已经发生的结果，不是意志。","pex":[],"ex":[{"jp":"{参加|さんか}してみたところ、とてもよかったです。","zh":"参加了一下，结果非常好。","src":"","say":"参加してみたところ、とてもよかったです。"},{"jp":"{電話|でんわ}したところ、もう{始|はじ}まっていました。","zh":"打了电话，结果已经开始了。","src":"","say":"電話したところ、もう始まっていました。"}],"tips":["和「たところが」（虽然…但是）不同。本课是“做了之后的结果”。"]},{"id":"7-3","lesson":7,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"explain","pattern":"〜ことになった","official":"〜ことになった","usage":"活動に参加する前とあとでの気持ちの変化を表すときの表現","usageR":"{活動|かつどう}に{参加|さんか}する{前|まえ}とあとでの{気持|きも}ちの{変化|へんか}を{表|あらわ}すときの{表現|ひょうげん}","conn":"Vる／Vない＋ことになった","zh":"决定…了；结果变成…。决定来自外部、规则或讨论，不是自己一个人的决心。","pex":[],"ex":[{"jp":"{来月|らいげつ}、ボランティアをすることになりました。","zh":"定下来下个月做志愿者。","src":"","say":"来月、ボランティアをすることになりました。"},{"jp":"{天気|てんき}が{悪|わる}いので、{中止|ちゅうし}ということになりました。","zh":"因为天气不好，决定取消了。","src":"","say":"天気が悪いので、中止ということになりました。"}],"tips":["自己决定用「ことにする」（初中級已学）。本课是「なった」。"]},{"id":"7-4","lesson":7,"taskN":1,"task":"1 見つけた！","stTitle":"1 見つけた！","cat":"cond","pattern":"〜{限|かぎ}り／〜{限|かぎ}りは","official":"〜限り／〜限りは","usage":"活動に参加する前とあとでの気持ちの変化を表すときの表現","usageR":"{活動|かつどう}に{参加|さんか}する{前|まえ}とあとでの{気持|きも}ちの{変化|へんか}を{表|あらわ}すときの{表現|ひょうげん}","conn":"Vる／Vている＋限り（は）","zh":"只要…就…。","pex":[],"ex":[{"jp":"この{店|みせ}にいる{限|かぎ}り、{安心|あんしん}です。","zh":"只要在这家店里，就放心。","src":"","say":"この店にいるかぎり、安心です。"},{"jp":"{健康|けんこう}である{限|かぎ}り、この{活動|かつどう}を{続|つづ}けたいです。","zh":"只要还健康，就想继续这个活动。","src":"","say":"健康であるかぎり、この活動を続けたいです。"}],"tips":["第17课的「{限|かぎ}り」多是“就…的范围而言”。本课是条件。"]},{"id":"7-5","lesson":7,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"request","pattern":"〜かなと{思|おも}って","official":"〜かなと思って","usage":"相手の都合や好みを考えて丁寧に誘うときの表現","usageR":"{相手|あいて}の{都合|つごう}や{好|この}みを{考|かんが}えて{丁寧|ていねい}に{誘|さそ}うときの{表現|ひょうげん}","conn":"Vたら／Vないか＋かなと思って","zh":"我在想是不是可以…。邀请或请求时，不把话说死。","pex":[],"ex":[{"jp":"よかったら{一緒|いっしょ}に{行|い}けるかなと{思|おも}って、メールしました。","zh":"我想着如果可以的话能不能一起去，就发了邮件。","src":"","say":"よかったら一緒に行けるかなと思って、メールしました。"},{"jp":"{今週|こんしゅう}は{忙|いそが}しいかなと{思|おも}って、{来週|らいしゅう}にしました。","zh":"觉得这周你可能忙，就改到了下周。","src":"","say":"今週は忙しいかなと思って、来週にしました。"}],"tips":["后面常接「{連絡|れんらく}しました／メールしました」。"]},{"id":"7-6","lesson":7,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"contrast","pattern":"〜にしては","official":"〜にしては","usage":"相手の都合や好みを考えて丁寧に誘うときの表現","usageR":"{相手|あいて}の{都合|つごう}や{好|この}みを{考|かんが}えて{丁寧|ていねい}に{誘|さそ}うときの{表現|ひょうげん}","conn":"N／Vる／Aい＋にしては","zh":"就…来说，却…。和身份、年龄、条件应有的样子不一样。","pex":[],"ex":[{"jp":"{初|はじ}めてにしては、{上手|じょうず}ですね。","zh":"就第一次来说，挺好的。","src":"","say":"初めてにしては、上手ですね。"},{"jp":"{学生|がくせい}にしては、よく{知|し}っていますね。","zh":"就学生来说，懂得真多。","src":"","say":"学生にしては、よく知っていますね。"}],"tips":["「わりに」不强调身份标准。「にしては」前面常是身份、经历。"]},{"id":"7-7","lesson":7,"taskN":2,"task":"2 こんなときどうする？","stTitle":"2 こんなときどうする？","cat":"written","pattern":"〜につき","official":"〜につき","usage":"相手の都合や好みを考えて丁寧に誘うときの表現","usageR":"{相手|あいて}の{都合|つごう}や{好|この}みを{考|かんが}えて{丁寧|ていねい}に{誘|さそ}うときの{表現|ひょうげん}","conn":"N＋につき","zh":"关于…；因为…。郑重的信件、告示用语。","pex":[],"ex":[{"jp":"{都合|つごう}につき、{開始|かいし}{時間|じかん}を{六|ろく}{時|じ}に{変|か}えました。","zh":"因故把开始时间改到了六点。","src":"","say":"都合につき、開始時間を六時に変えました。"},{"jp":"この{件|けん}につき、ご{意見|いけん}を{聞|き}かせてください。","zh":"关于这件事，请告诉我您的意见。","src":"","say":"この件につき、ご意見を聞かせてください。"}],"tips":["第2课同一形式是“每…”。邀请、联络里常见「{都合|つごう}につき」「この{件|けん}につき」。课本若只复习“每”，以课本为准。"]},{"id":"7-8","lesson":7,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"ability","pattern":"〜もんだ／〜ものだ","official":"〜もんだ／〜ものだ","usage":"自分や相手を呼ぶときのことば","usageR":"{自分|じぶん}や{相手|あいて}を{呼|よ}ぶときのことば","conn":"Vる／Vた＋もんだ／ものだ","zh":"按常理就该…。口语说「もんだ」。本课用来谈“该怎么称呼人”。","pex":[],"ex":[{"jp":"{初|はじ}めての{人|ひと}のことは、さんを{付|つ}けて{呼|よ}ぶもんだ。","zh":"对初次见面的人，应该加上“さん”来称呼。","src":"","say":"初めてのひとのことは、さんを付けて呼ぶもんだ。"},{"jp":"{目上|めうえ}の{人|ひと}を{名前|なまえ}だけで{呼|よ}ぶものではない。","zh":"不该对长辈只叫名字。","src":"","say":"目上のひとを名前だけで呼ぶものではない。"}],"tips":["怀念“以前常常”用「たものだ」，见第16课。"]},{"id":"7-9","lesson":7,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"contrast","pattern":"〜ながら（も）","official":"〜ながら（も）","usage":"自分や相手を呼ぶときのことば","usageR":"{自分|じぶん}や{相手|あいて}を{呼|よ}ぶときのことば","conn":"Vます词干＋ながら（も）","zh":"虽然…但是…。","pex":[],"ex":[{"jp":"{分|わ}かっていながら、{名前|なまえ}を{間違|まちが}えてしまいました。","zh":"虽然知道，还是把名字叫错了。","src":"","say":"分かっていながら、名前を間違えてしまいました。"},{"jp":"{不安|ふあん}ながらも、{参加|さんか}することにしました。","zh":"虽然不安，还是决定参加。","src":"","say":"不安ながらも、参加することにしました。"}],"tips":["「ながら」还有“一边…一边…”。有「も」或后项相反时，才是转折。"]},{"id":"7-10","lesson":7,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"time","pattern":"〜につけ（て）","official":"〜につけ（て）","usage":"自分や相手を呼ぶときのことば","usageR":"{自分|じぶん}や{相手|あいて}を{呼|よ}ぶときのことば","conn":"Vる＋につけ（て）","zh":"每当…就…。也说「{何|なに}かにつけ」。","pex":[],"ex":[{"jp":"その{写真|しゃしん}を{見|み}るにつけ、あの{日|ひ}を{思|おも}い{出|だ}します。","zh":"每当看到那张照片，就会想起那天。","src":"","say":"その写真を見るにつけ、あのひを思い出します。"},{"jp":"{何|なに}かを{頼|たの}むにつけ、{呼|よ}び{方|かた}に{気|き}をつけています。","zh":"每当拜托什么事，都会注意称呼。","src":"","say":"なにかを頼むにつけ、呼びかたにきをつけています。"}],"tips":["和「たびに」接近。「につけ」更书面，常带感情。"]},{"id":"7-11","lesson":7,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"example","pattern":"〜さえ","official":"〜さえ","usage":"自分や相手を呼ぶときのことば","usageR":"{自分|じぶん}や{相手|あいて}を{呼|よ}ぶときのことば","conn":"N＋さえ；Vます词干＋さえ＋すれば","zh":"就连…也。举一个最低限度。","pex":[],"ex":[{"jp":"{名前|なまえ}さえ{分|わ}かりません。","zh":"就连名字也不知道。","src":"","say":"名前さえ分かりません。"},{"jp":"あいさつさえすれば、{大丈夫|だいじょうぶ}です。","zh":"只要打个招呼就没问题。","src":"","say":"あいさつさえすれば、大丈夫です。"}],"tips":["「さえ〜ば」（只要…就）的完整形式在第12课。本课先记“甚至”。"]},{"id":"7-12","lesson":7,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"contrast","pattern":"～に{反|はん}し（て）／～に{反|はん}する／～に{反|はん}した","official":"～に反し（て）／～に反する／～に反した","usage":"交流の体験を述べるときに使うことば・表現","usageR":"{交流|こうりゅう}の{体験|たいけん}を{述|の}べるときに{使|つか}うことば・{表現|ひょうげん}","conn":"N＋に反して／に反する／に反した＋N","zh":"与…相反。","pex":[],"ex":[{"jp":"{予想|よそう}に{反|はん}して、{若|わか}い{人|ひと}が{多|おお}く{来|き}ました。","zh":"和预想相反，来了很多年轻人。","src":"","say":"予想に反して、若いひとが多く来ました。"},{"jp":"{期待|きたい}に{反|はん}する{結果|けっか}でした。","zh":"是与期待相反的结果。","src":"","say":"期待に反する結果でした。"}],"tips":["前面多是期待、预测、意思、规则。"]},{"id":"7-13","lesson":7,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"time","pattern":"～うちに","official":"～うちに","usage":"交流の体験を述べるときに使うことば・表現","usageR":"{交流|こうりゅう}の{体験|たいけん}を{述|の}べるときに{使|つか}うことば・{表現|ひょうげん}","conn":"Vる／Vない／Aい／Nの＋うちに","zh":"趁着…的时候。与第2课是同一句型。","pex":[],"ex":[{"jp":"{覚|おぼ}えているうちに、{名前|なまえ}をノートに{書|か}きました。","zh":"趁还记得，把名字写进了笔记本。","src":"","say":"覚えているうちに、名前をノートに書きました。"},{"jp":"{若|わか}いうちに、いろいろな{人|ひと}に{会|あ}いたいです。","zh":"想趁年轻多见各种各样的人。","src":"","say":"若いうちに、いろいろなひとに会いたいです。"}],"tips":["本课多用于“趁还能交流、趁还记得”。"]},{"id":"7-14","lesson":7,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"explain","pattern":"～からして","official":"～からして","usage":"交流の体験を述べるときに使うことば・表現","usageR":"{交流|こうりゅう}の{体験|たいけん}を{述|の}べるときに{使|つか}うことば・{表現|ひょうげん}","conn":"N＋からして","zh":"从…就…（先从这一点看）；就连…都。","pex":[],"ex":[{"jp":"{呼|よ}び{方|かた}からして、{距離|きょり}が{分|わ}かります。","zh":"光从称呼就能看出距离。","src":"","say":"呼びかたからして、距離が分かります。"},{"jp":"{声|こえ}からして、かなり{怒|おこ}っているようでした。","zh":"光听声音，就好像相当生气。","src":"","say":"声からして、かなり怒っているようでした。"}],"tips":["「からすると」是“从某立场来看”。「からして」常带“光看这一点就已经”。"]},{"id":"8-1","lesson":8,"taskN":1,"task":"1 こんなときどうする？","stTitle":"1 こんなときどうする？","cat":"keigo","pattern":"〜のことなんですが","official":"〜のことなんですが","usage":"目上の人に丁寧に許可を求めるときに使う表現","usageR":"{目上|めうえ}の{人|ひと}に{丁寧|ていねい}に{許可|きょか}を{求|もと}めるときに{使|つか}う{表現|ひょうげん}","conn":"N＋のことなんですが","zh":"关于…有件事。向长辈开口时，先把话题放轻。","pex":[],"ex":[{"jp":"{明日|あした}の{会議|かいぎ}のことなんですが、{少|すこ}し{遅|おく}れてもいいですか。","zh":"关于明天的会，我稍微迟到一下可以吗？","src":"","say":"あしたの会議のことなんですが、少し遅れてもいいですか。"},{"jp":"アルバイトのことなんですが、{相談|そうだん}があります。","zh":"关于打工的事，想跟您商量一下。","src":"","say":"アルバイトのことなんですが、相談があります。"}],"tips":["不要一上来就提要求。后面再说明理由和请求。"]},{"id":"8-2","lesson":8,"taskN":1,"task":"1 こんなときどうする？","stTitle":"1 こんなときどうする？","cat":"request","pattern":"〜(さ)せていただけませんか","official":"〜(さ)せていただけませんか","usage":"目上の人に丁寧に許可を求めるときに使う表現","usageR":"{目上|めうえ}の{人|ひと}に{丁寧|ていねい}に{許可|きょか}を{求|もと}めるときに{使|つか}う{表現|ひょうげん}","conn":"V（さ）せて＋いただけませんか","zh":"能否请允许我…。请求对方许可，自己做。非常礼貌。","pex":[],"ex":[{"jp":"{来週|らいしゅう}、{休|やす}ませていただけませんか。","zh":"下周能否允许我请假？","src":"","say":"来週、休ませていただけませんか。"},{"jp":"その{仕事|しごと}、{私|わたし}にやらせていただけませんか。","zh":"那项工作，能否让我来做？","src":"","say":"その仕事、わたしにやらせていただけませんか。"}],"tips":["「ていただきたい」是请对方做。「させていただく」是我自己做。"]},{"id":"8-3","lesson":8,"taskN":1,"task":"1 こんなときどうする？","stTitle":"1 こんなときどうする？","cat":"reason","pattern":"〜ものですから／〜ものだから／〜もので","official":"〜ものですから／〜ものだから／〜もので","usage":"目上の人に丁寧に許可を求めるときに使う表現","usageR":"{目上|めうえ}の{人|ひと}に{丁寧|ていねい}に{許可|きょか}を{求|もと}めるときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋ものですから／ものだから／もので","zh":"因为…（个人理由、辩解）。语气比「ので」更想求得理解。","pex":[],"ex":[{"jp":"{初|はじ}めてのものですから、やり{方|かた}が{分|わ}かりません。","zh":"因为是第一次，所以不知道做法。","src":"","say":"初めてのものですから、やりかたが分かりません。"},{"jp":"{電車|でんしゃ}が{止|と}まったもので、{遅|おく}れてしまいました。","zh":"因为电车停了，所以迟到了。","src":"","say":"電車が止まったもので、遅れてしまいました。"}],"tips":["「もので」最口语。「ものですから」对上级也可以。"]},{"id":"8-4","lesson":8,"taskN":1,"task":"1 こんなときどうする？","stTitle":"1 こんなときどうする？","cat":"scope","pattern":"〜の{代|か}わりに／〜に{代|か}わって","official":"〜の代わりに／〜に代わって","usage":"目上の人に丁寧に許可を求めるときに使う表現","usageR":"{目上|めうえ}の{人|ひと}に{丁寧|ていねい}に{許可|きょか}を{求|もと}めるときに{使|つか}う{表現|ひょうげん}","conn":"N＋の代わりに；N＋に代わって","zh":"代替…；作为交换。","pex":[],"ex":[{"jp":"{病気|びょうき}の{同僚|どうりょう}の{代|か}わりに、{私|わたし}が{行|い}きます。","zh":"我代替生病的同事去。","src":"","say":"病気の同僚の代わりに、わたしが行きます。"},{"jp":"{本日|ほんじつ}は{部長|ぶちょう}に{代|か}わって、ご{挨拶|あいさつ}します。","zh":"今天我代替部长向大家问好。","src":"","say":"本日は部長に代わって、ご挨拶します。"}],"tips":["人用「に{代|か}わって」很自然。物也可以用「{代|か}わりに」。"]},{"id":"8-5","lesson":8,"taskN":2,"task":"2 見つけた!","stTitle":"2 見つけた!","cat":"reason","pattern":"〜おかげで／〜おかげだ","official":"〜おかげで／〜おかげだ","usage":"気持ちを伝える挨拶表現","usageR":"{気持|きも}ちを{伝|つた}える{挨拶|あいさつ}{表現|ひょうげん}","conn":"普通形／Nの＋おかげで；おかげだ","zh":"托…的福。原因带来好的结果。","pex":[],"ex":[{"jp":"{先生|せんせい}のおかげで、{試験|しけん}に{受|う}かりました。","zh":"托老师的福，考试通过了。","src":"","say":"先生のおかげで、試験に受かりました。"},{"jp":"{早|はや}く{寝|ね}たおかげで、{今日|きょう}は{元気|げんき}です。","zh":"因为睡得早，今天很有精神。","src":"","say":"早く寝たおかげで、今日は元気です。"}],"tips":["坏的结果用「せいで」，不要用「おかげで」讽刺以外的场合。"]},{"id":"8-6","lesson":8,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"contrast","pattern":"〜くせに","official":"〜くせに","usage":"愚痴を言うときの表現","usageR":"{愚痴|ぐち}を{言|い}うときの{表現|ひょうげん}","conn":"普通形＋くせに（ナA・N：の＋くせに）","zh":"明明…却…。带责备，说对方或自己不该这样。","pex":[],"ex":[{"jp":"{知|し}っているくせに、{教|おし}えてくれない。","zh":"明明知道，却不告诉我。","src":"","say":"知っているくせに、教えてくれない。"},{"jp":"{学生|がくせい}のくせに、{勉強|べんきょう}しない。","zh":"明明是学生，却不学习。","src":"","say":"学生のくせに、勉強しない。"}],"tips":["对上级很不礼貌。客观转折用「のに」。"]},{"id":"8-7","lesson":8,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"reason","pattern":"〜せいで／〜せいか／〜せいだ","official":"〜せいで／〜せいか／〜せいだ","usage":"愚痴を言うときの表現","usageR":"{愚痴|ぐち}を{言|い}うときの{表現|ひょうげん}","conn":"普通形／Nの＋せいで／せいか／せいだ","zh":"因为…（不好的结果）。「せいか」是“也许是因为”。","pex":[],"ex":[{"jp":"{寝不足|ねぶそく}のせいで、{頭|あたま}が{痛|いた}いです。","zh":"因为没睡够，头疼。","src":"","say":"ねぶそくのせいで、頭が痛いです。"},{"jp":"{年|ねん}のせいでしょうか、{疲|つか}れやすくなりました。","zh":"也许是因为年龄，变得容易累了。","src":"","say":"年のせいでしょうか、疲れやすくなりました。"}],"tips":["好的结果不要用「せい」。"]},{"id":"8-8","lesson":8,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"guess","pattern":"〜にきまっている","official":"〜にきまっている","usage":"愚痴を言うときの表現","usageR":"{愚痴|ぐち}を{言|い}うときの{表現|ひょうげん}","conn":"普通形＋にきまっている","zh":"肯定是…；必定…。说话人很有把握，带一点主观。","pex":[],"ex":[{"jp":"{夜更|よふ}かしすれば、{朝|あさ}は{眠|ねむ}いにきまっています。","zh":"熬夜的话，早上肯定困。","src":"","say":"夜更かしすれば、朝は眠いにきまっています。"},{"jp":"あの{言|い}い{方|かた}では、{相手|あいて}は{嫌|いや}な{気持|きも}ちになるにきまっている。","zh":"那种说法，对方肯定会不愉快。","src":"","say":"あの言いかたでは、相手は嫌な気持ちになるにきまっている。"}],"tips":["比「はずだ」更强、更口语，有时显得武断。"]},{"id":"8-9","lesson":8,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"ability","pattern":"〜(さ)せる（{誘発|ゆうはつ}）","official":"〜(さ)せる（誘発）","usage":"愚痴を言うときの表現","usageR":"{愚痴|ぐち}を{言|い}うときの{表現|ひょうげん}","conn":"使役形（さ）せる：让人产生某种感情","zh":"让人…（产生感情或反应）。不是指派工作，而是某种言行引发了对方的情绪。","pex":[],"ex":[{"jp":"その{話|はなし}は、みんなを{困|こま}らせました。","zh":"那番话让大家为难。","src":"","say":"その話は、みんなを困らせました。"},{"jp":"{子|こ}どもの{作文|さくぶん}が、{親|おや}を{泣|な}かせました。","zh":"孩子的作文让父母落泪。","src":"","say":"子どもの作文が、親を泣かせました。"}],"tips":["「{泣|な}かせる」「{困|こま}らせる」「{笑|わら}わせる」都是这个用法。指派用一般使役即可，但本课标签是诱发。"]},{"id":"8-10","lesson":8,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"emotion","pattern":"〜ことはない","official":"〜ことはない","usage":"友達を励ますときの表現","usageR":"{友達|ともだち}を{励|はげ}ますときの{表現|ひょうげん}","conn":"Vる＋ことはない","zh":"不必…；用不着…。用来安慰、劝对方别做。","pex":[],"ex":[{"jp":"{失敗|しっぱい}したからといって、あきらめることはありません。","zh":"虽说失败了，也不必放弃。","src":"","say":"失敗したからといって、あきらめることはありません。"},{"jp":"{一人|ひとり}で{悩|なや}むことはないですよ。","zh":"用不着一个人烦恼。","src":"","say":"一人で悩むことはないですよ。"}],"tips":["和「わけにはいかない」（不能做）相反方向。"]},{"id":"8-11","lesson":8,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"scope","pattern":"〜のことになると／〜のこととなると","official":"〜のことになると／〜のこととなると","usage":"友達を励ますときの表現","usageR":"{友達|ともだち}を{励|はげ}ますときの{表現|ひょうげん}","conn":"N＋のことになると／のこととなると","zh":"一说到…就…。提到某个话题，情况就变了。","pex":[],"ex":[{"jp":"{仕事|しごと}のことになると、{彼|かれ}はとても{厳|きび}しいです。","zh":"一说到工作，他就非常严格。","src":"","say":"仕事のことになると、彼はとても厳しいです。"},{"jp":"{食|た}べ{物|もの}のこととなると、{目|め}がなくなります。","zh":"一说到吃的，就毫无抵抗力。","src":"","say":"食べ物のこととなると、目がなくなります。"}],"tips":["常接“特别严格、特别在行、特别敏感”。"]},{"id":"8-12","lesson":8,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"scope","pattern":"〜にしたら／〜にすれば／〜にしてみたら／〜にしてみれば","official":"〜にしたら／〜にすれば／〜にしてみたら／〜にしてみれば","usage":"友達を励ますときの表現","usageR":"{友達|ともだち}を{励|はげ}ますときの{表現|ひょうげん}","conn":"N＋にしたら／にすれば／にしてみたら／にしてみれば","zh":"站在…的立场来看。","pex":[],"ex":[{"jp":"{親|おや}にしたら、{心配|しんぱい}するのは{当然|とうぜん}です。","zh":"站在父母的立场，担心是当然的。","src":"","say":"親にしたら、心配するのは当然です。"},{"jp":"{初|はじ}めての{人|ひと}にしてみれば、{呼|よ}び{方|かた}が{難|むずか}しいです。","zh":"对第一次来的人来说，称呼很难。","src":"","say":"初めてのひとにしてみれば、呼びかたが難しいです。"}],"tips":["多用于理解别人的心情，后面常有“也是当然”。"]},{"id":"8-13","lesson":8,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"time","pattern":"〜たびに","official":"〜たびに","usage":"自分の考えを理由と一緒に言うときに使う表現","usageR":"{自分|じぶん}の{考|かんが}えを{理由|りゆう}と{一緒|いっしょ}に{言|い}うときに{使|つか}う{表現|ひょうげん}","conn":"Vる／Nの＋たびに","zh":"每当…就…。","pex":[],"ex":[{"jp":"この{歌|うた}を{聞|き}くたびに、{学生|がくせい}の{頃|ころ}を{思|おも}い{出|だ}します。","zh":"每当听到这首歌，就会想起学生时代。","src":"","say":"この歌を聞くたびに、学生の頃を思い出します。"},{"jp":"{会|あ}うたびに、{新|あたら}しい{話|はなし}を{教|おし}えてくれます。","zh":"每次见面，都会告诉我新的事情。","src":"","say":"会うたびに、新しい話を教えてくれます。"}],"tips":["每次都发生，不是只一次。"]},{"id":"8-14","lesson":8,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"cond","pattern":"〜ば／〜なら（ば）／〜たら、〜（のに／けど／が／…）","official":"〜ば／〜なら（ば）／〜たら、〜（のに／けど／が／…）","usage":"自分の考えを理由と一緒に言うときに使う表現","usageR":"{自分|じぶん}の{考|かんが}えを{理由|りゆう}と{一緒|いっしょ}に{言|い}うときに{使|つか}う{表現|ひょうげん}","conn":"Vば／Vたら／普通形＋なら、～のに／けど／が","zh":"如果…就好了／可是…。前面是条件，后面是遗憾、相反的结果或未实现的愿望。","pex":[],"ex":[{"jp":"もっと{早|はや}く{言|い}ってくれれば、{間|ま}に{合|あ}ったのに。","zh":"要是早点告诉我，就来得及了。","src":"","say":"もっと早く言ってくれれば、まに合ったのに。"},{"jp":"{晴|は}れたら{行|い}くんですが、{雨|あめ}なのでやめます。","zh":"要是晴天就去，但下雨所以算了。","src":"","say":"晴れたら行くんですが、雨なのでやめます。"}],"tips":["「のに」遗憾最强。「けど／が」可以只是转折。"]},{"id":"9-1","lesson":9,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"ability","pattern":"〜がたい","official":"〜がたい","usage":"作品の感想を述べるときの表現","usageR":"{作品|さくひん}の{感想|かんそう}を{述|の}べるときの{表現|ひょうげん}","conn":"Vます词干＋がたい","zh":"难以…。多指心理上难以相信、接受、说出。书面。","pex":[],"ex":[{"jp":"その{話|はなし}は{信|しん}じがたいです。","zh":"那件事难以相信。","src":"","say":"その話は信じがたいです。"},{"jp":"{今|いま}の{気持|きも}ちは、{言葉|ことば}では{表|あらわ}しがたいです。","zh":"现在的心情难以用语言表达。","src":"","say":"今の気持ちは、言葉では表しがたいです。"}],"tips":["身体上的困难用「にくい／づらい」。「がたい」偏心里过不去。"]},{"id":"9-2","lesson":9,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"manner","pattern":"〜ように（{同様|どうよう}）","official":"〜ように（同様）","usage":"作品の感想を述べるときの表現","usageR":"{作品|さくひん}の{感想|かんそう}を{述|の}べるときの{表現|ひょうげん}","conn":"Vる／Nの＋ように（同样）","zh":"像…那样。表示相似、同等，不是目的。","pex":[],"ex":[{"jp":"{詩|し}にあるように、{鳥|とり}が{空|そら}を{飛|と}んでいます。","zh":"就像诗里写的那样，鸟在天上飞。","src":"","say":"詩にあるように、鳥がそらを飛んでいます。"},{"jp":"{前|まえ}の{文|ぶん}のように、{短|みじか}く{書|か}いてください。","zh":"请像前一句那样写短一些。","src":"","say":"前の文のように、短く書いてください。"}],"tips":["目的是「Vるために／Vるようにする」。本课是“如同”。"]},{"id":"9-3","lesson":9,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"time","pattern":"〜とともに（{変化|へんか}）","official":"〜とともに（変化）","usage":"作品の感想を述べるときの表現","usageR":"{作品|さくひん}の{感想|かんそう}を{述|の}べるときの{表現|ひょうげん}","conn":"Vる／N＋とともに（变化）","zh":"随着…，同时发生变化。","pex":[],"ex":[{"jp":"{年|とし}を{取|と}るとともに、この{言葉|ことば}の{意味|いみ}が{分|わ}かりました。","zh":"随着年龄增长，明白了这句话的意思。","src":"","say":"年を取るとともに、この言葉の意味が分かりました。"},{"jp":"{暗|くら}くなるとともに、{町|まち}が{静|しず}かになりました。","zh":"随着天黑，城镇安静了下来。","src":"","say":"暗くなるとともに、町が静かになりました。"}],"tips":["第13课的「とともに」是“和…一起”，不是变化。"]},{"id":"9-4","lesson":9,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"explain","pattern":"〜をもとに（して）／〜をもとにした","official":"〜をもとに（して）／〜をもとにした","usage":"作品の感想を述べるときの表現","usageR":"{作品|さくひん}の{感想|かんそう}を{述|の}べるときの{表現|ひょうげん}","conn":"N／普通形＋の＋をもとに（して）；をもとにした＋N","zh":"以…为基础（创作、决定）。","pex":[],"ex":[{"jp":"この{話|はなし}は、{本当|ほんとう}の{経験|けいけん}をもとにしています。","zh":"这个故事以真实经历为基础。","src":"","say":"この話は、本当の経験をもとにしています。"},{"jp":"{学生|がくせい}の{声|こえ}をもとにした{計画|けいかく}です。","zh":"这是以学生的意见为基础的计划。","src":"","say":"学生の声をもとにした計画です。"}],"tips":["「に{基|もと}づいて」更正式，多用于法律、数据、规则。"]},{"id":"9-5","lesson":9,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"talk","pattern":"〜でしょう?／〜だろう?（{確認|かくにん}）","official":"〜でしょう?／〜だろう?（確認）","usage":"理解を確認しながら、友達に説明するときに使う表現","usageR":"{理解|りかい}を{確認|かくにん}しながら、{友達|ともだち}に{説明|せつめい}するときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋でしょう？／だろう？（确认）","zh":"…对吧？说话人觉得对方也知道，用来确认。","pex":[],"ex":[{"jp":"この{言葉|ことば}、{前|まえ}にも{出|で}たでしょう？","zh":"这个词前面也出现过，对吧？","src":"","say":"この言葉、前にも出たでしょう？"},{"jp":"{明日|あした}テストだろう？","zh":"明天有测验吧？","src":"","say":"あしたテストだろう？"}],"tips":["第1课的「でしょう」是推测，语调较平。这里是确认，常升调。"]},{"id":"9-6","lesson":9,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"talk","pattern":"〜っけ","official":"〜っけ","usage":"理解を確認しながら、友達に説明するときに使う表現","usageR":"{理解|りかい}を{確認|かくにん}しながら、{友達|ともだち}に{説明|せつめい}するときに{使|つか}う{表現|ひょうげん}","conn":"Vた／Nだ／Aかった＋っけ","zh":"…来着？记得不清楚，向自己或对方确认。口语。","pex":[],"ex":[{"jp":"この{漢字|かんじ}、{何|なん}て{読|よ}むんだっけ。","zh":"这个汉字怎么读来着。","src":"","say":"この漢字、なんて読むんだっけ。"},{"jp":"{会議|かいぎ}は{三|さん}{時|じ}からだっけ？","zh":"会议是三点开始来着？","src":"","say":"会議は三時からだっけ？"}],"tips":["只用于过去或已知信息，不用于新的请求。"]},{"id":"9-7","lesson":9,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"explain","pattern":"〜というわけだ／〜わけだ","official":"〜というわけだ／〜わけだ","usage":"理解を確認しながら、友達に説明するときに使う表現","usageR":"{理解|りかい}を{確認|かくにん}しながら、{友達|ともだち}に{説明|せつめい}するときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋（という）わけだ","zh":"所以就是…；也就是说…。根据前面的事实得出结论。","pex":[],"ex":[{"jp":"{夜|よる}に{働|はたら}くから、{昼|ひる}に{寝|ね}るわけですね。","zh":"因为晚上工作，所以就是白天睡觉啊。","src":"","say":"夜に働くから、昼に寝るわけですね。"},{"jp":"つまり、この{言葉|ことば}には{二|ふた}つの{意味|いみ}があるというわけです。","zh":"也就是说，这个词有两个意思。","src":"","say":"つまり、この言葉には二つの意味があるというわけです。"}],"tips":["「わけではない」是否定这个结论。"]},{"id":"9-8","lesson":9,"taskN":3,"task":"3 こんなときどうする?","stTitle":"3 こんなときどうする?","cat":"ability","pattern":"〜っこない","official":"〜っこない","usage":"気持ちを表す擬音語・擬態語","usageR":"{気持|きも}ちを{表|あらわ}す{擬音|ぎおん}{語|ご}・{擬態|ぎたい}{語|ご}","conn":"Vます词干＋っこない","zh":"绝不可能…。口语，语气强。","pex":[],"ex":[{"jp":"こんなに{難|むずか}しくては、{分|わ}かりっこない。","zh":"这么难，根本不可能懂。","src":"","say":"こんなに難しくては、分かりっこない。"},{"jp":"{今|いま}から{走|はし}っても、{間|ま}に{合|あ}いっこないよ。","zh":"现在跑也绝对赶不上了。","src":"","say":"今から走っても、まに合いっこないよ。"}],"tips":["比「できない」更绝对，朋友之间用。"]},{"id":"9-9","lesson":9,"taskN":3,"task":"3 こんなときどうする?","stTitle":"3 こんなときどうする?","cat":"talk","pattern":"〜もん／〜んだもん","official":"〜もん／〜んだもん","usage":"気持ちを表す擬音語・擬態語","usageR":"{気持|きも}ちを{表|あらわ}す{擬音|ぎおん}{語|ご}・{擬態|ぎたい}{語|ご}","conn":"普通形＋もん／んだもん","zh":"因为…嘛。孩子气的辩解，撒娇或找借口。","pex":[],"ex":[{"jp":"だって、{忙|いそが}しかったんだもん。","zh":"可是，因为太忙了嘛。","src":"","say":"だって、忙しかったんだもん。"},{"jp":"{知|し}りたかったんだもん。","zh":"因为我想知道嘛。","src":"","say":"知りたかったんだもん。"}],"tips":["对上级不合适。理由用「ので」。"]},{"id":"9-10","lesson":9,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"manner","pattern":"〜ほど／〜くらい／〜ぐらい","official":"〜ほど／〜くらい／〜ぐらい","usage":"外国語を使ったときの楽しさや難しさを伝えることば","usageR":"{外国|がいこく}{語|ご}を{使|つか}ったときの{楽|たの}しさや{難|むずか}しさを{伝|つた}えることば","conn":"普通形＋ほど／くらい／ぐらい","zh":"到…那种程度。","pex":[],"ex":[{"jp":"{泣|な}きたいほど、うれしかったです。","zh":"高兴得想哭。","src":"","say":"泣きたいほど、うれしかったです。"},{"jp":"{子|こ}どもでも{読|よ}めるくらい、やさしい{文|ぶん}です。","zh":"简单到连孩子也能读。","src":"","say":"子どもでも読めるくらい、やさしい文です。"}],"tips":["同一课后面的「くらい」还表示“至少、大约”。这里和「ほど」一起表程度。"]},{"id":"9-11","lesson":9,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"time","pattern":"〜ところだった","official":"〜ところだった","usage":"外国語を使ったときの楽しさや難しさを伝えることば","usageR":"{外国|がいこく}{語|ご}を{使|つか}ったときの{楽|たの}しさや{難|むずか}しさを{伝|つた}えることば","conn":"Vる＋ところだった","zh":"差点就…。结果没有发生。","pex":[],"ex":[{"jp":"もう{少|すこ}しで{電車|でんしゃ}に{乗|の}り{遅|おく}れるところでした。","zh":"差一点就没赶上电车。","src":"","say":"もう少しで電車に乗り遅れるところでした。"},{"jp":"{危|あぶ}ない。{忘|わす}れるところだった。","zh":"好险，差点忘了。","src":"","say":"危ない。忘れるところだった。"}],"tips":["「Vているところだ」是正在做。「るところだった」是几乎发生。"]},{"id":"9-12","lesson":9,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"emotion","pattern":"〜てたまらない","official":"〜てたまらない","usage":"外国語を使ったときの楽しさや難しさを伝えることば","usageR":"{外国|がいこく}{語|ご}を{使|つか}ったときの{楽|たの}しさや{難|むずか}しさを{伝|つた}えることば","conn":"Vて／Aくて＋たまらない","zh":"…得不得了。感情或感觉强到受不了。口语也强。","pex":[],"ex":[{"jp":"{合格|ごうかく}して、うれしくてたまりません。","zh":"合格了，高兴得不得了。","src":"","say":"合格して、うれしくてたまりません。"},{"jp":"{隣|となり}の{音|おと}がうるさくてたまりません。","zh":"旁边的声音吵得受不了。","src":"","say":"隣の音がうるさくてたまりません。"}],"tips":["第14课「てならない」更书面，多是自然涌出的感情。第15课「てしかたがない」接近。"]},{"id":"9-13","lesson":9,"taskN":5,"task":"5 耳でキャッチ","stTitle":"5 耳でキャッチ","cat":"explain","pattern":"〜わけではない／〜というわけではない","official":"〜わけではない／〜というわけではない","usage":"生活の中で耳にする日本語について説明するときに使われることば･表現","usageR":"{生活|せいかつ}の{中|なか}で{耳|みみ}にする{日本語|にほんご}について{説明|せつめい}するときに{使|つか}われることば･{表現|ひょうげん}","conn":"普通形＋わけではない／というわけではない","zh":"并不是…；并非就是…。部分否定。","pex":[],"ex":[{"jp":"{嫌|きら}いなわけではありません。ただ、{得意|とくい}ではないんです。","zh":"并不是讨厌。只是不擅长。","src":"","say":"嫌いなわけではありません。ただ、得意ではないんです。"},{"jp":"{毎日|まいにち}{勉強|べんきょう}しているというわけではないです。","zh":"并不是每天都在学习。","src":"","say":"毎日勉強しているというわけではないです。"}],"tips":["不是全部否定。常和「{全部|ぜんぶ}は」「いつもは」一起用。"]},{"id":"9-14","lesson":9,"taskN":5,"task":"5 耳でキャッチ","stTitle":"5 耳でキャッチ","cat":"manner","pattern":"〜くらい／〜ぐらい","official":"〜くらい／〜ぐらい","usage":"生活の中で耳にする日本語について説明するときに使われることば･表現","usageR":"{生活|せいかつ}の{中|なか}で{耳|みみ}にする{日本語|にほんご}について{説明|せつめい}するときに{使|つか}われることば･{表現|ひょうげん}","conn":"N／数量＋くらい／ぐらい","zh":"大约…；起码…这种程度。","pex":[],"ex":[{"jp":"{挨拶|あいさつ}くらい、{日本語|にほんご}でしてみてください。","zh":"至少问候试着用日语说。","src":"","say":"挨拶くらい、日本語でしてみてください。"},{"jp":"{一|いち}{時間|じかん}ぐらいなら、{時間|じかん}が{取|と}れます。","zh":"一个小时左右的话，抽得出时间。","src":"","say":"一時間ぐらいなら、時間が取れます。"}],"tips":["轻的程度说「くらいなら{簡単|かんたん}です」。最少的努力也用「くらい」。"]},{"id":"10-1","lesson":10,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"explain","pattern":"〜といったら","official":"〜といったら","usage":"観光地の特徴について説明する
