ときに使われることば・表現","usageR":"{観光|かんこう}{地|ち}の{特徴|とくちょう}について{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"N＋といったら","zh":"说到…（可不得了）。带感叹，觉得特别、非同一般。","pex":[],"ex":[{"jp":"{京都|きょうと}の{秋|あき}といったら、{本当|ほんとう}にきれいです。","zh":"说到京都的秋天，真是漂亮。","src":"","say":"京都の秋といったら、本当にきれいです。"},{"jp":"あの{店|みせ}の{行列|ぎょうれつ}といったら、すごいですよ。","zh":"那家店的队伍，可不得了。","src":"","say":"あの店の行列といったら、すごいですよ。"}],"tips":["比「といえば」感情更强，常接吃惊或赞美。"]},{"id":"10-2","lesson":10,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"ability","pattern":"とても〜ない","official":"とても〜ない","usage":"観光地の特徴について説明するときに使われることば・表現","usageR":"{観光|かんこう}{地|ち}の{特徴|とくちょう}について{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"とても＋Vない","zh":"无论如何也没…。这里的「とても」不是“很”，而是“怎么也”。","pex":[],"ex":[{"jp":"{一日|いちにち}では、とても{見|み}られません。","zh":"一天的话，怎么也看不完。","src":"","say":"いちにちでは、とても見られません。"},{"jp":"その{景色|けしき}は、とても{忘|わす}れられません。","zh":"那风景怎么也忘不了。","src":"","say":"その景色は、とても忘れられません。"}],"tips":["后面必须是否定。肯定句的「とても」才是“非常”。"]},{"id":"10-3","lesson":10,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"example","pattern":"〜はもちろん／〜はもとより","official":"〜はもちろん／〜はもとより","usage":"観光地の特徴について説明するときに使われることば・表現","usageR":"{観光|かんこう}{地|ち}の{特徴|とくちょう}について{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"N＋はもちろん／はもとより","zh":"…自不必说，…也。","pex":[],"ex":[{"jp":"{電車|でんしゃ}はもちろん、バスも{止|と}まっています。","zh":"电车就不用说了，公交车也停了。","src":"","say":"電車はもちろん、バスも止まっています。"},{"jp":"{国内|こくない}はもとより、{海外|かいがい}からも{客|きゃく}が{来|き}ます。","zh":"国内自不必说，海外也有客人来。","src":"","say":"国内はもとより、海外からも客が来ます。"}],"tips":["「はもとより」更书面。"]},{"id":"10-4","lesson":10,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"keigo","pattern":"〜（さ）せていただきます","official":"〜（さ）せていただきます","usage":"観光ガイドの説明でよく使われる表現","usageR":"{観光|かんこう}ガイドの{説明|せつめい}でよく{使|つか}われる{表現|ひょうげん}","conn":"V（さ）せて＋いただきます","zh":"请允许我…；我就冒昧…了。导游、服务中说明自己接下来要做的事。","pex":[],"ex":[{"jp":"それでは、{館内|かんない}をご{案内|あんない}させていただきます。","zh":"那么，请允许我为您介绍馆内。","src":"","say":"それでは、館内をご案内させていただきます。"},{"jp":"{今日|きょう}は{休|やす}ませていただきます。","zh":"今天请允许我请假。","src":"","say":"今日は休ませていただきます。"}],"tips":["是谦让，不是请对方做。已经得到许可或场合上当然可以时使用。"]},{"id":"10-5","lesson":10,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"keigo","pattern":"ご・お〜いたします","official":"ご・お〜いたします","usage":"観光ガイドの説明でよく使われる表現","usageR":"{観光|かんこう}ガイドの{説明|せつめい}でよく{使|つか}われる{表現|ひょうげん}","conn":"お＋Vます词干＋いたします；ご＋漢語＋いたします","zh":"我来为您…。谦让语，导游、店员说自己的动作。","pex":[],"ex":[{"jp":"ここで{少|すこ}しお{待|ま}ちいたします。","zh":"请在这里稍等，我来候着。","src":"","say":"ここで少しお待ちいたします。"},{"jp":"{次|つぎ}のポイントをご{説明|せつめい}いたします。","zh":"我来说明下一个要点。","src":"","say":"次のポイントをご説明いたします。"}],"tips":["对方的动作用「お〜です」「お〜になります」，不要用「いたします」。"]},{"id":"10-6","lesson":10,"taskN":3,"task":"3 こんなときどうする?","stTitle":"3 こんなときどうする?","cat":"explain","pattern":"〜つもりだ","official":"〜つもりだ","usage":"電話で忘れ物の問い合わせをするときの表現","usageR":"{電話|でんわ}で{忘|わす}れ{物|もの}の{問|と}い{合|あ}わせをするときの{表現|ひょうげん}","conn":"Vる／Vない＋つもりだ；Nの＋つもりだ","zh":"打算…。也用于“自以为”。","pex":[],"ex":[{"jp":"{来年|らいねん}はまたこの{町|まち}に{来|く}るつもりです。","zh":"打算明年再来这座城镇。","src":"","say":"来年はまたこの町に来るつもりです。"},{"jp":"{分|わ}かっているつもりでしたが、まだ{違|ちが}っていました。","zh":"我自以为懂了，结果还是不对。","src":"","say":"分かっているつもりでしたが、まだ違っていました。"}],"tips":["「つもりだった」常表示结果没能实现，带遗憾。"]},{"id":"10-7","lesson":10,"taskN":3,"task":"3 こんなときどうする?","stTitle":"3 こんなときどうする?","cat":"guess","pattern":"〜ように{思|おも}う","official":"〜ように思う","usage":"電話で忘れ物の問い合わせをするときの表現","usageR":"{電話|でんわ}で{忘|わす}れ{物|もの}の{問|と}い{合|あ}わせをするときの{表現|ひょうげん}","conn":"普通形＋ように思う","zh":"我觉得似乎…。比「と{思|おも}う」委婉。","pex":[],"ex":[{"jp":"{駅|えき}の{近|ちか}くに{置|お}いたように{思|おも}います。","zh":"我觉得好像放在车站附近了。","src":"","say":"駅の近くに置いたように思います。"},{"jp":"この{色|いろ}だったように{思|おも}うのですが。","zh":"我记得好像是这个颜色。","src":"","say":"この色だったように思うのですが。"}],"tips":["对不太有把握的印象、回忆，用这个更合适。"]},{"id":"10-8","lesson":10,"taskN":4,"task":"4 耳でキャッチ","stTitle":"4 耳でキャッチ","cat":"keigo","pattern":"〜ております","official":"〜ております","usage":"車内アナウンスでよく聞くことば・表現","usageR":"{車内|しゃない}アナウンスでよく{聞|き}くことば・{表現|ひょうげん}","conn":"Vて＋おります","zh":"正在…；一直…。谦让的「ています」，广播、商务里常用。","pex":[],"ex":[{"jp":"{只今|ただいま}、{電車|でんしゃ}が{遅|おく}れております。","zh":"现在电车晚点了。","src":"","say":"只今、電車が遅れております。"},{"jp":"{前|まえ}の{席|せき}は{予約|よやく}でふさがっております。","zh":"前面的座位已经预约满了。","src":"","say":"前の席は予約でふさがっております。"}],"tips":["说自己一方的状态，不用于对方。"]},{"id":"10-9","lesson":10,"taskN":4,"task":"4 耳でキャッチ","stTitle":"4 耳でキャッチ","cat":"ability","pattern":"〜かねます","official":"〜かねます","usage":"車内アナウンスでよく聞くことば・表現","usageR":"{車内|しゃない}アナウンスでよく{聞|き}くことば・{表現|ひょうげん}","conn":"Vます词干＋かねます","zh":"难以…；不能…。婉拒，公共广播、服务用语。","pex":[],"ex":[{"jp":"{指定|してい}{席|せき}{以外|いがい}にはご{案内|あんない}しかねます。","zh":"指定席以外的座位难以为您引导。","src":"","say":"指定席以外にはご案内しかねます。"},{"jp":"{個人|こじん}{的|てき}なご{質問|しつもん}にはお{答|こた}えしかねます。","zh":"个人问题恕难回答。","src":"","say":"個人的なご質問にはお答えしかねます。"}],"tips":["「かねない」是“有可能发生坏事”，正好相反。"]},{"id":"10-10","lesson":10,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"emotion","pattern":"〜ことに（は）","official":"〜ことに（は）","usage":"旅行の思い出を紹介するときに使うことば・表現","usageR":"{旅行|りょこう}の{思|おも}い{出|で}を{紹介|しょうかい}するときに{使|つか}うことば・{表現|ひょうげん}","conn":"Aい／Aな＋ことには；Vた＋ことには","zh":"令人…的是。先把感情放在句首。","pex":[],"ex":[{"jp":"うれしいことに、{荷物|にもつ}が{見|み}つかりました。","zh":"令人高兴的是，行李找到了。","src":"","say":"うれしいことに、荷物が見つかりました。"},{"jp":"{残念|ざんねん}なことに、その{店|みせ}は{閉|し}まっていました。","zh":"遗憾的是，那家店关着门。","src":"","say":"残念なことに、その店は閉まっていました。"}],"tips":["感情词：うれしい、残念な、困った、驚いた。"]},{"id":"10-11","lesson":10,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"contrast","pattern":"〜だけあって／〜だけのことはある","official":"〜だけあって／〜だけのことはある","usage":"旅行の思い出を紹介するときに使うことば・表現","usageR":"{旅行|りょこう}の{思|おも}い{出|で}を{紹介|しょうかい}するときに{使|つか}うことば・{表現|ひょうげん}","conn":"普通形／N＋だけあって；だけのことはある","zh":"不愧是…；到底是…。结果和身份、评价相称。","pex":[],"ex":[{"jp":"{有名|ゆうめい}な{場所|ばしょ}だけあって、{人|ひと}が{多|おお}いです。","zh":"不愧是有名的地方，人很多。","src":"","say":"有名な場所だけあって、ひとが多いです。"},{"jp":"よく{歩|ある}いただけのことはあります。{景色|けしき}が{最高|さいこう}でした。","zh":"这一路走得值，景色好极了。","src":"","say":"よく歩いただけのことはあります。景色が最高でした。"}],"tips":["和「にしては」「わりに」（不相称）方向相反。"]},{"id":"10-12","lesson":10,"taskN":5,"task":"5 伝えてみよう","stTitle":"5 伝えてみよう","cat":"time","pattern":"〜ついでに","official":"〜ついでに","usage":"旅行の思い出を紹介するときに使うことば・表現","usageR":"{旅行|りょこう}の{思|おも}い{出|で}を{紹介|しょうかい}するときに{使|つか}うことば・{表現|ひょうげん}","conn":"Vる／Vた／Nの＋ついでに","zh":"顺便…。做主要事情时附带做。","pex":[],"ex":[{"jp":"{駅|えき}に{行|い}ったついでに、{荷物|にもつ}を{探|さが}しました。","zh":"去车站时顺便找了行李。","src":"","say":"駅に行ったついでに、荷物を探しました。"},{"jp":"{買|か}い{物|もの}のついでに、この{写真|しゃしん}を{見|み}せてください。","zh":"买东西的时候，顺便给我看看这张照片。","src":"","say":"買い物のついでに、この写真を見せてください。"}],"tips":["顺便的事应该更小。主次不要颠倒。"]},{"id":"11-1","lesson":11,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"explain","pattern":"ということだ／とのことだ","official":"ということだ／とのことだ","usage":"調査の内容や結果を説明するときに使われることば・表現","usageR":"{調査|ちょうさ}の{内容|ないよう}や{結果|けっか}を{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"普通形＋ということだ／とのことだ","zh":"听说…。转述别人的话或调查结果。","pex":[],"ex":[{"jp":"{調査|ちょうさ}では、{六|ろく}{時間|じかん}{寝|ね}る{人|ひと}が{多|おお}いということです。","zh":"据调查，睡六个小时的人较多。","src":"","say":"調査では、六時間寝るひとが多いということです。"},{"jp":"{先生|せんせい}は{今日|きょう}は{来|こ}ないとのことです。","zh":"听说老师今天不来。","src":"","say":"先生は今日は来ないとのことです。"}],"tips":["「とのことだ」更正式。第2课的「ということだ」重点是“也就是”。本课是传闻。"]},{"id":"11-2","lesson":11,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"contrast","pattern":"〜に{対|たい}して","official":"〜に対して","usage":"調査の内容や結果を説明するときに使われることば・表現","usageR":"{調査|ちょうさ}の{内容|ないよう}や{結果|けっか}を{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"N＋に対して","zh":"与…相对；与…相比。两组数字或两边对照。","pex":[],"ex":[{"jp":"{学生|がくせい}の{八|はち}{割|わり}が{賛成|さんせい}したのに{対|たい}して、{反対|はんたい}は{二|に}{割|わり}でした。","zh":"八成学生赞成，与此相对，反对的是两成。","src":"","say":"学生の八割が賛成したのに対して、反対は二割でした。"},{"jp":"{去年|きょねん}に{対|たい}して、{今年|ことし}は{一人|ひとり}で{暮|く}らす{人|ひと}が{増|ふ}えました。","zh":"与去年相对，今年一个人生活的人增加了。","src":"","say":"去年に対して、今年は一人で暮らすひとが増えました。"}],"tips":["第12课的「に{対|たい}して」是动作的对象，“对…”。"]},{"id":"11-3","lesson":11,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"contrast","pattern":"〜ものの／〜とはいうものの","official":"〜ものの／〜とはいうものの","usage":"調査の内容や結果を説明するときに使われることば・表現","usageR":"{調査|ちょうさ}の{内容|ないよう}や{結果|けっか}を{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"普通形＋ものの／とはいうものの","zh":"虽然…但是…。承认前项，后项转折。书面也可以口语。","pex":[],"ex":[{"jp":"{結果|けっか}は{出|で}たものの、まだ{問題|もんだい}があります。","zh":"虽然出了结果，但还有问题。","src":"","say":"結果は出たものの、まだ問題があります。"},{"jp":"{便利|べんり}になったとはいうものの、{休|やす}む{時間|じかん}は{減|へ}りました。","zh":"虽说方便了，休息时间却减少了。","src":"","say":"便利になったとはいうものの、休む時間は減りました。"}],"tips":["「とはいうものの」转折更明显：虽说如此。"]},{"id":"11-4","lesson":11,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"contrast","pattern":"〜といっても","official":"〜といっても","usage":"調査の内容や結果を説明するときに使われることば・表現","usageR":"{調査|ちょうさ}の{内容|ないよう}や{結果|けっか}を{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"普通形／N＋といっても","zh":"虽说是…，其实也没那么…。把对方的印象往下降。","pex":[],"ex":[{"jp":"{一人暮|ひとりぐ}らしといっても、{親|おや}の{家|いえ}の{近|ちか}くです。","zh":"虽说是一个人住，其实离父母家很近。","src":"","say":"一人暮らしといっても、親の家の近くです。"},{"jp":"{料理|りょうり}ができるといっても、{簡単|かんたん}な{物|もの}だけです。","zh":"虽说会做饭，其实只有简单的。","src":"","say":"料理ができるといっても、簡単な物だけです。"}],"tips":["后面常是程度没有那么高。"]},{"id":"11-5","lesson":11,"taskN":2,"task":"2 見つけた！","stTitle":"2 見つけた！","cat":"explain","pattern":"〜とは〜ことだ／〜とは〜ということだ","official":"〜とは〜ことだ／〜とは〜ということだ","usage":"生活スタイルの傾向を紹介するときに使われる表現","usageR":"{生活|せいかつ}スタイルの{傾向|けいこう}を{紹介|しょうかい}するときに{使|つか}われる{表現|ひょうげん}","conn":"N＋とは、N／普通形＋（ということ）だ","zh":"所谓…，就是…。下定义。","pex":[],"ex":[{"jp":"ライフスタイルとは、{生活|せいかつ}の{仕方|しかた}のことです。","zh":"所谓生活方式，就是生活的方式。","src":"","say":"ライフスタイルとは、生活の仕方のことです。"},{"jp":"ここで{言|い}う「{休|やす}み」とは、{何|なに}もしない{時間|じかん}ということです。","zh":"这里说的“休息”，就是什么都不做的时间。","src":"","say":"ここで言う休みとは、なにもしない時間ということです。"}],"tips":["「とは」前面是要解释的词。"]},{"id":"11-6","lesson":11,"taskN":2,"task":"2 見つけた！","stTitle":"2 見つけた！","cat":"contrast","pattern":"〜にしても／〜にしろ／〜にせよ","official":"〜にしても／〜にしろ／〜にせよ","usage":"生活スタイルの傾向を紹介するときに使われる表現","usageR":"{生活|せいかつ}スタイルの{傾向|けいこう}を{紹介|しょうかい}するときに{使|つか}われる{表現|ひょうげん}","conn":"普通形／N＋にしても／にしろ／にせよ","zh":"即使…也…。","pex":[],"ex":[{"jp":"{忙|いそが}しいにしても、{食事|しょくじ}をしないのはよくありません。","zh":"即使忙，不吃饭也不好。","src":"","say":"忙しいにしても、食事をしないのはよくありません。"},{"jp":"{高|たか}いにせよ、{品質|ひんしつ}がよければ{買|か}います。","zh":"即使贵，质量好的话也会买。","src":"","say":"高いにせよ、品質がよければ買います。"}],"tips":["「にしろ／にせよ」更书面。两个并列见第12课。"]},{"id":"11-7","lesson":11,"taskN":2,"task":"2 見つけた！","stTitle":"2 見つけた！","cat":"time","pattern":"〜つつある","official":"〜つつある","usage":"生活スタイルの傾向を紹介するときに使われる表現","usageR":"{生活|せいかつ}スタイルの{傾向|けいこう}を{紹介|しょうかい}するときに{使|つか}われる{表現|ひょうげん}","conn":"Vます词干＋つつある","zh":"正在逐渐…。变化进行中。书面。","pex":[],"ex":[{"jp":"この{町|まち}の{生活|せいかつ}は{変|か}わりつつあります。","zh":"这座城镇的生活正在发生变化。","src":"","say":"この町の生活は変わりつつあります。"},{"jp":"{一人|ひとり}で{食|た}べる{人|ひと}が{増|ふ}えつつあるそうです。","zh":"听说一个人吃饭的人正在增加。","src":"","say":"一人で食べるひとが増えつつあるそうです。"}],"tips":["不是「ながら」的同时做两件事。"]},{"id":"11-8","lesson":11,"taskN":2,"task":"2 見つけた！","stTitle":"2 見つけた！","cat":"reason","pattern":"〜{結果|けっか}","official":"〜結果","usage":"生活スタイルの傾向を紹介するときに使われる表現","usageR":"{生活|せいかつ}スタイルの{傾向|けいこう}を{紹介|しょうかい}するときに{使|つか}われる{表現|ひょうげん}","conn":"Vた／Nの＋結果","zh":"…的结果。","pex":[],"ex":[{"jp":"{調|しら}べた{結果|けっか}、{平均|へいきん}{睡眠|すいみん}{時間|じかん}は{六|ろく}{時間|じかん}でした。","zh":"调查的结果，平均睡眠时间是六个小时。","src":"","say":"調べた結果、平均睡眠時間は六時間でした。"},{"jp":"{話|はな}し{合|あ}いの{結果|けっか}、{計画|けいかく}を{変|か}えました。","zh":"商量的结果，改变了计划。","src":"","say":"話し合いの結果、計画を変えました。"}],"tips":["前面是原因或过程，后面是结果。"]},{"id":"11-9","lesson":11,"taskN":3,"task":"3 こんなときどうする?","stTitle":"3 こんなときどうする?","cat":"ability","pattern":"〜づらい","official":"〜づらい","usage":"友達との約束を断るときに使う表現","usageR":"{友達|ともだち}との{約束|やくそく}を{断|ことわ}るときに{使|つか}う{表現|ひょうげん}","conn":"Vます词干＋づらい","zh":"难以…。说话人感到不方便、心理上不好做。","pex":[],"ex":[{"jp":"{今日|きょう}は{断|ことわ}りづらい{約束|やくそく}があります。","zh":"今天有个难以推辞的约定。","src":"","say":"今日は断りづらい約束があります。"},{"jp":"この{靴|くつ}は{歩|ある}きづらいです。","zh":"这双鞋不好走。","src":"","say":"この靴は歩きづらいです。"}],"tips":["「にくい」偏客观难易。「がたい」偏无法接受。「づらい」常是自己不好受。"]},{"id":"11-10","lesson":11,"taskN":3,"task":"3 こんなときどうする?","stTitle":"3 こんなときどうする?","cat":"reason","pattern":"〜んだから／〜のだから","official":"〜んだから／〜のだから","usage":"友達との約束を断るときに使う表現","usageR":"{友達|ともだち}との{約束|やくそく}を{断|ことわ}るときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋んだから／のだから","zh":"因为…嘛（这是明摆着的）。用来劝告、主张，带一点情绪。","pex":[],"ex":[{"jp":"{明日|あした}は{試験|しけん}なんだから、{今日|きょう}は{早|はや}く{寝|ね}よう。","zh":"明天要考试，所以今天早点睡吧。","src":"","say":"あしたは試験なんだから、今日は早く寝よう。"},{"jp":"{約束|やくそく}したのだから、{守|まも}ってください。","zh":"因为约好了，请遵守。","src":"","say":"約束したのだから、守ってください。"}],"tips":["原因是双方都知道或说话人觉得很明显的事。"]},{"id":"11-11","lesson":11,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"scope","pattern":"〜からすると／〜からすれば／〜から{見|み}ると／〜から{見|み}れば","official":"〜からすると／〜からすれば／〜から見ると／〜から見れば","usage":"グラフやデータを見て自分の考えを述べるときに使う表現","usageR":"グラフやデータを{見|み}て{自分|じぶん}の{考|かんが}えを{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"N＋からすると／からすれば／から見ると／から見れば","zh":"从…来看。","pex":[],"ex":[{"jp":"この{数字|すうじ}からすると、{若|わか}い{人|ひと}の{方|ほう}が{多|おお}いです。","zh":"从这些数字来看，年轻人更多。","src":"","say":"この数字からすると、若いひとのほうが多いです。"},{"jp":"{親|おや}から{見|み}れば、まだ{子|こ}どもです。","zh":"在父母看来，还是个孩子。","src":"","say":"親から見れば、まだ子どもです。"}],"tips":["和「にとって」（对谁而言的评价）接近，但这里更像观察角度。"]},{"id":"11-12","lesson":11,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"contrast","pattern":"〜というより（も）","official":"〜というより（も）","usage":"グラフやデータを見て自分の考えを述べるときに使う表現","usageR":"グラフやデータを{見|み}て{自分|じぶん}の{考|かんが}えを{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"普通形／N＋というより（も）","zh":"与其说…不如说…。","pex":[],"ex":[{"jp":"{好|す}きというより、{習慣|しゅうかん}になっています。","zh":"与其说喜欢，不如说已经成了习惯。","src":"","say":"好きというより、習慣になっています。"},{"jp":"{失敗|しっぱい}というより、{経験|けいけん}だと{思|おも}います。","zh":"我觉得与其说是失败，不如说是经验。","src":"","say":"失敗というより、経験だと思います。"}],"tips":["后面才是说话人认为更准确的说法。"]},{"id":"11-13","lesson":11,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"guess","pattern":"〜のではないでしょうか／〜んじゃないでしょうか","official":"〜のではないでしょうか／〜んじゃないでしょうか","usage":"グラフやデータを見て自分の考えを述べるときに使う表現","usageR":"グラフやデータを{見|み}て{自分|じぶん}の{考|かんが}えを{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋のではないでしょうか／んじゃないでしょうか","zh":"是不是…呢。委婉地提出自己的看法。","pex":[],"ex":[{"jp":"この{数字|すうじ}は、これからもっと{増|ふ}えるのではないでしょうか。","zh":"这个数字今后是不是还会增加呢。","src":"","say":"この数字は、これからもっと増えるのではないでしょうか。"},{"jp":"{休|やす}みが{短|みじか}いのが{原因|げんいん}なんじゃないでしょうか。","zh":"原因是不是休息太短呢。","src":"","say":"休みが短いのが原因なんじゃないでしょうか。"}],"tips":["演讲、报告的结尾常用，避免说得太满。"]},{"id":"12-1","lesson":12,"taskN":1,"task":"1 こんなときどうする?","stTitle":"1 こんなときどうする?","cat":"contrast","pattern":"〜にしても〜にしても／〜にしろ〜にしろ／〜にせよ〜にせよ","official":"〜にしても〜にしても／〜にしろ〜にしろ／〜にせよ〜にせよ","usage":"友達からアドバイスをもらいたいときに使う表現","usageR":"{友達|ともだち}からアドバイスをもらいたいときに{使|つか}う{表現|ひょうげん}","conn":"普通形／N＋にしても、～にしても；にしろ～にしろ；にせよ～にせよ","zh":"无论是…还是…。","pex":[],"ex":[{"jp":"{歩|ある}くにしても{泳|およ}ぐにしても、{続|つづ}けることが{大切|たいせつ}です。","zh":"无论是走路还是游泳，坚持都很重要。","src":"","say":"歩くにしても泳ぐにしても、続けることが大切です。"},{"jp":"{朝|あさ}にせよ{夜|よる}にせよ、{少|すこ}しは{体|からだ}を{動|うご}かしましょう。","zh":"无论早上还是晚上，都多少活动一下身体吧。","src":"","say":"朝にせよ夜にせよ、少しは体を動かしましょう。"}],"tips":["两边都包括，后面是共同的结论。"]},{"id":"12-2","lesson":12,"taskN":1,"task":"1 こんなときどうする?","stTitle":"1 こんなときどうする?","cat":"time","pattern":"〜ばかりだ／〜{一方|いっぽう}だ","official":"〜ばかりだ／〜一方だ","usage":"友達からアドバイスをもらいたいときに使う表現","usageR":"{友達|ともだち}からアドバイスをもらいたいときに{使|つか}う{表現|ひょうげん}","conn":"Vる＋ばかりだ／一方だ","zh":"一个劲地越来越…。多用于不好的变化。","pex":[],"ex":[{"jp":"{最近|さいきん}、{寝|ね}る{時間|じかん}が{遅|おそ}くなるばかりです。","zh":"最近睡觉时间一个劲地变晚。","src":"","say":"最近、寝る時間が遅くなるばかりです。"},{"jp":"{運動|うんどう}しないので、{体重|たいじゅう}が{増|ふ}える{一方|いっぽう}です。","zh":"因为不运动，体重一个劲地增加。","src":"","say":"運動しないので、体重が増える一方です。"}],"tips":["「{一方|いっぽう}だ」也可以用于变好，但常写变化的单方向。"]},{"id":"12-3","lesson":12,"taskN":1,"task":"1 こんなときどうする?","stTitle":"1 こんなときどうする?","cat":"manner","pattern":"〜{気味|きみ}","official":"〜気味","usage":"友達からアドバイスをもらいたいときに使う表現","usageR":"{友達|ともだち}からアドバイスをもらいたいときに{使|つか}う{表現|ひょうげん}","conn":"Vます词干／N＋気味","zh":"稍微有点…。程度轻，常是不太好的感觉。","pex":[],"ex":[{"jp":"{少|すこ}し{疲|つか}れ{気味|きみ}なので、{今日|きょう}は{早|はや}く{寝|ね}ます。","zh":"有点累，今天早点睡。","src":"","say":"少し疲れ気味なので、今日は早く寝ます。"},{"jp":"{最近|さいきん}、{寝不足|ねぶそく}{気味|きみ}です。","zh":"最近有点睡眠不足。","src":"","say":"最近、ねぶそく気味です。"}],"tips":["「がち」是习惯倾向。「{気味|きみ}」更像一时的苗头。"]},{"id":"12-4","lesson":12,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"contrast","pattern":"〜からといって","official":"〜からといって","usage":"運動習慣の大切さについて話すときに使うことば・表現","usageR":"{運動|うんどう}{習慣|しゅうかん}の{大切|たいせつ}さについて{話|はな}すときに{使|つか}うことば・{表現|ひょうげん}","conn":"普通形＋からといって","zh":"虽说…，也不能因此…。","pex":[],"ex":[{"jp":"{忙|いそが}しいからといって、{食事|しょくじ}をぬいてはいけません。","zh":"不能因为忙就省掉吃饭。","src":"","say":"忙しいからといって、食事をぬいてはいけません。"},{"jp":"{若|わか}いからといって、{疲|つか}れないわけではありません。","zh":"不能因为年轻就不累。","src":"","say":"若いからといって、疲れないわけではありません。"}],"tips":["后面常是否定：不能因为这个就…。"]},{"id":"12-5","lesson":12,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"scope","pattern":"〜に{応|おう}じ（て）／〜に{応|おう}じた","official":"〜に応じ（て）／〜に応じた","usage":"運動習慣の大切さについて話すときに使うことば・表現","usageR":"{運動|うんどう}{習慣|しゅうかん}の{大切|たいせつ}さについて{話|はな}すときに{使|つか}うことば・{表現|ひょうげん}","conn":"N／Vる＋に応じて／に応じた＋N","zh":"根据…；与…相适应。","pex":[],"ex":[{"jp":"{体力|たいりょく}に{応|おう}じて、{運動|うんどう}の{量|りょう}を{変|か}えましょう。","zh":"根据体力来改变运动量吧。","src":"","say":"体力に応じて、運動の量を変えましょう。"},{"jp":"{年齢|ねんれい}に{応|おう}じたメニューがあります。","zh":"有适合年龄的菜单。","src":"","say":"年齢に応じたメニューがあります。"}],"tips":["「に{応|おう}じた」后面接名词。"]},{"id":"12-6","lesson":12,"taskN":2,"task":"2 耳でキャッチ","stTitle":"2 耳でキャッチ","cat":"cond","pattern":"〜さえ〜ば","official":"〜さえ〜ば","usage":"運動習慣の大切さについて話すときに使うことば・表現","usageR":"{運動|うんどう}{習慣|しゅうかん}の{大切|たいせつ}さについて{話|はな}すときに{使|つか}うことば・{表現|ひょうげん}","conn":"N＋さえ／Vます词干＋さえ＋すれば／あれば","zh":"只要…就…。最低条件。","pex":[],"ex":[{"jp":"{天気|てんき}さえよければ、{外|そと}を{走|はし}ります。","zh":"只要天气好，就在外面跑。","src":"","say":"天気さえよければ、外を走ります。"},{"jp":"{十分|じゅうぶん}さえあれば、この{運動|うんどう}はできます。","zh":"只要有十分钟，就能做这个运动。","src":"","say":"じゅうぶんさえあれば、この運動はできます。"}],"tips":["「さえ」单独是“甚至”（第7课）。加上「ば」才是“只要”。"]},{"id":"12-7","lesson":12,"taskN":3,"task":"3 見つけた！","stTitle":"3 見つけた！","cat":"scope","pattern":"〜に{対|たい}して／〜に{対|たい}する（{対象|たいしょう}）","official":"〜に対して／〜に対する（対象）","usage":"睡眠に関係があることば・表現","usageR":"{睡眠|すいみん}に{関係|かんけい}があることば・{表現|ひょうげん}","conn":"N＋に対して／に対する＋N","zh":"对…（对象）。","pex":[],"ex":[{"jp":"{睡眠|すいみん}に{対|たい}する{関心|かんしん}が{高|たか}まっています。","zh":"对睡眠的关心在提高。","src":"","say":"睡眠に対する関心が高まっています。"},{"jp":"{体|からだ}に{対|たい}して、{無理|むり}な{運動|うんどう}はよくありません。","zh":"对身体来说，过度运动不好。","src":"","say":"体に対して、無理な運動はよくありません。"}],"tips":["第11课是两组对照。本课是动作、态度指向的对象。"]},{"id":"12-8","lesson":12,"taskN":3,"task":"3 見つけた！","stTitle":"3 見つけた！","cat":"example","pattern":"〜やら〜やら","official":"〜やら〜やら","usage":"睡眠に関係があることば・表現","usageR":"{睡眠|すいみん}に{関係|かんけい}があることば・{表現|ひょうげん}","conn":"N／普通形＋やら、～やら","zh":"又是…又是…。列举，常带“又多又烦”的感觉。","pex":[],"ex":[{"jp":"{宿題|しゅくだい}やらアルバイトやらで、{寝|ね}る{時間|じかん}がありません。","zh":"又是作业又是打工，没有睡觉的时间。","src":"","say":"宿題やらアルバイトやらで、寝る時間がありません。"},{"jp":"{頭|あたま}が{痛|いた}いやら、{眠|ねむ}れないやらで、{困|こま}りました。","zh":"又头疼又睡不着，真难办。","src":"","say":"頭が痛いやら、眠れないやらで、困りました。"}],"tips":["比「とか」更书面，情绪更重。"]},{"id":"12-9","lesson":12,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"example","pattern":"〜なんて／〜なんか／〜など","official":"〜なんて／〜なんか／〜など","usage":"他の人の意見を受けて自分の意見を述べるときに使う表現","usageR":"{他|ほか}の{人|ひと}の{意見|いけん}を{受|う}けて{自分|じぶん}の{意見|いけん}を{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"N／普通形＋なんて／なんか／など","zh":"…之类的。把事情说轻，或觉得不值一提。","pex":[],"ex":[{"jp":"{運動|うんどう}なんて、{自分|じぶん}には{関係|かんけい}ないと{思|おも}っていました。","zh":"我以前觉得运动之类的跟自己无关。","src":"","say":"運動なんて、自分には関係ないと思っていました。"},{"jp":"{忙|いそが}しいなんかという{理由|りゆう}で、{休|やす}まないでください。","zh":"请不要以忙之类的理由请假。","src":"","say":"忙しいなんかという理由で、休まないでください。"}],"tips":["第3课的「なんて」是吃惊。本课是“之类、谈不上”。「など」最中性。"]},{"id":"12-10","lesson":12,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"example","pattern":"〜として〜ない","official":"〜として〜ない","usage":"他の人の意見を受けて自分の意見を述べるときに使う表現","usageR":"{他|ほか}の{人|ひと}の{意見|いけん}を{受|う}けて{自分|じぶん}の{意見|いけん}を{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"数量＋として、～ない","zh":"就连一个…也没有。全部否定。","pex":[],"ex":[{"jp":"{一人|ひとり}として、{反対|はんたい}する{人|ひと}はいませんでした。","zh":"没有一个人反对。","src":"","say":"一人として、反対するひとはいませんでした。"},{"jp":"{一|いち}{日|にち}として、{運動|うんどう}しなかった{日|ひ}はありません。","zh":"没有一天不运动。","src":"","say":"一にちとして、運動しなかったひはありません。"}],"tips":["「{一人|ひとり}として」「{一|いち}{日|にち}として」「{何|なん}{一|ひと}つとして」。后面必须否定。"]},{"id":"12-11","lesson":12,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"explain","pattern":"〜というものだ","official":"〜というものだ","usage":"他の人の意見を受けて自分の意見を述べるときに使う表現","usageR":"{他|ほか}の{人|ひと}の{意見|いけん}を{受|う}けて{自分|じぶん}の{意見|いけん}を{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋というものだ","zh":"这才叫…；这就是所谓的…。说出一般道理。","pex":[],"ex":[{"jp":"{体|からだ}が{資本|しほん}です。それが{健康|けんこう}というものです。","zh":"身体是本钱。这才叫健康。","src":"","say":"体が資本です。それが健康というものです。"},{"jp":"{困|こま}ったときに{助|たす}けるのが、{友達|ともだち}というものです。","zh":"困难时伸手帮忙，这才是朋友。","src":"","say":"困ったときに助けるのが、友達というものです。"}],"tips":["和「ものだ」（理当、怀念）接近，但更像下评语。"]},{"id":"12-12","lesson":12,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"guess","pattern":"〜とは{限|かぎ}らない","official":"〜とは限らない","usage":"他の人の意見を受けて自分の意見を述べるときに使う表現","usageR":"{他|ほか}の{人|ひと}の{意見|いけん}を{受|う}けて{自分|じぶん}の{意見|いけん}を{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋とは限らない","zh":"未必…。","pex":[],"ex":[{"jp":"{高|たか}いものがいつもいいとは{限|かぎ}りません。","zh":"贵的东西未必总是好。","src":"","say":"高いものがいつもいいとはかぎりません。"},{"jp":"よく{寝|ね}る{人|ひと}が{健康|けんこう}だとは{限|かぎ}りません。","zh":"睡得多的人未必就健康。","src":"","say":"よく寝るひとが健康だとはかぎりません。"}],"tips":["用来否定“总是如此”的想法。"]},{"id":"13-1","lesson":13,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"scope","pattern":"〜とともに（{一緒|いっしょ}に）","official":"〜とともに（一緒に）","usage":"熱中していることを紹介するときに使う表現","usageR":"{熱中|ねっちゅう}していることを{紹介|しょうかい}するときに{使|つか}う{表現|ひょうげん}","conn":"N＋とともに（一起）","zh":"和…一起。","pex":[],"ex":[{"jp":"{友達|ともだち}とともに、この{活動|かつどう}を{続|つづ}けています。","zh":"和朋友一起继续着这个活动。","src":"","say":"友達とともに、この活動を続けています。"},{"jp":"{家族|かぞく}とともに{見|み}た{映画|えいが}です。","zh":"是和家人一起看的电影。","src":"","say":"家族とともに見た映画です。"}],"tips":["第9课的「とともに」是“随着变化”。本课是同伴。"]},{"id":"13-2","lesson":13,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"ability","pattern":"〜しかない","official":"〜しかない","usage":"熱中していることを紹介するときに使う表現","usageR":"{熱中|ねっちゅう}していることを{紹介|しょうかい}するときに{使|つか}う{表現|ひょうげん}","conn":"Vる＋しかない","zh":"只能…；只好…。没有别的办法。","pex":[],"ex":[{"jp":"{最終|さいしゅう}の{電車|でんしゃ}がないので、{歩|ある}くしかありません。","zh":"没有末班电车了，只好走。","src":"","say":"最終の電車がないので、歩くしかありません。"},{"jp":"{本当|ほんとう}に{好|す}きなら、{続|つづ}けるしかないと{思|おも}います。","zh":"如果真的喜欢，我觉得只能继续。","src":"","say":"本当に好きなら、続けるしかないと思います。"}],"tips":["和「ほかない」接近。口语里「しかない」更常见。"]},{"id":"13-3","lesson":13,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"emotion","pattern":"〜ないではいられない／〜ずにはいられない","official":"〜ないではいられない／〜ずにはいられない","usage":"熱中していることを紹介するときに使う表現","usageR":"{熱中|ねっちゅう}していることを{紹介|しょうかい}するときに{使|つか}う{表現|ひょうげん}","conn":"Vない＋ではいられない；V（ない形去掉ない）＋ずにはいられない","zh":"不能不…；不由得要…。","pex":[],"ex":[{"jp":"この{曲|きょく}を{聞|き}くと、{歌|うた}わないではいられません。","zh":"一听这首曲子，就忍不住要唱。","src":"","say":"この曲を聞くと、歌わないではいられません。"},{"jp":"{面白|おもしろ}いので、{最後|さいご}まで{見|み}ずにはいられません。","zh":"因为有趣，忍不住要看到最后。","src":"","say":"面白いので、最後まで見ずにはいられません。"}],"tips":["「する」用「せずにはいられない」。一段、カ变去掉「ない」再加「ず」。"]},{"id":"13-4","lesson":13,"taskN":2,"task":"2 伝えてみよう","stTitle":"2 伝えてみよう","cat":"ability","pattern":"〜（さ）せられる","official":"〜（さ）せられる","usage":"好きな作品とその見どころを紹介するときに使うことば・表現","usageR":"{好|す}きな{作品|さくひん}とその{見|み}どころを{紹介|しょうかい}するときに{使|つか}うことば・{表現|ひょうげん}","conn":"使役被动：（さ）せられる","zh":"被迫…；不由得…。","pex":[],"ex":[{"jp":"{長|なが}いスピーチを{聞|き}かされて、{疲|つか}れました。","zh":"被迫听了很长的致辞，累了。","src":"","say":"長いスピーチを聞かされて、疲れました。"},{"jp":"その{映画|えいが}を{見|み}て、{家族|かぞく}のことを{考|かんが}えさせられました。","zh":"看了那部电影，不由得思考家人的事。","src":"","say":"その映画を見て、家族のことを考えさせられました。"}],"tips":["Ⅰ类也有「される」型：待つ→待たされる。感情类「{考|かんが}えさせられる」是“不由得思考”。"]},{"id":"13-5","lesson":13,"taskN":2,"task":"2 伝えてみよう","stTitle":"2 伝えてみよう","cat":"contrast","pattern":"〜{一方|いっぽう}（で）","official":"〜一方（で）","usage":"好きな作品とその見どころを紹介するときに使うことば・表現","usageR":"{好|す}きな{作品|さくひん}とその{見|み}どころを{紹介|しょうかい}するときに{使|つか}うことば・{表現|ひょうげん}","conn":"普通形／N＋である＋一方（で）","zh":"一方面…，另一方面…。","pex":[],"ex":[{"jp":"この{作品|さくひん}は{楽|たの}しい{一方|いっぽう}で、{考|かんが}えさせるところもあります。","zh":"这部作品有趣，另一方面也有引人思考的地方。","src":"","say":"この作品は楽しい一方で、考えさせるところもあります。"},{"jp":"{人気|にんき}がある{一方|いっぽう}、{批判|ひはん}もあります。","zh":"虽然受欢迎，另一方面也有批评。","src":"","say":"人気がある一方、批判もあります。"}],"tips":["「Vる{一方|いっぽう}だ」是越来越（第12课）。这里的「{一方|いっぽう}で」是两边对照。"]},{"id":"13-6","lesson":13,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"example","pattern":"〜のみならず","official":"〜のみならず","usage":"話題になっていることが広がっていく様子を表すことば・表現","usageR":"{話題|わだい}になっていることが{広|ひろ}がっていく{様子|ようす}を{表|あらわ}すことば・{表現|ひょうげん}","conn":"N／普通形＋のみならず","zh":"不仅…而且…。书面。","pex":[],"ex":[{"jp":"{若者|わかもの}のみならず、{年配|ねんぱい}の{人|ひと}もこの{話題|わだい}に{関心|かんしん}があります。","zh":"不仅年轻人，上了年纪的人也关心这个话题。","src":"","say":"若者のみならず、年配のひともこの話題に関心があります。"},{"jp":"{国内|こくない}のみならず、{海外|かいがい}でも{知|し}られるようになりました。","zh":"不仅在国内，在海外也变得有名了。","src":"","say":"国内のみならず、海外でも知られるようになりました。"}],"tips":["和「だけでなく」「ばかりでなく」意思接近，「のみならず」最正式。"]},{"id":"13-7","lesson":13,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"time","pattern":"〜と{同時|どうじ}に","official":"〜と同時に","usage":"話題になっていることが広がっていく様子を表すことば・表現","usageR":"{話題|わだい}になっていることが{広|ひろ}がっていく{様子|ようす}を{表|あらわ}すことば・{表現|ひょうげん}","conn":"普通形／N＋と同時に","zh":"与…的同时。","pex":[],"ex":[{"jp":"{有名|ゆうめい}になると{同時|どうじ}に、{忙|いそが}しくなりました。","zh":"一出名，同时也变忙了。","src":"","say":"有名になると同時に、忙しくなりました。"},{"jp":"{開始|かいし}と{同時|どうじ}に、{雨|あめ}が{降|ふ}り{出|だ}しました。","zh":"一开始，雨就下起来了。","src":"","say":"開始と同時に、雨が降り出しました。"}],"tips":["两个变化或两件事同时发生。"]},{"id":"13-8","lesson":13,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"scope","pattern":"〜によって／〜により／〜による","official":"〜によって／〜により／〜による","usage":"話題になっていることが広がっていく様子を表すことば・表現","usageR":"{話題|わだい}になっていることが{広|ひろ}がっていく{様子|ようす}を{表|あらわ}すことば・{表現|ひょうげん}","conn":"N＋によって／により／による＋N","zh":"由于…；通过…；取决于…。本课用来说明事情如何传开、因何变化。","pex":[],"ex":[{"jp":"ネットによって、その{話題|わだい}はすぐ{広|ひろ}まりました。","zh":"通过网络，那个话题马上传开了。","src":"","say":"ネットによって、その話題はすぐ広まりました。"},{"jp":"{地域|ちいき}による{違|ちが}いもあります。","zh":"也有因地区而产生的差别。","src":"","say":"地域による違いもあります。"}],"tips":["第2课是“因人而异”，第5课是灾害原因。看后面的词判断。"]},{"id":"13-9","lesson":13,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"reason","pattern":"〜だけに","official":"〜だけに","usage":"実現したい気持ちを伝えて依頼するときに使う表現","usageR":"{実現|じつげん}したい{気持|きも}ちを{伝|つた}えて{依頼|いらい}するときに{使|つか}う{表現|ひょうげん}","conn":"普通形／N＋だけに","zh":"正因为…，所以更加…。","pex":[],"ex":[{"jp":"{初|はじ}めてだけに、{失敗|しっぱい}しないように{準備|じゅんび}しました。","zh":"正因为是第一次，才做了准备以免失败。","src":"","say":"初めてだけに、失敗しないように準備しました。"},{"jp":"{期待|きたい}していただけに、{中止|ちゅうし}は{残念|ざんねん}です。","zh":"正因为期待过，取消了才觉得遗憾。","src":"","say":"期待していただけに、中止は残念です。"}],"tips":["期待越高，结果相反时的失望也用「だけに」。"]},{"id":"13-10","lesson":13,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"contrast","pattern":"〜としても","official":"〜としても","usage":"実現したい気持ちを伝えて依頼するときに使う表現","usageR":"{実現|じつげん}したい{気持|きも}ちを{伝|つた}えて{依頼|いらい}するときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋としても","zh":"即使假定…也…。","pex":[],"ex":[{"jp":"{高|たか}いとしても、{直|なお}したいです。","zh":"即使贵，也想修。","src":"","say":"高いとしても、直したいです。"},{"jp":"{時間|じかん}がかかるとしても、お{願|ねが}いします。","zh":"即使花时间，也拜托您了。","src":"","say":"時間がかかるとしても、お願いします。"}],"tips":["比「ても」更像“就算当作是这样”。"]},{"id":"13-11","lesson":13,"taskN":5,"task":"5 耳でキャッチ","stTitle":"5 耳でキャッチ","cat":"time","pattern":"〜に{先立|さきだ}って／〜に{先立|さきだ}ち","official":"〜に先立って／〜に先立ち","usage":"イベントの現地リポートでよく聞く表現","usageR":"イベントの{現地|げんち}リポートでよく{聞|き}く{表現|ひょうげん}","conn":"Vる／N＋に先立って／に先立ち","zh":"在…之前。正式，活动、手续的事前步骤。","pex":[],"ex":[{"jp":"{大会|たいかい}に{先立|さきだ}って、{注意|ちゅうい}{事項|じこう}を{説明|せつめい}します。","zh":"在大会之前，说明注意事项。","src":"","say":"大会に先立って、注意事項を説明します。"},{"jp":"{旅行|りょこう}に{先立|さきだ}ち、{保険|ほけん}に{入|はい}りました。","zh":"旅行之前加入了保险。","src":"","say":"旅行に先立ち、保険に入りました。"}],"tips":["比「{前|まえ}に」正式，常用于通知。"]},{"id":"13-12","lesson":13,"taskN":5,"task":"5 耳でキャッチ","stTitle":"5 耳でキャッチ","cat":"contrast","pattern":"どちらかというと／どちらかといえば","official":"どちらかというと／どちらかといえば","usage":"イベントの現地リポートでよく聞く表現","usageR":"イベントの{現地|げんち}リポートでよく{聞|き}く{表現|ひょうげん}","conn":"どちらかというと／どちらかといえば","zh":"要说的话，比较偏向…。","pex":[],"ex":[{"jp":"どちらかというと、{静|しず}かな{方|ほう}が{好|す}きです。","zh":"要说的话，我更喜欢安静的。","src":"","say":"どちらかというと、静かなほうが好きです。"},{"jp":"どちらかといえば、{映画|えいが}の{方|ほう}がおもしろかったです。","zh":"比较而言，电影更有意思。","src":"","say":"どちらかといえば、映画のほうがおもしろかったです。"}],"tips":["不是绝对，只是相对更靠近一边。"]},{"id":"14-1","lesson":14,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"example","pattern":"〜ばかりでなく／〜ばかりか","official":"〜ばかりでなく／〜ばかりか","usage":"新聞の投書で使われる疑問や意見を表す表現","usageR":"{新聞|しんぶん}の{投書|とうしょ}で{使|つか}われる{疑問|ぎもん}や{意見|いけん}を{表|あらわ}す{表現|ひょうげん}","conn":"普通形／N＋ばかりでなく／ばかりか","zh":"不仅…而且…。「ばかりか」常常后面是更严重、更出乎意料的事。","pex":[],"ex":[{"jp":"{言葉|ことば}ばかりでなく、{習慣|しゅうかん}も{違|ちが}います。","zh":"不仅语言，习惯也不同。","src":"","say":"言葉ばかりでなく、習慣も違います。"},{"jp":"{謝|あやま}らないばかりか、{笑|わら}い{出|だ}してしまいました。","zh":"不仅不道歉，反而笑了起来。","src":"","say":"謝らないばかりか、笑い出してしまいました。"}],"tips":["「ばかりか」语气比「ばかりでなく」强。"]},{"id":"14-2","lesson":14,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"time","pattern":"〜（か）と{思|おも}うと／〜（か）と{思|おも}ったら","official":"〜（か）と思うと／〜（か）と思ったら","usage":"新聞の投書で使われる疑問や意見を表す表現","usageR":"{新聞|しんぶん}の{投書|とうしょ}で{使|つか}われる{疑問|ぎもん}や{意見|いけん}を{表|あらわ}す{表現|ひょうげん}","conn":"Vた＋（か）と思うと／（か）と思ったら","zh":"刚一…，就…。变化很快，常让人吃惊。","pex":[],"ex":[{"jp":"{晴|は}れたかと{思|おも}うと、もう{雨|あめ}が{降|ふ}ってきました。","zh":"刚觉得放晴了，就又下起雨来。","src":"","say":"晴れたかと思うと、もう雨が降ってきました。"},{"jp":"{帰|かえ}ったと{思|おも}ったら、また{呼|よ}びに{来|き}ました。","zh":"刚以为回去了，又来叫人了。","src":"","say":"帰ったと思ったら、また呼びに来ました。"}],"tips":["后项一般不是说话人自己的意志。"]},{"id":"14-3","lesson":14,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"emotion","pattern":"〜てならない","official":"〜てならない","usage":"新聞の投書で使われる疑問や意見を表す表現","usageR":"{新聞|しんぶん}の{投書|とうしょ}で{使|つか}われる{疑問|ぎもん}や{意見|いけん}を{表|あらわ}す{表現|ひょうげん}","conn":"Vて／Aくて＋ならない","zh":"不由得…；…得受不了。感情自然涌上来。偏书面。","pex":[],"ex":[{"jp":"どうしてそんなことをするのか、{不思議|ふしぎ}でなりません。","zh":"不明白为什么要做那种事，觉得很奇怪。","src":"","say":"どうしてそんなことをするのか、不思議でなりません。"},{"jp":"{家族|かぞく}のことが{心配|しんぱい}でなりません。","zh":"不由得担心家人。","src":"","say":"家族のことが心配でなりません。"}],"tips":["和「てたまらない」接近。「てならない」多用于担心、想知道、难受。"]},{"id":"14-4","lesson":14,"taskN":2,"task":"2 こんなときどうする?","stTitle":"2 こんなときどうする?","cat":"contrast","pattern":"〜ことは〜が","official":"〜ことは〜が","usage":"無理な注文に丁寧に対応し、代案を出して勧めるときに使う表現","usageR":"{無理|むり}な{注文|ちゅうもん}に{丁寧|ていねい}に{対応|たいおう}し、{代案|だいあん}を{出|だ}して{勧|すす}めるときに{使|つか}う{表現|ひょうげん}","conn":"Vる／Aい＋ことは～が","zh":"…是…，可是…。先承认，再转折。","pex":[],"ex":[{"jp":"できることはできますが、{今日|きょう}は{難|むずか}しいです。","zh":"做是能做，但今天有困难。","src":"","say":"できることはできますが、今日は難しいです。"},{"jp":"{高|たか}いことは{高|たか}いですが、{品質|ひんしつ}はいいです。","zh":"贵是贵，但质量好。","src":"","say":"高いことは高いですが、品質はいいです。"}],"tips":["重复同一个词：「{行|い}くことは{行|い}きますが」。"]},{"id":"14-5","lesson":14,"taskN":2,"task":"2 こんなときどうする?","stTitle":"2 こんなときどうする?","cat":"scope","pattern":"〜によっては","official":"〜によっては","usage":"無理な注文に丁寧に対応し、代案を出して勧めるときに使う表現","usageR":"{無理|むり}な{注文|ちゅうもん}に{丁寧|ていねい}に{対応|たいおう}し、{代案|だいあん}を{出|だ}して{勧|すす}めるときに{使|つか}う{表現|ひょうげん}","conn":"N＋によっては","zh":"根据…的不同，有的…。不是全部，而是某些情况。","pex":[],"ex":[{"jp":"{店|みせ}によっては、{当日|とうじつ}でも{注文|ちゅうもん}できます。","zh":"有的店当天也能订。","src":"","say":"店によっては、当日でも注文できます。"},{"jp":"{人|ひと}によっては、この{習慣|しゅうかん}を{失礼|しつれい}だと{感|かん}じます。","zh":"有的人会觉得这个习惯不礼貌。","src":"","say":"ひとによっては、この習慣を失礼だと感じます。"}],"tips":["和「によって」（因…而不同）接近，但「によっては」强调“有的场合会”。"]},{"id":"14-6","lesson":14,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"reason","pattern":"〜から（に）は","official":"〜から（に）は","usage":"図や表を見ながら説明するときに使われる表現","usageR":"{図|ず}や{表|ひょう}を{見|み}ながら{説明|せつめい}するときに{使|つか}われる{表現|ひょうげん}","conn":"普通形＋から（に）は","zh":"既然…就…。","pex":[],"ex":[{"jp":"やると{言|い}ったからには、{最後|さいご}までやります。","zh":"既然说了要做，就会做到最后。","src":"","say":"やると言ったからには、最後までやります。"},{"jp":"{日本|にほん}に{来|き}たからには、{日本語|にほんご}で{生活|せいかつ}したいです。","zh":"既然来了日本，就想用日语生活。","src":"","say":"にほんに来たからには、日本語で生活したいです。"}],"tips":["后面多是决心、义务、请求，不再回头。"]},{"id":"14-7","lesson":14,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"contrast","pattern":"〜どころか","official":"〜どころか","usage":"図や表を見ながら説明するときに使われる表現","usageR":"{図|ず}や{表|ひょう}を{見|み}ながら{説明|せつめい}するときに{使|つか}われる{表現|ひょうげん}","conn":"普通形／N＋どころか","zh":"岂止不是…，反而…。","pex":[],"ex":[{"jp":"{易|やさ}しくなるどころか、{前|まえ}より{難|むずか}しくなりました。","zh":"岂止没有变容易，反而比以前更难了。","src":"","say":"易しくなるどころか、前より難しくなりました。"},{"jp":"{百|ひゃく}{人|にん}どころか、{三十|さんじゅう}{人|にん}しか{来|き}ませんでした。","zh":"岂止一百人，只来了三十人。","src":"","say":"百にんどころか、三十にんしか来ませんでした。"}],"tips":["和「どころではない」（顾不上）不同。这里是相反的结果。"]},{"id":"14-8","lesson":14,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"ability","pattern":"〜{得|う}る／〜{得|え}ない","official":"〜得る／〜得ない","usage":"図や表を見ながら説明するときに使われる表現","usageR":"{図|ず}や{表|ひょう}を{見|み}ながら{説明|せつめい}するときに{使|つか}われる{表現|ひょうげん}","conn":"Vます词干＋得る／得ない","zh":"有可能…／不可能…。书面。读「うる／える」，否定「えない」。","pex":[],"ex":[{"jp":"それは{十分|じゅうぶん}にあり{得|う}ることです。","zh":"那是完全有可能的事。","src":"","say":"それはじゅうぶんにありうることです。"},{"jp":"{今|いま}の{条件|じょうけん}では、{成功|せいこう}し{得|え}ません。","zh":"以现在的条件，不可能成功。","src":"","say":"今の条件では、成功しえません。"}],"tips":["「あり{得|う}る」「{考|かんが}え{得|う}る」。日常会话少用。"]},{"id":"14-9","lesson":14,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"example","pattern":"〜に{限|かぎ}らず","official":"〜に限らず","usage":"図や表を見ながら説明するときに使われる表現","usageR":"{図|ず}や{表|ひょう}を{見|み}ながら{説明|せつめい}するときに{使|つか}われる{表現|ひょうげん}","conn":"N＋に限らず","zh":"不限于…，…也。","pex":[],"ex":[{"jp":"この{問題|もんだい}は、{日本|にほん}に{限|かぎ}らず、{他|ほか}の{国|くに}にもあります。","zh":"这个问题不限于日本，其他国家也有。","src":"","say":"この問題は、にほんにかぎらず、ほかの国にもあります。"},{"jp":"{若者|わかもの}に{限|かぎ}らず、{多|おお}くの{人|ひと}が{困|こま}っています。","zh":"不限于年轻人，很多人都感到为难。","src":"","say":"若者にかぎらず、多くのひとが困っています。"}],"tips":["「に{限|かぎ}り」是仅限。「に{限|かぎ}らず」是不限于。"]},{"id":"14-10","lesson":14,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"manner","pattern":"～げ","official":"～げ","usage":"驚きや感動、疑問などを述べるときに使う表現","usageR":"{驚|おどろ}きや{感動|かんどう}、{疑問|ぎもん}などを{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"Vます词干／A词干／N＋げ","zh":"显得…；…的样子。","pex":[],"ex":[{"jp":"{彼|かれ}は{寂|さび}しげな{顔|かお}をしていました。","zh":"他脸上带着寂寞的神情。","src":"","say":"彼は寂しげな顔をしていました。"},{"jp":"{子|こ}どもは{楽|たの}しげに{走|はし}っていました。","zh":"孩子开心地跑着。","src":"","say":"子どもは楽しげに走っていました。"}],"tips":["い形容词去「い」：悲しげ。ナ形容词用词干：不安げ。口语里「そう」更常见。"]},{"id":"14-11","lesson":14,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"time","pattern":"～たとたん（に）","official":"～たとたん（に）","usage":"驚きや感動、疑問などを述べるときに使う表現","usageR":"{驚|おどろ}きや{感動|かんどう}、{疑問|ぎもん}などを{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"Vた＋とたん（に）","zh":"刚一…的瞬间，就…。后项是意外的瞬间变化。","pex":[],"ex":[{"jp":"ドアを{開|あ}けたとたん、{猫|ねこ}が{走|はし}ってきました。","zh":"一开门，猫就跑了过来。","src":"","say":"ドアをあけたとたん、猫が走ってきました。"},{"jp":"{立|た}ったとたんに、{目|め}が{回|まわ}りました。","zh":"刚一站起来，就眼花了。","src":"","say":"立ったとたんに、目が回りました。"}],"tips":["后项不能是说话人的意志或命令。"]},{"id":"14-12","lesson":14,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"emotion","pattern":"なんて～んだろう／なんて～だろう","official":"なんて～んだろう／なんて～だろう","usage":"驚きや感動、疑問などを述べるときに使う表現","usageR":"{驚|おどろ}きや{感動|かんどう}、{疑問|ぎもん}などを{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"なんて＋普通形＋んだろう／だろう","zh":"多么…啊！感叹。","pex":[],"ex":[{"jp":"なんて{静|しず}かな{町|まち}なんだろう。","zh":"多么安静的城镇啊。","src":"","say":"なんて静かな町なんだろう。"},{"jp":"{同|おな}じ{国|くに}なのに、なんて{違|ちが}うんだろう。","zh":"明明是同一个国家，差别好大啊。","src":"","say":"同じ国なのに、なんて違うんだろう。"}],"tips":["前面常有「なんて」「なんと」。"]},{"id":"14-13","lesson":14,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"time","pattern":"～{以来|いらい}","official":"～以来","usage":"驚きや感動、疑問などを述べるときに使う表現","usageR":"{驚|おどろ}きや{感動|かんどう}、{疑問|ぎもん}などを{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"Vて＋以来；N＋以来","zh":"自从…以来。","pex":[],"ex":[{"jp":"{日本|にほん}に{来|き}て{以来|いらい}、{毎日|まいにち}{日本語|にほんご}を{使|つか}っています。","zh":"来日本以来，每天都在用日语。","src":"","say":"にほんに来て以来、毎日日本語を使っています。"},{"jp":"あれ{以来|いらい}、あの{店|みせ}には{行|い}っていません。","zh":"从那以后，就没去过那家店。","src":"","say":"あれ以来、あの店には行っていません。"}],"tips":["一直持续到现在，不是已经结束的过去。"]},{"id":"15-1","lesson":15,"taskN":1,"task":"1 伝えてみよう","stTitle":"1 伝えてみよう","cat":"example","pattern":"〜といった","official":"〜といった","usage":"情報メディアを表すことば","usageR":"{情報|じょうほう}メディアを{表|あらわ}すことば","conn":"N＋といった＋N","zh":"…之类的…。举出若干例子，概括成一类。","pex":[],"ex":[{"jp":"{新聞|しんぶん}やテレビといったメディアを{使|つか}い{分|わ}けています。","zh":"我会区分使用报纸、电视这类媒体。","src":"","say":"新聞やテレビといったメディアを使い分けています。"},{"jp":"{名前|なまえ}や{住所|じゅうしょ}といった{個人|こじん}{情報|じょうほう}は{大切|たいせつ}です。","zh":"姓名、住址这类个人信息很重要。","src":"","say":"名前や住所といった個人情報は大切です。"}],"tips":["和「という」不同，这里暗示不止这一个。"]},{"id":"15-2","lesson":15,"taskN":1,"task":"1 伝えてみよう","stTitle":"1 伝えてみよう","cat":"scope","pattern":"〜を{通|とお}して／〜を{通|つう}じて","official":"〜を通して／〜を通じて","usage":"情報メディアを表すことば","usageR":"{情報|じょうほう}メディアを{表|あらわ}すことば","conn":"N＋を通して／を通じて","zh":"通过…（手段、媒体）。与第6课是同一句型。","pex":[],"ex":[{"jp":"インターネットを{通|とお}して、{世界|せかい}のニュースを{知|し}ります。","zh":"通过互联网了解世界的新闻。","src":"","say":"インターネットをとおして、世界のニュースを知ります。"},{"jp":"{友人|ゆうじん}を{通|つう}じて、その{記事|きじ}を{読|よ}みました。","zh":"经朋友读到了那篇报道。","src":"","say":"友人をつうじて、その記事を読みました。"}],"tips":["本课重点是信息经过哪种媒介。"]},{"id":"15-3","lesson":15,"taskN":2,"task":"2 見つけた!","stTitle":"2 見つけた!","cat":"scope","pattern":"〜に{関|かん}して／〜に{関|かん}する","official":"〜に関して／〜に関する","usage":"利用してみて気が付いた予想外のことを述べるときの表現","usageR":"{利用|りよう}してみて{気|き}が{付|つ}いた{予想|よそう}{外|がい}のことを{述|の}べるときの{表現|ひょうげん}","conn":"N＋に関して／に関する＋N","zh":"关于…。书面。","pex":[],"ex":[{"jp":"{個人|こじん}{情報|じょうほう}に{関|かん}して、{注意|ちゅうい}が{必要|ひつよう}です。","zh":"关于个人信息，需要注意。","src":"","say":"個人情報に関して、注意が必要です。"},{"jp":"{環境|かんきょう}に{関|かん}する{記事|きじ}を{読|よ}みました。","zh":"读了关于环境的报道。","src":"","say":"環境に関する記事を読みました。"}],"tips":["「について」更通用。「に{関|かん}して」在文章、新闻里常见。"]},{"id":"15-4","lesson":15,"taskN":2,"task":"2 見つけた!","stTitle":"2 見つけた!","cat":"reason","pattern":"〜ばかりに","official":"〜ばかりに","usage":"利用してみて気が付いた予想外のことを述べるときの表現","usageR":"{利用|りよう}してみて{気|き}が{付|つ}いた{予想|よそう}{外|がい}のことを{述|の}べるときの{表現|ひょうげん}","conn":"普通形＋ばかりに","zh":"就因为…（才导致不好的结果）。带后悔。","pex":[],"ex":[{"jp":"パスワードを{書|か}いたばかりに、{人|ひと}に{見|み}られてしまいました。","zh":"就因为写下了密码，被别人看见了。","src":"","say":"パスワードを書いたばかりに、ひとに見られてしまいました。"},{"jp":"{確認|かくにん}しなかったばかりに、{違|ちが}う{情報|じょうほう}を{信|しん}じてしまいました。","zh":"就因为没有确认，结果相信了错误的信息。","src":"","say":"確認しなかったばかりに、違う情報を信じてしまいました。"}],"tips":["原因常常是小事。「だけに」不一定是坏事。"]},{"id":"15-5","lesson":15,"taskN":2,"task":"2 見つけた!","stTitle":"2 見つけた!","cat":"time","pattern":"〜か〜ないかのうちに","official":"〜か〜ないかのうちに","usage":"利用してみて気が付いた予想外のことを述べるときの表現","usageR":"{利用|りよう}してみて{気|き}が{付|つ}いた{予想|よそう}{外|がい}のことを{述|の}べるときの{表現|ひょうげん}","conn":"Vる＋か＋Vない＋かのうちに","zh":"刚要…还没…的时候，就…。几乎同时，非常快。","pex":[],"ex":[{"jp":"{投稿|とうこう}するかしないかのうちに、{反応|はんのう}が{来|き}ました。","zh":"刚发还是没发的工夫，反应就来了。","src":"","say":"投稿するかしないかのうちに、反応が来ました。"},{"jp":"ボタンを{押|お}すか{押|お}さないかのうちに、{画面|がめん}が{変|か}わりました。","zh":"按钮按下去的瞬间，画面就变了。","src":"","say":"ボタンを押すか押さないかのうちに、画面が変わりました。"}],"tips":["同一个动词，肯定形和否定形连用。"]},{"id":"15-6","lesson":15,"taskN":2,"task":"2 見つけた!","stTitle":"2 見つけた!","cat":"ability","pattern":"〜ことだ","official":"〜ことだ","usage":"利用してみて気が付いた予想外のことを述べるときの表現","usageR":"{利用|りよう}してみて{気|き}が{付|つ}いた{予想|よそう}{外|がい}のことを{述|の}べるときの{表現|ひょうげん}","conn":"Vる／Vない＋ことだ","zh":"应该…；最好…。提出建议。","pex":[],"ex":[{"jp":"{分|わ}からない{言葉|ことば}は、すぐ{調|しら}べることです。","zh":"不懂的词应该马上查。","src":"","say":"分からない言葉は、すぐ調べることです。"},{"jp":"{個人|こじん}{情報|じょうほう}は、{安易|あんい}に{出|だ}さないことです。","zh":"个人信息不要随便发出去。","src":"","say":"個人情報は、安易に出さないことです。"}],"tips":["第5课句尾的「こと」是告示上的硬性指示。本课是劝告。"]},{"id":"15-7","lesson":15,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"emotion","pattern":"〜てしかたがない／〜てしょうがない","official":"〜てしかたがない／〜てしょうがない","usage":"マイナスのことが起こる可能性を心配するときによく使われることば・表現","usageR":"マイナスのことが{起|お}こる{可能|かのう}{性|せい}を{心配|しんぱい}するときによく{使|つか}われることば・{表現|ひょうげん}","conn":"Vて／Aくて＋しかたがない／しょうがない","zh":"…得不得了；忍不住…。","pex":[],"ex":[{"jp":"{自分|じぶん}の{情報|じょうほう}が{心配|しんぱい}でしかたがありません。","zh":"担心自己的信息，担心得不得了。","src":"","say":"自分の情報が心配でしかたがありません。"},{"jp":"{眠|ねむ}くてしょうがないので、{先|さき}に{休|やす}みます。","zh":"困得不行，我先休息了。","src":"","say":"眠くてしょうがないので、先に休みます。"}],"tips":["和「てたまらない」「てならない」接近。口语说「しょうがない」。"]},{"id":"15-8","lesson":15,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"cond","pattern":"〜としたら／〜とすれば／〜とすると","official":"〜としたら／〜とすれば／〜とすると","usage":"マイナスのことが起こる可能性を心配するときによく使われることば・表現","usageR":"マイナスのことが{起|お}こる{可能|かのう}{性|せい}を{心配|しんぱい}するときによく{使|つか}われることば・{表現|ひょうげん}","conn":"普通形＋としたら／とすれば／とすると","zh":"假如…的话。把某事当作条件来想。","pex":[],"ex":[{"jp":"その{情報|じょうほう}が{間違|まちが}いだとしたら、どうしますか。","zh":"假如那个信息是错的，你怎么办？","src":"","say":"その情報が間違いだとしたら、どうしますか。"},{"jp":"{今|いま}やめたとすると、ここまでの{努力|どりょく}がむだになります。","zh":"假如现在停下来，到目前为止的努力就白费了。","src":"","say":"今やめたとすると、ここまでの努力がむだになります。"}],"tips":["还没发生，或用来推想结果。"]},{"id":"15-9","lesson":15,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"guess","pattern":"〜かねない","official":"〜かねない","usage":"マイナスのことが起こる可能性を心配するときによく使われることば・表現","usageR":"マイナスのことが{起|お}こる{可能|かのう}{性|せい}を{心配|しんぱい}するときによく{使|つか}われることば・{表現|ひょうげん}","conn":"Vます词干＋かねない","zh":"很有可能…（不好的事）。","pex":[],"ex":[{"jp":"そんなパスワードでは、{情報|じょうほう}がもれかねません。","zh":"那样的密码，信息可能会泄露。","src":"","say":"そんなパスワードでは、情報がもれかねません。"},{"jp":"{確認|かくにん}しないと、{大|おお}きい{問題|もんだい}になりかねません。","zh":"不确认的话，可能会变成大问题。","src":"","say":"確認しないと、大きい問題になりかねません。"}],"tips":["「かねる」是“难以做到”。「かねない」是“有可能发生坏事”。"]},{"id":"15-10","lesson":15,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"scope","pattern":"〜{代|か}わりに","official":"〜代わりに","usage":"マイナスのことが起こる可能性を心配するときによく使われることば・表現","usageR":"マイナスのことが{起|お}こる{可能|かのう}{性|せい}を{心配|しんぱい}するときによく{使|つか}われることば・{表現|ひょうげん}","conn":"Vる／Nの＋代わりに","zh":"代替…；作为交换。","pex":[],"ex":[{"jp":"{新聞|しんぶん}の{代|か}わりに、ネットでニュースを{見|み}ています。","zh":"我不再看报纸，而是在网上看新闻。","src":"","say":"新聞の代わりに、ネットでニュースを見ています。"},{"jp":"{便利|べんり}な{代|か}わりに、{危険|きけん}もあります。","zh":"方便是方便，但也有危险。","src":"","say":"便利な代わりに、危険もあります。"}],"tips":["可以是代替，也可以是有得有失。"]},{"id":"15-11","lesson":15,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"cond","pattern":"〜てからでないと／〜てからでなければ","official":"〜てからでないと／〜てからでなければ","usage":"自分で判断できないことを伝える表現","usageR":"{自分|じぶん}で{判断|はんだん}できないことを{伝|つた}える{表現|ひょうげん}","conn":"Vて＋からでないと／からでなければ","zh":"如果不先…，就不能…。","pex":[],"ex":[{"jp":"{内容|ないよう}を{確認|かくにん}してからでないと、{答|こた}えられません。","zh":"不先确认内容，就无法回答。","src":"","say":"内容を確認してからでないと、答えられません。"},{"jp":"{本人|ほんにん}に{聞|き}いてからでなければ、{決|き}められません。","zh":"不问本人，就不能决定。","src":"","say":"本人に聞いてからでなければ、決められません。"}],"tips":["顺序是硬条件。"]},{"id":"15-12","lesson":15,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"ability","pattern":"〜わけにはいかない／〜わけにもいかない","official":"〜わけにはいかない／〜わけにもいかない","usage":"自分で判断できないことを伝える表現","usageR":"{自分|じぶん}で{判断|はんだん}できないことを{伝|つた}える{表現|ひょうげん}","conn":"Vる＋わけにはいかない／わけにもいかない","zh":"不能…（从道理、责任、人情上说不过去）。","pex":[],"ex":[{"jp":"{友達|ともだち}のお{願|ねが}いを{断|ことわ}るわけにはいきません。","zh":"不能拒绝朋友的请求。","src":"","say":"友達のお願いを断るわけにはいきません。"},{"jp":"まだ{確認|かくにん}していないので、{発表|はっぴょう}するわけにもいきません。","zh":"还没确认，所以也不能公布。","src":"","say":"まだ確認していないので、発表するわけにもいきません。"}],"tips":["不是没有能力。「できない」才是不会、不能够。"]},{"id":"16-1","lesson":16,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"emotion","pattern":"〜ものだ／〜もんだ","official":"〜ものだ／〜もんだ","usage":"中学、高校生活の思い出を話すときに使うことば・表現","usageR":"{中学|ちゅうがく}、{高校|こうこう}{生活|せいかつ}の{思|おも}い{出|で}を{話|はな}すときに{使|つか}うことば・{表現|ひょうげん}","conn":"Vた＋ものだ／もんだ","zh":"以前常常…啊。带着怀念。","pex":[],"ex":[{"jp":"{学生|がくせい}の{頃|ころ}は、{放課|ほうか}{後|ご}に{友達|ともだち}と{話|はな}したものです。","zh":"学生时代，放学后常常和朋友聊天。","src":"","say":"学生の頃は、放課ごに友達と話したものです。"},{"jp":"{子|こ}どもの{頃|ころ}は、よく{川|かわ}で{泳|およ}いだもんだ。","zh":"小时候经常在河里游泳。","src":"","say":"子どもの頃は、よく川で泳いだもんだ。"}],"tips":["第5课、第7课的「ものだ」是“按理应该”。本课是回忆。"]},{"id":"16-2","lesson":16,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"scope","pattern":"〜にかけては","official":"〜にかけては","usage":"中学、高校生活の思い出を話すときに使うことば・表現","usageR":"{中学|ちゅうがく}、{高校|こうこう}{生活|せいかつ}の{思|おも}い{出|で}を{話|はな}すときに{使|つか}うことば・{表現|ひょうげん}","conn":"N＋にかけては","zh":"论…的话（谁也比不上）。谈特长。","pex":[],"ex":[{"jp":"{数学|すうがく}にかけては、{彼|かれ}がクラスで{一番|いちばん}です。","zh":"论数学，他是班里第一。","src":"","say":"数学にかけては、彼がクラスで一番です。"},{"jp":"{料理|りょうり}にかけては、{母|はは}にかないません。","zh":"论做饭，我比不上母亲。","src":"","say":"料理にかけては、母にかないません。"}],"tips":["后面常是“最…”“谁也赢不了”。"]},{"id":"16-3","lesson":16,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"contrast","pattern":"〜はともかく（として）","official":"〜はともかく（として）","usage":"中学、高校生活の思い出を話すときに使うことば・表現","usageR":"{中学|ちゅうがく}、{高校|こうこう}{生活|せいかつ}の{思|おも}い{出|で}を{話|はな}すときに{使|つか}うことば・{表現|ひょうげん}","conn":"N＋はともかく（として）","zh":"…先不说，暂且不论。","pex":[],"ex":[{"jp":"{結果|けっか}はともかく、よくがんばりました。","zh":"结果先不说，已经很努力了。","src":"","say":"結果はともかく、よくがんばりました。"},{"jp":"{点数|てんすう}はともかくとして、{毎日|まいにち}{勉強|べんきょう}した{経験|けいけん}は{残|のこ}ります。","zh":"分数暂且不论，每天学习的经历会留下来。","src":"","say":"点数はともかくとして、毎日勉強した経験は残ります。"}],"tips":["把一件事先放下，转而说更重要的。"]},{"id":"16-4","lesson":16,"taskN":2,"task":"2 伝えてみよう","stTitle":"2 伝えてみよう","cat":"contrast","pattern":"〜ないことはない／〜ないこともない","official":"〜ないことはない／〜ないこともない","usage":"相手の考えを受け入れながら、自分の意見を述べるときの表現","usageR":"{相手|あいて}の{考|かんが}えを{受|う}け{入|い}れながら、{自分|じぶん}の{意見|いけん}を{述|の}べるときの{表現|ひょうげん}","conn":"Vない＋ことはない／こともない","zh":"并非不…；也不是不能…。双重否定，表示勉强可以、有一点。","pex":[],"ex":[{"jp":"{難|むずか}しくないことはありませんが、できます。","zh":"并不是不难，但做得到。","src":"","say":"難しくないことはありませんが、できます。"},{"jp":"{行|い}きたい{気持|きも}ちがないこともないです。","zh":"也不是完全不想去。","src":"","say":"行きたい気持ちがないこともないです。"}],"tips":["语气是部分肯定，不是强烈赞成。"]},{"id":"16-5","lesson":16,"taskN":2,"task":"2 伝えてみよう","stTitle":"2 伝えてみよう","cat":"example","pattern":"〜も〜ば〜も／〜も〜なら〜も","official":"〜も〜ば〜も／〜も〜なら〜も","usage":"相手の考えを受け入れながら、自分の意見を述べるときの表現","usageR":"{相手|あいて}の{考|かんが}えを{受|う}け{入|い}れながら、{自分|じぶん}の{意見|いけん}を{述|の}べるときの{表現|ひょうげん}","conn":"N＋も＋Vば、N＋も＋V；Nも～なら、Nも～","zh":"既…又…。两边并列。","pex":[],"ex":[{"jp":"{兄|あに}も{勉強|べんきょう}すれば、{弟|おとうと}も{勉強|べんきょう}します。","zh":"哥哥一学习，弟弟也学习。","src":"","say":"兄も勉強すれば、弟も勉強します。"},{"jp":"{時間|じかん}もないなら、お{金|かね}もありません。","zh":"既没有时间，也没有钱。","src":"","say":"時間もないなら、お金もありません。"}],"tips":["用ば形或なら。可以是好的，也可以是麻烦都堆在一起。"]},{"id":"16-6","lesson":16,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"time","pattern":"〜にわたって／〜にわたり／〜にわたる","official":"〜にわたって／〜にわたり／〜にわたる","usage":"受験の話題でよく使われることば／毎年取り上げられる話題を伝えるニュースや記事で使われる表現","usageR":"{受験|じゅけん}の{話題|わだい}でよく{使|つか}われることば／{毎年|まいとし}{取|と}り{上|あ}げられる{話題|わだい}を{伝|つた}えるニュースや{記事|きじ}で{使|つか}われる{表現|ひょうげん}","conn":"N＋にわたって／にわたり／にわたる＋N","zh":"历经…；涉及…范围。时间或空间的跨度。书面。","pex":[],"ex":[{"jp":"{三|さん}{時間|じかん}にわたって、{試験|しけん}が{行|おこな}われました。","zh":"考试进行了三个小时。","src":"","say":"三時間にわたって、試験が行われました。"},{"jp":"{五|ご}{年|ねん}にわたる{調査|ちょうさ}の{結果|けっか}です。","zh":"这是历经五年的调查结果。","src":"","say":"五年にわたる調査の結果です。"}],"tips":["「にわたる」后面接名词。"]},{"id":"16-7","lesson":16,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"ability","pattern":"〜きる／〜きれる／〜きれない","official":"〜きる／〜きれる／〜きれない","usage":"受験の話題でよく使われることば／毎年取り上げられる話題を伝えるニュースや記事で使われる表現","usageR":"{受験|じゅけん}の{話題|わだい}でよく{使|つか}われることば／{毎年|まいとし}{取|と}り{上|あ}げられる{話題|わだい}を{伝|つた}えるニュースや{記事|きじ}で{使|つか}われる{表現|ひょうげん}","conn":"Vます词干＋きる／きれる／きれない","zh":"完全做到／做得完／做不完。","pex":[],"ex":[{"jp":"{多|おお}いですが、{今日中|きょうじゅう}に{読|よ}み{切|き}ります。","zh":"虽然多，今天之内会读完。","src":"","say":"多いですが、きょうじゅうに読み切ります。"},{"jp":"この{問題|もんだい}は、{一人|ひとり}では{考|かんが}えきれません。","zh":"这个问题一个人想不完。","src":"","say":"この問題は、一人では考えきれません。"}],"tips":["「{切|き}りがない」是没完没了，稍有不同。"]},{"id":"16-8","lesson":16,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"contrast","pattern":"〜にもかかわらず","official":"〜にもかかわらず","usage":"受験の話題でよく使われることば／毎年取り上げられる話題を伝えるニュースや記事で使われる表現","usageR":"{受験|じゅけん}の{話題|わだい}でよく{使|つか}われることば／{毎年|まいとし}{取|と}り{上|あ}げられる{話題|わだい}を{伝|つた}えるニュースや{記事|きじ}で{使|つか}われる{表現|ひょうげん}","conn":"普通形／N＋にもかかわらず","zh":"尽管…却…。书面，转折较强。","pex":[],"ex":[{"jp":"{雨|あめ}にもかかわらず、{試合|しあい}は{行|おこな}われました。","zh":"尽管下雨，比赛还是举行了。","src":"","say":"雨にもかかわらず、試合は行われました。"},{"jp":"よく{勉強|べんきょう}したにもかかわらず、{結果|けっか}はよくありませんでした。","zh":"尽管好好学了，结果却不好。","src":"","say":"よく勉強したにもかかわらず、結果はよくありませんでした。"}],"tips":["比「のに」正式。"]},{"id":"16-9","lesson":16,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"scope","pattern":"〜からいうと／〜からいって／〜からいえば","official":"〜からいうと／〜からいって／〜からいえば","usage":"相手の気持ちを後押ししたいときの表現","usageR":"{相手|あいて}の{気持|きも}ちを{後押|あとお}ししたいときの{表現|ひょうげん}","conn":"N＋からいうと／からいって／からいえば","zh":"从…来说；就…而论。","pex":[],"ex":[{"jp":"{経験|けいけん}からいうと、{早|はや}く{始|はじ}めた{方|ほう}がいいです。","zh":"从经验来说， 面。","pex":[],"ex":[{"jp":"この{仕事|しごと}は{自由|じゆう}な{反面|はんめん}、{責任|せきにん}が{重|おも}いです。","zh":"这项工作很自由，另一方面责任很重。","src":"","say":"この仕事は自由な反面、責任が重いです。"},{"jp":"{給料|きゅうりょう}はいい{半面|はんめん}、{残業|ざんぎょう}が{多|おお}いです。","zh":"工资不错，但加班很多。","src":"","say":"給料はいい半面、残業が多いです。"}],"tips":["「{一方|いっぽう}で」可以是两个不同的事。「{反面|はんめん}」多是一件事的正反。"]},{"id":"17-8","lesson":17,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"talk","pattern":"〜というか","official":"〜というか","usage":"わかりやすくするために例を出して説明するときに使う表現","usageR":"わかりやすくするために{例|れい}を{出|だ}して{説明|せつめい}するときに{使|つか}う{表現|ひょうげん}","conn":"普通形／N＋というか","zh":"怎么说呢；与其说…。边想边修正说法。口语。","pex":[],"ex":[{"jp":"{忙|いそが}しいというか、{優先|ゆうせん}{順位|じゅんい}が{決|き}まっていないんです。","zh":"怎么说呢，是忙，其实是优先顺序还没定。","src":"","say":"忙しいというか、優先順位が決まっていないんです。"},{"jp":"{仕事|しごと}というか、これからの{生活|せいかつ}について{考|かんが}えています。","zh":"说是工作，其实是在想今后的生活。","src":"","say":"仕事というか、これからの生活について考えています。"}],"tips":["可以只是犹豫：「{忙|いそが}しいというか、{時間|じかん}がないんです」。"]},{"id":"17-9","lesson":17,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"reason","pattern":"〜{以上|いじょう}（は）／〜{上|うえ}は","official":"〜以上（は）／〜上は","usage":"わかりやすくするために例を出して説明するときに使う表現","usageR":"わかりやすくするために{例|れい}を{出|だ}して{説明|せつめい}するときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋以上（は）；Vた／Vる＋上は","zh":"既然…就…。","pex":[],"ex":[{"jp":"{引|ひ}き{受|う}けた{以上|いじょう}は、{最後|さいご}まで{責任|せきにん}を{持|も}ちます。","zh":"既然答应了，就会负责到底。","src":"","say":"引き受けた以上は、最後まで責任を持ちます。"},{"jp":"{学生|がくせい}である{上|うえ}は、{学|まな}ぶことを{第|だい}{一|いち}にしたいです。","zh":"既然是学生，就把学习放在第一位。","src":"","say":"学生であるうえは、学ぶことを第一にしたいです。"}],"tips":["和「からには」接近。「{以上|いじょう}」强调身份或已经处于某种状态。"]},{"id":"17-10","lesson":17,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"scope","pattern":"〜{限|かぎ}り／〜{限|かぎ}りの","official":"〜限り／〜限りの","usage":"わかりやすくするために例を出して説明するときに使う表現","usageR":"わかりやすくするために{例|れい}を{出|だ}して{説明|せつめい}するときに{使|つか}う{表現|ひょうげん}","conn":"Vる／Vている＋限り；限りの＋N","zh":"就…的范围来说；尽…的全部。","pex":[],"ex":[{"jp":"{私|わたし}が{知|し}っている{限|かぎ}り、その{会社|かいしゃ}は{人気|にんき}があります。","zh":"就我所知，那家公司很受欢迎。","src":"","say":"わたしが知っているかぎり、その会社は人気があります。"},{"jp":"{力|ちから}の{限|かぎ}り、がんばります。","zh":"我会尽全力努力。","src":"","say":"力のかぎり、がんばります。"}],"tips":["第7课「{限|かぎ}り」是“只要…就”。本课是范围、最大限度。"]},{"id":"17-11","lesson":17,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"request","pattern":"〜ていただけないでしょうか","official":"〜ていただけないでしょうか","usage":"丁寧な依頼のメールを知り合いに送るときに使う表現","usageR":"{丁寧|ていねい}な{依頼|いらい}のメールを{知|し}り{合|あ}いに{送|おく}るときに{使|つか}う{表現|ひょうげん}","conn":"Vて＋いただけないでしょうか","zh":"不知能否请您…。邮件里很礼貌的请求。","pex":[],"ex":[{"jp":"{履歴|りれき}{書|しょ}を{見|み}ていただけないでしょうか。","zh":"不知能否请您看一下简历。","src":"","say":"履歴書を見ていただけないでしょうか。"},{"jp":"{来週|らいしゅう}、お{時間|じかん}をいただけないでしょうか。","zh":"不知下周能否占用您一些时间。","src":"","say":"来週、お時間をいただけないでしょうか。"}],"tips":["比「ていただきたいんですが」更留有拒绝的余地。"]},{"id":"17-12","lesson":17,"taskN":4,"task":"4 こんなときどうする?","stTitle":"4 こんなときどうする?","cat":"keigo","pattern":"〜ところ（を）","official":"〜ところ（を）","usage":"丁寧な依頼のメールを知り合いに送るときに使う表現","usageR":"{丁寧|ていねい}な{依頼|いらい}のメールを{知|し}り{合|あ}いに{送|おく}るときに{使|つか}う{表現|ひょうげん}","conn":"Aい／Vる／お忙しい＋ところ（を）","zh":"在您…的时候（还来打扰）。多用于致歉、请求。","pex":[],"ex":[{"jp":"お{忙|いそが}しいところを、{申|もう}し{訳|わけ}ありません。","zh":"在您百忙之中打扰，非常抱歉。","src":"","say":"お忙しいところを、申し訳ありません。"},{"jp":"お{休|やす}みのところを、お{電話|でんわ}してしまいました。","zh":"在您休息的时候打电话来了。","src":"","say":"お休みのところを、お電話してしまいました。"}],"tips":["「お{忙|いそが}しいところをすみません」是固定说法。"]},{"id":"17-13","lesson":17,"taskN":5,"task":"5 こんなときどうする?","stTitle":"5 こんなときどうする?","cat":"request","pattern":"〜ていただけないかと{思|おも}って","official":"〜ていただけないかと思って","usage":"目上の人や初めての人に電話をかけるときに最初に言う表現","usageR":"{目上|めうえ}の{人|ひと}や{初|はじ}めての{人|ひと}に{電話|でんわ}をかけるときに{最初|さいしょ}に{言|い}う{表現|ひょうげん}","conn":"Vて＋いただけないかと思って","zh":"我想能不能请您…。打电话给长辈或初次见面的人时，用来开口。","pex":[],"ex":[{"jp":"{一|いち}{度|ど}お{会|あ}いいただけないかと{思|おも}い、お{電話|でんわ}しました。","zh":"我想能不能见您一面，所以打了电话。","src":"","say":"一度お会いいただけないかと思い、お電話しました。"},{"jp":"アドバイスをいただけないかと{思|おも}って、メールしました。","zh":"我想能不能请您给些建议，所以发了邮件。","src":"","say":"アドバイスをいただけないかと思って、メールしました。"}],"tips":["后面再约时间、说事由。不要用这个对很熟的朋友，会显得过远。"]},{"id":"18-1","lesson":18,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"contrast","pattern":"〜つつ（も）","official":"〜つつ（も）","usage":"身近な環境問題とその対策で使われることば・表現","usageR":"{身近|みぢか}な{環境|かんきょう}{問題|もんだい}とその{対策|たいさく}で{使|つか}われることば・{表現|ひょうげん}","conn":"Vます词干＋つつ（も）","zh":"虽然…但是…。书面。","pex":[],"ex":[{"jp":"よくないことと{知|し}りつつも、ごみを{分別|ぶんべつ}しない{人|ひと}がいます。","zh":"虽然知道不好，还是有人不做垃圾分类。","src":"","say":"よくないことと知りつつも、ごみを分別しないひとがいます。"},{"jp":"{減|へ}らさなければと{思|おも}いつつ、{電気|でんき}をつけたままにしています。","zh":"虽然觉得必须减少，却还是让灯开着。","src":"","say":"減らさなければと思いつつ、電気をつけたままにしています。"}],"tips":["第16课没有「も」的「つつ」多是“一边…一边…”。"]},{"id":"18-2","lesson":18,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"manner","pattern":"〜っぱなし","official":"〜っぱなし","usage":"身近な環境問題とその対策で使われることば・表現","usageR":"{身近|みぢか}な{環境|かんきょう}{問題|もんだい}とその{対策|たいさく}で{使|つか}われることば・{表現|ひょうげん}","conn":"Vます词干＋っぱなし","zh":"一直放着…；只做了前半就撂下。带“不收拾、不关闭”的负面感觉。","pex":[],"ex":[{"jp":"{窓|まど}を{開|あ}けっぱなしにしないでください。","zh":"请不要把窗户一直开着。","src":"","say":"窓をあけっぱなしにしないでください。"},{"jp":"{電気|でんき}をつけっぱなしで{出|で}かけてしまいました。","zh":"灯开着就出门了。","src":"","say":"電気をつけっぱなしで出かけてしまいました。"}],"tips":["「たまま」是状态。「っぱなし」更口语，批评的语气更强。"]},{"id":"18-3","lesson":18,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"manner","pattern":"〜ことなく","official":"〜ことなく","usage":"身近な環境問題とその対策で使われることば・表現","usageR":"{身近|みぢか}な{環境|かんきょう}{問題|もんだい}とその{対策|たいさく}で{使|つか}われることば・{表現|ひょうげん}","conn":"Vる＋ことなく","zh":"不…就…；没有…。书面的「ないで」。","pex":[],"ex":[{"jp":"{水|みず}をむだにすることなく、{使|つか}っています。","zh":"我们用不浪费水的方式在使用。","src":"","say":"水をむだにすることなく、使っています。"},{"jp":"{休|やす}むことなく、{回収|かいしゅう}は{続|つづ}けられました。","zh":"回收没有中断，一直继续着。","src":"","say":"休むことなく、回収は続けられました。"}],"tips":["后面是一直持续的状态或另一个动作。"]},{"id":"18-4","lesson":18,"taskN":1,"task":"1 耳でキャッチ","stTitle":"1 耳でキャッチ","cat":"example","pattern":"〜{上|うえ}（に）","official":"〜上（に）","usage":"身近な環境問題とその対策で使われることば・表現","usageR":"{身近|みぢか}な{環境|かんきょう}{問題|もんだい}とその{対策|たいさく}で{使|つか}われることば・{表現|ひょうげん}","conn":"普通形／N＋である＋上（に）","zh":"不仅…而且…。坏上加坏或好上加好。读「うえ」。","pex":[],"ex":[{"jp":"この{袋|ふくろ}は{大|おお}きい{上|うえ}に、{丈夫|じょうぶ}です。","zh":"这个袋子又大又结实。","src":"","say":"この袋は大きいうえに、丈夫です。"},{"jp":"{高|たか}い{上|うえ}に、すぐ{壊|こわ}れます。","zh":"又贵，而且还很容易坏。","src":"","say":"高いうえに、すぐ壊れます。"}],"tips":["和第1课、第17课的「{上|うえ}で」不同。这里是累加。"]},{"id":"18-5","lesson":18,"taskN":2,"task":"2 こんなときどうする?","stTitle":"2 こんなときどうする?","cat":"scope","pattern":"〜{向|む}き","official":"〜向き","usage":"物の形や特徴、状態を説明するときに使うことば・表現","usageR":"{物|もの}の{形|かたち}や{特徴|とくちょう}、{状態|じょうたい}を{説明|せつめい}するときに{使|つか}うことば・{表現|ひょうげん}","conn":"N＋向き","zh":"适合…的。从使用者是否合适来说。","pex":[],"ex":[{"jp":"この{机|つくえ}は{小|ちい}さい{部屋|へや}{向|む}きです。","zh":"这张桌子适合小房间。","src":"","say":"この机は小さい部屋向きです。"},{"jp":"{子|こ}ども{向|む}きの{説明|せつめい}も{付|つ}けてください。","zh":"请也附上适合孩子的说明。","src":"","say":"子ども向きの説明も付けてください。"}],"tips":["「{向|む}け」是面向某对象制作的。「{向|む}き」是适不适合。"]},{"id":"18-6","lesson":18,"taskN":2,"task":"2 こんなときどうする?","stTitle":"2 こんなときどうする?","cat":"ability","pattern":"〜（よ）うにも〜ない","official":"〜（よ）うにも〜ない","usage":"物の形や特徴、状態を説明するときに使うことば・表現","usageR":"{物|もの}の{形|かたち}や{特徴|とくちょう}、{状態|じょうたい}を{説明|せつめい}するときに{使|つか}うことば・{表現|ひょうげん}","conn":"V意向形＋にも＋Vない","zh":"想…也…不了。","pex":[],"ex":[{"jp":"{大|おお}きすぎて、{運|はこ}ぼうにも{運|はこ}べません。","zh":"太大了，想搬也搬不了。","src":"","say":"大きすぎて、運ぼうにも運べません。"},{"jp":"{説明|せつめい}がなくて、{直|なお}そうにも{直|なお}せません。","zh":"没有说明，想修也修不了。","src":"","say":"説明がなくて、直そうにも直せません。"}],"tips":["同一个动词：帰ろうにも帰れない。"]},{"id":"18-7","lesson":18,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"time","pattern":"〜にしたがって","official":"〜にしたがって","usage":"問題の原因と結果、またその後について述べるときに使われる表現／絶滅のおそれがある野生動物について紹介するときに使われることば・表現","usageR":"{問題|もんだい}の{原因|げんいん}と{結果|けっか}、またその{後|あと}について{述|の}べるときに{使|つか}われる{表現|ひょうげん}／{絶滅|ぜつめつ}のおそれがある{野生|やせい}{動物|どうぶつ}について{紹介|しょうかい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"Vる／N＋にしたがって","zh":"随着…；按照…。","pex":[],"ex":[{"jp":"{年|とし}を{取|と}るにしたがって、{自然|しぜん}の{大切|たいせつ}さが{分|わ}かります。","zh":"随着年龄增长，明白自然的珍贵。","src":"","say":"年を取るにしたがって、自然の大切さが分かります。"},{"jp":"ルールにしたがって、ごみを{出|だ}してください。","zh":"请按照规则扔垃圾。","src":"","say":"ルールにしたがって、ごみを出してください。"}],"tips":["变化时和「につれて」接近。规则、指示时用“按照”，这是「につれて」没有的。"]},{"id":"18-8","lesson":18,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"explain","pattern":"〜にほかならない","official":"〜にほかならない","usage":"問題の原因と結果、またその後について述べるときに使われる表現／絶滅のおそれがある野生動物について紹介するときに使われることば・表現","usageR":"{問題|もんだい}の{原因|げんいん}と{結果|けっか}、またその{後|あと}について{述|の}べるときに{使|つか}われる{表現|ひょうげん}／{絶滅|ぜつめつ}のおそれがある{野生|やせい}{動物|どうぶつ}について{紹介|しょうかい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"普通形／N＋にほかならない","zh":"无非是…；正是…。强烈断定原因或本质。书面。","pex":[],"ex":[{"jp":"この{問題|もんだい}は、{人間|にんげん}の{活動|かつどう}の{結果|けっか}にほかなりません。","zh":"这个问题无非是人类活动的结果。","src":"","say":"この問題は、人間の活動の結果にほかなりません。"},{"jp":"{続|つづ}いているのは、{地域|ちいき}の{努力|どりょく}があるからにほかなりません。","zh":"之所以持续，正是因为有当地的努力。","src":"","say":"続いているのは、地域の努力があるからにほかなりません。"}],"tips":["前面常用「から」「ため」。"]},{"id":"18-9","lesson":18,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"time","pattern":"〜あげく","official":"〜あげく","usage":"問題の原因と結果、またその後について述べるときに使われる表現／絶滅のおそれがある野生動物について紹介するときに使われることば・表現","usageR":"{問題|もんだい}の{原因|げんいん}と{結果|けっか}、またその{後|あと}について{述|の}べるときに{使|つか}われる{表現|ひょうげん}／{絶滅|ぜつめつ}のおそれがある{野生|やせい}{動物|どうぶつ}について{紹介|しょうかい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"Vた／Nの＋あげく","zh":"…了半天，最后却…。前面是长时间的过程，结果多不好。","pex":[],"ex":[{"jp":"{何|なん}{時間|じかん}も{話|はな}したあげく、{結論|けつろん}は{出|で}ませんでした。","zh":"谈了好几个小时，最后还是没有结论。","src":"","say":"なん時間も話したあげく、結論は出ませんでした。"},{"jp":"{悩|なや}んだあげく、その{活動|かつどう}をやめることにしました。","zh":"烦恼了很久，最后决定停止那个活动。","src":"","say":"悩んだあげく、その活動をやめることにしました。"}],"tips":["「{末|すえ}に」可以是中性或好的结果。「あげく」多是折腾之后的坏结果。"]},{"id":"18-10","lesson":18,"taskN":3,"task":"3 見つけた!","stTitle":"3 見つけた!","cat":"ability","pattern":"〜ようがない","official":"〜ようがない","usage":"問題の原因と結果、またその後について述べるときに使われる表現／絶滅のおそれがある野生動物について紹介するときに使われることば・表現","usageR":"{問題|もんだい}の{原因|げんいん}と{結果|けっか}、またその{後|あと}について{述|の}べるときに{使|つか}われる{表現|ひょうげん}／{絶滅|ぜつめつ}のおそれがある{野生|やせい}{動物|どうぶつ}について{紹介|しょうかい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"Vます词干＋ようがない","zh":"没有办法…。想做也找不到方法。","pex":[],"ex":[{"jp":"{住所|じゅうしょ}が{分|わ}からなくて、{連絡|れんらく}のしようがありません。","zh":"不知道地址，没法联系。","src":"","say":"住所が分からなくて、連絡のしようがありません。"},{"jp":"データがないので、{比|くら}べようがありません。","zh":"没有数据，无法比较。","src":"","say":"データがないので、比べようがありません。"}],"tips":["「{仕様|しよう}がない／しょうがない」是“没办法、受不了”，不是这个接续。"]},{"id":"18-11","lesson":18,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"guess","pattern":"〜わけがない","official":"〜わけがない","usage":"自然の大切さについて述べるときに使う表現","usageR":"{自然|しぜん}の{大切|たいせつ}さについて{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋わけがない","zh":"绝不可能…。从道理上否定。","pex":[],"ex":[{"jp":"{何|なに}もしないで、{環境|かんきょう}がよくなるわけがありません。","zh":"什么都不做，环境不可能变好。","src":"","say":"なにもしないで、環境がよくなるわけがありません。"},{"jp":"この{小|ちい}さい{箱|ばこ}に、{全部|ぜんぶ}{入|はい}るわけがない。","zh":"这么小的箱子，不可能全部装下。","src":"","say":"この小さい箱に、全部入るわけがない。"}],"tips":["比「はずがない」语气更强，更像“怎么可能”。"]},{"id":"18-12","lesson":18,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"emotion","pattern":"〜ことだろう／〜ことか","official":"〜ことだろう／〜ことか","usage":"自然の大切さについて述べるときに使う表現","usageR":"{自然|しぜん}の{大切|たいせつ}さについて{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋ことだろう／ことか","zh":"该有多么…啊。感叹程度之深。书面。","pex":[],"ex":[{"jp":"この{景色|けしき}を{守|まも}ることは、どんなに{大切|たいせつ}なことでしょう。","zh":"守护这片风景，是多么重要啊。","src":"","say":"この景色を守ることは、どんなに大切なことでしょう。"},{"jp":"どれほど{多|おお}くの{人|ひと}が{困|こま}っていることか。","zh":"有多少人正在为难啊。","src":"","say":"どれほど多くのひとが困っていることか。"}],"tips":["「どんなに」「どれほど」「{何|なん}{度|ど}」常一起出现。"]},{"id":"18-13","lesson":18,"taskN":4,"task":"4 伝えてみよう","stTitle":"4 伝えてみよう","cat":"guess","pattern":"〜に{違|ちが}いない","official":"〜に違いない","usage":"自然の大切さについて述べるときに使う表現","usageR":"{自然|しぜん}の{大切|たいせつ}さについて{述|の}べるときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋に違いない","zh":"一定是…。根据依据做出的判断，把握很大。","pex":[],"ex":[{"jp":"この{森|もり}は、{地域|ちいき}の{人|ひと}にとって{大切|たいせつ}に{違|ちが}いない。","zh":"这片森林对当地人一定很重要。","src":"","say":"この森は、地域のひとにとって大切に違いない。"},{"jp":"{彼|かれ}が{反対|はんたい}したのは、{理由|りゆう}があるに{違|ちが}いありません。","zh":"他反对，一定是有理由的。","src":"","say":"彼が反対したのは、理由があるに違いありません。"}],"tips":["比「はずだ」更肯定。新闻、文章里也用。"]},{"id":"19-1","lesson":19,"taskN":1,"task":"1 見つけた!","stTitle":"1 見つけた!","cat":"explain","pattern":"〜といえば／〜というと","official":"〜といえば／〜というと","usage":"専門的な内容を興味・関心を引くように解説するときに使われる表現","usageR":"{専門|せんもん}{的|てき}な{内容|ないよう}を{興味|きょうみ}・{関心|かんしん}を{引|ひ}くように{解説|かいせつ}するときに{使|つか}われる{表現|ひょうげん}","conn":"N＋といえば／というと","zh":"说到…。与第6课是同一句型，用来把话题引到大家会联想到的事。","pex":[],"ex":[{"jp":"ロボットといえば、{工場|こうじょう}を{思|おも}い{浮|う}かべます。","zh":"说到机器人，就会想到工厂。","src":"","say":"ロボットといえば、工場を思い浮かべます。"},{"jp":"{科学|かがく}というと{難|むずか}しく{感|かん}じますが、{生活|せいかつ}の{中|なか}にあります。","zh":"一说科学就觉得难，其实它就在生活里。","src":"","say":"科学というと難しく感じますが、生活のなかにあります。"}],"tips":["后面常是代表例，或反过来出人意料的解释。"]},{"id":"19-2","lesson":19,"taskN":2,"task":"2 伝えてみよう","stTitle":"2 伝えてみよう","cat":"ability","pattern":"〜べきだ／〜べきではない／〜べき","official":"〜べきだ／〜べきではない／〜べき","usage":"さまざまな立場や条件などを考えて、意見を言うときに使う表現","usageR":"さまざまな{立場|たちば}や{条件|じょうけん}などを{考|かんが}えて、{意見|いけん}を{言|い}うときに{使|つか}う{表現|ひょうげん}","conn":"Vる／Vない＋べきだ；べき＋N；べきではない","zh":"应该…／不应该…。从义务、道德上说。","pex":[],"ex":[{"jp":"{技術|ぎじゅつ}は{人|ひと}を{助|たす}けるために{使|つか}うべきです。","zh":"技术应该用来帮助人。","src":"","say":"技術はひとを助けるために使うべきです。"},{"jp":"{安全|あんぜん}を{無視|むし}すべきではありません。","zh":"不应该无视安全。","src":"","say":"安全を無視すべきではありません。"}],"tips":["「する」也可以说「するべき」，「すべき」更常见。"]},{"id":"19-3","lesson":19,"taskN":2,"task":"2 伝えてみよう","stTitle":"2 伝えてみよう","cat":"manner","pattern":"〜ほど〜はない","official":"〜ほど〜はない","usage":"さまざまな立場や条件などを考えて、意見を言うときに使う表現","usageR":"さまざまな{立場|たちば}や{条件|じょうけん}などを{考|かんが}えて、{意見|いけん}を{言|い}うときに{使|つか}う{表現|ひょうげん}","conn":"N＋ほど＋～はない","zh":"没有比…更…的了。","pex":[],"ex":[{"jp":"{健康|けんこう}ほど{大切|たいせつ}なものはない。","zh":"没有比健康更重要的了。","src":"","say":"健康ほど大切なものはない。"},{"jp":"{自分|じぶん}で{考|かんが}えることほど{大切|たいせつ}なことはありません。","zh":"没有比自己思考更重要的事了。","src":"","say":"自分で考えることほど大切なことはありません。"}],"tips":["「ほど」前面是比较的顶点。"]},{"id":"19-4","lesson":19,"taskN":2,"task":"2 伝えてみよう","stTitle":"2 伝えてみよう","cat":"ability","pattern":"〜（より）ほかない／〜（より）ほかしかたがない","official":"〜（より）ほかない／〜（より）ほかしかたがない","usage":"さまざまな立場や条件などを考えて、意見を言うときに使う表現","usageR":"さまざまな{立場|たちば}や{条件|じょうけん}などを{考|かんが}えて、{意見|いけん}を{言|い}うときに{使|つか}う{表現|ひょうげん}","conn":"Vる＋（より）ほかない／（より）ほかしかたがない","zh":"除此之外别无他法；只好…。","pex":[],"ex":[{"jp":"{今|いま}は{人|ひと}の{力|ちから}を{借|か}りるよりほかありません。","zh":"现在只好借助人的力量。","src":"","say":"今はひとの力を借りるよりほかありません。"},{"jp":"{壊|こわ}れたので、{新|あたら}しくするほかしかたがありません。","zh":"已经坏了，只好换新的。","src":"","say":"壊れたので、新しくするほかしかたがありません。"}],"tips":["和「しかない」意思接近，稍书面。"]},{"id":"19-5","lesson":19,"taskN":3,"task":"3 こんなときどうする?","stTitle":"3 こんなときどうする?","cat":"time","pattern":"〜（っ）きり／〜（っ）きりだ（そのまま）","official":"〜（っ）きり／〜（っ）きりだ（そのまま）","usage":"物が壊れた状況を説明するときに使う表現","usageR":"{物|もの}が{壊|こわ}れた{状況|じょうきょう}を{説明|せつめい}するときに{使|つか}う{表現|ひょうげん}","conn":"Vた＋（っ）きり／（っ）きりだ","zh":"…了之后，就一直那样。","pex":[],"ex":[{"jp":"{今朝|けさ}、{動|うご}かなくなったきりです。","zh":"今天早上不动了之后，就一直这样。","src":"","say":"今朝、動かなくなったきりです。"},{"jp":"{棚|たな}に{置|お}いたきり、もう{二|に}{年|ねん}{使|つか}っていません。","zh":"放到架子上之后，已经两年没用了。","src":"","say":"棚に置いたきり、もう二年使っていません。"}],"tips":["第17课的「きり」是“只有那一次／仅此”。本课是状态没有变回来。"]},{"id":"19-6","lesson":19,"taskN":3,"task":"3 こんなときどうする?","stTitle":"3 こんなときどうする?","cat":"time","pattern":"〜{最中|さいちゅう}に","official":"〜最中に","usage":"物が壊れた状況を説明するときに使う表現","usageR":"{物|もの}が{壊|こわ}れた{状況|じょうきょう}を{説明|せつめい}するときに{使|つか}う{表現|ひょうげん}","conn":"Vている／Nの＋最中に","zh":"正在…的当中。","pex":[],"ex":[{"jp":"{食事|しょくじ}の{最中|さいちゅう}に、{電気|でんき}が{消|き}えました。","zh":"正吃饭的时候，电停了。","src":"","say":"食事の最中に、電気が消えました。"},{"jp":"{使|つか}っている{最中|さいちゅう}に、{変|へん}な{音|おと}がし{始|はじ}めました。","zh":"正在使用的时候，开始发出奇怪的声音。","src":"","say":"使っている最中に、変な音がし始めました。"}],"tips":["强调正好在进行，这时被打断。比「{途中|とちゅう}」更“正中央”。"]},{"id":"19-7","lesson":19,"taskN":3,"task":"3 こんなときどうする?","stTitle":"3 こんなときどうする?","cat":"time","pattern":"〜かけだ／〜かけの／〜かける","official":"〜かけだ／〜かけの／〜かける","usage":"物が壊れた状況を説明するときに使う表現","usageR":"{物|もの}が{壊|こわ}れた{状況|じょうきょう}を{説明|せつめい}するときに{使|つか}う{表現|ひょうげん}","conn":"Vます词干＋かけだ／かけの＋N／かける","zh":"做到一半；刚开始…。","pex":[],"ex":[{"jp":"{書|か}きかけのメールが{残|のこ}っています。","zh":"还留着写到一半的邮件。","src":"","say":"書きかけのメールが残っています。"},{"jp":"{椅子|いす}が{壊|こわ}れかけていて、{危険|きけん}です。","zh":"椅子快要坏了，很危险。","src":"","say":"椅子が壊れかけていて、危険です。"}],"tips":["「{読|よ}みかけの{本|ほん}」是读到一半的书。「{死|し}にかける」是几乎要死，程度可以很重。"]},{"id":"19-8","lesson":19,"taskN":4,"task":"4 耳でキャッチ","stTitle":"4 耳でキャッチ","cat":"time","pattern":"〜に{伴|ともな}って／〜に{伴|ともな}い／〜に{伴|ともな}う","official":"〜に伴って／〜に伴い／〜に伴う","usage":"エネルギー問題について説明するときに使われることば・表現","usageR":"エネルギー{問題|もんだい}について{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"N／Vる＋に伴って／に伴い／に伴う＋N","zh":"随着…；伴随着…。书面。","pex":[],"ex":[{"jp":"{人口|じんこう}が{増|ふ}えるに{伴|ともな}って、{電気|でんき}の{使用|しよう}{量|りょう}も{増|ふ}えました。","zh":"随着人口增加，用电量也增加了。","src":"","say":"人口が増えるに伴って、電気の使用量も増えました。"},{"jp":"{発展|はってん}に{伴|ともな}う{問題|もんだい}を{考|かんが}える{必要|ひつよう}があります。","zh":"需要思考伴随发展而来的问题。","src":"","say":"発展に伴う問題を考える必要があります。"}],"tips":["「に{伴|ともな}う」后面接名词：増加に伴う問題。"]},{"id":"19-9","lesson":19,"taskN":4,"task":"4 耳でキャッチ","stTitle":"4 耳でキャッチ","cat":"ability","pattern":"〜ざるを{得|え}ない","official":"〜ざるを得ない","usage":"エネルギー問題について説明するときに使われることば・表現","usageR":"エネルギー{問題|もんだい}について{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"Vない形去掉ない＋ざるを得ない","zh":"不得不…。书面。","pex":[],"ex":[{"jp":"データがある{以上|いじょう}、{認|みと}めざるを{得|え}ません。","zh":"既然有数据，就不得不承认。","src":"","say":"データがある以上、認めざるをえません。"},{"jp":"{費用|ひよう}がかかるとしても、{変|か}えざるを{得|え}ません。","zh":"即使花钱，也不得不更换。","src":"","say":"費用がかかるとしても、変えざるをえません。"}],"tips":["「する」是「せざるを{得|え}ない」。"]},{"id":"19-10","lesson":19,"taskN":4,"task":"4 耳でキャッチ","stTitle":"4 耳でキャッチ","cat":"reason","pattern":"〜を{契機|けいき}に（して）／〜を{契機|けいき}として","official":"〜を契機に（して）／〜を契機として","usage":"エネルギー問題について説明するときに使われることば・表現","usageR":"エネルギー{問題|もんだい}について{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"N／Vた＋の＋を契機に（して）／を契機として","zh":"以…为契机。比「きっかけ」正式。","pex":[],"ex":[{"jp":"あの{事故|じこ}を{契機|けいき}に、ルールが{変|か}わりました。","zh":"以那次事故为契机，规则改变了。","src":"","say":"あの事故を契機に、ルールが変わりました。"},{"jp":"{新|あたら}しい{調査|ちょうさ}を{契機|けいき}として、{議論|ぎろん}が{始|はじ}まりました。","zh":"以新的调查为契机，讨论开始了。","src":"","say":"新しい調査を契機として、議論が始まりました。"}],"tips":["常用于政策、社会变化的转折点。"]},{"id":"19-11","lesson":19,"taskN":4,"task":"4 耳でキャッチ","stTitle":"4 耳でキャッチ","cat":"scope","pattern":"〜をめぐって／〜をめぐり／〜をめぐる","official":"〜をめぐって／〜をめぐり／〜をめぐる","usage":"エネルギー問題について説明するときに使われることば・表現","usageR":"エネルギー{問題|もんだい}について{説明|せつめい}するときに{使|つか}われることば・{表現|ひょうげん}","conn":"N＋をめぐって／をめぐり／をめぐる＋N","zh":"围绕…（进行讨论、产生问题）。","pex":[],"ex":[{"jp":"エネルギー{政策|せいさく}をめぐって、{意見|いけん}が{分|わ}かれています。","zh":"围绕能源政策，意见出现了分歧。","src":"","say":"エネルギー政策をめぐって、意見が分かれています。"},{"jp":"この{技術|ぎじゅつ}をめぐる{議論|ぎろん}は、まだ{終|お}わっていません。","zh":"围绕这项技术的讨论还没有结束。","src":"","say":"この技術をめぐる議論は、まだ終わっていません。"}],"tips":["前面多是有争议的主题。"]},{"id":"19-12","lesson":19,"taskN":5,"task":"5 見つけた!","stTitle":"5 見つけた!","cat":"scope","pattern":"〜{上|じょう}の／〜{上|じょう}","official":"〜上の／〜上","usage":"医療技術に関する記事などでよく使われることば","usageR":"{医療|いりょう}{技術|ぎじゅつ}に{関|かん}する{記事|きじ}などでよく{使|つか}われることば","conn":"N＋上／N＋上の＋N","zh":"从…上看；在…方面。读「じょう」。","pex":[],"ex":[{"jp":"{健康|けんこう}{上|じょう}の{理由|りゆう}で、その{治療|ちりょう}はできません。","zh":"由于健康方面的原因，不能做那种治疗。","src":"","say":"健康じょうの理由で、その治療はできません。"},{"jp":"データ{上|じょう}は、{問題|もんだい}がないように{見|み}えます。","zh":"从数据上看，好像没有问题。","src":"","say":"データじょうは、問題がないように見えます。"}],"tips":["法律上、健康上、教育上。不要和第1课的「うえ」混淆。"]},{"id":"20-1","lesson":20,"taskN":1,"task":"1 伝えてみよう","stTitle":"1 伝えてみよう","cat":"reason","pattern":"〜あっての〜","official":"〜あっての〜","usage":"大切だと思うものについて、優先順位を考えながら話すときに使う表現","usageR":"{大切|たいせつ}だと{思|おも}うものについて、{優先|ゆうせん}{順位|じゅんい}を{考|かんが}えながら{話|はな}すときに{使|つか}う{表現|ひょうげん}","conn":"N＋あっての＋N","zh":"有了…才有…。没有前项，后项就不能成立。","pex":[],"ex":[{"jp":"{健康|けんこう}あっての{仕事|しごと}です。","zh":"有健康才有工作。","src":"","say":"健康あっての仕事です。"},{"jp":"お{客|きゃく}{様|さま}あっての{店|みせ}ですから、まず{安全|あんぜん}です。","zh":"有顾客才有店，所以安全第一。","src":"","say":"お客様あっての店ですから、まず安全です。"}],"tips":["两个名词：あなたあっての私。"]},{"id":"20-2","lesson":20,"taskN":1,"task":"1 伝えてみよう","stTitle":"1 伝えてみよう","cat":"contrast","pattern":"〜にもまして","official":"〜にもまして","usage":"大切だと思うものについて、優先順位を考えながら話すときに使う表現","usageR":"{大切|たいせつ}だと{思|おも}うものについて、{優先|ゆうせん}{順位|じゅんい}を{考|かんが}えながら{話|はな}すときに{使|つか}う{表現|ひょうげん}","conn":"N＋にもまして","zh":"比…更加。","pex":[],"ex":[{"jp":"{以前|いぜん}にもまして、{家族|かぞく}の{時間|じかん}を{大切|たいせつ}にしています。","zh":"比以前更加珍惜和家人在一起的时间。","src":"","say":"以前にもまして、家族の時間を大切にしています。"},{"jp":"{何|なに}にもまして、{健康|けんこう}が{一番|いちばん}です。","zh":"比什么都重要的是健康。","src":"","say":"なににもまして、健康が一番です。"}],"tips":["前面是比较的基准，常是“以前”“其他”。"]},{"id":"20-3","lesson":20,"taskN":1,"task":"1 伝えてみよう","stTitle":"1 伝えてみよう","cat":"emotion","pattern":"〜にこしたことはない","official":"〜にこしたことはない","usage":"大切だと思うものについて、優先順位を考えながら話すときに使う表現","usageR":"{大切|たいせつ}だと{思|おも}うものについて、{優先|ゆうせん}{順位|じゅんい}を{考|かんが}えながら{話|はな}すときに{使|つか}う{表現|ひょうげん}","conn":"Vる／Vない／Aい＋にこしたことはない","zh":"最好不过…；没有比…更好。做了也没有坏处。","pex":[],"ex":[{"jp":"{準備|じゅんび}は{早|はや}いのにこしたことはありません。","zh":"准备得早是最好不过的。","src":"","say":"準備は早いのにこしたことはありません。"},{"jp":"お{金|かね}もあるのにこしたことはないですが、{一番|いちばん}ではありません。","zh":"有钱最好不过，但那不是最重要的。","src":"","say":"お金もあるのにこしたことはないですが、一番ではありません。"}],"tips":["常用于“虽然不是必须，但做了更好”。"]},{"id":"20-4","lesson":20,"taskN":1,"task":"1 伝えてみよう","stTitle":"1 伝えてみよう","cat":"explain","pattern":"〜というものではない／〜というものでもない","official":"〜というものではない／〜というものでもない","usage":"大切だと思うものについて、優先順位を考えながら話すときに使う表現","usageR":"{大切|たいせつ}だと{思|おも}うものについて、{優先|ゆうせん}{順位|じゅんい}を{考|かんが}えながら{話|はな}すときに{使|つか}う{表現|ひょうげん}","conn":"普通形＋というものではない／というものでもない","zh":"并不是说…就行；并非…。否定“只要这样就够了”的简单想法。","pex":[],"ex":[{"jp":"{高|たか}ければ{幸|しあわ}せというものではありません。","zh":"并不是贵就会幸福。","src":"","say":"高ければ幸せというものではありません。"},{"jp":"{速|はや}ければいいというものでもないです。","zh":"并不是快就好。","src":"","say":"速ければいいというものでもないです。"}],"tips":["和「わけではない」接近，但更针对一种普遍说法。"]},{"id":"20-5","lesson":20,"taskN":2,"task":"2 見つけた!","stTitle":"2 見つけた!","cat":"explain","pattern":"〜に{基|もと}づいて／〜に{基|もと}づく／〜に{基|もと}づいた","official":"〜に基づいて／〜に基づく／〜に基づいた","usage":"国や地域の幸せについて述べるときに使われることば","usageR":"{国|くに}や{地域|ちいき}の{幸|しあわ}せについて{述|の}べるときに{使|つか}われることば","conn":"N＋に基づいて／に基づく／に基づいた＋N","zh":"基于…。根据数据、法律、事实。","pex":[],"ex":[{"jp":"{調査|ちょうさ}に{基|もと}づいて、{順位|じゅんい}を{考|かんが}えました。","zh":"基于调查思考了优先顺序。","src":"","say":"調査に基づいて、順位を考えました。"},{"jp":"{事実|じじつ}に{基|もと}づいた{記事|きじ}を{読|よ}んでください。","zh":"请读基于事实的报道。","src":"","say":"事実に基づいた記事を読んでください。"}],"tips":["比「をもとに」更正式，强调依据。"]},{"id":"20-6","lesson":20,"taskN":2,"task":"2 見つけた!","stTitle":"2 見つけた!","cat":"manner","pattern":"〜あまり（に）／あまりの〜に","official":"〜あまり（に）／あまりの〜に","usage":"国や地域の幸せについて述べるときに使われることば","usageR":"{国|くに}や{地域|ちいき}の{幸|しあわ}せについて{述|の}べるときに{使|つか}われることば","conn":"Vる／Aい＋あまり（に）；あまりの＋N＋に","zh":"由于过于…，结果…。程度过度，结果常常失控或负面。","pex":[],"ex":[{"jp":"{喜|よろこ}びのあまり、{言葉|ことば}が{出|で}ませんでした。","zh":"由于过于高兴，说不出话来。","src":"","say":"喜びのあまり、言葉が出ませんでした。"},{"jp":"あまりの{驚|おどろ}きに、{何|なに}もできませんでした。","zh":"因为太吃惊，什么都做不了。","src":"","say":"あまりの驚きに、なにもできませんでした。"}],"tips":["「あまりの」后面接名词：あまりの驚きに。"]},{"id":"20-7","lesson":20,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"guess","pattern":"〜まい","official":"〜まい","usage":"会社の経営理念について話すときに使われることば・表現","usageR":"{会社|かいしゃ}の{経営|けいえい}{理念|りねん}について{話|はな}すときに{使|つか}われることば・{表現|ひょうげん}","conn":"Vる／Ⅰ类ない形去掉ない＋まい；する→するまい／すまい","zh":"不会…吧；不想…。否定的推测，或否定的意志。书面、稍老。","pex":[],"ex":[{"jp":"{同|おな}じ{失敗|しっぱい}はするまいと{決|き}めました。","zh":"我决定不再犯同样的失败。","src":"","say":"同じ失敗はするまいと決めました。"},{"jp":"この{方針|ほうしん}は、{簡単|かんたん}には{変|か}わらないだろうし、{変|か}わるまい。","zh":"这个方针大概不会轻易改变，也不会变吧。","src":"","say":"この方針は、簡単には変わらないだろうし、変わるまい。"}],"tips":["意志：「もう{遅|おく}れるまい」。推测：「{彼|かれ}は{来|き}まい」。Ⅱ类用辞书形＋まい。"]},{"id":"20-8","lesson":20,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"contrast","pattern":"〜てでも","official":"〜てでも","usage":"会社の経営理念について話すときに使われることば・表現","usageR":"{会社|かいしゃ}の{経営|けいえい}{理念|りねん}について{話|はな}すときに{使|つか}われることば・{表現|ひょうげん}","conn":"Vて＋でも","zh":"哪怕…也要。不惜做某事。","pex":[],"ex":[{"jp":"{夜|よる}を{通|とお}してでも、この{仕事|しごと}を{終|お}わらせます。","zh":"哪怕通宵，也要把这项工作做完。","src":"","say":"夜をとおしてでも、この仕事を終わらせます。"},{"jp":"{頭|あたま}を{下|さ}げてでも、お{願|ねが}いするつもりです。","zh":"哪怕低头鞠躬，也打算去请求。","src":"","say":"頭をさげてでも、お願いするつもりです。"}],"tips":["后面是强烈的意志。"]},{"id":"20-9","lesson":20,"taskN":3,"task":"3 耳でキャッチ","stTitle":"3 耳でキャッチ","cat":"time","pattern":"〜{末|まつ}（に）／〜{末|まつ}の","official":"〜末（に）／〜末の","usage":"会社の経営理念について話すときに使われることば・表現","usageR":"{会社|かいしゃ}の{経営|けいえい}{理念|りねん}について{話|はな}すときに{使|つか}われることば・{表現|ひょうげん}","conn":"Vた／Nの＋末（に）；末の＋N","zh":"经过长时间之后，终于…。","pex":[],"ex":[{"jp":"{三|さん}{年|ねん}{考|かんが}えた{末|すえ}に、この{仕事|しごと}を{選|えら}びました。","zh":"想了三年，最终选了这份工作。","src":"","say":"三年考えた末に、この仕事を選びました。"},{"jp":"{議論|ぎろん}の{末|すえ}の{決定|けってい}です。","zh":"这是讨论到最后的决定。","src":"","say":"議論の末の決定です。"}],"tips":["可以是好结果。「あげく」更偏向折腾后的坏结果。"]},{"id":"20-10","lesson":20,"taskN":4,"task":"4 見つけた!","stTitle":"4 見つけた!","cat":"manner","pattern":"〜てまで／〜までして","official":"〜てまで／〜までして","usage":"決意したときの状況や思いを伝えるときの表現","usageR":"{決意|けつい}したときの{状況|じょうきょう}や{思|おも}いを{伝|つた}えるときの{表現|ひょうげん}","conn":"Vて＋まで；N＋までして","zh":"甚至做到…的地步。说话人觉得过分，或强调决心之强。","pex":[],"ex":[{"jp":"{体|からだ}を{壊|こわ}してまで、{働|はたら}く{必要|ひつよう}はありません。","zh":"没必要拼命到把身体搞坏还要工作。","src":"","say":"体を壊してまで、働く必要はありません。"},{"jp":"{夜行|やこう}バスまでして、その{会|かい}に{参加|さんか}しました。","zh":"甚至坐了夜班大巴，去参加了那个会。","src":"","say":"夜行バスまでして、その会に参加しました。"}],"tips":["带评价：不必做到这个地步，或居然做到这个地步。"]},{"id":"20-11","lesson":20,"taskN":4,"task":"4 見つけた!","stTitle":"4 見つけた!","cat":"scope","pattern":"〜のもと（で）／〜のもとに","official":"〜のもと（で）／〜のもとに","usage":"決意したときの状況や思いを伝えるときの表現","usageR":"{決意|けつい}したときの{状況|じょうきょう}や{思|おも}いを{伝|つた}えるときの{表現|ひょうげん}","conn":"N＋のもと（で）／のもとに","zh":"在…之下（指导、条件、名义）。","pex":[],"ex":[{"jp":"{経験|けいけん}のある{人|ひと}のもとで、{仕事|しごと}を{覚|おぼ}えました。","zh":"在有经验的人手下学会了工作。","src":"","say":"経験のあるひとのもとで、仕事を覚えました。"},{"jp":"{同|おな}じ{目標|もくひょう}のもとに、{活動|かつどう}しています。","zh":"在同一个目标之下开展活动。","src":"","say":"同じ目標のもとに、活動しています。"}],"tips":["人的指导用「のもとで」。条件、名目用「のもとに」。"]},{"id":"20-12","lesson":20,"taskN":5,"task":"5 こんなときどうする?","stTitle":"5 こんなときどうする?","cat":"request","pattern":"〜ないものでしょうか","official":"〜ないものでしょうか","usage":"希望を伝えて予約するときに使う表現","usageR":"{希望|きぼう}を{伝|つた}えて{予約|よやく}するときに{使|つか}う{表現|ひょうげん}","conn":"Vない＋ものでしょうか","zh":"能不能…呢。很礼貌地表达愿望，希望出现某种可能。","pex":[],"ex":[{"jp":"{人数|にんずう}を{増|ふ}やしていただくことはできないものでしょうか。","zh":"人数能不能再增加一些呢。","src":"","say":"人数を増やしていただくことはできないものでしょうか。"},{"jp":"{開始|かいし}{時間|じかん}を{少|すこ}し{遅|おそ}くすることはできないものでしょうか。","zh":"开始时间能不能稍微推迟一些呢。","src":"","say":"開始時間を少し遅くすることはできないものでしょうか。"}],"tips":["不是普通疑问。用于预约、请求变更时，给对方留余地。"]}],"compare":[{"title":"推测：应该、不可能、一定","icon":"🔮","rows":[{"pattern":"〜でしょう／〜だろう","card":"1-7","point":"大概。天气预报式的推测，把握不一定很高","jp":"{明日|あした}は{雨|あめ}でしょう。","zh":"明天大概下雨。","src":"","say":"あしたは雨でしょう。"},{"pattern":"〜はずだ","card":"2-12","point":"按理说应该。有依据","jp":"{予約|よやく}したので、{席|せき}があるはずです。","zh":"预约了，所以应该有座位。","src":"","say":"予約したので、席があるはずです。"},{"pattern":"〜はずがない","card":"3-1","point":"按理说不可能","jp":"{一日|いちにち}で{全部|ぜんぶ}{終|お}わるはずがありません。","zh":"不可能一天全部做完。","src":"","say":"いちにちで全部終わるはずがありません。"},{"pattern":"〜にきまっている","card":"8-8","point":"口语，很有把握，有时武断","jp":"{夜更|よふ}かしすれば、{朝|あさ}は{眠|ねむ}いにきまっている。","zh":"熬夜的话早上肯定困。","src":"","say":"夜更かしすれば、朝は眠いにきまっている。"},{"pattern":"〜わけがない","card":"18-11","point":"怎么可能。语气强","jp":"{何|なに}もしないで、よくなるわけがない。","zh":"什么都不做，不可能变好。","src":"","say":"なにもしないで、よくなるわけがない。"},{"pattern":"〜に{違|ちが}いない","card":"18-13","point":"一定是。根据迹象判断","jp":"{理由|りゆう}があるに{違|ちが}いない。","zh":"一定是有理由的。","src":"","say":"理由があるに違いない。"},{"pattern":"〜まい","card":"20-7","point":"书面：不会…吧／我不想…","jp":"{同|おな}じ{失敗|しっぱい}はするまい。","zh":"不想再犯同样的失败。","src":"","say":"同じ失敗はするまい。"},{"pattern":"〜かねない","card":"15-9","point":"有可能发生不好的事","jp":"{問題|もんだい}になりかねません。","zh":"有可能变成问题。","src":"","say":"問題になりかねません。"}],"point":"有依据用「はず」；不可能用「はずがない／わけがない」；很有把握用「に{違|ちが}いない／にきまっている」；不好的可能用「かねない／おそれがある」。"},{"title":"原因：托福、怪罪、契机、就因为","icon":"💡","rows":[{"pattern":"〜がきっかけで","card":"1-10","point":"某件事成了开始的契机，可好可坏","jp":"アニメがきっかけで{日本語|にほんご}を{始|はじ}めました。","zh":"以动漫为契机开始学日语。","src":"","say":"アニメがきっかけで日本語を始めました。"},{"pattern":"〜おかげで／〜おかげだ","card":"8-5","point":"好的结果，感谢","jp":"{先生|せんせい}のおかげで、{受|う}かりました。","zh":"托老师的福，通过了。","src":"","say":"先生のおかげで、受かりました。"},{"pattern":"〜せいで／〜せいか／〜せいだ","card":"8-7","point":"不好的结果","jp":"{寝不足|ねぶそく}のせいで、{頭|あたま}が{痛|いた}いです。","zh":"因为没睡够，头疼。","src":"","say":"ねぶそくのせいで、頭が痛いです。"},{"pattern":"〜ものですから／〜ものだから／〜もので","card":"8-3","point":"个人理由，希望对方理解","jp":"{初|はじ}めてのものですから、{分|わ}かりません。","zh":"因为是第一次，所以不明白。","src":"","say":"初めてのものですから、分かりません。"},{"pattern":"〜ことから","card":"6-13","point":"书面：从某事实得出名称或结论","jp":"{桜|さくら}が{多|おお}いことから、この{名前|なまえ}がつきました。","zh":"因为樱花多，所以有了这个名字。","src":"","say":"桜が多いことから、この名前がつきました。"},{"pattern":"〜ばかりに","card":"15-4","point":"就因为这点，导致不好的结果，常后悔","jp":"{確認|かくにん}しなかったばかりに、{間違|まちが}えた。","zh":"就因为没确认，才搞错了。","src":"","say":"確認しなかったばかりに、間違えた。"},{"pattern":"〜あげく","card":"18-9","point":"折腾了很久，最后结果不好","jp":"{悩|なや}んだあげく、やめることにした。","zh":"烦恼了很久，最后决定放弃。","src":"","say":"悩んだあげく、やめることにした。"}],"point":"好结果用「おかげで」，坏结果用「せいで／ばかりに／あげく」。「きっかけ／{契機|けいき}」是转折点，不一定是责怪。"},{"title":"时候：趁着、正在、刚一…就","icon":"⏱️","rows":[{"pattern":"〜うちに","card":"2-3","point":"趁还没变化","jp":"{熱|あつ}いうちに{食|た}べてください。","zh":"请趁热吃。","src":"","say":"熱いうちに食べてください。"},{"pattern":"〜{途中|とちゅう}（で）／〜{途中|とちゅう}（に）","card":"4-11","point":"做到一半、路途中","jp":"{映画|えいが}の{途中|とちゅう}で{電話|でんわ}が{鳴|な}った。","zh":"电影放到一半电话响了。","src":"","say":"映画の途中で電話が鳴った。"},{"pattern":"〜{最中|さいちゅう}に","card":"19-6","point":"正好在做的正中间","jp":"{食事|しょくじ}の{最中|さいちゅう}に{電気|でんき}が{消|き}えた。","zh":"正吃饭的时候停电了。","src":"","say":"食事の最中に電気が消えた。"},{"pattern":"～たとたん（に）","card":"14-11","point":"瞬间就发生了意外的变化","jp":"{開|あ}けたとたん、{猫|ねこ}が{出|で}てきた。","zh":"一打开，猫就出来了。","src":"","say":"あけたとたん、猫が出てきた。"},{"pattern":"〜（か）と{思|おも}うと／〜（か）と{思|おも}ったら","card":"14-2","point":"刚觉得…，情况马上变了","jp":"{晴|は}れたかと{思|おも}うと、{雨|あめ}が{降|ふ}った。","zh":"刚觉得放晴，就下雨了。","src":"","say":"晴れたかと思うと、雨が降った。"},{"pattern":"〜か〜ないかのうちに","card":"15-5","point":"几乎同时，快到分不清先后","jp":"{押|お}すか{押|お}さないかのうちに{変|か}わった。","zh":"一按下去就变了。","src":"","say":"押すか押さないかのうちに変わった。"},{"pattern":"〜につれて","card":"5-7","point":"两边都在变化","jp":"{夜|よる}になるにつれて、{寒|さむ}くなった。","zh":"随着入夜变冷了。","src":"","say":"夜になるにつれて、寒くなった。"}],"point":"趁变化之前用「うちに」；正进行用「{最中|さいちゅう}に／{途中|とちゅう}で」；瞬间变化用「たとたん／かと{思|おも}うと」，后项不要用意志或命令。"},{"title":"によって：不同、原因、方式","icon":"🎯","rows":[{"pattern":"〜によって（さまざまだ）","card":"2-2","point":"因…而不同","jp":"{味|あじ}は{店|みせ}によってさまざまです。","zh":"味道因店而异。","src":"","say":"味は店によってさまざまです。"},{"pattern":"〜によって／〜により／〜による（{原因|げんいん}）","card":"5-1","point":"由于（新闻里的原因）","jp":"{台風|たいふう}によって{電車|でんしゃ}が{止|と}まった。","zh":"由于台风，电车停了。","src":"","say":"台風によって電車が止まった。"},{"pattern":"〜によって／〜により／〜による","card":"13-8","point":"通过某种方式；也表示取决于","jp":"ネットによってすぐ{広|ひろ}まった。","zh":"通过网络马上传开了。","src":"","say":"ネットによってすぐ広まった。"},{"pattern":"〜によっては","card":"14-5","point":"有的情况下会（不是全部）","jp":"{店|みせ}によっては{当日|とうじつ}でも{買|か}える。","zh":"有的店当天也能买。","src":"","say":"店によっては当日でも買える。"}],"point":"看后面的词：さまざま／違う＝因人而异；被害／中止＝原因；広まる＝方式。「によっては」强调“有的场合”。"},{"title":"限：仅限、最好、只要、未必","icon":"📌","rows":[{"pattern":"〜に{限|かぎ}り","card":"2-7","point":"仅限。广告","jp":"{本日|ほんじつ}に{限|かぎ}り、{半額|はんがく}です。","zh":"仅限今天半价。","src":"","say":"本日にかぎり、半額です。"},{"pattern":"〜に{限|かぎ}る","card":"6-9","point":"最好是…","jp":"{早|はや}く{寝|ね}るに{限|かぎ}ります。","zh":"最好早点睡。","src":"","say":"早く寝るにかぎります。"},{"pattern":"〜に{限|かぎ}らず","card":"14-9","point":"不限于","jp":"{日本|にほん}に{限|かぎ}らず、{他|ほか}の{国|くに}にもある。","zh":"不限于日本，其他国家也有。","src":"","say":"にほんにかぎらず、ほかの国にもある。"},{"pattern":"〜{限|かぎ}り／〜{限|かぎ}りは","card":"7-4","point":"只要这个条件还在","jp":"{健康|けんこう}である{限|かぎ}り、{続|つづ}けたい。","zh":"只要健康就想继续。","src":"","say":"健康であるかぎり、続けたい。"},{"pattern":"〜{限|かぎ}り／〜{限|かぎ}りの","card":"17-10","point":"就…的范围而言","jp":"{知|し}っている{限|かぎ}り、{問題|もんだい}はない。","zh":"就我所知，没有问题。","src":"","say":"知っているかぎり、問題はない。"},{"pattern":"〜とは{限|かぎ}らない","card":"12-12","point":"未必总是","jp":"{高|たか}いものがいいとは{限|かぎ}らない。","zh":"贵的未必就好。","src":"","say":"高いものがいいとはかぎらない。"}],"point":"「に{限|かぎ}り」只限这个；「に{限|かぎ}る」是推荐；「に{限|かぎ}らず」是超出这个；「とは{限|かぎ}らない」否定绝对化。两个「{限|かぎ}り」：第7课是条件，第17课是范围。"},{"title":"上：之后、而且、在…方面","icon":"📰","rows":[{"pattern":"〜{上|うえ}（で）","card":"1-2","point":"在此基础上；通知里的「{予約|よやく}の{上|うえ}」。读うえ","jp":"{確認|かくにん}した{上|うえ}で{申|もう}し{込|こ}む。","zh":"确认之后再报名。","src":"","say":"確認したうえで申し込む。"},{"pattern":"〜{上|うえ}で","card":"17-6","point":"做完再进入下一步。读うえ","jp":"{理解|りかい}した{上|うえ}で{応募|おうぼ}する。","zh":"理解之后再申请。","src":"","say":"理解したうえで応募する。"},{"pattern":"〜{上|うえ}（に）","card":"18-4","point":"而且，好上加好或坏上加坏。读うえ","jp":"{大|おお}きい{上|うえ}に{丈夫|じょうぶ}だ。","zh":"又大又结实。","src":"","say":"大きいうえに丈夫だ。"},{"pattern":"〜{上|じょう}の／〜{上|じょう}","card":"19-12","point":"从…方面看。读じょう","jp":"{健康|けんこう}{上|じょう}の{理由|りゆう}で{休|やす}む。","zh":"因健康方面的原因休息。","src":"","say":"健康じょうの理由で休む。"}],"point":"前面三句都读「うえ」。只有「{法律|ほうりつ}{上|じょう}・{健康|けんこう}{上|じょう}・データ{上|じょう}」读「じょう」。"},{"title":"もの・わけ","icon":"📖","rows":[{"pattern":"〜ものだ／〜ものではない（{当然|とうぜん}）","card":"5-8","point":"按常理就该／不该","jp":"{約束|やくそく}は{守|まも}るものだ。","zh":"约定就该遵守。","src":"","say":"約束は守るものだ。"},{"pattern":"〜ものだ／〜もんだ","card":"16-1","point":"以前常常，带着怀念","jp":"{学生|がくせい}の{頃|ころ}は、{放課|ほうか}{後|ご}によく{話|はな}したものだ。","zh":"学生时代放学后常常聊天。","src":"","say":"学生の頃は、放課ごによく話したものだ。"},{"pattern":"〜というものだ","card":"12-11","point":"这才叫…","jp":"{困|こま}ったときに{助|たす}けるのが{友達|ともだち}というものだ。","zh":"困难时帮忙，这才是朋友。","src":"","say":"困ったときに助けるのが友達というものだ。"},{"pattern":"〜にすぎない","card":"17-3","point":"只不过是","jp":"{一|ひと}つの{意見|いけん}にすぎない。","zh":"只不过是一种意见。","src":"","say":"一つの意見にすぎない。"},{"pattern":"〜というわけだ／〜わけだ","card":"9-7","point":"所以就是这个意思","jp":"{昼|ひる}に{寝|ね}るわけですね。","zh":"所以就是白天睡觉啊。","src":"","say":"昼に寝るわけですね。"},{"pattern":"〜わけではない／〜というわけではない","card":"9-13","point":"并不是（部分否定）","jp":"{嫌|きら}いなわけではない。","zh":"并不是讨厌。","src":"","say":"嫌いなわけではない。"},{"pattern":"〜わけがない","card":"18-11","point":"绝不可能","jp":"{入|はい}るわけがない。","zh":"不可能装得下。","src":"","say":"入るわけがない。"},{"pattern":"〜わけにはいかない／〜わけにもいかない","card":"15-12","point":"从情理上不能做","jp":"{断|ことわ}るわけにはいかない。","zh":"不能拒绝。","src":"","say":"断るわけにはいかない。"}],"point":"「ものだ」看时态：辞书形多是“理当”，た形多是“以前常”。「わけ」一族：结论、部分否定、绝不可能、情理上不能，不要互换。"},{"title":"请求：让谁做","icon":"🙏","rows":[{"pattern":"〜てほしい／〜てもらいたい","card":"1-3","point":"希望对方做。通知、朋友","jp":"{参加|さんか}してほしい。","zh":"希望你参加。","src":"","say":"参加してほしい。"},{"pattern":"〜てくれない?／〜てくれる?","card":"3-12","point":"对朋友：帮我…好吗","jp":"{貸|か}してくれない？","zh":"借我好吗？","src":"","say":"貸してくれない？"},{"pattern":"〜ていただきたいんですが","card":"4-7","point":"对不太熟的人，较礼貌","jp":"{説明|せつめい}していただきたいんですが。","zh":"想请您说明一下。","src":"","say":"説明していただきたいんですが。"},{"pattern":"〜ていただけないでしょうか","card":"17-11","point":"邮件里更礼貌，给对方拒绝的余地","jp":"{見|み}ていただけないでしょうか。","zh":"不知能否请您看一下。","src":"","say":"見ていただけないでしょうか。"},{"pattern":"〜(さ)せていただけませんか","card":"8-2","point":"请求允许我自己做","jp":"{休|やす}ませていただけませんか。","zh":"能否允许我请假？","src":"","say":"休ませていただけませんか。"},{"pattern":"〜（さ）せていただきます","card":"10-4","point":"我这就做了（谦让）","jp":"ご{案内|あんない}させていただきます。","zh":"请允许我为您介绍。","src":"","say":"ご案内させていただきます。"},{"pattern":"〜ないものでしょうか","card":"20-12","point":"礼貌地表达愿望","jp":"{遅|おそ}くすることはできないものでしょうか。","zh":"能不能晚一点呢。","src":"","say":"遅くすることはできないものでしょうか。"}],"point":"请对方做：てほしい → ていただきたい → ていただけないでしょうか，越来越礼貌。允许我做：させていただく。"},{"title":"转折：虽然、岂止、不愧","icon":"⚖️","rows":[{"pattern":"〜ながら（も）","card":"7-9","point":"虽然…但是","jp":"{分|わ}かっていながら、{間違|まちが}えた。","zh":"虽然知道，还是错了。","src":"","say":"分かっていながら、間違えた。"},{"pattern":"〜つつ（も）","card":"18-1","point":"书面的虽然…却","jp":"{知|し}りつつも、やめられない。","zh":"虽然知道，却停不下来。","src":"","say":"知りつつも、やめられない。"},{"pattern":"〜ものの／〜とはいうものの","card":"11-3","point":"承认前项，再转折","jp":"{結果|けっか}は{
