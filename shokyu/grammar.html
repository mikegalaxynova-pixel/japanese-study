.stat{background:#ffffff22;border:1px solid #ffffff3a;border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px}

.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chips{display:flex;gap:7px;overflow:auto;padding:7px 0 1px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:750}

.controls{display:flex;align-items:center;justify-content:space-between;gap:4px 12px;padding-top:4px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.toggles{display:flex;gap:2px 14px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px;min-height:38px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-left)) 40px}
.hidden{display:none!important}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.8}
.legend b{color:var(--ink)}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin:0 0 14px;box-shadow:var(--shadow);overflow:hidden}
.lesson>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;min-height:56px}

.lnum{flex:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:3px 10px;font-weight:800}
.ltitle{font-weight:800;font-size:19px;line-height:1.35}
.ltitle small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.count{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.inside{padding:0 12px 12px}
.st{margin:6px 0 12px}

.grid{display:grid;gap:12px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 13px;scroll-margin-top:170px}

.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--muted);background:var(--panel);white-space:nowrap}
.badge.cat{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.badge.tb{color:var(--tb);background:var(--tb-bg);border-color:color-mix(in srgb,var(--tb) 35%,transparent)}
.badge.id{background:var(--c);color:#fff;border-color:var(--c)}
@media (prefers-color-scheme:dark){.badge.id{color:#0f172a}}
.pattern{font-size:22px;font-weight:800;line-height:1.9;margin:2px 0;color:var(--ink)}
.conn{font-size:14px;color:var(--muted);background:var(--panel);border-radius:8px;padding:4px 8px;margin:4px 0}
.conn b{color:var(--c);white-space:nowrap}
.mean{font-size:16px;margin:6px 0}
.exs{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.ex{padding:6px 0}
.ex+.ex{border-top:1px dotted var(--line)}
.jp{font-size:19px;line-height:2.05}
.exz{font-size:15px;color:var(--muted)}
.tips{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:14.5px;line-height:1.95}
.tips div::before{content:"⚠️ ";}
.cando{font-size:13px;color:var(--muted);margin-top:6px}
ruby rt{font-size:.55em;color:var(--muted);font-weight:500}
body.hide-ex .exs{display:none}
.empty{text-align:center;color:var(--muted);padding:40px 0}
/* particles & conj */
.pblock{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.pname{font-size:28px;font-weight:900;color:var(--accent);margin-right:8px}
.prom{color:var(--muted);font-size:14px}
.puse{padding:8px 0;border-top:1px dotted var(--line)}
.puse .u{font-weight:700;font-size:15px}
.ljump{border:1px solid var(--line);background:var(--soft);color:var(--accent);border-radius:999px;padding:0 9px;font-size:12px;font-weight:800;cursor:pointer;min-height:26px;margin-left:6px}
table.conj{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
table.conj td{border-top:1px solid var(--line);padding:7px 5px;vertical-align:top;line-height:2}
table.conj td:first-child{white-space:nowrap;font-weight:700;color:var(--muted);font-size:14px}
table.conj td:last-child{color:var(--muted);font-size:13px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 30px}

</style>

icle","pattern":"［{言語|げんご}］で","conn":"语言 ＋ で","zh":"「で」表示手段、方法：用某种语言。","ex":[{"jp":"すみません、これは{日本語|にほんご}で{何|なん}ですか。","zh":"不好意思，这个用日语怎么说？","src":""},{"jp":"A：「ありがとう」は{英語|えいご}で{何|なん}ですか。　B：「Thank you」です。","zh":"A：“ありがとう”用英语怎么说？　B：是“Thank you”。","src":""}],"tips":["「で」还表示交通工具（第4课）、工具（第7课）等手段。"],"official":"［言語］で"},{"id":"2-8","lesson":2,"st":3,"stTitle":"レストラン","cando":"能在餐厅点餐；能询问遗忘物品是谁的。","cat":"q","pattern":"どこのN","conn":"どこ ＋ の ＋ 名词","zh":"“哪里的N”，问产地、公司、学校等。","ex":[{"jp":"A：これはどこのワインですか。　B：フランスのワインです。","zh":"A：这是哪儿产的葡萄酒？　B：是法国的葡萄酒。","src":""},{"jp":"A：それはどこのカメラですか。　B：{日本|にほん}のカメラです。","zh":"A：那是哪儿的相机？　B：是日本的相机。","src":""}],"tips":["回答直接用“地方＋の＋名词”。"],"official":"どこのN"},{"id":"2-9","lesson":2,"st":3,"stTitle":"レストラン","cando":"能在餐厅点餐；能询问遗忘物品是谁的。","cat":"num","pattern":"Nを（～つ）ください","conn":"N ＋ を ＋ 数量 ＋ ください","zh":"点餐/购物时说数量。数量词放在「を」和动词之间，中间不加「の」。","ex":[{"jp":"ご{飯|はん}を２つください。","zh":"我要两碗米饭。","src":"第2课"},{"jp":"コーヒーを１つとケーキを２つください。","zh":"请给我一杯咖啡和两块蛋糕。","src":""}],"tips":["1つひとつ、2つふたつ、3つみっつ、4つよっつ、5つ いつつ…10 とお。","数量词位置：✓ ジュースを２つください。"],"official":"Nを（～つ）ください"},{"id":"2-10","lesson":2,"st":3,"stTitle":"レストラン","cando":"能在餐厅点餐；能询问遗忘物品是谁的。","cat":"q","pattern":"{誰|だれ}のN","conn":"誰 ＋ の ＋ 名词","zh":"“谁的N”，问所有者。回答可以省略名词：「私のです」。","ex":[{"jp":"A：これは{誰|だれ}の{財布|さいふ}ですか。　B：{私|わたし}のです。","zh":"A：这是谁的钱包？　B：是我的。","src":""},{"jp":"A：このかばんは{誰|だれ}のですか。　B：{田中|たなか}さんのです。","zh":"A：这个包是谁的？　B：是田中的。","src":""}],"tips":["「{私|わたし}のです」＝「{私|わたし}の{財布|さいふ}です」。礼貌说法是「どなた」。"],"official":"誰のN"},{"id":"3-1","lesson":3,"st":1,"stTitle":"{何時|なんじ}までですか","cando":"能向公共设施询问开放时间、休息日等。","cat":"num","pattern":"{今|いま}、{何時|なんじ}ですか","conn":"今 ＋ 何時ですか；～時～分","zh":"问时间、说时间。","ex":[{"jp":"A：{今|いま}、{何時|なんじ}ですか。　B：{午後|ごご}３{時半|じはん}です。","zh":"A：现在几点？　B：下午3点半。","src":""},{"jp":"{今|いま}、９{時|じ}２０{分|ぷん}です。","zh":"现在是9点20分。","src":"第3课"}],"tips":["4時よじ、7時しちじ、9時くじ；1分いっぷん、2分にふん、3分さんぷん、10分じゅっぷん。"],"official":"今、何時ですか／時間の言い方"},{"id":"3-2","lesson":3,"st":1,"stTitle":"{何時|なんじ}までですか","cando":"能向公共设施询问开放时间、休息日等。","cat":"num","pattern":"［{時間|じかん}］から［{時間|じかん}］までです","conn":"时间 ＋ から ＋ 时间 ＋ までです","zh":"“从…到…”，说营业时间、开放时间等范围。","ex":[{"jp":"A：{図書館|としょかん}は{何時|なんじ}から{何時|なんじ}までですか。　B：{午前|ごぜん}９{時|じ}から{午後|ごご}８{時|じ}までです。","zh":"A：图书馆几点到几点开放？　B：上午9点到晚上8点。","src":""},{"jp":"{銀行|ぎんこう}は{月曜日|げつようび}から{金曜日|きんようび}までです。","zh":"银行从周一到周五营业。","src":""}],"tips":["「から」＝起点，「まで」＝终点，也可以单独使用：９{時|じ}からです。"],"official":"［時間］から［時間］までです"},{"id":"3-3","lesson":3,"st":1,"stTitle":"{何時|なんじ}までですか","cando":"能向公共设施询问开放时间、休息日等。","cat":"num","pattern":"{何曜日|なんようび}ですか","conn":"N ＋ は ＋ 何曜日ですか","zh":"问星期几。","ex":[{"jp":"A：{今日|きょう}は{何曜日|なんようび}ですか。　B：{水曜日|すいようび}です。","zh":"A：今天星期几？　B：星期三。","src":""},{"jp":"A：{図書館|としょかん}の{休|やす}みは{何曜日|なんようび}ですか。　B：{月曜日|げつようび}です。","zh":"A：图书馆星期几休息？　B：星期一。","src":""}],"tips":["{月|げつ}・{火|か}・{水|すい}・{木|もく}・{金|きん}・{土|ど}・{日|にち} ＋ {曜日|ようび}。"],"official":"曜日の言い方"},{"id":"3-4","lesson":3,"st":2,"stTitle":"{私|わたし}のスケジュール","cando":"能询问学校一年的日程，能说自己一年的计划。","cat":"verb","pattern":"Vます（{予定|よてい}）・～をVます","conn":"N ＋ を ＋ 动词ます形","zh":"动词ます形表示将来的预定（“要…”）。「を」表示动作的对象（宾语）。","ex":[{"jp":"スキーをします。","zh":"滑雪。","src":"第3课"},{"jp":"{明日|あした}、{映画|えいが}を{見|み}ます。","zh":"明天看电影。","src":""},{"jp":"A：{夏休|なつやす}み、{何|なに}をしますか。　B：アルバイトをします。","zh":"A：暑假做什么？　B：打工。","src":""}],"tips":["日语动词放在句末：✗ {見|み}ます{映画|えいが}を。","ます形也表示现在的习惯（本课ST3），靠时间词区分。","「を」读作 o。"],"official":"Vます（予定）／～をVます"},{"id":"3-5","lesson":3,"st":2,"stTitle":"{私|わたし}のスケジュール","cando":"能询问学校一年的日程，能说自己一年的计划。","cat":"particle","pattern":"［{場所|ばしょ}］へ","conn":"场所 ＋ へ ＋ 行きます／来ます／帰ります","zh":"「へ」（写作へ，读作 e）表示移动的方向。","ex":[{"jp":"A：{夏休|なつやす}み、{北海道|ほっかいどう}へ{行|い}きます。B：いいですね。","zh":"A：我暑假时去北海道。B：真不错呀。","src":"第3课"},{"jp":"{来年|らいねん}、{国|くに}へ{帰|かえ}ります。","zh":"明年回国。","src":""}],"tips":["「へ」可换成「に」：{北海道|ほっかいどう}に{行|い}きます。","「へ」只和表示移动的动词连用。"],"official":"［場所］へ"},{"id":"3-6","lesson":3,"st":2,"stTitle":"{私|わたし}のスケジュール","cando":"能询问学校一年的日程，能说自己一年的计划。","cat":"verb","pattern":"Vません","conn":"动词ます形 ます→ません","zh":"动词的否定（现在/将来）：“不…”。","ex":[{"jp":"{週末|しゅうまつ}はアルバイトをしません。","zh":"周末不打工。","src":""},{"jp":"A：{夏休|なつやす}み、{国|くに}へ{帰|かえ}りますか。　B：いいえ、{帰|かえ}りません。","zh":"A：暑假回国吗？　B：不，不回去。","src":""}],"tips":["动词问句回答时要重复动词：✗ いいえ、そうじゃありません（那是名词句的回答）。"],"official":"Vません"},{"id":"3-7","lesson":3,"st":3,"stTitle":"どんな{毎日|まいにち}？","cando":"能谈论并询问日常生活。","cat":"particle","pattern":"［{場所|ばしょ}］で","conn":"场所 ＋ で ＋ 动词","zh":"「で」表示动作进行的场所（“在…做…”）。","ex":[{"jp":"{家|うち}で{勉強|べんきょう}します。","zh":"在家里学习。","src":"第3课"},{"jp":"{図書館|としょかん}で{本|ほん}を{読|よ}みます。","zh":"在图书馆看书。","src":""},{"jp":"コンビニでアルバイトをします。","zh":"在便利店打工。","src":""}],"tips":["✗ {図書館|としょかん}に{勉強|べんきょう}します。动作的场所用「で」；存在的场所（あります・います・{住|す}んでいます）用「に」。"],"official":"［場所］で"},{"id":"3-8","lesson":3,"st":3,"stTitle":"どんな{毎日|まいにち}？","cando":"能谈论并询问日常生活。","cat":"verb","pattern":"Vます（{習慣|しゅうかん}）","conn":"（毎日・毎朝…）＋ 动词ます形","zh":"ます形也表示习惯性、反复进行的动作（“每天/经常做…”）。","ex":[{"jp":"{毎朝|まいあさ}、コーヒーを{飲|の}みます。","zh":"每天早上喝咖啡。","src":""},{"jp":"{音楽|おんがく}を{聞|き}きます。","zh":"听音乐。","src":"第3课"},{"jp":"{毎晩|まいばん}、{新聞|しんぶん}を{読|よ}みます。","zh":"每天晚上看报纸。","src":""}],"tips":["第11课学「Vています（習慣）」，表示一段时期内的生活习惯。"],"official":"Vます（習慣）"},{"id":"3-9","lesson":3,"st":3,"stTitle":"どんな{毎日|まいにち}？","cando":"能谈论并询问日常生活。","cat":"particle","pattern":"NやNなど","conn":"N₁ ＋ や ＋ N₂ ＋ など","zh":"“N₁、N₂等”，从很多东西中举几个例子。","ex":[{"jp":"{朝|あさ}ご{飯|はん}はパンや{果物|くだもの}などを{食|た}べます。","zh":"早饭吃面包、水果等。","src":""},{"jp":"コンビニで{牛乳|ぎゅうにゅう}やサラダなどを{買|か}います。","zh":"在便利店买牛奶、沙拉之类的。","src":""}],"tips":["「と」＝全部列举；「や」＝只举几例，常与「など」连用。"],"official":"NやNなど"},{"id":"3-10","lesson":3,"st":3,"stTitle":"どんな{毎日|まいにち}？","cando":"能谈论并询问日常生活。","cat":"verb","pattern":"{何|なに}もVません・どこへも{行|い}きません","conn":"疑问词 ＋ も ＋ 否定","zh":"疑问词＋も＋否定＝全面否定：“什么也不…”“哪儿也不去”。","ex":[{"jp":"A：{朝|あさ}ご{飯|はん}は{何|なに}を{食|た}べますか。　B：{何|なに}も{食|た}べません。","zh":"A：早饭吃什么？　B：什么也不吃。","src":""},{"jp":"A：{週末|しゅうまつ}、どこへ{行|い}きますか。　B：どこへも{行|い}きません。","zh":"A：周末去哪儿？　B：哪儿也不去。","src":""}],"tips":["「{何|なに}も」读 なにも，后面必须是否定。","课本形式是「どこへも」（口语也说「どこにも」）。"],"official":"何もVません／どこへも行きません"},{"id":"3-11","lesson":3,"st":3,"stTitle":"どんな{毎日|まいにち}？","cando":"能谈论并询问日常生活。","cat":"particle","pattern":"［{時間|じかん}］に","conn":"时间点 ＋ に ＋ 动词","zh":"具体的时间点后面加「に」（“在…点/…日”）。","ex":[{"jp":"{毎朝|まいあさ}、７{時|じ}に{起|お}きます。","zh":"每天早上7点起床。","src":""},{"jp":"{夜|よる}１１{時|じ}に{寝|ね}ます。","zh":"晚上11点睡觉。","src":""}],"tips":["带数字的时间加「に」（７{時|じ}に、５{月|がつ}に）；星期可加可不加；「{今日|きょう}・{明日|あした}・{毎朝|まいあさ}・{週末|しゅうまつ}・{今|いま}」不加「に」。"],"official":"［時間］に"},{"id":"3-12","lesson":3,"st":3,"stTitle":"どんな{毎日|まいにち}？","cando":"能谈论并询问日常生活。","cat":"num","pattern":"［{時間|じかん}］から［{時間|じかん}］までVます","conn":"时间 ＋ から ＋ 时间 ＋ まで ＋ 动词","zh":"表示动作持续的时间范围（“从…到…做…”）。","ex":[{"jp":"９{時|じ}から１２{時|じ}まで{勉強|べんきょう}します。","zh":"从9点学习到12点。","src":""},{"jp":"{午後|ごご}１{時|じ}から５{時|じ}まで{働|はたら}きます。","zh":"下午1点到5点工作。","src":""}],"tips":["与「［時間］に」区别：に＝时间点，から～まで＝时间段。"],"official":"［時間］から［時間］までVます"},{"id":"4-1","lesson":4,"st":1,"stTitle":"どこ？","cando":"能说出并询问国家/城市的位置、到日本要多长时间等。","cat":"exist","pattern":"［{国|くに}］の［{方角|ほうがく}・{位置|いち}］","conn":"地方 ＋ の ＋ 北／南／東／西／真ん中","zh":"说明某地在某个国家/地区的哪个方位。","ex":[{"jp":"{北海道|ほっかいどう}は{日本|にほん}の{北|きた}です。","zh":"北海道在日本的北部。","src":""},{"jp":"{大阪|おおさか}は{東京|とうきょう}の{西|にし}です。","zh":"大阪在东京的西边。","src":""}],"tips":["{東|ひがし}・{西|にし}・{南|みなみ}・{北|きた}・{真|ま}ん{中|なか}。"],"official":"［国］の［方角・位置］"},{"id":"4-2","lesson":4,"st":1,"stTitle":"どこ？","cando":"能说出并询问国家/城市的位置、到日本要多长时间等。","cat":"num","pattern":"［{場所|ばしょ}］から［{場所|ばしょ}］までどのくらいですか・～{時間|じかん}","conn":"场所 ＋ から ＋ 场所 ＋ まで ＋ どのくらいですか","zh":"问所需时间（或距离）。回答：～{時間|じかん}、～{分|ふん}。","ex":[{"jp":"うちから{学校|がっこう}まで２０{分|ぷん}です。","zh":"从家里到学校20分钟。","src":"第4课"},{"jp":"A：{東京|とうきょう}から{大阪|おおさか}までどのくらいですか。　B：{新幹線|しんかんせん}で２{時間半|じかんはん}です。","zh":"A：从东京到大阪要多长时间？　B：坐新干线两个半小时。","src":""}],"tips":["～{時間|じかん}＝…小时（时间长度）；～{時|じ}＝…点（时刻）。"],"official":"［場所］から［場所］までどのくらいですか／～時間"},{"id":"4-3","lesson":4,"st":1,"stTitle":"どこ？","cando":"能说出并询问国家/城市的位置、到日本要多长时间等。","cat":"particle","pattern":"［{交通手段|こうつうしゅだん}］で","conn":"交通工具 ＋ で","zh":"「で」表示交通手段（“坐/乘…”）。","ex":[{"jp":"{毎日|まいにち}、バスで{学校|がっこう}へ{来|き}ます。","zh":"每天坐公交车来学校。","src":""},{"jp":"{国|くに}から{日本|にほん}まで{飛行機|ひこうき}で５{時間|じかん}です。","zh":"从我的国家到日本坐飞机5个小时。","src":""}],"tips":["步行说「{歩|ある}いて」：✗ {足|あし}で。"],"official":"［交通手段］で"},{"id":"4-4","lesson":4,"st":2,"stTitle":"どんなところ？","cando":"能介绍并询问自己的国家/城市是什么样的地方。","cat":"adj","pattern":"～はイAです・～はナAです","conn":"い形容词 ＋ です；な形容词（去な）＋ です","zh":"形容词谓语句：“…很…”。","ex":[{"jp":"{富士山|ふじさん}は{高|たか}いです。","zh":"富士山很高。","src":"第4课"},{"jp":"{私|わたし}の{町|まち}は{静|しず}かです。","zh":"我的城市很安静。","src":""},{"jp":"{東京|とうきょう}はにぎやかです。","zh":"东京很热闹。","src":""}],"tips":["✗ {静|しず}かなです → ✓ {静|しず}かです。","きれい・{有名|ゆうめい}・{嫌|きら}い 是な形容词。"],"official":"～はAです"},{"id":"4-5","lesson":4,"st":2,"stTitle":"どんなところ？","cando":"能介绍并询问自己的国家/城市是什么样的地方。","cat":"adj","pattern":"イAくないです・ナAじゃありません","conn":"い形容词 い→くないです；な形容词 ＋ じゃありません","zh":"形容词的否定：“不…”。","ex":[{"jp":"{私|わたし}の{国|くに}は{夏|なつ}、あまり{暑|あつ}くないです。","zh":"我的国家夏天不太热。","src":"第4课"},{"jp":"この{町|まち}は{静|しず}かじゃありません。","zh":"这个城市不安静。","src":""},{"jp":"A：{寒|さむ}いですか。　B：いいえ、{寒|さむ}くないです。","zh":"A：冷吗？　B：不，不冷。","src":""}],"tips":["いい→よくないです（✗ いくないです）。","な形容词：✗ きれくないです → ✓ きれいじゃありません。"],"official":"イAくないです／ナAじゃありません"},{"id":"4-6","lesson":4,"st":2,"stTitle":"どんなところ？","cando":"能介绍并询问自己的国家/城市是什么样的地方。","cat":"adj","pattern":"～はA＋Nです","conn":"い形容词 ＋ N；な形容词 ＋ な ＋ N","zh":"形容词修饰名词：い形容词直接接名词；な形容词要加「な」。","ex":[{"jp":"{東京|とうきょう}は{大|おお}きい{町|まち}です。","zh":"东京是个大城市。","src":""},{"jp":"{京都|きょうと}はきれいな{町|まち}です。","zh":"京都是个美丽的城市。","src":""},{"jp":"{箱根|はこね}は{有名|ゆうめい}な{温泉|おんせん}です。","zh":"箱根是有名的温泉。","src":""}],"tips":["✗ {有名|ゆうめい}{温泉|おんせん}、✗ {大|おお}きいな{町|まち}。"],"official":"～はA＋Nです"},{"id":"4-7","lesson":4,"st":2,"stTitle":"どんなところ？","cando":"能介绍并询问自己的国家/城市是什么样的地方。","cat":"q","pattern":"どんなN","conn":"どんな ＋ 名词","zh":"“什么样的N”，问性质、状态。","ex":[{"jp":"A：{大阪|おおさか}はどんな{町|まち}ですか。　B：にぎやかな{町|まち}です。","zh":"A：大阪是个什么样的城市？　B：是个热闹的城市。","src":""},{"jp":"A：リンさんの{町|まち}はどんなところですか。　B：{静|しず}かなところです。","zh":"A：小林的城市是什么样的地方？　B：是个安静的地方。","src":""}],"tips":["回答用“形容词＋名词”：どんな{町|まち}ですか → にぎやかな{町|まち}です。"],"official":"どんなN"},{"id":"4-8","lesson":4,"st":2,"stTitle":"どんなところ？","cando":"能介绍并询问自己的国家/城市是什么样的地方。","cat":"exist","pattern":"［{場所|ばしょ}］に～があります","conn":"场所 ＋ に ＋ N ＋ が ＋ あります","zh":"“某处有…”（物品、建筑、植物等）。","ex":[{"jp":"{箱根|はこね}に{温泉|おんせん}があります。","zh":"箱根有温泉。","src":"第4课"},{"jp":"{私|わたし}の{町|まち}に{大|おお}きい{公園|こうえん}があります。","zh":"我的城市有一个大公园。","src":""}],"tips":["物品用「あります」，人和动物用「います」（第7课）。","存在的场所用「に」：✗ {箱根|はこね}で{温泉|おんせん}があります。"],"official":"［場所］に～があります"},{"id":"4-9","lesson":4,"st":2,"stTitle":"どんなところ？","cando":"能介绍并询问自己的国家/城市是什么样的地方。","cat":"conn","pattern":"そして","conn":"句子。そして、句子。","zh":"“而且、还有”，连接两个句子，补充同方向的信息。","ex":[{"jp":"{私|わたし}の{町|まち}は{静|しず}かです。そして、きれいです。","zh":"我的城市很安静，而且很漂亮。","src":""},{"jp":"{大阪|おおさか}はにぎやかです。そして、{食|た}べ{物|もの}がおいしいです。","zh":"大阪很热闹，而且吃的东西很好吃。","src":""}],"tips":["一句话里连接形容词要用て形（第8课）：{静|しず}かで、きれいです。"],"official":"そして"},{"id":"4-10","lesson":4,"st":2,"stTitle":"どんなところ？","cando":"能介绍并询问自己的国家/城市是什么样的地方。","cat":"conn","pattern":"～が、～","conn":"句子（です／ます）＋ が、句子","zh":"“…，但是…”，前后意思相反（逆接）。","ex":[{"jp":"{私|わたし}の{町|まち}は{小|ちい}さいですが、きれいです。","zh":"我的城市很小，但是很漂亮。","src":""},{"jp":"{日本語|にほんご}は{難|むずか}しいですが、おもしろいです。","zh":"日语很难，但是很有意思。","src":""}],"tips":["「が」接在です／ます后面：～ですが、～。","第9课的「でも」放在第二句的开头。"],"official":"～が、～"},{"id":"4-11","lesson":4,"st":3,"stTitle":"{季節|きせつ}・{料理|りょうり}","cando":"能谈论并询问国家/城市的气候和饮食。","cat":"mood","pattern":"～ね（{共感|きょうかん}）","conn":"句子 ＋ ね","zh":"句末「ね」表示同感、感叹（“…呢／…啊”），期待对方同意。","ex":[{"jp":"A：{今日|きょう}は{暑|あつ}いですね。　B：そうですね。","zh":"A：今天真热啊。　B：是啊。","src":""},{"jp":"A：{富士山|ふじさん}はきれいですね。　B：ええ、きれいですね。","zh":"A：富士山真美啊。　B：是啊，真美。","src":""}],"tips":["「ね」求同感；「よ」告诉对方不知道的信息（第6课）。"],"official":"～ね（共感）"},{"id":"4-12","lesson":4,"st":3,"stTitle":"{季節|きせつ}・{料理|りょうり}","cando":"能谈论并询问国家/城市的气候和饮食。","cat":"adj","pattern":"～は［{春|はる}・○{月|がつ}・{一年中|いちねんじゅう}……］、Aです","conn":"地方 ＋ は ＋ 时期、形容词です","zh":"介绍某地某个季节/时期的气候：“（某地）（某时）很…”。","ex":[{"jp":"{東京|とうきょう}は８{月|がつ}、とても{暑|あつ}いです。","zh":"东京8月非常热。","src":""},{"jp":"タイは{一年中|いちねんじゅう}、{暑|あつ}いです。","zh":"泰国一年到头都很热。","src":""},{"jp":"{北海道|ほっかいどう}は{冬|ふゆ}、とても{寒|さむ}いです。","zh":"北海道冬天非常冷。","src":""}],"tips":["课本句型在时期后面用逗号「、」隔开（一般不加「に」）。"],"official":"～は［春・○月・一年中……］、Aです"},{"id":"4-13","lesson":4,"st":3,"stTitle":"{季節|きせつ}・{料理|りょうり}","cando":"能谈论并询问国家/城市的气候和饮食。","cat":"adj","pattern":"とても・{少|すこ}し・あまり～ない","conn":"とても／少し ＋ 肯定；あまり ＋ 否定","zh":"程度副词：とても（很）、少し（有点儿）接肯定；あまり（不太）必须接否定。","ex":[{"jp":"この{料理|りょうり}はとても{辛|から}いです。","zh":"这道菜非常辣。","src":""},{"jp":"このカレーは{少|すこ}し{辛|から}いです。","zh":"这个咖喱有点辣。","src":""},{"jp":"{日本|にほん}の{冬|ふゆ}はあまり{寒|さむ}くないです。","zh":"日本的冬天不太冷。","src":""}],"tips":["✗ あまり{寒|さむ}いです → ✓ あまり{寒|さむ}くないです。","「少し」为第2版新增的学习项目。"],"official":"とても・少し／あまり～ない"},{"id":"4-14","lesson":4,"st":3,"stTitle":"{季節|きせつ}・{料理|りょうり}","cando":"能谈论并询问国家/城市的气候和饮食。","cat":"q","pattern":"～はどうですか","conn":"N ＋ は ＋ どうですか","zh":"询问对方的感想、情况（“…怎么样？”）。","ex":[{"jp":"A：{日本|にほん}の{料理|りょうり}はどうですか。　B：おいしいです。","zh":"A：日本菜怎么样？　B：很好吃。","src":""},{"jp":"A：{東京|とうきょう}の{夏|なつ}はどうですか。　B：とても{暑|あつ}いです。","zh":"A：东京的夏天怎么样？　B：非常热。","src":""}],"tips":["问过去的感想用「どうでしたか」（第5课）；第6课的「～はどうですか」表示提议。","本课还学习味觉词汇：{甘|あま}い・{辛|から}い・{苦|にが}い・すっぱい。"],"official":"～はどうですか／味覚の語彙"},{"id":"5-1","lesson":5,"st":1,"stTitle":"{週末|しゅうまつ}","cando":"能谈论并询问休息日做了什么。","cat":"verb","pattern":"Vました・Vませんでした","conn":"动词ます形 ます→ました／ませんでした","zh":"动词的过去肯定和过去否定。","ex":[{"jp":"{週末|しゅうまつ}、{映画|えいが}を{見|み}ました。","zh":"周末看了电影。","src":""},{"jp":"{昨日|きのう}は{何|なに}もしませんでした。","zh":"昨天什么也没做。","src":""},{"jp":"A：{日曜日|にちようび}、{何|なに}をしましたか。　B：{買|か}い{物|もの}をしました。","zh":"A：星期天做了什么？　B：去购物了。","src":""}],"tips":["✗ ませんでしたです；✗ {見|み}ませんました。"],"official":"Vました／Vませんでした"},{"id":"5-2","lesson":5,"st":1,"stTitle":"{週末|しゅうまつ}","cando":"能谈论并询问休息日做了什么。","cat":"q","pattern":"どこかへ{行|い}きましたか","conn":"疑问词 ＋ か（不定）","zh":"疑问词＋か 表示“某处/某物”。问有没有去哪儿，先用はい／いいえ回答。","ex":[{"jp":"A：{週末|しゅうまつ}、どこかへ{行|い}きましたか。　B：はい、{箱根|はこね}へ{行|い}きました。","zh":"A：周末去哪儿了吗？　B：嗯，去了箱根。","src":""},{"jp":"A：{昨日|きのう}、どこかへ{行|い}きましたか。　B：いいえ、どこへも{行|い}きませんでした。","zh":"A：昨天去哪儿了吗？　B：没有，哪儿也没去。","src":""}],"tips":["「どこかへ」（有没有去某处 → 答はい／いいえ）≠「どこへ」（去了哪里 → 直接答地点）。"],"official":"どこかへ行きましたか"},{"id":"5-3","lesson":5,"st":1,"stTitle":"{週末|しゅうまつ}","cando":"能谈论并询问休息日做了什么。","cat":"particle","pattern":"［{人|ひと}］と","conn":"人 ＋ と ＋ 动词","zh":"「と」表示一起做动作的人（“和…一起”）。","ex":[{"jp":"{友達|ともだち}と{映画|えいが}を{見|み}ました。","zh":"和朋友看了电影。","src":""},{"jp":"{昨日|きのう}、{家族|かぞく}と{食事|しょくじ}しました。","zh":"昨天和家人一起吃了饭。","src":""}],"tips":["一个人做说「{一人|ひとり}で」；也可说「{友達|ともだち}と{一緒|いっしょ}に」。"],"official":"［人］と"},{"id":"5-4","lesson":5,"st":1,"stTitle":"{週末|しゅうまつ}","cando":"能谈论并询问休息日做了什么。","cat":"conn","pattern":"それから","conn":"句子。それから、句子。","zh":"“然后、接着”，按时间顺序叙述几个动作。","ex":[{"jp":"{午前|ごぜん}、{掃除|そうじ}しました。それから、{洗濯|せんたく}しました。","zh":"上午打扫了，然后洗了衣服。","src":""},{"jp":"デパートで{買|か}い{物|もの}しました。それから、{友達|ともだち}と{食事|しょくじ}しました。","zh":"在百货商店购物，然后和朋友吃了饭。","src":""}],"tips":["「そして」偏重补充并列，「それから」强调先后顺序。"],"official":"それから"},{"id":"5-5","lesson":5,"st":2,"stTitle":"{休|やす}みの{後|あと}で","cando":"能谈论并询问休息日的感想。","cat":"adj","pattern":"イAかったです・イAくなかったです","conn":"い形容词 い→かったです／くなかったです","zh":"い形容词的过去肯定和过去否定。","ex":[{"jp":"パソコンは{高|たか}かったです。","zh":"电脑太贵了。","src":"第5课"},{"jp":"{旅行|りょこう}は{楽|たの}しかったです。","zh":"旅行很开心。","src":""},{"jp":"{映画|えいが}はあまりおもしろくなかったです。","zh":"电影不太有意思。","src":""}],"tips":["✗ {楽|たの}しいでした → ✓ {楽|たの}しかったです。","いい→よかったです（✗ いかったです）。"],"official":"イAかったです／イAくなかったです"},{"id":"5-6","lesson":5,"st":2,"stTitle":"{休|やす}みの{後|あと}で","cando":"能谈论并询问休息日的感想。","cat":"adj","pattern":"ナA・Nでした・ナA・Nじゃありませんでした","conn":"な形容词／名词 ＋ でした／じゃありませんでした","zh":"な形容词和名词的过去肯定、过去否定（两者变化相同）。","ex":[{"jp":"{箱根|はこね}はとてもきれいでした。","zh":"箱根非常漂亮。","src":""},{"jp":"{昨日|きのう}は{雨|あめ}でした。","zh":"昨天是雨天。","src":""},{"jp":"ホテルはあまり{静|しず}かじゃありませんでした。","zh":"酒店不太安静。","src":""}],"tips":["✗ きれいかったです（きれい是な形容词）。"],"official":"ナA・Nでした／ナA・Nじゃありませんでした"},{"id":"5-7","lesson":5,"st":2,"stTitle":"{休|やす}みの{後|あと}で","cando":"能谈论并询问休息日的感想。","cat":"q","pattern":"（～は）どうでしたか","conn":"N ＋ は ＋ どうでしたか","zh":"问过去的感想（“…怎么样？”）。","ex":[{"jp":"A：{旅行|りょこう}はどうでしたか。　B：とても{楽|たの}しかったです。","zh":"A：旅行怎么样？　B：非常开心。","src":""},{"jp":"A：{京都|きょうと}はどうでしたか。　B：きれいでしたが、{人|ひと}が{多|おお}かったです。","zh":"A：京都怎么样？　B：很美，不过人很多。","src":""}],"tips":["回答要用过去式：✗ {楽|たの}しいです。"],"official":"（～は）どうでしたか"},{"id":"5-8","lesson":5,"st":2,"stTitle":"{休|やす}みの{後|あと}で","cando":"能谈论并询问休息日的感想。","cat":"conn","pattern":"どうして・～から","conn":"どうして ＋ 问句；理由 ＋ から","zh":"「どうして」问原因（为什么）；「～から」说明理由（因为…）。","ex":[{"jp":"A：どうして{箱根|はこね}へ{行|い}きましたか。　B：{温泉|おんせん}が{有名|ゆうめい}ですから。","zh":"A：为什么去箱根？　B：因为那里的温泉很有名。","src":""},{"jp":"{今日|きょう}は{忙|いそが}しいですから、{行|い}きません。","zh":"今天很忙，所以不去。","src":""}],"tips":["「から」接在理由句的后面：{忙|いそが}しいですから。","「どうして」问原因，「どうやって」问方法（第9课）。"],"official":"どうして／～から"},{"id":"5-9","lesson":5,"st":3,"stTitle":"{今度|こんど}の{休|やす}みに","cando":"能谈论并询问下次休息日打算做什么。","cat":"want","pattern":"Nがほしいです","conn":"N ＋ が ＋ ほしいです","zh":"“想要N”（说话人自己的愿望）。对象用「が」。","ex":[{"jp":"{新|あたら}しいパソコンがほしいです。","zh":"我想要一台新电脑。","src":""},{"jp":"A：{今|いま}、{何|なに}がほしいですか。　B：カメラがほしいです。","zh":"A：你现在想要什么？　B：想要相机。","src":""}],"tips":["✗ パソコンをほしいです。","想要东西用「ほしい」，想做动作用「Vたい」。","ほしい按い形容词变化：ほしくないです、ほしかったです。"],"official":"Nがほしいです"},{"id":"5-10","lesson":5,"st":3,"stTitle":"{今度|こんど}の{休|やす}みに","cando":"能谈论并询问下次休息日打算做什么。","cat":"want","pattern":"Nが{好|す}きです・{嫌|きら}いです","conn":"N ＋ が ＋ 好きです／嫌いです","zh":"“喜欢／讨厌N”。对象用「が」。","ex":[{"jp":"{私|わたし}は{日本|にほん}の{料理|りょうり}が{好|す}きです。","zh":"我喜欢日本菜。","src":""},{"jp":"A：どんなスポーツが{好|す}きですか。　B：サッカーが{好|す}きです。","zh":"A：你喜欢什么运动？　B：我喜欢足球。","src":""},{"jp":"{魚|さかな}はあまり{好|す}きじゃありません。","zh":"我不太喜欢鱼。","src":""}],"tips":["✗ {料理|りょうり}を{好|す}きです。","{嫌|きら}い 语气较强，常说「あまり{好|す}きじゃありません」。"],"official":"Nが好きです・嫌いです"},{"id":"5-11","lesson":5,"st":3,"stTitle":"{今度|こんど}の{休|やす}みに","cando":"能谈论并询问下次休息日打算做什么。","cat":"want","pattern":"Vたいです","conn":"动词ます形去ます ＋ たいです","zh":"“想做…”（说话人自己的愿望）。按い形容词变化：たくないです、たかったです。","ex":[{"jp":"{休|やす}みに{北海道|ほっかいどう}へ{行|い}きたいです。","zh":"休假时想去北海道。","src":""},{"jp":"{日本|にほん}で{温泉|おんせん}に{入|はい}りたいです。","zh":"想在日本泡温泉。","src":""},{"jp":"{今|いま}、{何|なに}も{食|た}べたくないです。","zh":"现在什么也不想吃。","src":""}],"tips":["✗ {行|い}くたいです → ✓ {行|い}きたいです。","对长辈不要直接问「～たいですか」，显得不礼貌。"],"official":"Vたいです"},{"id":"5-12","lesson":5,"st":3,"stTitle":"{今度|こんど}の{休|やす}みに","cando":"能谈论并询问下次休息日打算做什么。","cat":"particle","pattern":"～へ～に{行|い}きます","conn":"场所 ＋ へ ＋ 动词ます形去ます／动作名词 ＋ に ＋ 行きます","zh":"表示移动的目的（“去…做…”）。","ex":[{"jp":"{週末|しゅうまつ}、{横浜|よこはま}へ{買|か}い{物|もの}に{行|い}きます。","zh":"周末去横滨购物。","src":""},{"jp":"デパートへ{靴|くつ}を{買|か}いに{行|い}きました。","zh":"去百货商店买鞋了。","src":""},{"jp":"{友達|ともだち}と{横浜|よこはま}へ{遊|あそ}びに{行|い}きます。","zh":"和朋友去横滨玩。","src":""}],"tips":["✗ {買|か}うに{行|い}きます → ✓ {買|か}いに{行|い}きます（用ます形词干）。"],"official":"～へ～に行きます"},{"id":"6-1","lesson":6,"st":1,"stTitle":"{一緒|いっしょ}に{行|い}きませんか","cando":"能邀请朋友；能接受或拒绝邀请。","cat":"invite","pattern":"Vませんか・Vましょう・～はちょっと…","conn":"动词ます形 ます→ませんか／ましょう","zh":"「～ませんか」邀请对方；「～ましょう」积极响应或提议一起做；拒绝时用「～はちょっと…」委婉表达。","ex":[{"jp":"A：{一緒|いっしょ}に{映画|えいが}を{見|み}に{行|い}きませんか。B：いいですね。{行|い}きましょう。","zh":"A：一起去看电影吧？B：好啊。一起去。","src":"第6课"},{"jp":"A：{今晩|こんばん}{一緒|いっしょ}にご{飯|はん}を{食|た}べませんか。B：すみません。{今晩|こんばん}はちょっと…。","zh":"A：今天晚上一起吃饭吧。B：对不起，今天晚上有点……。","src":"第6课"},{"jp":"ああ、{日曜日|にちようび}はちょっと…。","zh":"啊，星期天有点……。","src":"第6课"}],"tips":["邀请对方时「～ませんか」比「～ましょう」更客气。","拒绝不直接说「いいえ」，用「すみません。～はちょっと…」。"],"official":"Vませんか／Vましょう／～はちょっと…"},{"id":"6-2","lesson":6,"st":1,"stTitle":"{一緒|いっしょ}に{行|い}きませんか","cando":"能邀请朋友；能接受或拒绝邀请。","cat":"exist","pattern":"～があります（{予定|よてい}・{行事|ぎょうじ}）","conn":"事情／活动 ＋ が ＋ あります","zh":"“有（事情、安排、活动）”：{用事|ようじ}・{試合|しあい}・パーティー・テストがあります。","ex":[{"jp":"{今晩|こんばん}、{用事|ようじ}があります。","zh":"今晚有点事。","src":"第6课"},{"jp":"{明日|あした}、テストがあります。","zh":"明天有考试。","src":""}],"tips":["活动、事情作主语时也用「あります」。"],"official":"～があります"},{"id":"6-3","lesson":6,"st":1,"stTitle":"{一緒|いっしょ}に{行|い}きませんか","cando":"能邀请朋友；能接受或拒绝邀请。","cat":"exist","pattern":"［{場所|ばしょ}］で～があります","conn":"场所 ＋ で ＋ 活动 ＋ が ＋ あります","zh":"活动、比赛在某处举行（“在…有…”）。场所用「で」。","ex":[{"jp":"{横浜|よこはま}で{野球|やきゅう}の{試合|しあい}があります。","zh":"在横滨有棒球比赛。","src":"第6课"},{"jp":"{土曜日|どようび}に{公園|こうえん}でお{祭|まつ}りがあります。","zh":"星期六在公园有庙会。","src":""}],"tips":["对比：{町|まち}に{公園|こうえん}があります（物体存在 → に）／{公園|こうえん}でお{祭|まつ}りがあります（活动举行 → で）。"],"official":"［場所］で～があります"},{"id":"6-4","lesson":6,"st":1,"stTitle":"{一緒|いっしょ}に{行|い}きませんか","cando":"能邀请朋友；能接受或拒绝邀请。","cat":"num","pattern":"～が（～{枚|まい}）あります","conn":"N ＋ が ＋ 数量 ＋ あります","zh":"说有几个/几张。数量词放在「が」和「あります」之间。","ex":[{"jp":"チケットが２{枚|まい}あります。","zh":"有2张票。","src":"第6课"},{"jp":"コンサートのチケットが２{枚|まい}ありますから、{一緒|いっしょ}に{行|い}きませんか。","zh":"我有两张音乐会的票，一起去吧？","src":""}],"tips":["～{枚|まい}用于纸、票、T恤等薄而平的东西。"],"official":"～が（～枚）あります"},{"id":"6-5","lesson":6,"st":2,"stTitle":"どちらがいいですか","cando":"能一边询问朋友的意向、比较信息，一边商量。","cat":"adj","pattern":"～で～がいちばんAです","conn":"范围 ＋ で ＋ N ＋ が ＋ いちばん ＋ 形容词","zh":"在某范围内“…最…”（最高级）。","ex":[{"jp":"A：スポーツで{何|なに}がいちばん{好|す}きですか。　B：サッカーがいちばん{好|す}きです。","zh":"A：运动里你最喜欢什么？　B：最喜欢足球。","src":""},{"jp":"{日本|にほん}の{山|やま}で{富士山|ふじさん}がいちばん{高|たか}いです。","zh":"在日本的山里富士山最高。","src":""}],"tips":["范围用「で」；问人用{誰|だれ}，问地点用どこ，问时间用いつ，其他用{何|なに}。"],"official":"～で～がいちばんAです"},{"id":"6-6","lesson":6,"st":2,"stTitle":"どちらがいいですか","cando":"能一边询问朋友的意向、比较信息，一边商量。","cat":"adj","pattern":"～と～とどちらがAですか・～のほうがAです","conn":"N₁ ＋ と ＋ N₂ ＋ と ＋ どちらが ＋ 形容词ですか","zh":"两者比较：“…和…哪个更…？”，回答“…更…”。","ex":[{"jp":"A：{肉|にく}と{魚|さかな}とどちらが{好|す}きですか。　B：{魚|さかな}のほうが{好|す}きです。","zh":"A：肉和鱼你更喜欢哪个？　B：我更喜欢鱼。","src":""},{"jp":"A：バスと{電車|でんしゃ}とどちらが{安|やす}いですか。　B：バスのほうが{安|やす}いです。","zh":"A：公交车和电车哪个便宜？　B：公交车更便宜。","src":""}],"tips":["两者用「どちら」，三者以上用「{何|なに}／どこ／{誰|だれ}」＋いちばん。"],"official":"～と～とどちらがAですか／～のほうがAです"},{"id":"6-7","lesson":6,"st":2,"stTitle":"どちらがいいですか","cando":"能一边询问朋友的意向、比较信息，一边商量。","cat":"adj","pattern":"～は～よりAです","conn":"N₁ ＋ は ＋ N₂ ＋ より ＋ 形容词","zh":"“N₁比N₂更…”。「より」后面是比较的基准。","ex":[{"jp":"{東京|とうきょう}は{大阪|おおさか}より{大|おお}きいです。","zh":"东京比大阪大。","src":""},{"jp":"{今日|きょう}は{昨日|きのう}より{暑|あつ}いです。","zh":"今天比昨天热。","src":""}],"tips":["✗ {東京|とうきょう}は{大阪|おおさか}より{大|おお}きいより。注意语序：AはBより～。"],"official":"～は～よりAです"},{"id":"6-8","lesson":6,"st":3,"stTitle":"{約束|やくそく}","cando":"能约定见面的地点和时间。","cat":"verb","pattern":"もうVましたか（{経験|けいけん}）・まだです","conn":"もう ＋ 动词ました ＋ か","zh":"问对方是否已经做过（看过/去过）。否定回答“还没有”用「まだです」。","ex":[{"jp":"A：もう{富士山|ふじさん}に{登|のぼ}りましたか。　B：いいえ、まだです。","zh":"A：已经爬过富士山了吗？　B：不，还没有。","src":""},{"jp":"A：その{映画|えいが}、もう{見|み}ましたか。　B：はい、{見|み}ました。","zh":"A：那部电影已经看过了吗？　B：嗯，看过了。","src":""}],"tips":["✗ いいえ、{見|み}ませんでした（表示过去某时没看，意思不同）→ ✓ いいえ、まだです。","第10课学「まだVていません」。"],"official":"もうVましたか（経験）／まだです"},{"id":"6-9","lesson":6,"st":3,"stTitle":"{約束|やくそく}","cando":"能约定见面的地点和时间。","cat":"mood","pattern":"～よ","conn":"句子 ＋ よ","zh":"句末「よ」告诉对方不知道的信息，或提醒、主张（“…哦”）。","ex":[{"jp":"A：この{映画|えいが}、おもしろいですよ。　B：そうですか。","zh":"A：这部电影很好看哦。　B：是吗。","src":""},{"jp":"A：{明日|あした}、テストがありますよ。　B：えっ、そうですか。","zh":"A：明天有考试哦。　B：诶，是吗？","src":""}],"tips":["对长辈频繁用「よ」会显得强势。"],"official":"～よ"},{"id":"6-10","lesson":6,"st":3,"stTitle":"{約束|やくそく}","cando":"能约定见面的地点和时间。","cat":"invite","pattern":"～はどうですか（{提案|ていあん}）","conn":"N ＋ は ＋ どうですか","zh":"提出建议（“…怎么样？”）。","ex":[{"jp":"A：{何時|なんじ}に{会|あ}いますか。　B：３{時|じ}はどうですか。","zh":"A：几点见？　B：3点怎么样？","src":""},{"jp":"A：{土曜日|どようび}はちょっと…。　B：じゃ、{日曜日|にちようび}はどうですか。","zh":"A：星期六有点……。　B：那星期天怎么样？","src":""}],"tips":["第4课的「～はどうですか」问感想；这里是提议。"],"official":"～はどうですか（提案）"},{"id":"6-11","lesson":6,"st":3,"stTitle":"{約束|やくそく}","cando":"能约定见面的地点和时间。","cat":"mood","pattern":"～ね（{確認|かくにん}）","conn":"句子 ＋ ね","zh":"句末「ね」用来确认双方约定的内容（“…对吧”）。","ex":[{"jp":"じゃ、{土曜日|どようび}の１０{時|じ}に{駅|えき}ですね。","zh":"那就周六10点在车站，对吧。","src":""},{"jp":"A：{明日|あした}は３{時|じ}ですね。　B：はい、３{時|じ}です。","zh":"A：明天是3点，对吧？　B：对，3点。","src":""}],"tips":["与第4课「ね」（同感）比较：这里是确认。"],"official":"～ね（確認）"},{"id":"7-1","lesson":7,"st":1,"stTitle":"{道|みち}がわかりません","cando":"迷路时能问想去的地方在哪里，能说出自己在哪里。","cat":"exist","pattern":"～は～にあります","conn":"物 ＋ は ＋ 场所 ＋ に ＋ あります","zh":"“（某物）在某处”。已知的物品作话题。","ex":[{"jp":"A：{銀行|ぎんこう}はどこにありますか。　B：{駅|えき}の{前|まえ}にあります。","zh":"A：银行在哪儿？　B：在车站前面。","src":""},{"jp":"トイレは２{階|かい}にあります。","zh":"洗手间在2楼。","src":""}],"tips":["也可简单说「{銀行|ぎんこう}は{駅|えき}の{前|まえ}です」。"],"official":"～は～にあります"},{"id":"7-2","lesson":7,"st":1,"stTitle":"{道|みち}がわかりません","cando":"迷路时能问想去的地方在哪里，能说出自己在哪里。","cat":"exist","pattern":"～は～にいます","conn":"人／动物 ＋ は ＋ 场所 ＋ に ＋ います","zh":"“（某人/动物）在某处”。","ex":[{"jp":"A：{田中|たなか}さんはどこにいますか。　B：{教室|きょうしつ}にいます。","zh":"A：田中在哪儿？　B：在教室。","src":""},{"jp":"{今|いま}、{駅|えき}の{前|まえ}にいます。","zh":"我现在在车站前面。","src":""}],"tips":["人、动物用「います」；物品、植物用「あります」。"],"official":"～は～にいます"},{"id":"7-3","lesson":7,"st":1,"stTitle":"{道|みち}がわかりません","cando":"迷路时能问想去的地方在哪里，能说出自己在哪里。","cat":"exist","pattern":"～に～があります・います","conn":"场所 ＋ に ＋ N ＋ が ＋ あります／います","zh":"“某处有…”，介绍新信息（有 どのかばん。两个里面选用「どちら」（第6课）。"],"official":"どのN／どれ"},{"id":"7-8","lesson":7,"st":3,"stTitle":"みんなで{楽|たの}しいパーティー","cando":"聚会时能主动提出帮忙、劝别人吃东西等。","cat":"te","pattern":"Vています（{動作|どうさ}の{進行|しんこう}）","conn":"动词て形 ＋ います","zh":"表示动作正在进行（“正在…”）。","ex":[{"jp":"A：{今|いま}、{何|なに}をしていますか。　B：{料理|りょうり}を{作|つく}っています。","zh":"A：你现在在做什么？　B：正在做饭。","src":""},{"jp":"{田中|たなか}さんはキッチンでお{皿|さら}を{洗|あら}っています。","zh":"田中正在厨房洗盘子。","src":""}],"tips":["「～ています」还有：职业（第8课）、习惯（第11课）、穿戴（第13课）、结果状态（第15课）等用法。"],"official":"Vています（動作の進行）"},{"id":"7-9","lesson":7,"st":3,"stTitle":"みんなで{楽|たの}しいパーティー","cando":"聚会时能主动提出帮忙、劝别人吃东西等。","cat":"invite","pattern":"Vましょうか","conn":"动词ます形 ます→ましょうか","zh":"主动提出帮忙（“我来…吧？”）。","ex":[{"jp":"A：{手伝|てつだ}いましょうか。　B：ありがとうございます。お{願|ねが}いします。","zh":"A：我来帮忙吧？　B：谢谢，拜托了。","src":""},{"jp":"A：エアコンをつけましょうか。　B：ええ、お{願|ねが}いします。","zh":"A：我把空调打开吧？　B：好的，麻烦你了。","src":""}],"tips":["接受：ありがとうございます。お{願|ねが}いします；拒绝：いいえ、{大丈夫|だいじょうぶ}です。","「～ませんか」是邀请对方一起做，「～ましょうか」是我来为你做。"],"official":"Vましょうか"},{"id":"7-10","lesson":7,"st":3,"stTitle":"みんなで{楽|たの}しいパーティー","cando":"聚会时能主动提出帮忙、劝别人吃东西等。","cat":"q","pattern":"{誰|だれ}が","conn":"誰 ＋ が ＋ 动词","zh":"疑问词作主语时后面用「が」，回答也用「が」。","ex":[{"jp":"A：{誰|だれ}がケーキを{作|つく}りましたか。　B：リンさんが{作|つく}りました。","zh":"A：谁做的蛋糕？　B：小林做的。","src":""},{"jp":"A：{誰|だれ}が{来|き}ますか。　B：{田中|たなか}さんと{山田|やまだ}さんが{来|き}ます。","zh":"A：谁会来？　B：田中和山田会来。","src":""}],"tips":["✗ {誰|だれ}は{来|き}ますか。疑问词（{誰|だれ}・{何|なに}・どこ）作主语一定用「が」。"],"official":"誰が"},{"id":"7-11","lesson":7,"st":3,"stTitle":"みんなで{楽|たの}しいパーティー","cando":"聚会时能主动提出帮忙、劝别人吃东西等。","cat":"exist","pattern":"まだあります・もうありません","conn":"まだ ＋ 肯定；もう ＋ 否定","zh":"「まだ」＝还（有）；「もう～ません」＝已经没有了。","ex":[{"jp":"A：ジュースはまだありますか。　B：いいえ、もうありません。","zh":"A：果汁还有吗？　B：没有了。","src":""},{"jp":"ケーキはまだありますよ。どうぞ。","zh":"蛋糕还有哦，请吃。","src":""}],"tips":["对比第6课「もうVましたか」（已经…了吗）。"],"official":"まだあります／もうありません"},{"id":"8-1","lesson":8,"st":1,"stTitle":"{家族|かぞく}・{友達|ともだち}","cando":"能谈论家人、朋友有几个人、住在哪里等。","cat":"exist","pattern":"～に{住|す}んでいます","conn":"场所 ＋ に ＋ 住んでいます","zh":"“住在…”。表示状态，用「～ています」。","ex":[{"jp":"{私|わたし}は{東京|とうきょう}に{住|す}んでいます。","zh":"我住在东京。","src":""},{"jp":"{両親|りょうしん}は{中国|ちゅうごく}に{住|す}んでいます。","zh":"我父母住在中国。","src":""}],"tips":["✗ {東京|とうきょう}で{住|す}んでいます；✗ {東京|とうきょう}に{住|す}みます（表示现在住在哪儿要用「～ています」）。"],"official":"～に住んでいます"},{"id":"8-2","lesson":8,"st":1,"stTitle":"{家族|かぞく}・{友達|ともだち}","cando":"能谈论家人、朋友有几个人、住在哪里等。","cat":"num","pattern":"［～{人|にん}］で","conn":"人数 ＋ で ＋ 动词","zh":"表示以多少人一起做某事（“…个人（一起）”）。","ex":[{"jp":"{兄|あに}と{二人|ふたり}で{住|す}んでいます。","zh":"和哥哥两个人住。","src":""},{"jp":"{友達|ともだち}と３{人|にん}で{旅行|りょこう}に{行|い}きました。","zh":"和朋友三个人去旅行了。","src":""},{"jp":"{一人|ひとり}で{住|す}んでいます。","zh":"一个人住。","src":""}],"tips":["1人ひとり、2人ふたり（特殊），3人以上读～にん（4人よにん）。","第1版的写法是「［人］と（～人）で住んでいます」。"],"official":"［～人］で"},{"id":"8-3","lesson":8,"st":1,"stTitle":"{家族|かぞく}・{友達|ともだち}","cando":"能谈论家人、朋友有几个人、住在哪里等。","cat":"exist","pattern":"～が（～{人|にん}・{匹|ひき}）います","conn":"N ＋ が ＋ 数量 ＋ います","zh":"说有几个家人、几只动物。","ex":[{"jp":"{私|わたし}は{弟|おとうと}がいます。","zh":"我有弟弟。","src":"第8课"},{"jp":"{兄弟|きょうだい}が３{人|にん}います。","zh":"我有三个兄弟姐妹。","src":""},{"jp":"{家|うち}に{犬|いぬ}が２{匹|ひき}います。","zh":"家里有两只狗。","src":""}],"tips":["～{匹|ひき}：1匹いっぴき、3匹さんびき、6匹ろっぴき、8匹はっぴき、10匹じゅっぴき。","人和动物用「います」。"],"official":"～が（～人・匹）います"},{"id":"8-4","lesson":8,"st":1,"stTitle":"{家族|かぞく}・{友達|ともだち}","cando":"能谈论家人、朋友有几个人、住在哪里等。","cat":"te","pattern":"Vています（{職業|しょくぎょう}）","conn":"场所 ＋ で ＋ 动词て形 ＋ います","zh":"表示职业、长期从事的工作。","ex":[{"jp":"{父|ちち}は{銀行|ぎんこう}で{働|はたら}いています。","zh":"我父亲在银行工作。","src":""},{"jp":"{姉|あね}は{高校|こうこう}で{英語|えいご}を{教|おし}えています。","zh":"我姐姐在高中教英语。","src":""}],"tips":["说工作场所用「で」：{銀行|ぎんこう}で{働|はたら}いています。"],"official":"Vています（職業）"},{"id":"8-5","lesson":8,"st":2,"stTitle":"こんな{人|ひと}","cando":"能介绍家人、朋友是什么样的人。","cat":"want","pattern":"～はNが{上手|じょうず}です・{下手|へた}です","conn":"人 ＋ は ＋ N ＋ が ＋ 上手です／下手です","zh":"“某人擅长／不擅长…”。对象用「が」。","ex":[{"jp":"{母|はは}は{料理|りょうり}が{上手|じょうず}です。","zh":"我妈妈很会做菜。","src":""},{"jp":"{私|わたし}はダンスが{下手|へた}です。","zh":"我跳舞跳得不好。","src":""}],"tips":["「{上手|じょうず}」多用于夸别人；说自己时谦虚地说「あまり{上手|じょうず}じゃありません」。","✗ {料理|りょうり}を{上手|じょうず}です。"],"official":"～はNが上手です・下手です"},{"id":"8-6","lesson":8,"st":2,"stTitle":"こんな{人|ひと}","cando":"能介绍家人、朋友是什么样的人。","cat":"adj","pattern":"～は～がAです","conn":"N₁ ＋ は ＋ N₂ ＋ が ＋ 形容词","zh":"描述人或事物某一部分的特征：“N₁（的）N₂很…”。","ex":[{"jp":"{田中|たなか}さんは{背|せ}が{高|たか}いです。","zh":"田中个子高。","src":""},{"jp":"{妹|いもうと}は{目|め}が{大|おお}きいです。","zh":"我妹妹眼睛很大。","src":""},{"jp":"{兄|あに}は{頭|あたま}がいいです。","zh":"我哥哥很聪明。","src":""}],"tips":["整体（人）用「は」，部分（身体部位等）用「が」。"],"official":"～は～がAです"},{"id":"8-7","lesson":8,"st":2,"stTitle":"こんな{人|ひと}","cando":"能介绍家人、朋友是什么样的人。","cat":"adj","pattern":"イAくて、～・ナA・Nで、～","conn":"い形容词 い→くて；な形容词／名词 ＋ で","zh":"形容词、名词的中顿形（て形），连接两个特征（“又…又…”）。","ex":[{"jp":"{兄|あに}は{背|せ}が{高|たか}くて、かっこいいです。","zh":"我哥哥个子高，又帅。","src":""},{"jp":"{田中|たなか}さんは{親切|しんせつ}で、おもしろい{人|ひと}です。","zh":"田中既热情又有趣。","src":""},{"jp":"{姉|あね}は{会社員|かいしゃいん}で、{東京|とうきょう}に{住|す}んでいます。","zh":"我姐姐是公司职员，住在东京。","src":""}],"tips":["いい→よくて（✗ いくて）。","前后意思相反时用「が」：{安|やす}いですが、おいしくないです。"],"official":"イAくて、～／ナA・Nで、～"},{"id":"8-8","lesson":8,"st":3,"stTitle":"プレゼント","cando":"能商量送朋友的礼物，能谈论自己收到的礼物。","cat":"give","pattern":"あげます","conn":"给予者 ＋ は ＋ 接受者 ＋ に ＋ N ＋ を ＋ あげます","zh":"“（我/别人）给别人…”。","ex":[{"jp":"{私|わたし}は{友達|ともだち}に{花|はな}をあげました。","zh":"我送给朋友花了。","src":""},{"jp":"{母|はは}の{誕生日|たんじょうび}にセーターをあげます。","zh":"妈妈生日的时候送她毛衣。","src":""}],"tips":["别人给“我”不能用「あげます」：✗ {友達|ともだち}は{私|わたし}に{本|ほん}をあげました → ✓ くれました。"],"official":"あげます"},{"id":"8-9","lesson":8,"st":3,"stTitle":"プレゼント","cando":"能商量送朋友的礼物，能谈论自己收到的礼物。","cat":"give","pattern":"もらいます","conn":"接受者 ＋ は ＋ 给予者 ＋ に／から ＋ N ＋ を ＋ もらいます","zh":"“从别人那里得到…”，主语是接受的人。","ex":[{"jp":"{私|わたし}は{友達|ともだち}にＴシャツをもらいました。","zh":"我从朋友那里收到了T恤。","src":""},{"jp":"{誕生日|たんじょうび}に{父|ちち}から{時計|とけい}をもらいました。","zh":"生日时从爸爸那里收到了手表。","src":""}],"tips":["给予者用「に」或「から」都可以。"],"official":"もらいます"},{"id":"8-10","lesson":8,"st":3,"stTitle":"プレゼント","cando":"能商量送朋友的礼物，能谈论自己收到的礼物。","cat":"give","pattern":"くれます","conn":"给予者 ＋ が ＋ 私に ＋ N ＋ を ＋ くれます","zh":"“别人给我（或我的家人）…”。","ex":[{"jp":"{友達|ともだち}が{私|わたし}に{本|ほん}をくれました。","zh":"朋友送给我一本书。","src":""},{"jp":"{姉|あね}がかばんをくれました。","zh":"姐姐给了我一个包。","src":""}],"tips":["「{私|わたし}に」常省略。✗ {私|わたし}は{友達|ともだち}に{本|ほん}をくれました。"],"official":"くれます"},{"id":"9-1","lesson":9,"st":1,"stTitle":"いろいろな{趣味|しゅみ}","cando":"能谈论并询问兴趣爱好。","cat":"form","pattern":"{辞書形|じしょけい}・Vることです","conn":"动词辞书形 ＋ ことです","zh":"用“动词辞书形＋こと”把动作变成名词，说明爱好等：“（我的爱好）是做…”。","ex":[{"jp":"{私|わたし}の{趣味|しゅみ}は{写真|しゃしん}を{撮|と}ることです。","zh":"我的爱好是拍照。","src":""},{"jp":"{趣味|しゅみ}は{映画|えいが}を{見|み}ることです。","zh":"我的爱好是看电影。","src":""}],"tips":["辞书形：{書|か}きます→{書|か}く、{食|た}べます→{食|た}べる、します→する、{来|き}ます→{来|く}る。","✗ {趣味|しゅみ}は{写真|しゃしん}を{撮|と}ります。"],"official":"辞書形／Vることです"},{"id":"9-2","lesson":9,"st":1,"stTitle":"いろいろな{趣味|しゅみ}","cando":"能谈论并询问兴趣爱好。","cat":"verb","pattern":"いつも・よく・ときどき・あまり・{全然|ぜんぜん}","conn":"频率副词 ＋ 动词","zh":"表示频率的副词。あまり、全然 后面接否定。","ex":[{"jp":"{私|わたし}はよく{映画|えいが}を{見|み}ます。","zh":"我经常看电影。","src":"第9课"},{"jp":"あまりテレビを{見|み}ません。","zh":"我不太看电视。","src":"第9课"},{"jp":"お{酒|さけ}は{全然|ぜんぜん}{飲|の}みません。","zh":"我完全不喝酒。","src":""}],"tips":["频率：いつも＞よく＞ときどき＞あまり～ない＞{全然|ぜんぜん}～ない。","第10课「よくわかりません」的「よく」是“清楚地”，不是频率。"],"official":"いつも・よく・ときどき・あまり・全然"},{"id":"9-3","lesson":9,"st":1,"stTitle":"いろいろな{趣味|しゅみ}","cando":"能谈论并询问兴趣爱好。","cat":"conn","pattern":"でも","conn":"句子。でも、句子。","zh":"句首的“但是”，连接两个句子（口语）。","ex":[{"jp":"テニスが{好|す}きです。でも、あまり{上手|じょうず}じゃありません。","zh":"我喜欢网球，但是打得不太好。","src":""},{"jp":"{日本語|にほんご}は{難|むずか}しいです。でも、おもしろいです。","zh":"日语很难，但是很有意思。","src":""}],"tips":["「でも」放在第二句句首；「～が、～」在一句话之内连接（第4课）。"],"official":"でも"},{"id":"9-4","lesson":9,"st":1,"stTitle":"いろいろな{趣味|しゅみ}","cando":"能谈论并询问兴趣爱好。","cat":"num","pattern":"［{期間|きかん}］に［～{回|かい}・{冊|さつ}・{本|ほん}］","conn":"期间 ＋ に ＋ 次数／数量","zh":"表示频率（“每…几次/几本”）。","ex":[{"jp":"{一週間|いっしゅうかん}に２{回|かい}テニスをします。","zh":"一周打两次网球。","src":""},{"jp":"{一|いっ}か{月|げつ}に{本|ほん}を３{冊|さつ}{読|よ}みます。","zh":"一个月看三本书。","src":""},{"jp":"{一年|いちねん}に２{回|かい}{国|くに}へ{帰|かえ}ります。","zh":"一年回国两次。","src":""}],"tips":["～{回|かい}（次数）、～{冊|さつ}（书本）、～{本|ほん}（细长物、电影）：1本いっぽん、2本にほん、3本さんぼん。"],"official":"［期間］に［～回・冊・本］／助数詞"},{"id":"9-5","lesson":9,"st":2,"stTitle":"できること・できないこと","cando":"能根据信息谈论会做、不会做的事。","cat":"want","pattern":"Nができます・Vることができます（{能力|のうりょく}）","conn":"N ＋ が ＋ できます；动词辞书形 ＋ ことができます","zh":"表示能力（“会…”）。","ex":[{"jp":"スキーができます。","zh":"我会滑雪。","src":"第9课"},{"jp":"{私|わたし}は{車|くるま}を{運転|うんてん}することができます。","zh":"我会开车。","src":""},{"jp":"{漢字|かんじ}を{書|か}くことができません。","zh":"我不会写汉字。","src":""}],"tips":["对象用「が」：✗ スキーをできます。","「Nができます」的N是动作性名词（スポーツ、{料理|りょうり}、{日本語|にほんご}…）。"],"official":"Nができます／Vることができます（能力）"},{"id":"9-6","lesson":9,"st":3,"stTitle":"{楽|たの}しい{週末|しゅうまつ}","cando":"能谈论休息日做的事；能说明自己知道的事情的步骤。","cat":"te","pattern":"Vて、～","conn":"动词て形、动词…","zh":"用て形连接按顺序进行的几个动作（“…，然后…”）。时态由最后的动词决定。","ex":[{"jp":"{昨日|きのう}、{図書館|としょかん}へ{行|い}って、{本|ほん}を{借|か}りました。","zh":"昨天去图书馆借了书。","src":""},{"jp":"{朝|あさ}{起|お}きて、シャワーを{浴|あ}びて、{朝|あさ}ご{飯|はん}を{食|た}べます。","zh":"早上起床，冲个澡，然后吃早饭。","src":""}],"tips":["✗ {行|い}きました、{借|か}りました（前面的动词不用过去式）。"],"official":"Vて、～"},{"id":"9-7","lesson":9,"st":3,"stTitle":"{楽|たの}しい{週末|しゅうまつ}","cando":"能谈论休息日做的事；能说明自己知道的事情的步骤。","cat":"q","pattern":"どうやって","conn":"どうやって ＋ 动词","zh":"问方法、手段（“怎么…”）。","ex":[{"jp":"A：{駅|えき}までどうやって{行|い}きますか。　B：バスで{行|い}きます。","zh":"A：怎么去车站？　B：坐公交车去。","src":""},{"jp":"A：{図書館|としょかん}のカードはどうやって{作|つく}りますか。　B：ここに{名前|なまえ}を{書|か}いて、{受付|うけつけ}に{出|だ}します。","zh":"A：图书馆的卡怎么办？　B：在这里写上名字，交到服务台。","src":""}],"tips":["「どうやって」问方法，「どうして」问原因（第5课）。"],"official":"どうやって"},{"id":"10-1","lesson":10,"st":1,"stTitle":"{集合|しゅうごう}","cando":"找不到集合地点时能打电话问朋友并找过去；能进行出发前的简单交流。","cat":"te","pattern":"もうVましたか（{完了|かんりょう}）・まだVていません","conn":"もう ＋ Vましたか；まだ ＋ 动词て形 ＋ いません","zh":"问动作是否已经完成；否定回答“还没…”用「まだVていません」。","ex":[{"jp":"A：アンナさんはもう{来|き}ましたか。　B：いいえ、まだ{来|き}ていません。","zh":"A：安娜已经来了吗？　B：不，还没来。","src":""},{"jp":"A：もう{昼|ひる}ご{飯|はん}を{食|た}べましたか。　B：いいえ、まだ{食|た}べていません。","zh":"A：已经吃过午饭了吗？　B：不，还没吃。","src":""}],"tips":["✗ いいえ、{来|き}ませんでした（“过去某时没来”，意思不同）。","第6课只学了「まだです」。"],"official":"もうVましたか（完了）／まだVていません"},{"id":"10-2","lesson":10,"st":1,"stTitle":"{集合|しゅうごう}","cando":"找不到集合地点时能打电话问朋友并找过去；能进行出发前的简单交流。","cat":"te","pattern":"Vてきます","conn":"动词て形 ＋ きます","zh":"“去…（做完）再回来”。","ex":[{"jp":"ちょっとトイレに{行|い}ってきます。","zh":"我去一下洗手间（就回来）。","src":""},{"jp":"アンナさんを{探|さが}してきます。","zh":"我去找一下安娜（就回来）。","src":""},{"jp":"コンビニで{飲|の}み{物|もの}を{買|か}ってきます。","zh":"我去便利店买点喝的回来。","src":""}],"tips":["出门时说「{行|い}ってきます」，对方回答「{行|い}ってらっしゃい」。"],"official":"Vてきます"},{"id":"10-3","lesson":10,"st":1,"stTitle":"{集合|しゅうごう}","cando":"找不到集合地点时能打电话问朋友并找过去；能进行出发前的简单交流。","cat":"verb","pattern":"Nが{見|み}えます・Nが{聞|き}こえます","conn":"N ＋ が ＋ 見えます／聞こえます","zh":"“能看见／能听见…”（自然进入视野或耳朵）。对象用「が」。","ex":[{"jp":"A：そこから{何|なに}が{見|み}えますか。　B：{大|おお}きい{橋|はし}が{見|み}えます。","zh":"A：从那里能看见什么？　B：能看见一座大桥。","src":""},{"jp":"すみません、{声|こえ}がよく{聞|き}こえません。","zh":"不好意思，我听不太清楚你的声音。","src":""}],"tips":["{見|み}えます／{聞|き}こえます（自然看到/听到，用「が」）↔ {見|み}ます／{聞|き}きます（主动去看/听，用「を」）。"],"official":"Nが見えます／Nが聞こえます"},{"id":"10-4","lesson":10,"st":1,"stTitle":"{集合|しゅうごう}","cando":"找不到集合地点时能打电话问朋友并找过去；能进行出发前的简单交流。","cat":"particle","pattern":"［{場所|ばしょ}］を","conn":"场所 ＋ を ＋ 移动动词（渡る・曲がる・歩く）","zh":"「を」表示移动经过的场所（过桥、拐弯、在…走）。","ex":[{"jp":"{橋|はし}を{渡|わた}ってください。","zh":"请过桥。","src":""},{"jp":"あの{交差点|こうさてん}を{右|みぎ}へ{曲|ま}がってください。","zh":"请在那个十字路口向右拐。","src":""},{"jp":"{公園|こうえん}を{歩|ある}きます。","zh":"在公园里散步。","src":""}],"tips":["✗ {橋|はし}に{渡|わた}ります。","离开的场所也用「を」：バスを{降|お}ります（第9课词汇）。"],"official":"［場所］を"},{"id":"10-5","lesson":10,"st":2,"stTitle":"いろいろな{注意|ちゅうい}","cando":"能听懂公共场所的注意事项，能请求许可。","cat":"te","pattern":"Vてもいいですか","conn":"动词て形 ＋ もいいですか","zh":"请求许可（“可以…吗？”）。","ex":[{"jp":"ここで{写真|しゃしん}を{撮|と}ってもいいですか。","zh":"可以在这里拍照吗？","src":""},{"jp":"A：ここに{座|すわ}ってもいいですか。　B：はい、どうぞ。","zh":"A：我可以坐这里吗？　B：可以，请坐。","src":""}],"tips":["同意：はい、どうぞ；不同意：すみません、ちょっと…。","第14课「～てはいけません」表示禁止。"],"official":"Vてもいいですか"},{"id":"10-6","lesson":10,"st":2,"stTitle":"いろいろな{注意|ちゅうい}","cando":"能听懂公共场所的注意事项，能请求许可。","cat":"form","pattern":"ナイ{形|けい}・Vないでください","conn":"动词ない形 ＋ でください","zh":"请对方不要做某事（“请不要…”）。","ex":[{"jp":"ここでたばこを{吸|す}わないでください。","zh":"请不要在这里吸烟。","src":""},{"jp":"{動物|どうぶつ}に{食|た}べ{物|もの}をやらないでください。","zh":"请不要给动物喂食。","src":""},{"jp":"{絵|え}に{触|さわ}らないでください。","zh":"请不要触摸画。","src":""}],"tips":["ない形：{書|か}く→{書|か}かない、{買|か}う→{買|か}わない（う→わ）、{食|た}べる→{食|た}べない、する→しない、{来|く}る→{来|こ}ない。"],"official":"ナイ形／Vないでください"},{"id":"10-7","lesson":10,"st":2,"stTitle":"いろいろな{注意|ちゅうい}","cando":"能听懂公共场所的注意事项，能请求许可。","cat":"particle","pattern":"Nは（{取|と}り{立|た}て）","conn":"N ＋ は（替换 を／が 等）","zh":"把某个名词提出来作话题，或暗含对比、限定（“…嘛／…的话”）。","ex":[{"jp":"{荷物|にもつ}はバスの{中|なか}に{置|お}いてください。","zh":"行李（的话）请放在车里。","src":""},{"jp":"A：ここでたばこを{吸|す}ってもいいですか。　B：たばこはあそこでお{願|ねが}いします。","zh":"A：可以在这里吸烟吗？　B：吸烟请到那边。","src":""}],"tips":["宾语提出来作话题时「を」变「は」：✗ {荷物|にもつ}をは。"],"official":"Nは（取り立て）"},{"id":"10-8","lesson":10,"st":3,"stTitle":"{動物園|どうぶつえん}で","cando":"能根据周围情况提出行动建议；能询问设施有哪些服务。","cat":"te","pattern":"～が（Vています）","conn":"N ＋ が ＋ 动词て形 ＋ います","zh":"描述眼前看到的情景，新信息的主语用「が」（“…在…呢”）。","ex":[{"jp":"あっ、パンダが{寝|ね}ています。","zh":"啊，熊猫在睡觉。","src":""},{"jp":"あそこで{子|こ}どもが{遊|あそ}んでいます。","zh":"孩子们在那边玩。","src":""}],"tips":["把它当话题说明时用「は」：パンダは{今|いま}、{寝|ね}ています。"],"official":"～が（Vています）"},{"id":"10-9","lesson":10,"st":3,"stTitle":"{動物園|どうぶつえん}で","cando":"能根据周围情况提出行动建议；能询问设施有哪些服务。","cat":"want","pattern":"Nができます・Vることができます（{状況|じょうきょう}）","conn":"（场所で／では）N ＋ ができます；V辞书形 ＋ ことができます","zh":"表示在某场所、某情况下“可以（做）…”，即条件允许。","ex":[{"jp":"この{動物園|どうぶつえん}では{写真|しゃしん}を{撮|と}ることができます。","zh":"在这个动物园可以拍照。","src":""},{"jp":"A：ここで{食事|しょくじ}ができますか。　B：はい、できます。","zh":"A：这里可以吃饭吗？　B：可以。","src":""}],"tips":["第9课是能力（会…），第10课是情况允许（能…、可以…）。"],"official":"Nができます／Vることができます（状況）"},{"id":"10-10","lesson":10,"st":3,"stTitle":"{動物園|どうぶつえん}で","cando":"能根据周围情况提出行动建议；能询问设施有哪些服务。","cat":"adj","pattern":"イAくなります・ナA・Nになります","conn":"い形容词 い→くなります；な形容词／名词 ＋ になります","zh":"表示变化（“变得…／成为…”）。","ex":[{"jp":"{暑|あつ}くなりましたね。","zh":"天气变热了呢。","src":""},{"jp":"{部屋|へや}がきれいになりました。","zh":"房间变干净了。","src":""},{"jp":"{兄|あに}は{医者|いしゃ}になりました。","zh":"我哥哥当上了医生。","src":""}],"tips":["いい→よくなります。","✗ きれいくなります → ✓ きれいになります。"],"official":"イAくなります／ナA・Nになります"},{"id":"11-1","lesson":11,"st":1,"stTitle":"{今|いま}の{生活|せいかつ}","cando":"能谈论并询问现在的生活。","cat":"particle","pattern":"～は～が、～は（{対比|たいひ}）","conn":"N₁ ＋ は ＋ …が、N₂ ＋ は ＋ …","zh":"两件事物对比时都用「は」。","ex":[{"jp":"{会話|かいわ}は{好|す}きですが、{作文|さくぶん}はあまり{好|す}きじゃありません。","zh":"我喜欢会话，但不太喜欢作文。","src":""},{"jp":"{肉|にく}は{食|た}べますが、{魚|さかな}は{食|た}べません。","zh":"肉吃，但鱼不吃。","src":""}],"tips":["原来的「が」「を」在对比时变成「は」：{会話|かいわ}が{好|す}き → {会話|かいわ}は{好|す}き。"],"official":"～は～が、～は（対比）"},{"id":"11-2","lesson":11,"st":1,"stTitle":"{今|いま}の{生活|せいかつ}","cando":"能谈论并询问现在的生活。","cat":"te","pattern":"Vています（{習慣|しゅうかん}）","conn":"动词て形 ＋ います","zh":"表示现在生活中反复进行的习惯。","ex":[{"jp":"{毎朝|まいあさ}、{公園|こうえん}を{散歩|さんぽ}しています。","zh":"我每天早上在公园散步。","src":""},{"jp":"{今|いま}、{日本語学校|にほんごがっこう}に{通|かよ}っています。","zh":"我现在在上日语学校。","src":""},{"jp":"{週末|しゅうまつ}はコンビニでアルバイトをしています。","zh":"周末在便利店打工。","src":""}],"tips":["与第3课「Vます（習慣）」相比，「～ています」更强调现在这一时期的生活。"],"official":"Vています（習慣）"},{"id":"11-3","lesson":11,"st":1,"stTitle":"{今|いま}の{生活|せいかつ}","cando":"能谈论并询问现在的生活。","cat":"form","pattern":"タ{形|けい}・VたりVたりします","conn":"动词た形 ＋ り、动词た形 ＋ り ＋ します","zh":"列举几个有代表性的动作（“又…又…”、“…啦…啦”）。","ex":[{"jp":"{週末|しゅうまつ}は{掃除|そうじ}したり{洗濯|せんたく}したりします。","zh":"周末打扫打扫、洗洗衣服。","src":""},{"jp":"{休|やす}みの{日|ひ}は{映画|えいが}を{見|み}たり、{買|か}い{物|もの}をしたりしました。","zh":"休息日看了看电影、买了买东西。","src":""}],"tips":["最后一定要加「します」：✗ {見|み}たり、{買|か}い{物|もの}をします。","た形变法与て形相同：{見|み}て→{見|み}た、{飲|の}んで→{飲|の}んだ。"],"official":"タ形／VたりVたりします"},{"id":"11-4","lesson":11,"st":1,"stTitle":"{今|いま}の{生活|せいかつ}","cando":"能谈论并询问现在的生活。","cat":"conn","pattern":"～とき、Vます","conn":"动词辞书形／ない形・い形容词・な形容词＋な・名词＋の ＋ とき","zh":"“…的时候，（做）…”。","ex":[{"jp":"{寂|さび}しいとき、{家族|かぞく}に{電話|でんわ}します。","zh":"寂寞的时候给家人打电话。","src":""},{"jp":"A：{暇|ひま}なとき、{何|なに}をしますか。　B：{音楽|おんがく}を{聞|き}きます。","zh":"A：有空的时候做什么？　B：听音乐。","src":""}],"tips":["な形容词加な、名词加の：✗ {暇|ひま}とき、✗ {子|こ}どもとき。"],"official":"～とき、Vます"},{"id":"11-5","lesson":11,"st":1,"stTitle":"{今|いま}の{生活|せいかつ}","cando":"能谈论并询问现在的生活。","cat":"q","pattern":"どうしますか","conn":"（～とき、）どうしますか","zh":"问对方在某种情况下怎么做（“怎么办”）。","ex":[{"jp":"A：{風邪|かぜ}をひいたとき、どうしますか。　B：{薬|くすり}を{飲|の}んで、{寝|ね}ます。","zh":"A：感冒的时候你怎么办？　B：吃药、睡觉。","src":""},{"jp":"A：{眠|ねむ}いとき、どうしますか。　B：コーヒーを{飲|の}みます。","zh":"A：困的时候怎么办？　B：喝咖啡。","src":""}],"tips":["どうしますか（怎么做）／どうでしたか（怎么样）／どうしてですか（为什么）。"],"official":"どうしますか"},{"id":"11-6","lesson":11,"st":2,"stTitle":"{今|いま}の{私|わたし}・{前|まえ}の{私|わたし}","cando":"能简单谈论并询问自己以前的事。","cat":"conn","pattern":"～とき、Vました","conn":"（辞书形／た形／名词の …）とき、动词过去式","zh":"“…的时候，（做了）…”，叙述过去的事。","ex":[{"jp":"{子|こ}どものとき、よく{海|うみ}で{泳|およ}ぎました。","zh":"小时候经常在海里游泳。","src":""},{"jp":"{日本|にほん}へ{来|く}るとき、{飛行機|ひこうき}の{中|なか}で{映画|えいが}を{見|み}ました。","zh":"来日本的时候，在飞机上看了电影。","src":""},{"jp":"{日本|にほん}へ{来|き}たとき、{日本語|にほんご}が{全然|ぜんぜん}わかりませんでした。","zh":"刚来日本的时候，日语完全听不懂。","src":""}],"tips":["「{来|く}るとき」＝来的路上（到达之前）；「{来|き}たとき」＝来了之后。"],"official":"～とき、Vました"},{"id":"11-7","lesson":11,"st":3,"stTitle":"{友達|ともだち}と","cando":"能用“朋友语”（简体）和朋友说话。","cat":"form","pattern":"{友達|ともだち}{言葉|ことば}・{普通形|ふつうけい}","conn":"です／ます形 → 普通形","zh":"朋友之间用普通形（简体）说话：“行きます→行く”“楽しかったです→楽しかった”。","ex":[{"jp":"A：{明日|あした}、{映画|えいが}に{行|い}く？　B：うん、{行|い}く。","zh":"A：明天去看电影吗？　B：嗯，去。","src":""},{"jp":"A：{昨日|きのう}のパーティー、{楽|たの}しかった？　B：うん、すごく{楽|たの}しかった。","zh":"A：昨天的聚会开心吗？　B：嗯，特别开心。","src":""},{"jp":"Ａ：{山田|やまだ}さんは{英語|えいご}が{上手|じょうず}だね。 B：{彼|かれ}/{彼女|かのじょ}はイギリスに{留学|りゅうがく}したことがあるから。","zh":"A：山田的英语真好啊。B：因为他/她在英国留过学。","src":"第15课"}],"tips":["名词、な形容词的普通形疑问句去掉「だ」：{元気|げんき}？（✗ {元気|げんき}だ？）。","「はい」→うん，「いいえ」→ううん。","「普通形」为第2版新增的项目名称（第1版只写「友達言葉」）。"],"official":"友達言葉／普通形"},{"id":"12-1","lesson":12,"st":1,"stTitle":"{体|からだ}の{調子|ちょうし}","cando":"身体不适时能简单说明症状，提出早退或说明缺席理由。","cat":"mood","pattern":"どうしたんですか・～んです","conn":"普通形 ＋ んです（な形容词／名词 ＋ なんです）","zh":"「～んです」用于说明理由、情况；「どうしたんですか」关心地询问对方怎么了。","ex":[{"jp":"A：どうしたんですか。　B：{頭|あたま}が{痛|いた}いんです。","zh":"A：你怎么了？　B：我头疼。","src":""},{"jp":"すみません、{気分|きぶん}が{悪|わる}いんです。{早退|そうたい}してもいいですか。","zh":"对不起，我不舒服。可以早退吗？","src":""},{"jp":"A：{元気|げんき}がないですね。　B：{昨日|きのう}から{熱|ねつ}があるんです。","zh":"A：你没精神啊。　B：我从昨天开始发烧。","src":""}],"tips":["な形容词／名词：{暇|ひま}なんです、{病気|びょうき}なんです（✗ {病気|びょうき}だんです）。"],"official":"どうしたんですか／～んです"},{"id":"12-2","lesson":12,"st":2,"stTitle":"アドバイス","cando":"能给身体不适的朋友提建议。","cat":"form","pattern":"Vたほうがいいです・Vないほうがいいです","conn":"动词た形／ない形 ＋ ほうがいいです","zh":"给对方建议（“最好…／最好不要…”）。","ex":[{"jp":"{熱|ねつ}がありますから、{早|はや}く{帰|かえ}ったほうがいいですよ。","zh":"你发烧了，最好早点回去。","src":""},{"jp":"{今日|きょう}はお{風呂|ふろ}に{入|はい}らないほうがいいです。","zh":"今天最好别泡澡。","src":""}],"tips":["否定用ない形：✗ {入|はい}らなかったほうがいい。"],"official":"Vたほうがいいです／Vないほうがいいです"},{"id":"12-3","lesson":12,"st":3,"stTitle":"{病院|びょういん}で","cando":"能在医院简单说明症状，听懂医生的指示。","cat":"te","pattern":"Vてから、～","conn":"动词て形 ＋ から、…","zh":"强调先后顺序：“做完A之后再做B”。","ex":[{"jp":"ご{飯|はん}を{食|た}べてから、{薬|くすり}を{飲|の}んでください。","zh":"吃完饭以后请吃药。","src":""},{"jp":"{手|て}を{洗|あら}ってから、{食|た}べます。","zh":"洗了手再吃。","src":""}],"tips":["与「Vて、～」（第9课）相比，更强调“A完成之后”。"],"official":"Vてから、～"},{"id":"12-4","lesson":12,"st":3,"stTitle":"{病院|びょういん}で","cando":"能在医院简单说明症状，听懂医生的指示。","cat":"conn","pattern":"Vる{前|まえ}に・Nの{前|まえ}に・［{時間|じかん}］{前|まえ}に","conn":"动词辞书形／N＋の／时间段 ＋ 前に","zh":"“…之前”。","ex":[{"jp":"{寝|ね}る{前|まえ}に、この{薬|くすり}を{飲|の}んでください。","zh":"睡觉前请吃这个药。","src":""},{"jp":"{食事|しょくじ}の{前|まえ}に、{手|て}を{洗|あら}います。","zh":"吃饭前洗手。","src":""},{"jp":"３{年|ねん}{前|まえ}に、{日本|にほん}へ{来|き}ました。","zh":"三年前来到日本。","src":""}],"tips":["动词一律用辞书形：✗ {寝|ね}た{前|まえ}に。","时间段＋前に 不加「の」：✗ ３{年|ねん}の{前|まえ}に。","「Nの前に」「［時間］前に」为第2版新增的学习项目。"],"official":"Vる前に、～／Nの前に、～／［時間］前に、～"},{"id":"13-1","lesson":13,"st":1,"stTitle":"{経験|けいけん}から","cando":"能从朋友的经验中获得想知道的信息，能谈自己的经验。","cat":"form","pattern":"Vたことがあります","conn":"动词た形 ＋ ことがあります","zh":"表示过去的经历（“曾经…过”）。","ex":[{"jp":"{富士山|ふじさん}に{登|のぼ}ったことがあります。","zh":"我爬过富士山。","src":""},{"jp":"A：{日本|にほん}の{温泉|おんせん}に{入|はい}ったことがありますか。　B：いいえ、ありません。","zh":"A：你泡过日本的温泉吗？　B：没有。","src":""}],"tips":["不和具体的时间连用：✗ {昨日|きのう}、{富士山|ふじさん}に{登|のぼ}ったことがあります。"],"official":"Vたことがあります"},{"id":"13-2","lesson":13,"st":1,"stTitle":"{経験|けいけん}から","cando":"能从朋友的经验中获得想知道的信息，能谈自己的经验。","cat":"verb","pattern":"{知|し}っていますか・{知|し}りません","conn":"～を知っていますか；知っています／知りません","zh":"“知道吗？”。肯定用「知っています」，否定用「知りません」。","ex":[{"jp":"A：{田中|たなか}さんの{電話番号|でんわばんごう}を{知|し}っていますか。　B：いいえ、{知|し}りません。","zh":"A：你知道田中的电话号码吗？　B：不，不知道。","src":""},{"jp":"A：この{店|みせ}、{知|し}っていますか。　B：はい、{知|し}っています。","zh":"A：你知道这家店吗？　B：嗯，知道。","src":""}],"tips":["否定：✗ {知|し}っていません → ✓ {知|し}りません。"],"official":"知っていますか／知りません"},{"id":"13-3","lesson":13,"st":1,"stTitle":"{経験|けいけん}から","cando":"能从朋友的经验中获得想知道的信息，能谈自己的经验。","cat":"noun","pattern":"NというN","conn":"名称 ＋ という ＋ 名词","zh":"介绍对方可能不知道的名称（“叫做…的N”）。","ex":[{"jp":"「さくら」という{店|みせ}を{知|し}っていますか。","zh":"你知道一家叫“樱花”的店吗？","src":""},{"jp":"これは「てんぷら」という{料理|りょうり}です。","zh":"这是一道叫“天妇罗”的菜。","src":""}],"tips":["对方不知道的名称用「という」介绍。"],"official":"NというN"},{"id":"13-4","lesson":13,"st":2,"stTitle":"おすすめします","cando":"能谈论推荐的东西、地方、人。","cat":"form","pattern":"～は［{名詞修飾|めいししゅうしょく}］です","conn":"（普通形从句）＋ 名词","zh":"用普通形的从句修饰名词，说明“…是（…的）N”。","ex":[{"jp":"これは{私|わたし}が{撮|と}った{写真|しゃしん}です。","zh":"这是我拍的照片。","src":""},{"jp":"{田中|たなか}さんは{眼鏡|めがね}をかけている{人|ひと}です。","zh":"田中是戴眼镜的那个人。","src":""}],"tips":["修饰从句里的主语用「が」：✓ {私|わたし}が{撮|と}った{写真|しゃしん}　✗ {私|わたし}は{撮|と}った{写真|しゃしん}。","从句用普通形：✗ {撮|と}りました{写真|しゃしん}。"],"official":"～は［名詞修飾］です"},{"id":"13-5","lesson":13,"st":2,"stTitle":"おすすめします","cando":"能谈论推荐的东西、地方、人。","cat":"te","pattern":"Vています（{装着動詞|そうちゃくどうし}）","conn":"（着る・はく・かぶる・かける・する）て形 ＋ います","zh":"表示穿着、戴着的状态。","ex":[{"jp":"{山田|やまだ}さんは{帽子|ぼうし}をかぶっています。","zh":"山田戴着帽子。","src":""},{"jp":"あの{赤|あか}いセーターを{着|き}ている{人|ひと}は{誰|だれ}ですか。","zh":"那个穿红毛衣的人是谁？","src":""},{"jp":"{眼鏡|めがね}をかけます。","zh":"戴眼镜。","src":"第13课"}],"tips":["上衣 {着|き}る；裤子、鞋、袜子 はく；帽子 かぶる；眼镜 かける；领带、手表 する（ネクタイをします）。"],"official":"Vています（装着動詞）"},{"id":"13-6","lesson":13,"st":3,"stTitle":"{教|おし}えてください","cando":"为了获得想知道的信息，能进行提问。","cat":"form","pattern":"［{名詞修飾|めいししゅうしょく}］を／へVます","conn":"（普通形从句）＋ 名词 ＋ を／へ ＋ 动词","zh":"修饰从句＋名词 作宾语或目的地。","ex":[{"jp":"{外国人|がいこくじん}がよく{行|い}く{店|みせ}を{教|おし}えてください。","zh":"请告诉我外国人常去的店。","src":""},{"jp":"{駅|えき}の{近|ちか}くにある{店|みせ}へ{行|い}きたいです。","zh":"我想去车站附近的那家店。","src":""}],"tips":["修饰从句一律放在名词前面。"],"official":"［名詞修飾］を／へVます"},{"id":"13-7","lesson":13,"st":3,"stTitle":"{教|おし}えてください","cando":"为了获得想知道的信息，能进行提问。","cat":"form","pattern":"［{名詞修飾|めいししゅうしょく}］は～","conn":"（普通形从句）＋ 名词 ＋ は …","zh":"修饰从句＋名词 作话题。","ex":[{"jp":"{昨日|きのう}{見|み}た{映画|えいが}はおもしろかったです。","zh":"昨天看的电影很有意思。","src":""},{"jp":"{駅|えき}の{前|まえ}にある{店|みせ}は{安|やす}いです。","zh":"车站前面的那家店很便宜。","src":""}],"tips":["从句里的主语用「が」：{私|わたし}が{昨日|きのう}{見|み}た{映画|えいが}は…"],"official":"［名詞修飾］は～"},{"id":"14-1","lesson":14,"st":1,"stTitle":"{初|はじ}めて{見|み}た！{初|はじ}めて{聞|き}いた！","cando":"能向不会用的人简单说明使用方法。","cat":"conn","pattern":"Vると、～","conn":"动词辞书形 ＋ と、…","zh":"“一…就…”，表示必然的结果（机器操作、自然现象、路线说明）。","ex":[{"jp":"カードをかざすと、ドアが{開|ひら}きます。","zh":"一刷卡，门就开了。","src":""},{"jp":"このボタンを{押|お}すと、お{釣|つ}りが{出|で}ます。","zh":"一按这个按钮，找零就出来了。","src":""},{"jp":"ここを{回|まわ}すと、{電気|でんき}がつきます。","zh":"一转这里，灯就亮了。","src":""}],"tips":["后句不能是请求、意志：✗ {駅|えき}に{着|つ}くと、{電話|でんわ}してください → ✓ {着|つ}いたら（第15课）。"],"official":"Vると、～"},{"id":"14-2","lesson":14,"st":1,"stTitle":"{初|はじ}めて{見|み}た！{初|はじ}めて{聞|き}いた！","cando":"能向不会用的人简单说明使用方法。","cat":"mood","pattern":"「　」と{言|い}います","conn":"「引用内容」＋ と ＋ 言います","zh":"引用说话的内容（“说…”）。","ex":[{"jp":"{日本|にほん}では{食事|しょくじ}の{前|まえ}に「いただきます」と{言|い}います。","zh":"在日本，吃饭前要说“我开动了”。","src":""},{"jp":"A：これは{日本語|にほんご}で{何|なん}と{言|い}いますか。　B：「はし」と{言|い}います。","zh":"A：这个用日语怎么说？　B：叫“はし（筷子）”。","src":""}],"tips":["引用用「と」；问说法：～は{日本語|にほんご}で{何|なん}と{言|い}いますか。"],"official":"「　」と言います"},{"id":"14-3","lesson":14,"st":2,"stTitle":"ルール・マナー","cando":"为防止麻烦，能把规则、礼仪等告诉朋友。","cat":"te","pattern":"Vてはいけません","conn":"动词て形 ＋ はいけません","zh":"表示规则上的禁止（“不许…／不可以…”）。","ex":[{"jp":"ここに{自転車|じてんしゃ}を{止|と}めてはいけません。","zh":"这里不许停自行车。","src":""},{"jp":"{美術館|びじゅつかん}で{写真|しゃしん}を{撮|と}ってはいけません。","zh":"美术馆里不能拍照。","src":""}],"tips":["语气强，多用于规则；当面提醒别人常用「～ないでください」（第10课）。"],"official":"Vてはいけません"},{"id":"14-4","lesson":14,"st":2,"stTitle":"ルール・マナー","cando":"为防止麻烦，能把规则、礼仪等告诉朋友。","cat":"form","pattern":"Vなければなりません","conn":"动词ない形 ない→なければなりません","zh":"“必须…”（义务）。","ex":[{"jp":"ごみは{分|わ}けて{捨|す}てなければなりません。","zh":"垃圾必须分类扔。","src":""},{"jp":"{明日|あした}は８{時|じ}に{学校|がっこう}へ{行|い}かなければなりません。","zh":"明天8点必须去学校。","src":""}],"tips":["✗ {行|い}かないければなりません；✗ {行|い}きなければなりません。"],"official":"Vなければなりません"},{"id":"14-5","lesson":14,"st":2,"stTitle":"ルール・マナー","cando":"为防止麻烦，能把规则、礼仪等告诉朋友。","cat":"form","pattern":"Vなくてもいいです","conn":"动词ない形 ない→なくてもいいです","zh":"“不…也可以／不必…”。","ex":[{"jp":"ここでは{靴|くつ}を{脱|ぬ}がなくてもいいです。","zh":"在这里不脱鞋也可以。","src":""},{"jp":"A：{明日|あした}も{来|こ}なければなりませんか。　B：いいえ、{来|こ}なくてもいいですよ。","zh":"A：明天也必须来吗？　B：不，不来也行。","src":""}],"tips":["是「～なければなりませんか」的否定回答。"],"official":"Vなくてもいいです"},{"id":"14-6","lesson":14,"st":3,"stTitle":"{私|わたし}の{意見|いけん}","cando":"能就身边的事简单说出自己的意见，并询问对方的意见。","cat":"mood","pattern":"～と{思|おも}います（{意見|いけん}）","conn":"普通形 ＋ と思います（な形容词／名词 ＋ だ）","zh":"说出自己的意见（“我认为…”）。","ex":[{"jp":"{私|わたし}もそう{思|おも}います。","zh":"我也这样想。","src":"第14课"},{"jp":"{日本|にほん}の{電車|でんしゃ}は{便利|べんり}だと{思|おも}います。","zh":"我觉得日本的电车很方便。","src":""},{"jp":"{子|こ}どもはスマホを{使|つか}わないほうがいいと{思|おも}います。","zh":"我认为小孩最好不要用智能手机。","src":""}],"tips":["な形容词／名词要加「だ」：✗ {便利|べんり}と{思|おも}います → ✓ {便利|べんり}だと{思|おも}います。","问意见：～についてどう{思|おも}いますか。"],"official":"～と思います（意見）"},{"id":"15-1","lesson":15,"st":1,"stTitle":"これ、{知|し}ってる？","cando":"能把电视、杂志等的信息告诉朋友，邀请对方或谈感想。","cat":"mood","pattern":"～そうです（{伝聞|でんぶん}）","conn":"普通形 ＋ そうです（な形容词／名词 ＋ だそうです）","zh":"转述听来或看来的信息（“听说…”）。","ex":[{"jp":"{明日|あした}は{雨|あめ}が{降|ふ}るそうです。","zh":"听说明天会下雨。","src":""},{"jp":"{駅|えき}の{前|まえ}に{新|あたら}しい{店|みせ}ができたそうです。","zh":"听说车站前开了一家新店。","src":""},{"jp":"あの{映画|えいが}はとてもおもしろいそうです。","zh":"听说那部电影非常有意思。","src":""}],"tips":["名词／な形容词：{雨|あめ}だそうです、{有名|ゆうめい}だそうです。","表示“看起来…”的「そう」（様態）不在1–15课范围内，注意别混。"],"official":"～そうです（伝聞）"},{"id":"15-2","lesson":15,"st":1,"stTitle":"これ、{知|し}ってる？","cando":"能把电视、杂志等的信息告诉朋友，邀请对方或谈感想。","cat":"particle","pattern":"［{原因|げんいん}］で","conn":"名词（原因）＋ で","zh":"名词＋で 表示原因（多为自然现象、事故、事件）。","ex":[{"jp":"{台風|たいふう}で{電車|でんしゃ}が{止|と}まりました。","zh":"因为台风，电车停了。","src":""},{"jp":"{地震|じしん}でガラスが{割|わ}れました。","zh":"因为地震，玻璃碎了。","src":""},{"jp":"{事故|じこ}で{道|みち}が{混|こ}んでいます。","zh":"因为交通事故，路上很堵。","src":""}],"tips":["句子作原因用「～から」（第5课）；名词作原因用「で」。"],"official":"［原因］で"},{"id":"15-3","lesson":15,"st":2,"stTitle":"{雑誌|ざっし}を{見|み}て{町|まち}へ","cando":"能根据杂志等的信息，考虑各种条件和朋友一起行动。","cat":"conn","pattern":"～たら（{仮定条件|かていじょうけん}）","conn":"动词／い形容词 た形 ＋ ら；な形容词／名词 ＋ だったら","zh":"“如果…的话”，假设条件；后句可以是意志、请求。","ex":[{"jp":"{雨|あめ}が{降|ふ}ったら、{行|い}きません。","zh":"如果下雨就不去。","src":""},{"jp":"{安|やす}かったら、{買|か}いたいです。","zh":"如果便宜的话想买。","src":""},{"jp":"{駅|えき}に{着|つ}いたら、{電話|でんわ}してください。","zh":"到了车站请给我打电话。","src":""}],"tips":["い形容词：{安|やす}かったら；な形容词／名词：{暇|ひま}だったら、{雨|あめ}だったら。"],"official":"～たら（仮定条件）"},{"id":"15-4","lesson":15,"st":2,"stTitle":"{雑誌|ざっし}を{見|み}て{町|まち}へ","cando":"能根据杂志等的信息，考虑各种条件和朋友一起行动。","cat":"mood","pattern":"～と{思|おも}います（{推量|すいりょう}）","conn":"普通形 ＋ と思います","zh":"表示推测（“我想…吧”），常与「たぶん」「きっと」连用。","ex":[{"jp":"{明日|あした}はたぶん{晴|は}れると{思|おも}います。","zh":"我想明天大概会放晴。","src":""},{"jp":"{道|みち}が{混|こ}んでいますから、{間|ま}に{合|あ}わないと{思|おも}います。","zh":"路上很堵，我想来不及了。","src":""},{"jp":"きっと{大丈夫|だいじょうぶ}だと{思|おも}います。","zh":"我想一定没问题的。","src":""}],"tips":["第14课是说意见，第15课是推测；接续相同。"],"official":"～と思います（推量）"},{"id":"15-5","lesson":15,"st":2,"stTitle":"{雑誌|ざっし}を{見|み}て{町|まち}へ","cando":"能根据杂志等的信息，考虑各种条件和朋友一起行动。","cat":"conn","pattern":"～ても","conn":"动词て形 ＋ も；い形容词 い→くても；な形容词／名词 ＋ でも","zh":"“即使…也…”（逆接的假设）。","ex":[{"jp":"{雨|あめ}が{降|ふ}っても、{行|い}きます。","zh":"即使下雨也去。","src":""},{"jp":"{高|たか}くても、{買|か}いたいです。","zh":"即使贵也想买。","src":""},{"jp":"{今|いま}から{急|いそ}いでも、{間|ま}に{合|あ}いません。","zh":"就算现在赶也来不及了。","src":""}],"tips":["～たら（如果…就…）↔ ～ても（即使…也…）。"],"official":"～ても"},{"id":"15-6","lesson":15,"st":3,"stTitle":"{町|まち}を{歩|ある}いて","cando":"外出时能简单描述周围的情况。","cat":"te","pattern":"Vています（{結果|けっか}の{状態|じょうたい}）","conn":"自动词て形 ＋ います","zh":"表示动作结果的持续状态（“…着”）。","ex":[{"jp":"{店|みせ}が{閉|し}まっています。","zh":"店关着门。","src":""},{"jp":"{電気|でんき}が{消|き}えています。","zh":"灯是灭的。","src":""},{"jp":"あ、{財布|さいふ}が{落|お}ちていますよ。","zh":"啊，钱包掉在地上了哦。","src":""}],"tips":["对比第7课的“正在进行”：{雨|あめ}が{降|ふ}っています（正在下雨）；{店|みせ}が{閉|し}まっています（关门的状态）。"],"official":"Vています（結果の状態）"}],"particles":[{"p":"は","rom":"wa","uses":[{"u":"提示话题（……是……）","ex":"{私|わたし}はマリアです。","zh":"我是玛丽亚。","lesson":1,"card":"1-1"},{"u":"提出宾语等作话题（取り立て），「を」变「は」","ex":"{荷物|にもつ}はバスの{中|なか}に{置|お}いてください。","zh":"行李请放在车里。","lesson":10,"card":"10-7"},{"u":"对比（～は…が、～は…）","ex":"{肉|にく}は{食|た}べますが、{魚|さかな}は{食|た}べません。","zh":"肉吃，但鱼不吃。","lesson":11,"card":"11-1"}]},{"p":"が","rom":"ga","uses":[{"u":"存在句的主语（新信息）","ex":"{箱根|はこね}に{温泉|おんせん}があります。","zh":"箱根有温泉。","lesson":4,"card":"4-8"},{"u":"逆接“但是”（～が、～）","ex":"{日本語|にほんご}は{難|むずか}しい "],["Ⅱ类","{食|た}べる→{食|た}べない、{見|み}る→{見|み}ない","去る＋ない"],["Ⅲ类","する→しない、{来|く}る→{来|こ}ない","来ない读こない"]]},{"name":"た形","lesson":11,"card":"11-3","rule":"过去的普通形，变法与て形相同（て→た、で→だ）。用于 ～たり～たりします（11）、～とき（11）、～たほうがいい（12）、～たことがあります（13）、～たら（15）。","rows":[["Ⅰ类","{買|か}う→{買|か}った、{飲|の}む→{飲|の}んだ、{書|か}く→{書|か}いた、{話|はな}す→{話|はな}した","同て形"],["例外","{行|い}く→{行|い}った",""],["Ⅱ类","{食|た}べる→{食|た}べた",""],["Ⅲ类","する→した、{来|く}る→{来|き}た",""]]},{"name":"普通形（友達言葉）","lesson":11,"card":"11-7","rule":"朋友之间说话、以及 ～と思います（14・15）、～そうです（15）、名词修饰（13）、～んです（12）等的接续基础。","rows":[["动词","{行|い}く／{行|い}かない／{行|い}った／{行|い}かなかった","ます→辞书形等"],["い形容词","{高|たか}い／{高|たか}くない／{高|たか}かった／{高|たか}くなかった","去掉です"],["な形容词","{暇|ひま}だ／{暇|ひま}じゃない／{暇|ひま}だった／{暇|ひま}じゃなかった","です→だ"],["名词","{雨|あめ}だ／{雨|あめ}じゃない／{雨|あめ}だった／{雨|あめ}じゃなかった","です→だ"]]},{"name":"形容词的变化","lesson":4,"card":"4-5","rule":"第4课否定、第5课过去、第8课て形（中顿）、第10课～なります。いい 特殊：よくない・よかった・よくて・よくなります。","rows":[["い形容词","{高|たか}いです→{高|たか}くないです→{高|たか}かったです→{高|たか}くなかったです／{高|たか}くて／{高|たか}くなります","い→く／かった"],["な形容词","{静|しず}かです→{静|しず}かじゃありません→{静|しず}かでした→{静|しず}かじゃありませんでした／{静|しず}かで／{静|しず}かになります","同名词"],["名词","{雨|あめ}です→{雨|あめ}じゃありません→{雨|あめ}でした→{雨|あめ}じゃありませんでした／{雨|あめ}で／{雨|あめ}になります",""]]}],"stats":{"cards":136,"examples":315,"textbook":29,"new":286,"perLesson":{"1":9,"2":10,"3":12,"4":14,"5":12,"6":11,"7":11,"8":10,"9":7,"10":10,"11":7,"12":4,"13":7,"14":6,"15":6},"particles":13,"particleUses":50,"conj":7}};
const PALETTE = {noun:"#2563eb",q:"#7c3aed",num:"#0891b2",exist:"#059669",verb:"#dc2626",particle:"#db2777",adj:"#ea580c",invite:"#0d9488",want:"#c026d3",te:"#4f46e5",form:"#9333ea",give:"#d97706",conn:"#0284c7",mood:"#65a30d"};
const catMap = new Map(DATA.categories.map(function(c){ return [c.id, c]; }));
const cardMap = new Map(DATA.cards.map(function(c){ return [c.id, c]; }));
const state = {view:"cards", lesson:"all", cat:"all", q:""};

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toHira(s){ return String(s).replace(/[\u30a1-\u30f6]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }
function ruby(s){ return esc(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>"); }
function plain(s){ return String(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "$1"); }
function yomi(s){ return String(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "$2"); }
function color(cat){ return PALETTE[cat] || "#4f46e5"; }

function cardHTML(c){
  var cat = catMap.get(c.cat);
  var exs = c.ex.map(function(e){
    return '<div class="ex"><div class="jp">' + ruby(e.jp) + (e.src ? ' <span class="badge tb">课本例句 ' + esc(e.src) + '</span>' : '') +
      '</div><div class="exz">' + esc(e.zh) + '</div></div>';
  }).join("");
  var tips = c.tips.length ? '<div class="tips">' + c.tips.map(function(t){ return "<div>" + ruby(t) + "</div>"; }).join("") + "</div>" : "";
  return '<article class="card" id="card-' + c.id + '" data-id="' + c.id + '" style="--c:' + color(c.cat) + '">' +
    '<div class="top"><span class="badge id">' + c.id + '</span><span class="badge">ST' + c.st + '</span><span class="badge cat">' + cat.icon + " " + esc(cat.name) + '</span></div>' +
    '<div class="pattern">' + ruby(c.pattern) + '</div>' +
    '<div class="conn"><b>接续</b>　' + esc(c.conn) + '</div>' +
    '<div class="mean">' + esc(c.zh) + '</div>' +
    '<div class="exs">' + exs + '</div>' + tips + '</article>';
}
function buildCards(){
  var html = DATA.lessons.map(function(L){
    var cs = DATA.cards.filter(function(c){ return c.lesson === L.n; });
    var sts = [1,2,3].map(function(s){
      var list = cs.filter(function(c){ return c.st === s; });
      if (!list.length) return "";
      return '<div class="st" data-st="' + s + '"><div class="sthead">ST' + s + '　<b>' + ruby(L.st[s-1]) + '</b><br>Can-do：' + esc(L.cando[s-1]) + '</div><div class="grid">' + list.map(cardHTML).join("") + '</div></div>';
    }).join("");
    return '<details class="lesson" id="lesson-' + L.n + '" data-lesson="' + L.n + '" open><summary><span class="lnum">第' + L.n + '课</span><span class="ltitle">' + ruby(L.title) + '<small>' + esc(L.zh) + '</small></span><span class="count"></span></summary><div class="inside">' + sts + '</div></details>';
  }).join("");
  document.getElementById("content").innerHTML = html;
}
function hay(c){
  var p = [c.id, "第" + c.lesson + "课", c.pattern, plain(c.pattern), yomi(c.pattern), c.conn, c.zh, c.official, c.cando];
  c.ex.forEach(function(e){ p.push(plain(e.jp), yomi(e.jp), e.zh, e.src); });
  c.tips.forEach(function(t){ p.push(plain(t), yomi(t)); });
  return toHira(p.join(" ").toLowerCase());
}
const HAY = new Map(DATA.cards.map(function(c){ return [c.id, hay(c)]; }));
function matchCard(c){
  if (state.lesson !== "all" && c.lesson !== +state.lesson) return false;
  if (state.cat !== "all" && c.cat !== state.cat) return false;
  return !state.q || HAY.get(c.id).indexOf(state.q) !== -1;
}
function filterCards(){
  var total = 0;
  document.querySelectorAll(".lesson").forEach(function(sec){
    var n = 0;
    sec.querySelectorAll(".st").forEach(function(st){
      var k = 0;
      st.querySelectorAll(".card").forEach(function(el){
        var v = matchCard(cardMap.get(el.dataset.id));
        el.classList.toggle("hidden", !v);
        if (v) k++;
      });
      st.classList.toggle("hidden", k === 0);
      n += k;
    });
    sec.classList.toggle("hidden", n === 0);
    sec.querySelector(".count").textContent = n + " 条";
    if (n && state.q) sec.open = true;
    total += n;
  });
  document.getElementById("empty").classList.toggle("hidden", total > 0);
  document.getElementById("resultText").textContent = "显示 " + total + " 条语法";
}
function buildParticles(){
  document.getElementById("v-particles").innerHTML =
    '<div class="legend"><b>助词总结：</b>按助词整理1–15课出现的主要用法，右侧按钮跳到对应语法卡片。</div>' +
    DATA.particles.map(function(p){
      return '<div class="pblock"><span class="pname">' + esc(p.p) + '</span><span class="prom">' + esc(p.rom) + '</span>' +
        p.uses.map(function(u){
          return '<div class="puse"><div class="u">' + esc(u.u) + '<button type="button" class="ljump" data-jump="' + u.card + '">第' + u.lesson + '课 ' + u.card + ' →</button></div>' +
            '<div class="jp">' + ruby(u.ex) + '</div><div class="exz">' + esc(u.zh) + '</div></div>';
        }).join("") + '</div>';
    }).join("");
}
function buildConj(){
  document.getElementById("v-conj").innerHTML =
    '<div class="legend"><b>活用规则：</b>只收1–15课学过的形式（ます形3课、て形7课、辞书形9课、ない形10课、た形11课、普通形11课；形容词4・5・8・10课）。</div>' +
    DATA.conj.map(function(c){
      return '<div class="pblock"><div><span class="pname" style="font-size:22px">' + esc(c.name) + '</span><button type="button" class="ljump" data-jump="' + c.card + '">第' + c.lesson + '课 ' + c.card + ' →</button></div>' +
        '<div class="mean">' + esc(c.rule) + '</div><table class="conj">' +
        c.rows.map(function(r){ return "<tr><td>" + esc(r[0]) + "</td><td>" + ruby(r[1]) + "</td><td>" + ruby(r[2]) + "</td></tr>"; }).join("") + "</table></div>";
    }).join("");
}
// ---------- common ----------
function buildChips(){
  var ls = [{v:"all", t:"全部课"}].concat(DATA.lessons.map(function(L){ return {v:String(L.n), t:String(L.n)}; }));
  document.getElementById("lchips").innerHTML = ls.map(function(x){ return '<button type="button" class="chip lc' + (x.v === "all" ? " active" : "") + '" data-lesson="' + x.v + '">' + (x.v === "all" ? x.t : "第" + x.t + "课") + "</button>"; }).join("");
  var cs = [{id:"all", icon:"✦", name:"全部分类"}].concat(DATA.categories);
  document.getElementById("cchips").innerHTML = cs.map(function(c){ return '<button type="button" class="chip' + (c.id === "all" ? " active" : "") + '" data-cat="' + c.id + '">' + c.icon + " " + esc(c.name) + "</button>"; }).join("");
}
function refresh(){
  if (state.view === "cards") filterCards();
  else document.getElementById("resultText").textContent = "";
}
function setView(v){
  state.view = v;
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.dataset.view === v); });
  ["cards","particles","conj"].forEach(function(x){ document.getElementById("v-" + x).classList.toggle("hidden", x !== v); });
  var showFilters = v === "cards";
  ["q","lchips","cchips"].forEach(function(id){ document.getElementById(id).classList.toggle("hidden", !showFilters); });
  refresh();
}
function jump(id){
  state.lesson = "all"; state.cat = "all"; state.q = "";
  document.getElementById("q").value = "";
  document.querySelectorAll("#lchips .chip").forEach(function(x){ x.classList.toggle("active", x.dataset.lesson === "all"); });
  document.querySelectorAll("#cchips .chip").forEach(function(x){ x.classList.toggle("active", x.dataset.cat === "all"); });
  setView("cards");
  var el = document.getElementById("card-" + id);
  if (el) { el.closest("details").open = true; el.scrollIntoView({behavior:"smooth", block:"start"}); el.classList.add("flash"); setTimeout(function(){ el.classList.remove("flash"); }, 1600); }
}
document.addEventListener("click", function(e){
  var t;
  if ((t = e.target.closest(".tab"))) { setView(t.dataset.view); return; }
  if ((t = e.target.closest("[data-jump]"))) { jump(t.dataset.jump); return; }
  if ((t = e.target.closest("#lchips .chip"))) {
    state.lesson = t.dataset.lesson;
    document.querySelectorAll("#lchips .chip").forEach(function(x){ x.classList.toggle("active", x === t); });
    refresh();
    if (state.view === "cards" && state.lesson !== "all") { var s = document.getElementById("lesson-" + state.lesson); if (s) { s.open = true; s.scrollIntoView({behavior:"smooth", block:"start"}); } }
    return;
  }
  if ((t = e.target.closest("#cchips .chip"))) {
    state.cat = t.dataset.cat;
    document.querySelectorAll("#cchips .chip").forEach(function(x){ x.classList.toggle("active", x === t); });
    refresh(); return;
  }
});
document.getElementById("q").addEventListener("input", function(e){ state.q = toHira(e.target.value.trim().toLowerCase()); refresh(); });
document.getElementById("tEx").addEventListener("change", function(e){ document.body.classList.toggle("hide-ex", !e.target.checked); });
(function(){
  var s = DATA.stats;
  document.getElementById("stats").innerHTML =
    '<span class="stat">' + s.cards + ' 个语法点</span><span class="stat">' + s.examples + ' 条例句（课本 ' + s.textbook + '）</span>' +
    '<span class="stat">' + s.particles + ' 组助词</span><span class="stat">' + s.conj + ' 组活用规则</span>';
  buildChips(); buildCards(); buildParticles(); buildConj(); setView("cards");
})();
</script>
