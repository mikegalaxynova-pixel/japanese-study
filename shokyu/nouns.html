<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>できる日本語 初級｜名词复习</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --ink:#172033; --muted:#5f6b7a; --line:#e2e6ef;
  --accent:#0f766e; --accent-ink:#fff; --soft:#e6f4f1;
  --extra:#b45309; --extra-bg:#fff7ed; --pair:#6d28d9; --pair-bg:#f5f3ff;
  --suru:#be185d; --suru-bg:#fdf2f8; --col:#0f766e; --col-bg:#f0fdfa; --irr:#fef3c7;
  --shadow:0 8px 24px rgba(23,32,51,.06); --tap:46px;
}
:root[data-theme="dark"]{
  --bg:#0f172a; --panel:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
  --accent:#5eead4; --accent-ink:#042f2e; --soft:#133b37;
  --extra:#fdba74; --extra-bg:#3b2714; --pair:#c4b5fd; --pair-bg:#2e1065;
  --suru:#f9a8d4; --suru-bg:#4a0f2c; --col:#5eead4; --col-bg:#0b2e2b; --irr:#4a3b0b; --shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --panel:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
    --accent:#5eead4; --accent-ink:#042f2e; --soft:#133b37;
    --extra:#fdba74; --extra-bg:#3b2714; --pair:#c4b5fd; --pair-bg:#2e1065;
    --suru:#f9a8d4; --suru-bg:#4a0f2c; --col:#5eead4; --col-bg:#0b2e2b; --irr:#4a3b0b; --shadow:none;
  }
}
:root[data-theme="dark"]{color-scheme:dark} :root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.big{font-size:19px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK JP","PingFang SC","Noto Sans SC",sans-serif}
button,input{font:inherit}
header{padding:22px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));background:linear-gradient(135deg,#0f766e 0%,#0e7490 55%,#4338ca 100%);color:#fff}
h1{font-size:clamp(22px,6.4vw,32px);line-height:1.25;margin:0 0 6px}
header p{margin:0;opacity:.92;font-size:.94rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:#ffffff22;border:1px solid #ffffff3a;border-radius:999px;padding:5px 10px;font-weight:700;font-size:.8rem}
.toolbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left)) 6px}
.search{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:10px 14px;outline:none;font-size:16px}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chips{display:flex;gap:7px;overflow:auto;padding:7px 0 1px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:999px;white-space:nowrap;min-height:40px;cursor:pointer;font-size:.9rem}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:750}
.lchips .chip{min-width:44px;padding:7px 10px;text-align:center}
.controls{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;padding-top:4px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.toggles{display:flex;gap:2px 12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px;min-height:36px;cursor:pointer;white-space:nowrap}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.btns{display:flex;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;min-height:36px;padding:4px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-left)) 88px}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 15px;margin:4px 0 12px;box-shadow:var(--shadow);font-size:.9rem;line-height:1.9}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:.72rem;font-weight:800;white-space:nowrap;line-height:1.6;vertical-align:middle}
.badge.book{color:var(--accent);background:var(--soft)}
.badge.extra{color:var(--extra);background:var(--extra-bg);border:1px solid color-mix(in srgb,var(--extra) 35%,transparent)}
.badge.suru{color:var(--suru);background:var(--suru-bg);border:1px solid color-mix(in srgb,var(--suru) 35%,transparent)}
.badge.tb{color:var(--col);background:var(--col-bg);border:1px solid color-mix(in srgb,var(--col) 30%,transparent);font-size:.68rem;padding:0 6px}
.badge.otype{color:var(--muted);background:var(--bg);border:1px solid var(--line)}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
details.section{margin:10px 0;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c,var(--accent));border-radius:18px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:210px}
summary{list-style:none;cursor:pointer;min-height:56px;padding:13px 16px;display:flex;align-items:center;gap:8px;font-size:1.08rem;font-weight:850}
summary::-webkit-details-marker{display:none}
.caret{margin-left:auto;color:var(--muted);transition:transform .18s}
details[open]>summary .caret{transform:rotate(180deg)}
.count{color:var(--muted);font-size:.8rem;font-weight:650}
.inside{padding:0 10px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.card{background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--c,var(--accent));border-radius:16px;padding:12px 12px 11px;min-width:0}
.card.extra-card{border-style:dashed;border-left-style:solid;background:color-mix(in srgb,var(--extra-bg) 55%,var(--bg))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.word{font-size:1.45rem;font-weight:860;line-height:1.35;overflow-wrap:anywhere}
.kana{display:block;margin-top:2px;color:var(--muted);font-size:.95rem;font-weight:700;letter-spacing:.04em}
.meaning{font-size:1.1rem;font-weight:800;color:var(--c,var(--accent));margin:6px 0 6px;line-height:1.45}
.meta{font-size:.85rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:750}
.also{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.surul{font-size:.88rem;margin-top:4px}
.surul b{color:var(--suru)}
.cardnote{margin:7px 0 0;font-size:.8rem;color:var(--muted);background:var(--panel);border-radius:8px;padding:6px 8px}
.cols{margin-top:9px;border-top:1px dashed var(--line);padding-top:6px}
.col{background:var(--panel);border-left:3px solid var(--col);border-radius:8px;padding:6px 9px;margin-top:6px}
.cphrase{font-size:1.05rem;font-weight:800;line-height:2}
.cz{font-size:.8rem;font-weight:600;color:var(--muted);margin-left:4px}
.ex{font-size:1rem;line-height:2.15;margin-top:1px}
.exz{font-size:.86rem;color:var(--muted);line-height:1.5}
body.hide-ex .ex, body.hide-ex .exz{display:none}
body.hide-col .cols{display:none}
ruby{ruby-position:over}
rt{font-size:.55em;font-weight:600;color:var(--muted);letter-spacing:0}
.pair{border:2px solid color-mix(in srgb,var(--pair) 42%,var(--line));border-radius:18px;padding:10px;background:var(--pair-bg);margin:0 0 12px}
.pairtitle{display:flex;align-items:center;gap:8px;color:var(--pair);font-weight:850;margin:0 2px 8px;font-size:.88rem}
.paircards{display:grid;grid-template-columns:1fr 36px 1fr;align-items:stretch;gap:6px}
.paircards .card{background:var(--panel)}
.paircards .card .col,.paircards .card .cardnote{background:var(--bg)}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--pair);font-size:22px;font-weight:900}
.pairnote{font-size:.88rem;color:var(--muted);margin:8px 4px 2px}
.pair.solo .arrow{display:none}
.pair.solo .paircards{grid-template-columns:1fr}
.ctable{margin:0 0 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:10px}
.ctable h3{margin:0 0 4px;font-size:1rem}
.ctable p{margin:0 0 8px;font-size:.8rem;color:var(--muted)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:.82rem;white-space:nowrap}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:center}
th{background:var(--panel);position:sticky;left:0}
td.irr{background:var(--irr);font-weight:800}
.ogroup h3{margin:8px 4px 6px;font-size:.95rem;color:var(--muted)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin-bottom:8px}
.ocard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.oword{font-size:1.1rem;font-weight:820}
.ozh{font-weight:750;color:var(--accent);font-size:.95rem}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:8px 12px 28px}
@media (max-width:640px){
  .paircards{grid-template-columns:1fr}
  .arrow{height:26px;transform:rotate(90deg)}
}

/* site chrome: home link + prevent horizontal overflow */
html{overflow-x:hidden;max-width:100%}
body{max-width:100%}
img,svg,video,canvas{max-width:100%;height:auto}
.site-home{display:inline-flex;align-items:center;min-height:48px;padding:0 8px 0 0;margin:0 0 2px;color:#fff;font-weight:700;font-size:16px;line-height:1.2;text-decoration:none;letter-spacing:.02em}
.site-home:hover{text-decoration:underline}
.site-home:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:4px}

</style>
</head>

<header>
  <a class="site-home" href="../index.html">← 首页</a>
  <h1>できる日本語 初級<br>名词复习</h1>
  <p>按含义分类 · 平假名注音 · 对照记忆 · する名词 · 搭配例句 · 量词速查</p>
  <div class="stats" id="stats"></div>
</header>
<div class="toolbar">
  <input id="q" class="search" type="search" placeholder="搜索：日语／假名／中文／例句…" autocomplete="off" enterkeyhint="search" aria-label="搜索名词">
  <div class="chips" id="chips" aria-label="分类"></div>
  <div class="chips lchips" id="lchips" aria-label="课次"></div>
  <div class="controls">
    <div class="toggles">
      <label class="toggle"><input id="showExtras" type="checkbox" checked>书里没有</label>
      <label class="toggle"><input id="onlySuru" type="checkbox">只看する</label>
      <label class="toggle"><input id="showCol" type="checkbox" checked>搭配</label>
      <label class="toggle"><input id="showEx" type="checkbox" checked>例句</label>
    </div>
    <div class="btns">
      <button type="button" class="tbtn" id="bigBtn" aria-pressed="false">A+ 大字</button>
      <button type="button" class="tbtn" id="themeBtn">🌓 自动</button>
    </div>
  </div>
  <div class="controls"><span id="resultText"></span><button type="button" class="tbtn" id="foldBtn">全部收起</button></div>
</div>
<main>
  <div class="legend">
    <b>图例：</b>
    <span class="badge book">课本</span> 课本名词（跨课合并，课次全部保留；“另见”＝在课本例句／短语中出现）；
    <span class="badge suru">する</span> 可以直接加「する」变成动词（例：旅行→旅行する）；
    <span class="badge extra">书里没有</span> 为对照记忆补充的词；
    <span class="badge tb">课本例句</span> 例句原文取自课本（<span class="badge tb">课本搭配</span>＝搭配本身是课本词条，例句为新写）。
    卡片左边的颜色＝分类。汉字读音一律用<strong>平假名</strong>；外来语保留片假名写法，读音也用平假名。分类默认收起，点开再加载。
  </div>
  <div id="content"></div>
  <div id="empty" class="empty hidden">没有匹配的词</div>
</main>
<footer>单文件离线版 · できる日本語 初級 第1〜15课</footer>

    '<span class="stat">' + s.colItems + ' 条搭配例句</span>' +
    '<span class="stat">其他 ' + s.others + ' 条</span>';
  var chips = [{id:"all", icon:"✦", name:"全部"}].concat(DATA.categories, [{id:"other", icon:"💬", name:"其他（副词・寒暄・疑问词…）"}]);
  document.getElementById("chips").innerHTML = chips.map(function(c){
    return '<button type="button" class="chip' + (c.id === "all" ? " active" : "") + '" data-cat="' + c.id + '">' + c.icon + " " + esc(c.name) + "</button>";
  }).join("");
  var l = '<button type="button" class="chip active" data-lesson="0">全部课</button>';
  for (var i = 1; i <= 15; i++) l += '<button type="button" class="chip" data-lesson="' + i + '">第' + i + "课</button>";
  document.getElementById("lchips").innerHTML = l;
  var content = document.getElementById("content");
  var defs = DATA.categories.map(function(c){ return {id:c.id, name:c.name, icon:c.icon, color:c.color, other:false}; });
  defs.push({id:"other", name:"其他（副词・寒暄・疑问词…）", icon:"💬", color:"#64748b", other:true});
  defs.forEach(function(d){
    var det = document.createElement("details");
    det.className = "section"; det.id = "cat-" + d.id; det.dataset.cat = d.id; det.style.setProperty("--c", d.color);
    det.innerHTML = "<summary><span>" + d.icon + "</span><span>" + esc(d.name) + '</span><span class="count"></span><span class="caret">⌄</span></summary><div class="inside"></div>';
    content.appendChild(det);
    var S = {id:d.id, other:d.other, el:det, inside:det.querySelector(".inside"), count:det.querySelector(".count"), rendered:false, dirty:true, matched:[],
             records:DATA.records.filter(function(r){ return d.other ? r.kind === "other" : (r.kind === "noun" && r.category === d.id); })};
    det.addEventListener("toggle", function(){ if (det.open && (S.dirty || !S.rendered)) { renderSection(S); S.dirty = false; } });
    SECTIONS.push(S);
  });
  var h = decodeURIComponent((location.hash || "").slice(1)), o = (location.search.match(/[?&]open=([a-z]+)/) || [])[1];
  SECTIONS.forEach(function(S){ if (h === "cat-" + S.id || o === S.id) S.el.open = true; });
  filter();
  if (o) setTimeout(function(){ window.scrollTo(0, 0); }, 50);
}
function filter(){
  var total = 0, autoOpen = !!(state.q || state.lesson || state.suru);
  SECTIONS.forEach(function(S){
    var catOK = state.cat === "all" || state.cat === S.id;
    S.matched = catOK ? S.records.filter(match) : [];
    total += S.matched.length;
    S.el.classList.toggle("hidden", S.matched.length === 0);
    S.count.textContent = S.matched.length + (S.other ? " 条" : " 张");
    S.dirty = true;
    if (S.matched.length && (autoOpen || state.cat === S.id)) S.el.open = true;
    if (S.el.open) { renderSection(S); S.dirty = false; }
  });
  document.getElementById("empty").classList.toggle("hidden", total > 0);
  document.getElementById("resultText").textContent = "显示 " + total + " 条";
}
document.addEventListener("click", function(e){
  var b = e.target.closest(".chip");
  if (!b) return;
  if (b.dataset.lesson !== undefined) {
    state.lesson = +b.dataset.lesson;
    document.querySelectorAll("#lchips .chip").forEach(function(x){ x.classList.toggle("active", x === b); });
    filter(); return;
  }
  state.cat = b.dataset.cat;
  document.querySelectorAll("#chips .chip").forEach(function(x){ x.classList.toggle("active", x === b); });
  filter();
  if (state.cat !== "all") {
    var el = document.getElementById("cat-" + state.cat);
    if (el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"start"});
  }
});
var timer = null;
document.getElementById("q").addEventListener("input", function(e){
  clearTimeout(timer);
  timer = setTimeout(function(){ state.q = norm(e.target.value); filter(); }, 150);
});
document.getElementById("showExtras").addEventListener("change", function(e){ state.extras = e.target.checked; filter(); });
document.getElementById("onlySuru").addEventListener("change", function(e){ state.suru = e.target.checked; filter(); });
document.getElementById("showCol").addEventListener("change", function(e){ document.body.classList.toggle("hide-col", !e.target.checked); });
document.getElementById("showEx").addEventListener("change", function(e){ document.body.classList.toggle("hide-ex", !e.target.checked); });
document.getElementById("foldBtn").addEventListener("click", function(){ SECTIONS.forEach(function(S){ S.el.open = false; }); });
function store(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
var THEMES = [["auto","🌓 自动"],["dark","🌙 深色"],["light","☀️ 浅色"]];
function applyTheme(t){
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeBtn").textContent = THEMES.filter(function(x){ return x[0] === t; })[0][1];
}
var theme = load("nounTheme") || "auto"; applyTheme(theme);
document.getElementById("themeBtn").addEventListener("click", function(){
  var i = THEMES.map(function(x){ return x[0]; }).indexOf(theme);
  theme = THEMES[(i + 1) % 3][0]; applyTheme(theme); store("nounTheme", theme);
});
function applyBig(on){ document.documentElement.classList.toggle("big", on); document.getElementById("bigBtn").setAttribute("aria-pressed", on ? "true" : "false"); }
var big = load("nounBig") === "1"; applyBig(big);
document.getElementById("bigBtn").addEventListener("click", function(){ big = !big; applyBig(big); store("nounBig", big ? "1" : null); });
build();
</script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register(new URL("../sw.js", location.href)).catch(function () {});
}
</script>
