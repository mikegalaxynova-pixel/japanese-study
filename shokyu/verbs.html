<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日语复习">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<title>できる日本語 初級｜动词复习</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --ink:#172033; --muted:#5f6b7a; --line:#e2e6ef;
  --accent:#4f46e5; --accent-ink:#fff; --soft:#eef2ff;
  --extra:#b45309; --extra-bg:#fff7ed; --pair:#6d28d9; --pair-bg:#f5f3ff;
  --new:#047857; --new-bg:#ecfdf5; --col:#0f766e; --col-bg:#f0fdfa;
  --shadow:0 8px 24px rgba(23,32,51,.06);
  --tap:46px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f172a; --panel:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
    --accent:#a5b4fc; --accent-ink:#1e1b4b; --soft:#1e293b;
    --extra:#fdba74; --extra-bg:#3b2714; --pair:#c4b5fd; --pair-bg:#2e1065;
    --new:#6ee7b7; --new-bg:#063b2c; --col:#5eead4; --col-bg:#0b2e2b;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK JP","PingFang SC","Noto Sans SC",sans-serif}
button,input{font:inherit}
header{padding:22px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));background:linear-gradient(135deg,#4338ca 0%,#6d28d9 55%,#7c3aed 100%);color:#fff}
h1{font-size:clamp(22px,6.4vw,32px);line-height:1.25;margin:0 0 6px}
header p{margin:0;opacity:.92}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:#ffffff22;border:1px solid #ffffff3a;border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px}
.toolbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left)) 8px}
.search{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:10px 14px;outline:none;font-size:16px}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chips{display:flex;gap:8px;overflow:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 13px;border-radius:999px;white-space:nowrap;min-height:42px;cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:750}
.controls{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;padding-top:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.toggles{display:flex;gap:4px 14px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:7px;min-height:38px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-left)) 88px}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin:4px 0 14px;box-shadow:var(--shadow);font-size:15px;line-height:1.9}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;white-space:nowrap;line-height:1.6;vertical-align:middle}
.badge.book{color:var(--accent);background:var(--soft)}
.badge.extra{color:var(--extra);background:var(--extra-bg);border:1px solid color-mix(in srgb,var(--extra) 35%,transparent)}
.badge.new{color:var(--new);background:var(--new-bg);border:1px solid color-mix(in srgb,var(--new) 35%,transparent)}
.badge.tb{color:var(--col);background:var(--col-bg);border:1px solid color-mix(in srgb,var(--col) 30%,transparent);font-size:11px;padding:0 6px}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
details.section{margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:170px}
summary{list-style:none;cursor:pointer;min-height:58px;padding:14px 16px;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:850}
summary::-webkit-details-marker{display:none}
.caret{margin-left:auto;color:var(--muted);transition:transform .18s}
details[open]>summary .caret{transform:rotate(180deg)}
.count{color:var(--muted);font-size:13px;font-weight:650}
.inside{padding:0 10px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:13px 13px 12px;min-width:0}
.card.extra-card{border-style:dashed;border-color:color-mix(in srgb,var(--extra) 50%,var(--line));background:color-mix(in srgb,var(--extra-bg) 55%,var(--bg))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.word{font-size:24px;font-weight:860;line-height:1.35;overflow-wrap:anywhere}
.kana{display:block;margin-top:2px;color:var(--muted);font-size:15px;font-weight:700;letter-spacing:.04em}
.meaning{font-size:18px;font-weight:800;color:var(--accent);margin:8px 0 10px;line-height:1.45}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.field{background:var(--panel);border-radius:10px;padding:7px 8px;min-width:0}
.field.wide{grid-column:1/-1}
.label{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:2px}
.formvalue{font-size:15px;overflow-wrap:anywhere}
.also{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.note{margin:8px 0 0;font-size:13px;color:var(--muted)}
.cols{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.colhead{font-size:12px;font-weight:800;color:var(--col);letter-spacing:.08em;margin-bottom:4px}
.col{background:var(--panel);border-left:3px solid var(--col);border-radius:8px;padding:7px 9px;margin-top:6px}
.cphrase{font-size:17px;font-weight:800;line-height:2}
.cz{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.ex{font-size:16px;line-height:2.15;margin-top:1px}
.exz{font-size:14px;color:var(--muted);line-height:1.5}
body.hide-ex .ex, body.hide-ex .exz{display:none}
body.hide-col .cols{display:none}
ruby{ruby-position:over}
rt{font-size:.55em;font-weight:600;color:var(--muted);letter-spacing:0}
.pair{border:2px solid color-mix(in srgb,var(--pair) 42%,var(--line));border-radius:18px;padding:10px;background:var(--pair-bg);margin:0 0 12px}
.pairtitle{display:flex;align-items:center;gap:8px;color:var(--pair);font-weight:850;margin:0 2px 8px;font-size:14px}
.paircards{display:grid;grid-template-columns:1fr 36px 1fr;align-items:stretch;gap:6px}
.paircards .card{background:var(--panel)}
.paircards .card .field,.paircards .card .col{background:var(--bg)}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--pair);font-size:22px;font-weight:900}
.pairnote{font-size:14px;color:var(--muted);margin:8px 4px 2px}
.pair.solo .arrow{display:none}
.pair.solo .paircards{grid-template-columns:1fr}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:13px;padding:8px 12px 28px}
@media (max-width:640px){
  .paircards{grid-template-columns:1fr}
  .arrow{height:28px;transform:rotate(90deg)}
  .word{font-size:22px}
  .forms{grid-template-columns:1fr 1fr}
}

/* site chrome: home link + prevent horizontal overflow */
html{overflow-x:hidden;max-width:100%}
body{max-width:100%}
img,svg,video,canvas{max-width:100%;height:auto}
.site-home{display:inline-flex;align-items:center;min-height:48px;padding:0 8px 0 0;margin:0 0 2px;color:#fff;font-weight:700;font-size:16px;line-height:1.2;text-decoration:none;letter-spacing:.02em}
.site-home:hover{text-decoration:underline}
.site-home:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:4px}


    .header-links { display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center; }
    .site-kana { display:inline-flex; align-items:center; min-height:48px; color:#fff; font-weight:700; font-size:16px; text-decoration:none; }
    .site-kana:focus-visible { outline:2px solid #fff; outline-offset:3px; border-radius:4px; }
</style>

const byKey = new Map(DATA.records.map(function(x){ return [x.key, x]; }));
const paired = new Set(DATA.pairs.flatMap(function(p){ return [p.a, p.b]; }));
const state = {cat:"all", q:"", extras:true};

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function toHira(s){
  return String(s).replace(/[\u30a1-\u30f6]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0x60); });
}
// {漢字|かんじ} -> <ruby>
function ruby(s){
  return esc(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
}
function plain(s){ return String(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "$1"); }
function yomi(s){ return String(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "$2"); }
function hasKanji(s){ return /[\u4e00-\u9fff々]/.test(s); }
function withKana(word, reading){
  return esc(word) + '<span class="kana">' + esc(reading) + "</span>";
}
function formLine(text, reading){
  return hasKanji(text) ? esc(text) + "（" + esc(reading) + "）" : esc(text);
}
function lessonLine(r){
  if (!r.book) return "—（补充词）";
  var s = esc(r.lessons.join("、"));
  if (r.also && r.also.length){
    s += '<span class="also">另见：' + r.also.map(function(a){ return esc(a.lesson) + "「" + esc(a.text) + "」"; }).join("；") + "</span>";
  }
  return s;
}
function colBlock(r){
  if (!r.col || !r.col.length) return "";
  return '<div class="cols"><div class="colhead">固定搭配・例句</div>' + r.col.map(function(c){
    return '<div class="col"><div class="cphrase">' + ruby(c.c) + '<span class="cz">' + esc(c.cz) + "</span>" +
      (c.src ? ' <span class="badge tb">课本例句 ' + esc(c.src) + "</span>" : "") + "</div>" +
      '<div class="ex">' + ruby(c.ex) + '</div><div class="exz">' + esc(c.exz) + "</div></div>";
  }).join("") + "</div>";
}
function card(r){
  var badges = '<span class="badge ' + (r.book ? "book" : "extra") + '">' + (r.book ? "课本" : "书里没有") + "</span>";
  if (r.new) badges += '<span class="badge new">本次补全</span>';
  var extraNote = (!r.book && r.note) ? '<p class="note">' + esc(r.note) + "</p>" : "";
  return '<article class="card ' + (r.book ? "" : "extra-card") + '" data-key="' + esc(r.key) + '">' +
    '<div class="top"><div class="word">' + withKana(r.jp, r.masu_reading) + '</div><div class="badges">' + badges + "</div></div>" +
    '<div class="meaning">' + esc(r.zh) + "</div>" +
    '<div class="forms">' +
      '<div class="field"><span class="label">辞書形</span><span class="formvalue">' + formLine(r.dictf, r.reading) + "</span></div>" +
      '<div class="field"><span class="label">て形</span><span class="formvalue">' + formLine(r.te, r.te_reading) + "</span></div>" +
      '<div class="field wide"><span class="label">课次</span><span class="formvalue">' + lessonLine(r) + "</span></div>" +
      '<div class="field wide"><span class="label">活用类型</span><span class="formvalue">' + esc(r.group) + "</span></div>" +
    "</div>" + extraNote + colBlock(r) + "</article>";
}
function pairBlock(p){
  return '<div class="pair" data-a="' + esc(p.a) + '" data-b="' + esc(p.b) + '">' +
    '<div class="pairtitle">↔ 反义・对照记忆</div>' +
    '<div class="paircards">' + card(byKey.get(p.a)) + '<div class="arrow" aria-hidden="true">↔</div>' + card(byKey.get(p.b)) + "</div>" +
    '<p class="pairnote">' + esc(p.explanation) + "</p></div>";
}
function build(){
  var s = DATA.stats;
  document.getElementById("stats").innerHTML =
    '<span class="stat">' + s.bookCards + ' 个课本动词</span>' +
    '<span class="stat">本次补全 ' + s.newCards + '</span>' +
    '<span class="stat">' + s.pairs + ' 组反义对照</span>' +
    '<span class="stat">' + s.extras + ' 个「书里没有」</span>' +
    '<span class="stat">' + s.colItems + ' 条搭配例句</span>';
  var chips = [{id:"all", icon:"✦", name:"全部"}].concat(DATA.categories);
  document.getElementById("chips").innerHTML = chips.map(function(c){
    return '<button type="button" class="chip ' + (c.id === "all" ? "active" : "") + '" data-cat="' + c.id + '">' + (c.icon || "") + " " + esc(c.name) + "</button>";
  }).join("");
  document.getElementById("content").innerHTML = DATA.categories.map(function(c){
    var ps = DATA.pairs.filter(function(p){ return p.category === c.id; });
    var singles = DATA.records.filter(function(r){ return r.category === c.id && !paired.has(r.key); });
    return '<details class="section" id="cat-' + c.id + '" data-cat="' + c.id + '" open>' +
      "<summary><span>" + c.icon + "</span><span>" + esc(c.name) + '</span><span class="count"></span><span class="caret">⌄</span></summary>' +
      '<div class="inside">' + ps.map(pairBlock).join("") + '<div class="grid">' + singles.map(card).join("") + "</div></div></details>";
  }).join("");
  filter();
}
function hay(r){
  var parts = [r.jp, r.dictf, r.reading, r.masu_reading, r.te, r.te_reading, r.zh, r.group, r.note || ""];
  (r.lessons || []).forEach(function(l){ parts.push(l); });
  (r.also || []).forEach(function(a){ parts.push(a.lesson, a.text); });
  (r.col || []).forEach(function(c){ parts.push(plain(c.c), yomi(c.c), c.cz, plain(c.ex), yomi(c.ex), c.exz); });
  return toHira(parts.join(" ").toLowerCase());
}
var HAY = new Map();
DATA.records.forEach(function(r){ HAY.set(r.key, hay(r)); });
function match(r){
  if (!r) return false;
  if (!state.extras && !r.book) return false;
  if (state.cat !== "all" && r.category !== state.cat) return false;
  if (!state.q) return true;
  return HAY.get(r.key).indexOf(state.q) !== -1;
}
function filter(){
  var total = 0;
  document.querySelectorAll(".section").forEach(function(sec){
    var count = 0, cat = sec.dataset.cat;
    var catOK = state.cat === "all" || state.cat === cat;
    sec.querySelectorAll(".pair").forEach(function(el){
      var va = catOK && match(byKey.get(el.dataset.a)), vb = catOK && match(byKey.get(el.dataset.b));
      var cards = el.querySelectorAll(".paircards > .card");
      cards[0].classList.toggle("hidden", !va);
      cards[1].classList.toggle("hidden", !vb);
      el.classList.toggle("hidden", !(va || vb));
      el.classList.toggle("solo", (va || vb) && !(va && vb));
      if (va) { count++; total++; }
      if (vb) { count++; total++; }
    });
    sec.querySelectorAll(".grid > .card").forEach(function(el){
      var v = catOK && match(byKey.get(el.dataset.key));
      el.classList.toggle("hidden", !v);
      if (v) { count++; total++; }
    });
    sec.classList.toggle("hidden", !catOK || count === 0);
    sec.querySelector(".count").textContent = count + " 张";
    if (catOK && count && state.q) sec.open = true;
  });
  document.getElementById("empty").classList.toggle("hidden", total > 0);
  document.getElementById("resultText").textContent = "显示 " + total + " 张词卡";
}
document.addEventListener("click", function(e){
  var b = e.target.closest(".chip");
  if (!b) return;
  state.cat = b.dataset.cat;
  document.querySelectorAll(".chip").forEach(function(x){ x.classList.toggle("active", x === b); });
  filter();
  if (state.cat !== "all") {
    var el = document.getElementById("cat-" + state.cat);
    if (el) { el.open = true; el.scrollIntoView({behavior:"smooth", block:"start"}); }
  }
});
document.getElementById("q").addEventListener("input", function(e){
  state.q = toHira(e.target.value.trim().toLowerCase());
  filter();
});
document.getElementById("showExtras").addEventListener("change", function(e){ state.extras = e.target.checked; filter(); });
document.getElementById("showCol").addEventListener("change", function(e){ document.body.classList.toggle("hide-col", !e.target.checked); });
document.getElementById("showEx").addEventListener("change", function(e){ document.body.classList.toggle("hide-ex", !e.target.checked); });
build();
</script>
