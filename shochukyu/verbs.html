<head>

<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --ink:#172033; --muted:#5f6b7a; --line:#e2e6ef;
  --accent:#4f46e5; --accent-ink:#fff; --soft:#eef2ff;
  --extra:#b45309; --extra-bg:#fff7ed; --pair:#6d28d9; --pair-bg:#f5f3ff;
  --col:#0f766e; --col-bg:#f0fdfa; --irr:#fef3c7; --say:#0369a1; --say-bg:#e0f2fe;
  --shadow:0 8px 24px rgba(23,32,51,.06); --tap:46px;
}
:root[data-theme="dark"]{
  --bg:#0f172a; --panel:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
  --accent:#a5b4fc; --accent-ink:#0f172a; --soft:#1e2a4a;
  --extra:#fdba74; --extra-bg:#3b2714; --pair:#c4b5fd; --pair-bg:#2e1065;
  --col:#5eead4; --col-bg:#0b2e2b; --irr:#4a3b0b; --say:#7dd3fc; --say-bg:#0c3049; --shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --panel:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
    --accent:#a5b4fc; --accent-ink:#0f172a; --soft:#1e2a4a;
    --extra:#fdba74; --extra-bg:#3b2714; --pair:#c4b5fd; --pair-bg:#2e1065;
    --col:#5eead4; --col-bg:#0b2e2b; --irr:#4a3b0b; --say:#7dd3fc; --say-bg:#0c3049; --shadow:none;
  }
}
:root[data-theme="dark"]{color-scheme:dark} :root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{font-size:17px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.big{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK JP","PingFang SC","Noto Sans SC",sans-serif}
button,input{font:inherit}
header{padding:20px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));background:linear-gradient(135deg,#312e81,#4f46e5 55%,#0891b2);color:#fff}
h1{font-size:clamp(22px,6.4vw,32px);line-height:1.25;margin:0 0 6px}
header p{margin:0;opacity:.92;font-size:.9rem}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.stat{background:#ffffff22;border:1px solid #ffffff3a;border-radius:999px;padding:4px 10px;font-weight:700;font-size:.78rem}
.toolbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:9px max(12px,env(safe-area-inset-left)) 5px}
.search{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:10px 14px;outline:none;font-size:16px}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chips{display:flex;gap:7px;overflow:auto;padding:7px 0 1px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;white-space:nowrap;min-height:40px;cursor:pointer;font-size:.88rem}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:750}
.lchips .chip{min-width:44px;padding:6px 10px;text-align:center}
.tchips .chip.active{background:var(--tc,var(--accent));border-color:var(--tc,var(--accent));color:#fff}
.controls{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;padding-top:4px;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.toggles{display:flex;gap:2px 12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px;min-height:36px;cursor:pointer;white-space:nowrap}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;min-height:38px;padding:4px 10px;cursor:pointer;font-size:.84rem;white-space:nowrap}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:800}
main{max-width:980px;margin:0 auto;padding:10px max(12px,env(safe-area-inset-left)) 88px}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin:4px 0 12px;box-shadow:var(--shadow);font-size:.86rem;line-height:1.9}
.subbar{padding:2px max(12px,env(safe-area-inset-left)) 0}
.ttsnote{position:fixed;z-index:50;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));max-width:640px;margin:0 auto;box-shadow:0 8px 30px rgba(0,0,0,.25);background:#fff7ed;color:#7c2d12;border:1px solid #fdba74;border-radius:12px;padding:10px 12px;font-size:.86rem;display:flex;gap:8px;align-items:flex-start}
:root[data-theme="dark"] .ttsnote{background:#3b2714;color:#fed7aa}
.ttsnote button{margin-left:auto;flex:0 0 auto}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:.7rem;font-weight:800;white-space:nowrap;line-height:1.6;vertical-align:middle}
.badge.book{color:var(--accent);background:var(--soft)}
.badge.extra{color:var(--extra);background:var(--extra-bg);border:1px solid color-mix(in srgb,var(--extra) 35%,transparent)}
.badge.tb{color:var(--col);background:var(--col-bg);border:1px solid color-mix(in srgb,var(--col) 30%,transparent);font-size:.66rem;padding:0 6px}
.badge.nw{color:var(--muted);background:var(--bg);border:1px solid var(--line);font-size:.66rem;padding:0 6px}
.badge.otype{color:var(--muted);background:var(--bg);border:1px solid var(--line)}
.badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
details.section{margin:10px 0;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c,var(--accent));border-radius:18px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:230px}
summary{list-style:none;cursor:pointer;min-height:56px;padding:13px 16px;display:flex;align-items:center;gap:8px;font-size:1.06rem;font-weight:850}
summary::-webkit-details-marker{display:none}
.caret{margin-left:auto;color:var(--muted);transition:transform .18s}
details[open]>summary .caret{transform:rotate(180deg)}
.count{color:var(--muted);font-size:.8rem;font-weight:650}
.inside{padding:0 10px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.card{background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--c,var(--accent));border-radius:16px;padding:12px 12px 11px;min-width:0}
.card.extra-card{border-style:dashed;border-left-style:solid;background:color-mix(in srgb,var(--extra-bg) 55%,var(--bg))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.word{font-size:1.5rem;font-weight:860;line-height:1.35;overflow-wrap:anywhere}
.kana{display:block;margin-top:1px;color:var(--muted);font-size:.95rem;font-weight:700;letter-spacing:.04em}
.meaning{font-size:1.1rem;font-weight:800;color:var(--c,var(--accent));margin:6px 0 7px;line-height:1.45}
.meta{font-size:.84rem;color:var(--muted);margin-top:6px}
.meta b{color:var(--ink);font-weight:750}
.also{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.cardnote{margin:7px 0 0;font-size:.8rem;color:var(--muted);background:var(--panel);border-radius:8px;padding:6px 8px}
.forms{display:grid;grid-template-columns:1fr;gap:5px}
@media (min-width:700px){.forms{grid-template-columns:1fr 1fr}}
.field{background:var(--panel);border-radius:10px;padding:4px 6px 4px 9px;min-width:0;display:flex;align-items:center;gap:6px}
.field .fv{flex:1;min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px}
.field .fv .label{flex:0 0 5.4em}
.label{display:block;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.04em}
.formvalue{font-size:1rem;font-weight:700;overflow-wrap:anywhere}
.fr{font-size:.78rem;color:var(--muted);line-height:1.3;font-weight:600}
.cols{margin-top:9px;border-top:1px dashed var(--line);padding-top:6px}
.col{background:var(--panel);border-left:3px solid var(--col);border-radius:8px;padding:6px 9px;margin-top:6px}
.cphrase{font-size:1.06rem;font-weight:800;line-height:2.05}
.cz{font-size:.8rem;font-weight:600;color:var(--muted);margin-left:4px}
.ex{font-size:1rem;line-height:2.15;margin-top:1px}
.exz{font-size:.86rem;color:var(--muted);line-height:1.5}
body.hide-ex .ex, body.hide-ex .exz{display:none}
body.hide-col .cols{display:none}
ruby{ruby-position:over}
rt{font-size:.56em;font-weight:600;color:var(--muted);letter-spacing:0}
.say{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;border:1px solid color-mix(in srgb,var(--say) 35%,transparent);background:var(--say-bg);color:var(--say);border-radius:999px;min-width:34px;height:30px;padding:0 6px;margin:0 3px;font-size:.92rem;line-height:1;cursor:pointer;flex:0 0 auto;-webkit-tap-highlight-color:transparent}
.say.speaking{background:var(--say);color:#fff;border-color:var(--say);animation:pulse 1s ease-in-out infinite}
.word .say{height:34px;min-width:38px;font-size:1rem}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--say) 45%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.pair{border:2px solid color-mix(in srgb,var(--pair) 42%,var(--line));border-radius:18px;padding:10px;background:var(--pair-bg);margin:0 0 12px}
.pairtitle{display:flex;align-items:center;gap:8px;color:var(--pair);font-weight:850;margin:0 2px 8px;font-size:.88rem}
.paircards{display:grid;grid-template-columns:1fr 36px 1fr;align-items:stretch;gap:6px}
.paircards .card{background:var(--panel)}
.paircards .card .col,.paircards .card .cardnote,.paircards .card .field{background:var(--bg)}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--pair);font-size:22px;font-weight:900}
.pairnote{font-size:.88rem;color:var(--muted);margin:8px 4px 2px}
.pair.solo .arrow{display:none}
.pair.solo .paircards{grid-template-columns:1fr}
.ogroup h3{margin:8px 4px 6px;font-size:.95rem;color:var(--muted)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px;margin-bottom:8px}
.ocard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.oword{font-size:1.15rem;font-weight:820}
.ozh{font-weight:750;color:var(--accent);font-size:.95rem}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:8px 12px 28px}
@media (max-width:640px){
  .paircards{grid-template-columns:1fr}
  .arrow{height:26px;transform:rotate(90deg)}
}

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

var RB = /\{([^{}|]+)\|([^{}|]+)\}/g;
function ruby(s){ return esc(s).replace(RB, "<ruby>$1<rt>$2</rt></ruby>"); }

function hasKanji(s){ return /[\u4e00-\u9fff々]/.test(s); }

/* text spoken for a ruby string: the hiragana from the ruby (exact textbook reading),

function sayOf(s){

    DATA.otherTypes.forEach(function(t){
      var rs = S.matched.filter(function(r){ return r.otype === t.id; });
      if (rs.length) html += '<div class="ogroup"><h3>' + t.icon + " " + esc(t.name) + " · " + rs.length + '</h3><div class="ogrid">' + rs.map(APP.ocard).join("") + "</div></div>";
    });
  } else {
    if (APP.sectionTop) html += APP.sectionTop(S.id, state);
    var set = new Set(S.matched.map(function(r){ return r.key; })), done = new Set(), singles = [];
    S.matched.forEach(function(r){
      if (done.has(r.key)) return;
      var p = pairOf.get(r.key);
      if (p) { done.add(p.a); done.add(p.b); html += pairBlock(p, set.has(p.a), set.has(p.b)); }
      else singles.push(r);
    });
    html += '<div class="grid">' + singles.map(APP.card).join("") + "</div>";
  }
  S.inside.innerHTML = html;
  S.rendered = true;
}
function build(){
  document.getElementById("stats").innerHTML = APP.statsHtml(DATA.stats);
  var hasOther = !!(DATA.otherTypes && DATA.otherTypes.length);
  var otherDef = {id:"other", icon:"💬", name:APP.otherName || "其他", color:"#64748b"};
  var chips = [{id:"all", icon:"✦", name:"全部"}].concat(DATA.categories, hasOther ? [otherDef] : []);
  document.getElementById("chips").innerHTML = chips.map(function(c){
    return '<button type="button" class="chip' + (c.id === "all" ? " active" : "") + '" data-cat="' + c.id + '">' + c.icon + " " + esc(c.name) + "</button>";
  }).join("");
  var l = '<button type="button" class="chip active" data-lesson="0">全部课</button>';
  for (var i = 1; i <= 15; i++) l += '<button type="button" class="chip" data-lesson="' + i + '">第' + i + "课</button>";
  document.getElementById("lchips").innerHTML = l;
  document.getElementById("tchips").innerHTML = [{id:"all", name:"全部类型"}].concat(APP.types).map(function(t){
    return '<button type="button" class="chip' + (t.id === "all" ? " active" : "") + '" data-type="' + t.id + '"' + (t.color ? ' style="--tc:' + t.color + '"' : "") + ">" + esc(t.name) + "</button>";
  }).join("");
  var content = document.getElementById("content");
  var defs = DATA.categories.map(function(c){ return {id:c.id, name:c.name, icon:c.icon, color:c.color, other:false}; });
  if (hasOther) defs.push({id:"other", name:otherDef.name, icon:otherDef.icon, color:otherDef.color, other:true});
  defs.forEach(function(d){
    var det = document.createElement("details");
    det.className = "section"; det.id = "cat-" + d.id; det.dataset.cat = d.id; det.style.setProperty("--c", d.color);
    det.innerHTML = "<summary><span>" + d.icon + "</span><span>" + esc(d.name) + '</span><span class="count"></span><span class="caret">⌄</span></summary><div class="inside"></div>';
    content.appendChild(det);
    var S = {id:d.id, other:d.other, el:det, inside:det.querySelector(".inside"), count:det.querySelector(".count"), rendered:false, dirty:true, matched:[],
             records:DATA.records.filter(function(r){ return d.other ? r.kind === "other" : (r.kind !== "other" && r.category === d.id); })};
    det.addEventListener("toggle", function(){ if (det.open && (S.dirty || !S.rendered)) { renderSection(S); S.dirty = false; } });
    SECTIONS.push(S);
  });
  var h = decodeURIComponent((location.hash || "").slice(1)), o = (location.search.match(/[?&]open=([a-z]+)/) || [])[1];
  SECTIONS.forEach(function(S){ if (h === "cat-" + S.id || o === S.id || o === "all") S.el.open = true; });
  filter();
}
function filter(){
  var total = 0, autoOpen = !!(state.q || state.lesson || state.type !== "all");
  SECTIONS.forEach(function(S){
    var catOK = state.cat === "all" || state.cat === S.id;
    S.matched = catOK ? S.records.filter(match) : [];
    total += S.matched.length;
    S.el.classList.toggle("hidden", S.matched.length === 0);
    S.count.textContent = S.matched.length + (S.other ? " 条" : " 张");
    S.dirty = true;
    if (S.matched.length && (autoOpen || state.cat === S.id)) S.el.open = true;
    if (S.el.open) { renderSection(S); S.dirty = false; }
  });
  document.getElementById("empty").classList.toggle("hidden", total > 0);
  document.getElementById("resultText").textContent = "显示 " + total + " 条";
}
document.addEventListener("click", function(e){
  var b = e.target.closest(".chip");
  if (!b) return;
  if (b.dataset.lesson !== undefined) {
    state.lesson = +b.dataset.lesson;
    document.querySelectorAll("#lchips .chip").forEach(function(x){ x.classList.toggle("active", x === b); });
    filter(); return;
  }
  if (b.dataset.type !== undefined) {
    state.type = b.dataset.type;
    document.querySelectorAll("#tchips .chip").forEach(function(x){ x.classList.toggle("active", x === b); });
    filter(); return;
  }
  state.cat = b.dataset.cat;
  document.querySelectorAll("#chips .chip").forEach(function(x){ x.classList.toggle("active", x === b); });
  filter();
  if (state.cat !== "all") {
    var el = document.getElementById("cat-" + state.cat);
    if (el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"start"});
  }
});
var timer = null;
document.getElementById("q").addEventListener("input", function(e){
  clearTimeout(timer);
  timer = setTimeout(function(){ state.q = norm(e.target.value); filter(); }, 150);
});
document.getElementById("showExtras").addEventListener("change", function(e){ state.extras = e.target.checked; filter(); });
document.getElementById("showCol").addEventListener("change", function(e){ document.body.classList.toggle("hide-col", !e.target.checked); });
document.getElementById("showEx").addEventListener("change", function(e){ document.body.classList.toggle("hide-ex", !e.target.checked); });
document.getElementById("foldBtn").addEventListener("click", function(){ SECTIONS.forEach(function(S){ S.el.open = false; }); });
var THEMES = [["auto","🌓 自动"],["dark","🌙 深色"],["light","☀️ 浅色"]];
function applyTheme(t){
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeBtn").textContent = THEMES.filter(function(x){ return x[0] === t; })[0][1];
}
var theme = load("shochukyuTheme") || "auto"; applyTheme(theme);
document.getElementById("themeBtn").addEventListener("click", function(){
  var i = THEMES.map(function(x){ return x[0]; }).indexOf(theme);
  theme = THEMES[(i + 1) % 3][0]; applyTheme(theme); store("shochukyuTheme", theme);
});
function applyBig(on){ document.documentElement.classList.toggle("big", on); document.getElementById("bigBtn").setAttribute("aria-pressed", on ? "true" : "false"); }
var big = load("shochukyuBig") === "1"; applyBig(big);
document.getElementById("bigBtn").addEventListener("click", function(){ big = !big; applyBig(big); store("shochukyuBig", big ? "1" : null); });

/* ---------- click-to-speak (Web Speech API, offline system voices) ---------- */
var TTS = {
  ok: typeof window !== "undefined" && "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance !== "undefined",
  voice: null, hasJa: false, voicesLoaded: false, rate: load("shochukyuTtsRate") === "0.7" ? 0.7 : 1.0,
  btn: null, u: null, watch: null, noteShown: false
};
var UA = (typeof navigator !== "undefined" && navigator.userAgent) || "";
function pickVoice(){
  if (!TTS.ok) return 0;
  var vs = [];
  try { vs = window.speechSynthesis.getVoices() || []; } catch (e) {}
  if (vs.length) TTS.voicesLoaded = true;
  var ja = vs.filter(function(v){ return /^ja([-_]|$)/i.test(v.lang || "") || /日本語|Japanese/i.test(v.name || ""); });
  TTS.hasJa = ja.length > 0;
  function find(rx){ for (var i = 0; i < ja.length; i++) if (rx.test(ja[i].name || "")) return ja[i]; return null; }
  TTS.voice = find(/Kyoko/i) || find(/Otoya/i) || find(/Google\s*日本語|Google.*Japanese/i) ||
    ja.filter(function(v){ return /^ja[-_]JP$/i.test(v.lang || "") && v.localService; })[0] ||
    ja.filter(function(v){ return /^ja[-_]JP$/i.test(v.lang || ""); })[0] || ja[0] || null;
  return ja.length;
}
function noteText(kind){
  if (kind === "api") return "当前浏览器不支持发音，请用 Safari / Chrome 打开（微信内置浏览器可能不支持）。";
  var s = "没有找到日语语音，暂时无法发音。";
  if (/Android/i.test(UA)) s += "安卓手机：设置 → 系统 → 语言和输入法 → 文字转语音（TTS）输出 → 安装「日语」语音数据，然后重新打开本页。";
  else if (/iPhone|iPad|iPod|Macintosh/i.test(UA)) s += "iPhone：设置 → 辅助功能 → 朗读内容 → 声音 → 日语，下载 Kyoko 或 Otoya。";
  return s + "也可以换 Safari / Chrome 打开（微信内置浏览器可能不支持）。";
}
function showNote(kind, force){
  if (TTS.noteShown && !force) return;
  TTS.noteShown = true;
  document.getElementById("ttsNoteText").textContent = noteText(kind);
  document.getElementById("ttsNote").classList.remove("hidden");
}
document.getElementById("ttsNoteClose").addEventListener("click", function(){
  document.getElementById("ttsNote").classList.add("hidden"); store("shochukyuTtsNoteSeen", "1");
});
function unmark(){
  if (TTS.btn) { TTS.btn.classList.remove("speaking"); TTS.btn.removeAttribute("aria-pressed"); }
  TTS.btn = null; TTS.u = null;
  if (TTS.watch) { clearInterval(TTS.watch); TTS.watch = null; }
}
/* must run synchronously inside the click handler (iOS Safari only allows speech started by a user gesture) */
function speak(text, btn){
  text = String(text || "").trim();
  if (!text) return false;
  if (!TTS.ok) { showNote("api", true); return false; }
  var ss = window.speechSynthesis;
  var again = TTS.btn === btn && (ss.speaking || ss.pending);
  if (ss.speaking || ss.pending) ss.cancel();      // cancel the previous utterance before starting a new one
  unmark();
  if (again) return false;                          // tapping the active button again just stops it
  if (!TTS.voice) pickVoice();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  if (TTS.voice) u.voice = TTS.voice;
  u.rate = TTS.rate; u.pitch = 1; u.volume = 1;
  TTS.u = u; TTS.btn = btn || null;
  if (btn) { btn.classList.add("speaking"); btn.setAttribute("aria-pressed", "true"); }
  u.onend = function(){ if (TTS.u === u) unmark(); };
  u.onerror = function(ev){
    if (TTS.u === u) unmark();
    var er = ev && ev.error;
    if (er && !/interrupted|canceled|cancelled/.test(er)) showNote("voice", true);
  };
  if (ss.paused) ss.resume();
  ss.speak(u);
  var started = Date.now();
  TTS.watch = setInterval(function(){   // some browsers never fire onend: clear the highlight when speech stops
    if (TTS.u !== u) return;
    if (!ss.speaking && !ss.pending && Date.now() - started > 600) unmark();
  }, 300);
  if (TTS.voicesLoaded && !TTS.hasJa) showNote("voice", true);
  return true;
}
document.addEventListener("click", function(e){
  var b = e.target.closest(".say");
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  speak(b.getAttribute("data-say"), b);
}, true);
function applyRate(){
  var b = document.getElementById("rateBtn");
  b.textContent = TTS.rate < 1 ? "🐢 慢速" : "🔊 正常";
  b.setAttribute("aria-pressed", TTS.rate < 1 ? "true" : "false");
}
applyRate();
document.getElementById("rateBtn").addEventListener("click", function(){
  TTS.rate = TTS.rate < 1 ? 1.0 : 0.7; store("shochukyuTtsRate", TTS.rate < 1 ? "0.7" : null); applyRate();
});
if (TTS.ok) {
  pickVoice();
  var ss0 = window.speechSynthesis;
  if (ss0.addEventListener) ss0.addEventListener("voiceschanged", pickVoice);
  else ss0.onvoiceschanged = pickVoice;
  setTimeout(function(){ pickVoice(); if (TTS.voicesLoaded && !TTS.hasJa && load("shochukyuTtsNoteSeen") !== "1") showNote("voice"); }, 1500);
} else if (load("shochukyuTtsNoteSeen") !== "1") {
  showNote("api");
}
build();
</script>

}
