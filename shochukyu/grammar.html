<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7490">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>できる日本語 初中級｜语法句型复习</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --ink:#172033; --muted:#5f6b7a; --line:#e2e6ef;
  --accent:#4f46e5; --accent-ink:#fff; --soft:#eef2ff;
  --tb:#047857; --tb-bg:#ecfdf5; --warn:#b45309; --warn-bg:#fff7ed;
  --shadow:0 8px 24px rgba(23,32,51,.06); --tap:46px; color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f172a; --panel:#1e293b; --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
    --accent:#a5b4fc; --accent-ink:#1e1b4b; --soft:#172554;
    --tb:#6ee7b7; --tb-bg:#063b2c; --warn:#fdba74; --warn-bg:#3b2714;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK JP","PingFang SC","Noto Sans SC",sans-serif}
button,input{font:inherit}
header{padding:22px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));background:linear-gradient(135deg,#0f766e 0%,#0e7490 50%,#4f46e5 100%);color:#fff}
h1{font-size:clamp(22px,6.4vw,32px);line-height:1.25;margin:0 0 6px}
header p{margin:0;opacity:.92;font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:#ffffff22;border:1px solid #ffffff3a;border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px max(12px,env(safe-area-inset-left)) 0;background:var(--bg)}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;min-height:48px;cursor:pointer;font-size:14px;font-weight:650;padding:4px}
.tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toolbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left)) 6px}
.search{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:10px 14px;outline:none;font-size:16px}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chips{display:flex;gap:7px;overflow:auto;padding:7px 0 1px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:999px;white-space:nowrap;min-height:40px;cursor:pointer;font-size:15px}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:750}
.chip.lc{min-width:44px;font-weight:700}
.controls{display:flex;align-items:center;justify-content:space-between;gap:4px 12px;padding-top:4px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.toggles{display:flex;gap:2px 14px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px;min-height:38px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-left)) 40px}
.hidden{display:none!important}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.8}
.legend b{color:var(--ink)}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin:0 0 14px;box-shadow:var(--shadow);overflow:hidden}
.lesson>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;min-height:56px}
.lesson>summary::-webkit-details-marker{display:none}
.lnum{flex:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:3px 10px;font-weight:800}
.ltitle{font-weight:800;font-size:19px;line-height:1.35}
.ltitle small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.count{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.inside{padding:0 12px 12px}
.st{margin:6px 0 12px}
.sthead{font-size:14px;color:var(--muted);border-left:4px solid var(--accent);padding:4px 10px;margin:8px 0;background:var(--soft);border-radius:0 10px 10px 0}
.sthead b{color:var(--ink);font-size:15px}
.grid{display:grid;gap:12px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 13px;scroll-margin-top:170px}
.card.flash{outline:3px solid var(--accent)}
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--muted);background:var(--panel);white-space:nowrap}
.badge.cat{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.badge.tb{color:var(--tb);background:var(--tb-bg);border-color:color-mix(in srgb,var(--tb) 35%,transparent)}
.badge.id{background:var(--c);color:#fff;border-color:var(--c)}
@media (prefers-color-scheme:dark){.badge.id{color:#0f172a}}
.pattern{font-size:22px;font-weight:800;line-height:1.9;margin:2px 0;color:var(--ink)}
.conn{font-size:14px;color:var(--muted);background:var(--panel);border-radius:8px;padding:4px 8px;margin:4px 0}
.conn b{color:var(--c);white-space:nowrap}
.mean{font-size:16px;margin:6px 0}
.exs{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.ex{padding:6px 0}
.ex+.ex{border-top:1px dotted var(--line)}
.jp{font-size:19px;line-height:2.05}
.exz{font-size:15px;color:var(--muted)}
.tips{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:14.5px;line-height:1.95}
.tips div::before{content:"⚠️ ";}
.cando{font-size:13px;color:var(--muted);margin-top:6px}
ruby rt{font-size:.55em;color:var(--muted);font-weight:500}
body.hide-ex .exs{display:none}
.empty{text-align:center;color:var(--muted);padding:40px 0}
/* particles & conj */
.pblock{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.pname{font-size:28px;font-weight:900;color:var(--accent);margin-right:8px}
.prom{color:var(--muted);font-size:14px}
.puse{padding:8px 0;border-top:1px dotted var(--line)}
.puse .u{font-weight:700;font-size:15px}
.ljump{border:1px solid var(--line);background:var(--soft);color:var(--accent);border-radius:999px;padding:0 9px;font-size:12px;font-weight:800;cursor:pointer;min-height:26px;margin-left:6px}
table.conj{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
table.conj td{border-top:1px solid var(--line);padding:7px 5px;vertical-align:top;line-height:2}
table.conj td:first-child{white-space:nowrap;font-weight:700;color:var(--muted);font-size:14px}
table.conj td:last-child{color:var(--muted);font-size:13px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 30px}

.top .badge.use{color:var(--c)}
.pex{margin:6px 0 2px;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px dashed color-mix(in srgb,var(--c) 40%,var(--line))}
.pex .lab{font-size:12px;font-weight:800;color:var(--c)}
.line{display:flex;align-items:flex-start;gap:6px}
.line .jp{flex:1;min-width:0}
.pex .jp{font-size:18px}
.spk{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:19px;line-height:1;cursor:pointer;padding:0;margin-top:3px;-webkit-tap-highlight-color:transparent}
.spk:active{transform:scale(.92)}
.speaking{background:color-mix(in srgb,#facc15 32%,transparent);border-radius:8px;box-shadow:0 0 0 2px #facc15}
.speaking .spk,.spk.speaking{background:#facc15;border-color:#eab308;box-shadow:none}
.badge.nw{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.goal{font-size:14px;color:var(--muted);margin:2px 0 6px;padding:6px 10px;background:var(--soft);border-radius:10px}
.rate{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.rate button{border:0;background:transparent;color:var(--ink);min-height:38px;padding:0 12px;cursor:pointer;font-size:14px;font-weight:700}
.rate button.active{background:var(--accent);color:var(--accent-ink)}
.ctitle{font-size:19px;font-weight:850;line-height:1.9}
.crow{padding:8px 0;border-top:1px dotted var(--line)}
.crow .pat{font-weight:800;font-size:17px;line-height:1.9}
.crow .pt{font-size:14.5px;color:var(--ink);margin:2px 0}
.cpoint{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14.5px;line-height:1.95}
.cpoint::before{content:"💡 "}
table.conj td.cx{line-height:2}
table.conj .line .jp{font-size:16px;line-height:2}
.notice{position:fixed;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));z-index:60;background:#1e293b;color:#fff;border-radius:14px;padding:12px 44px 12px 14px;font-size:15px;line-height:1.7;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.notice button{position:absolute;right:8px;top:8px;border:0;background:#ffffff22;color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer}

/* site chrome: home link + prevent horizontal overflow */
html{overflow-x:hidden;max-width:100%}
body{max-width:100%}
img,svg,video,canvas{max-width:100%;height:auto}
.site-home{display:inline-flex;align-items:center;min-height:48px;padding:0 8px 0 0;margin:0 0 2px;color:#fff;font-weight:700;font-size:16px;line-height:1.2;text-decoration:none;letter-spacing:.02em}
.site-home:hover{text-decoration:underline}
.site-home:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:4px}

</style>
</head>
<body>
<header>
  <a class="site-home" href="../index.html">← 首页</a>
  <h1>できる日本語 初中級<br>语法・句型复习（1–15课）</h1>
  <p>按课・ST排列 · 接续 · 中文说明 · 例句 · 🔊 点读 · 易混对比 · 活用规则</p>
  <div class="stats" id="stats"></div>
</header>
<nav class="tabs" role="tablist">
  <button type="button" class="tab active" data-view="cards">📚 语法卡片</button>
  <button type="button" class="tab" data-view="compare">⚖️ 易混对比</button>
  <button type="button" class="tab" data-view="conj">🔄 活用规则</button>
</nav>
<div class="toolbar" id="toolbar">
  <input id="q" class="search" type="search" placeholder="搜索：句型 / 平假名 / 片假名 / 中文 / 例句…" autocomplete="off" enterkeyhint="search" aria-label="搜索语法">
  <div class="chips" id="lchips" aria-label="课次"></div>
  <div class="chips" id="cchips" aria-label="分类"></div>
  <div class="controls">
    <div class="toggles">
      <label class="toggle" id="tExWrap"><input id="tEx" type="checkbox" checked>例句</label>
      <span class="rate" role="group" aria-label="朗读速度"><button type="button" data-rate="0.7">🐢 慢速</button><button type="button" data-rate="1">▶ 正常</button></span>
    </div>
    <span id="resultText"></span>
  </div>
</div>
<main>
  <section id="v-cards">
    <div class="legend">
      <b>说明：</b>课次与 ST 按官方「シラバス一覧（初中級 第2版）」排列；
      <span class="badge tb">课本例句 第N课 p.X</span> 为课本（本册／别册）原句，<span class="badge nw">新例句</span> 为补充的句子。
      汉字读音一律用<strong>平假名</strong>标注。点 <b>🔊</b> 朗读日语（需要浏览器支持日语语音）。中文说明为自编讲解。
    </div>
    <div id="content"></div>
    <div id="empty" class="empty hidden">没有匹配的语法点</div>
  </section>
  <section id="v-compare" class="hidden"></section>
  <section id="v-conj" class="hidden"></section>
</main>
<div id="notice" class="notice hidden" role="alert"><span id="noticeText"></span><button type="button" id="noticeClose" aria-label="关闭">✕</button></div>
<footer>单文件离线版 · できる日本語 初中級（第2版）第1–15课</footer>
<script>
const DATA = {"lessons":[{"n":1,"title":"{新|あたら}しい{一歩|いっぽ}","zh":"新的一步","goal":"会向初次见面的人详细地介绍自己，并礼貌地询问对方的情况。","st":["アルバイトを{探|さが}す","{新|あたら}しい{友達|ともだち}"],"cando":["会就打工相关事宜进行询问，会在面试中进行简单地交流。","会和打工处及小组活动中初次见面的人就爱好及在日本的生活进行交谈。"]},{"n":2,"title":"{楽|たの}しいショッピング","zh":"快乐购物","goal":"会在商店或餐馆和朋友就商品及菜单交谈，可以与店里的人在购物中进行交谈。","st":["{上手|じょうず}に{買|か}い{物|もの}","{一緒|いっしょ}に{食事|しょくじ}"],"cando":["会在购买某种物品时，和朋友看着该物品就该物品的样子进行交谈，会向店里的人询问自己想了解的信息，决定自己的行动。","会在去餐馆等处进餐时，和同去的朋友及店里的人等进行交流。"]},{"n":3,"title":"{私|わたし}の{目標|もくひょう}","zh":"我的目标","goal":"会谈论自己的目标及计划，并会询问周围人的意见作为决定自己前途的参考。","st":["これからの{計画|けいかく}","{夢|ゆめ}に{向|む}かって"],"cando":["会谈论来日本的目的以及今后的目标、计划等。","关于自己的将来，会向周围的人谈论、询问感兴趣的事情。"]},{"n":4,"title":"{住|す}んでいる{町|まち}で","zh":"在我住的城市","goal":"为了享受在日本的生活，会相互交流所居住的城镇的信息，并会依据该信息安排自己的行动。","st":["{生活|せいかつ}を{楽|たの}しむ","{行|い}き{方|かた}を{教|おし}える"],"cando":["会询问或告诉他人自己居住的城镇之设施及店铺信息。","会为人指路或在迷路时问路。"]},{"n":5,"title":"{大変|たいへん}な1{日|にち}","zh":"糟糕的一天","goal":"当发生突发事件时，会对简单的状况进行说明并会进行应对。","st":["{困|こま}ったな……","{駅|えき}で"],"cando":["会说明遇到的困难的状况，并会说明丢失物品的特征及丢失时的状况。","当在车站或路上遇到困难时，会简单地说明事由，并进行委托或道歉。"]},{"n":6,"title":"{旅行|りょこう}に{行|い}こう","zh":"去旅行吧","goal":"在旅行之前，会事先收集信息、相互协商、进行旅行前的准备。","st":["{旅行|りょこう}の{計画|けいかく}","{旅行|りょこう}の{準備|じゅんび}"],"cando":["对于想去哪里旅行，会提出理由表示建议。","会在旅行前就准备事项进行交谈。"]},{"n":7,"title":"{西川|にしかわ}さんの{家|いえ}へ","zh":"去西川家","goal":"去日本人家拜访时，会考虑到情形和相互关系，与其家人愉快交流。","st":["{初|はじ}めての{訪問|ほうもん}","{一緒|いっしょ}に{作|つく}りましょう"],"cando":["会和初次见面的人使用礼貌的日语进行交谈。","会简单地介绍熟知的菜肴的做法。"]},{"n":8,"title":"ありがとう","zh":"谢谢","goal":"会就以往的经历中受到过帮助而感到开心的事情表示感谢。","st":["うれしい{出来事|できごと}","お{世話|せわ}になりました"],"cando":["会谈论以前的经历中接受过的帮助，会向关系亲近的人主动提出愿意给予帮助。","会向他人谈论自己受到的关照。会对关照自己的人表示感谢。"]},{"n":9,"title":"アルバイト{先|さき}で","zh":"在打工的地方","goal":"为了能在集体中舒服地工作，会在交谈中考虑到周围人的情形。","st":["アルバイト{先|さき}のルール","{楽|たの}しいアルバイト"],"cando":["会向前辈询问打工处的规则，会向后辈介绍打工处的规则。","会相互招呼，以便工作顺利不出错。"]},{"n":10,"title":"{旅行|りょこう}に{行|い}って","zh":"旅行途中","goal":"会向他人叙述旅行中遇到的困难及现在的状况，并会简单地介绍在景点看到的风景及建筑。","st":["ハプニング！","ガイドブックを{片手|かたて}に"],"cando":["当在旅行中发生不可预期的状况及不利的状况时，会就其状况及问题点等进行简单地说明。","会就自己现在的状况及眼前的事物等进行简单地说明。"]},{"n":11,"title":"{地域|ちいき}{社会|しゃかい}の{中|なか}で","zh":"在社区里","goal":"会向社区的日本人谈论自己最近的生活及现在遇到的困难等话题，会参加社区的活动。","st":["{慣|な}れてくると","スポーツチームに{入|はい}って"],"cando":["会谈论自己习惯的变化及遇到的困难等。","会转达自己听到的事情。会为体育比赛进行加油助威。"]},{"n":12,"title":"{私|わたし}の{健康|けんこう}{法|ほう}","zh":"我的健康秘诀","goal":"会和周围的人就保持健康的方法及身体不舒服时的应对方法，进行信息交流。","st":["{体調|たいちょう}{不良|ふりょう}","{毎日|まいにち}、{元気|げんき}に！"],"cando":["当身体不舒服时，会叙述其症状、原因及应对方法。","会谈论平时为了保持健康而采取的行动及使用的物品。"]},{"n":13,"title":"{親|おや}の{気持|きも}ち・{子|こ}の{気持|きも}ち","zh":"父母的心情・孩子的心情","goal":"在看到电视中及路上有让自己感兴趣的事情时，会就该事情发表意见、并谈论自己与之相关的经验。","st":["{町|まち}で{見|み}かけた{子|こ}どもたち","{思|おも}い{出|だ}すと"],"cando":["会在简单地发表自己意见时穿插对儿时经验的回忆。","会谈论小时候接受的教育对现在的自己的影响。"]},{"n":14,"title":"イベント・{行事|ぎょうじ}","zh":"活动・节庆","goal":"为了让周围的日本人了解自己的国家・城镇，会介绍自己国家・城镇的风俗活动及习惯。","st":["{私|わたし}の{国|くに}・{町|まち}の{行事|ぎょうじ}","{贈|おく}り{物|もの}の{習慣|しゅうかん}"],"cando":["会简单地介绍、询问国家・城镇的活动及与活动相关的事宜。","会在考虑到送礼习惯及对方的喜好，向他人就礼物进行商量。"]},{"n":15,"title":"{気|き}になるニュース","zh":"关注的新闻","goal":"会就日常生活中感兴趣的新闻及事情，自己带着问题进行调查，并将自己的观点说给周围的人听，进行交流。","st":["{発表|はっぴょう}の{準備|じゅんび}","みんなの{前|まえ}で{発表|はっぴょう}"],"cando":["会在讨论中倾听他人的发言并陈述自己的观点。","会叙述就某一主题调查到的信息，并会关于其主题陈述自己的意见。"]}],"categories":[{"id":"keigo","name":"敬语","icon":"🎩","color":"#7c3aed"},{"id":"give","name":"授受","icon":"🎁","color":"#d97706"},{"id":"form","name":"动词变形","icon":"🔤","color":"#ea580c"},{"id":"cond","name":"条件","icon":"🔀","color":"#0284c7"},{"id":"reason","name":"原因・理由・转折","icon":"💡","color":"#0891b2"},{"id":"purpose","name":"目的・用途","icon":"🎯","color":"#059669"},{"id":"infer","name":"推测・样态・传闻","icon":"👀","color":"#db2777"},{"id":"intent","name":"意志・计划・选择","icon":"🧭","color":"#4f46e5"},{"id":"aspect","name":"体・时间","icon":"⏱️","color":"#dc2626"},{"id":"change","name":"变化・习惯","icon":"📈","color":"#65a30d"},{"id":"voice","name":"被动・使役","icon":"🔁","color":"#9333ea"},{"id":"advice","name":"请求・建议・规则","icon":"🙏","color":"#0d9488"},{"id":"degree","name":"程度・数量・难易","icon":"📏","color":"#be123c"},{"id":"explain","name":"说明・引用・询问","icon":"💬","color":"#2563eb"},{"id":"struct","name":"句子结构","icon":"🧩","color":"#57534e"}],"cards":[{"id":"1-1","lesson":1,"st":1,"stTitle":"アルバイトを探す","cat":"keigo","pattern":"いらっしゃいます","official":"いらっしゃいます","usage":"","usageR":"","conn":"いる・{行|い}く・{来|く}る 的尊敬语：いらっしゃる → いらっしゃいます","zh":"“在／去／来”的尊敬说法，用于对方或上级的存在、动作。打电话找人：「～さんはいらっしゃいますか」＝“请问～在吗？”","pex":[{"jp":"いる → いらっしゃいます","say":"いる 、 いらっしゃいます"},{"jp":"{来|き}ました → いらっしゃいました","say":"来ました 、 いらっしゃいました"}],"ex":[{"jp":"Ａ：メアリーさんはいらっしゃいますか。　Ｂ：はい。{少々|しょうしょう}お{待|ま}ちください。","zh":"A：请问玛丽在吗？　B：在，请稍等。","src":"第1课 别册p.1","say":"メアリーさんはいらっしゃいますか。 はい。少々お待ちください。"},{"jp":"いつ{日本|にほん}へいらっしゃいましたか。","zh":"您是什么时候来日本的？","src":"第1课 p.21","say":"いつにほんへいらっしゃいましたか。"}],"tips":["说自己时不能用：✗ {私|わたし}は４{月|がつ}にいらっしゃいました → ✓ {私|わたし}は４{月|がつ}に{参|まい}りました（1-4）。","辞书形「いらっしゃる」，ます形是特殊的「いらっしゃいます」（✗ いらっしゃります）。"]},{"id":"1-2","lesson":1,"st":1,"stTitle":"アルバイトを探す","cat":"keigo","pattern":"Nと{申|もう}します","official":"Nと申します","usage":"","usageR":"","conn":"名字 ＋ と{申|もう}します（＝と{言|い}います 的谦让语）","zh":"“我叫～”。自我介绍的谦让说法，比「～です」更郑重，用于打电话、面试、正式场合。","pex":[{"jp":"パクと{申|もう}します","say":"パクと申します"}],"ex":[{"jp":"パクと{申|もう}しますが、{佐藤|さとう}さんはいらっしゃいますか。","zh":"我叫朴，请问佐藤先生在吗？","src":"第1课 别册p.1","say":"パクと申しますが、佐藤さんはいらっしゃいますか。"},{"jp":"はじめまして、プロイと{申|もう}します。","zh":"初次见面，我叫Ploy。","src":"第1课 p.21","say":"はじめまして、プロイと申します。"}],"tips":["只用于自己（或自己一方）：✗ {先生|せんせい}は{山田|やまだ}と{申|もう}します。","「～と{申|もう}しますが、～」：先报姓名，再说要找的人或事情。"]},{"id":"1-3","lesson":1,"st":1,"stTitle":"アルバイトを探す","cat":"reason","pattern":"～ので、～","official":"～ので、～","usage":"","usageR":"","conn":"普通形 ＋ ので（ナA・N：～なので）","zh":"“因为～，所以～”。比较客观地说明原因，语气比「から」柔和、礼貌，适合请假、拒绝、道歉。","pex":[{"jp":"{用事|ようじ}がある → {用事|ようじ}があるので","say":"用事がある 、 用事があるので"},{"jp":"{病気|びょうき}だ → {病気|びょうき}なので","say":"病気だ 、 病気なので"}],"ex":[{"jp":"{用事|ようじ}があるので、お{先|さき}に{失礼|しつれい}します。","zh":"因为有事，我先走了。","src":"第1课 别册p.1","say":"用事があるので、お先に失礼します。"},{"jp":"ルームメイトが{病気|びょうき}なので、{今日|きょう}は{早|はや}く{帰|かえ}ってもいいですか。","zh":"室友生病了，今天我可以早点回去吗？","src":"第1课 别册p.1","say":"ルームメイトが病気なので、今日は早く帰ってもいいですか。"}],"tips":["名词・ナ形容词接「なので」：✗ {病気|びょうき}だので。","向上级说明理由、请求许可时，「ので」比「から」更得体。"]},{"id":"1-4","lesson":1,"st":1,"stTitle":"アルバイトを探す","cat":"keigo","pattern":"{参|まい}りました","official":"参りました","usage":"","usageR":"","conn":"{来|く}る・{行|い}く 的谦让语：{参|まい}る → {参|まい}ります／{参|まい}りました","zh":"“来／去”的谦让说法，用于自己的动作，以示对听话人的尊敬。面试时说「～から{参|まい}りました」＝“我从～来”。","pex":[{"jp":"{来|き}ました → {参|まい}りました","say":"来ました 、 参りました"}],"ex":[{"jp":"{今年|ことし}の4{月|がつ}に{参|まい}りました。","zh":"我是今年4月来的。","src":"第1课 p.16","say":"今年の4月に参りました。"},{"jp":"{今年|ことし}の4{月|がつ}に{韓国|かんこく}のプサンから{参|まい}りました。","zh":"我是今年4月从韩国釜山来的。","src":"第1课 p.26","say":"今年の4月に韓国のプサンから参りました。"}],"tips":["对比：{先生|せんせい}はいついらっしゃいましたか（尊敬，对方）↔ {私|わたし}は４{月|がつ}に{参|まい}りました（谦让，自己）。"]},{"id":"1-5","lesson":1,"st":1,"stTitle":"アルバイトを探す","cat":"form","pattern":"{可能|かのう}{動詞|どうし}","official":"可能動詞","usage":"","usageR":"","conn":"Ⅰ类：う段→え段＋る（{読|よ}む→{読|よ}める）；Ⅱ类：去る＋られる（{食|た}べる→{食|た}べられる）；する→できる，{来|く}る→{来|こ}られる","zh":"“能／会／可以～”。表示能力或条件上的可能。宾语助词「を」通常变成「が」。","pex":[{"jp":"{読|よ}む → {読|よ}めます","say":"読む 、 読めます"},{"jp":"{食|た}べる → {食|た}べられます","say":"食べる 、 食べられます"},{"jp":"{来|く}る → {来|こ}られます","say":"来る 、 来られます"}],"ex":[{"jp":"{難|むずか}しい{漢字|かんじ}が{読|よ}めません。","zh":"难的汉字我不会读。","src":"第1课 别册p.1","say":"難しい漢字が読めません。"},{"jp":"{明日|あした}2{時|じ}に{来|こ}られます。","zh":"明天2点我能来。","src":"第1课 别册p.1","say":"あした2時に来られます。"}],"tips":["「を」→「が」：{漢字|かんじ}を{読|よ}む → {漢字|かんじ}が{読|よ}める。","可能动词本身按Ⅱ类变化：{読|よ}める→{読|よ}めない／{読|よ}めて。","「Vることができます」意思相同，较书面。"]},{"id":"1-6","lesson":1,"st":1,"stTitle":"アルバイトを探す","cat":"struct","pattern":"Nなら〜","official":"Nなら〜","usage":"","usageR":"","conn":"N ＋ なら","zh":"“（如果是）N的话（就～）”。从话题中限定一个范围来回答，常暗示“别的不一定，N的话可以”。","pex":[{"jp":"{簡単|かんたん}な{料理|りょうり}なら","say":"簡単な料理なら"}],"ex":[{"jp":"{簡単|かんたん}な{料理|りょうり}なら{作|つく}れます。","zh":"简单的菜的话，我会做。","src":"第1课 p.16","say":"簡単な料理なら作れます。"},{"jp":"じゃ、2{時|じ}なら{来|こ}られますか。","zh":"那么，2点的话能来吗？","src":"第1课 p.21","say":"じゃ、2時なら来られますか。"}],"tips":["第4课的「～なら」表示“如果要～的话（建议你…）”，见 4-2。"]},{"id":"1-7","lesson":1,"st":2,"stTitle":"新しい友達","cat":"struct","pattern":"VるのがＡ","official":"VるのがＡ","usage":"","usageR":"","conn":"Vる ＋ のが ＋ {好|す}き／{得意|とくい}／{苦手|にがて}／{上手|じょうず}／{速|はや}い…","zh":"用「の」把动作变成名词，作「{好|す}き・{得意|とくい}・{苦手|にがて}」等的对象：“喜欢／擅长／不擅长做～”。","pex":[{"jp":"{話|はな}す → {話|はな}すのが{好|す}きです","say":"話す 、 話すのが好きです"}],"ex":[{"jp":"{人|ひと}と{話|はな}すのが{好|す}きです。","zh":"我喜欢和人聊天。","src":"第1课 别册p.3","say":"人と話すのが好きです。"},{"jp":"{朝|あさ}{早|はや}く{起|お}きるのが{苦手|にがて}です。","zh":"我不擅长早起。","src":"第1课 别册p.3","say":"朝早く起きるのが苦手です。"}],"tips":["这些词前面用「が」：✗ {話|はな}すのを{好|す}きです。"]},{"id":"1-8","lesson":1,"st":2,"stTitle":"新しい友達","cat":"struct","pattern":"VるのはＡ","official":"VるのはＡ","usage":"","usageR":"","conn":"Vる ＋ のは ＋ {楽|たの}しい／{大変|たいへん}／{難|むずか}しい／おもしろい…","zh":"“做～（这件事）很……”。「の」使动作成为主题，后面是评价。","pex":[{"jp":"{絵|え}を{描|か}く → {絵|え}を{描|か}くのは{楽|たの}しいです","say":"絵をかく 、 絵をかくのは楽しいです"}],"ex":[{"jp":"{絵|え}を{描|か}くのは{楽|たの}しいです。","zh":"画画很开心。","src":"第1课 别册p.3","say":"絵をかくのは楽しいです。"},{"jp":"{日本語|にほんご}で{自分|じぶん}の{意見|いけん}を{言|い}うのは{難|むずか}しいです。","zh":"用日语说自己的意见很难。","src":"第1课 别册p.3","say":"日本語で自分の意見を言うのは難しいです。"}],"tips":["「のが」接好恶、能力（{好|す}き・{上手|じょうず}）；「のは」接评价（{楽|たの}しい・{大変|たいへん}）。"]},{"id":"1-9","lesson":1,"st":2,"stTitle":"新しい友達","cat":"change","pattern":"Ｖるようになります（{能力|のうりょく}の{変化|へんか}）","official":"Ｖるようになります（能力の変化）","usage":"能力の変化","usageR":"{能力|のうりょく}の{変化|へんか}","conn":"可能动词／わかる 等 ＋ ようになります","zh":"“（从不会到）会～了”。表示能力的变化。想要会：「～ようになりたいです」。","pex":[{"jp":"{乗|の}れる → {乗|の}れるようになりました","say":"乗れる 、 乗れるようになりました"}],"ex":[{"jp":"{自転車|じてんしゃ}に{乗|の}れるようになりました。","zh":"我会骑自行车了。","src":"第1课 别册p.3","say":"自転車に乗れるようになりました。"},{"jp":"{日本語|にほんご}の{新聞|しんぶん}が{読|よ}めるようになりたいです。","zh":"我想能看懂日语报纸。","src":"第1课 别册p.3","say":"日本語の新聞が読めるようになりたいです。"}],"tips":["前面用可能动词表示能力：{乗|の}れるようになりました（会骑了）；{乗|の}るようになりました 是“开始（经常）骑了”（11-1 习惯的变化）。"]},{"id":"2-1","lesson":2,"st":1,"stTitle":"上手に買い物","cat":"infer","pattern":"Ａそうです（{様態|ようたい}）","official":"Ａそうです（様態）","usage":"様態","usageR":"{様態|ようたい}","conn":"イA：去い＋そう（いい→よさそう）；ナA：＋そう；否定：～くなさそう／～じゃなさそう","zh":"“看起来好像～”。根据外观做出的判断（还没有确认）。","pex":[{"jp":"{軽|かる}い → {軽|かる}そうです","say":"軽い 、 軽そうです"},{"jp":"いい → よさそうです","say":"いい 、 よさそうです"},{"jp":"{丈夫|じょうぶ} → {丈夫|じょうぶ}そうです","say":"丈夫 、 丈夫そうです"}],"ex":[{"jp":"いいですね。{暖|あたた}かそうですね。","zh":"不错啊，看起来很暖和。","src":"第2课 p.32","say":"いいですね。暖かそうですね。"},{"jp":"あれは{高|たか}そうです。","zh":"那个看起来很贵。","src":"第2课 p.30","say":"あれは高そうです。"},{"jp":"{簡単|かんたん}じゃなさそうです。","zh":"看起来不简单。","src":"第2课 别册p.5","say":"簡単じゃなさそうです。"}],"tips":["いい→よさそう，ない→なさそう。","一眼就能看出的性质（{赤|あか}い・きれい等）一般不用「そう」。","修饰名词：おいしそうなケーキ；修饰动词：{楽|たの}しそうに（10-8）。"]},{"id":"2-2","lesson":2,"st":1,"stTitle":"上手に買い物","cat":"intent","pattern":"Ｖてみます","official":"Ｖてみます","usage":"","usageR":"","conn":"Vて ＋ みます","zh":"“试着做～（看看）”。","pex":[{"jp":"はく → はいてみます","say":"はく 、 はいてみます"}],"ex":[{"jp":"あのう、この{靴|くつ}をはいてみてもいいですか。","zh":"请问，我可以试穿一下这双鞋吗？","src":"第2课 p.32","say":"あのう、この靴をはいてみてもいいですか。"},{"jp":"お{菓子|かし}を{食|た}べてみます。","zh":"我尝一下点心。","src":"第2课 别册p.5","say":"お菓子を食べてみます。"}],"tips":["请对方试一试：「～てみてください」。"]},{"id":"2-3","lesson":2,"st":1,"stTitle":"上手に買い物","cat":"advice","pattern":"Ｖてもらえませんか","official":"Ｖてもらえませんか","usage":"","usageR":"","conn":"Vて ＋ もらえませんか","zh":"“能不能请你帮我～？”。比「～てください」客气的请求。","pex":[{"jp":"{説明|せつめい}する → {説明|せつめい}してもらえませんか","say":"説明する 、 説明してもらえませんか"}],"ex":[{"jp":"{使|つか}い{方|かた}を{説明|せつめい}してもらえませんか。","zh":"能请您说明一下用法吗？","src":"第2课 别册p.5","say":"使いかたを説明してもらえませんか。"},{"jp":"あのう、{右|みぎ}から2つ{目|め}の{腕時計|うでどけい}を{見|み}せてもらえませんか。","zh":"请问，能给我看看右数第二块手表吗？","src":"第2课 p.32","say":"あのう、右から2つ目のうでどけいを見せてもらえませんか。"}],"tips":["礼貌程度：～てください ＜ ～てもらえませんか ＜ ～ていただけませんか（5-4）。"]},{"id":"2-4","lesson":2,"st":1,"stTitle":"上手に買い物","cat":"degree","pattern":"Ｖにくいです","official":"Ｖにくいです","usage":"","usageR":"","conn":"Vます形（去ます）＋ にくい（按イ形容词变化）","zh":"“难以～／不好～”。多说东西用起来不方便。","pex":[{"jp":"{書|か}きます → {書|か}きにくいです","say":"書きます 、 書きにくいです"}],"ex":[{"jp":"ああ、このかばんはファスナーが{固|かた}いですから、ちょっと{開|あ}けにくいです。","zh":"啊，这个包的拉链很紧，有点不好打开。","src":"第2课 p.32","say":"ああ、このかばんはファスナーが固いですから、ちょっとあけにくいです。"},{"jp":"でも、ボタンが{多|おお}いですから、ちょっとわかりにくいです。","zh":"不过按钮太多，有点难懂。","src":"第2课 p.30","say":"でも、ボタンが多いですから、ちょっとわかりにくいです。"}],"tips":["第12课还有“不容易发生”的用法（12-9）。"]},{"id":"2-5","lesson":2,"st":1,"stTitle":"上手に買い物","cat":"degree","pattern":"Ａすぎます","official":"Ａすぎます","usage":"","usageR":"","conn":"イA：去い＋すぎます（いい→よすぎます）；ナA：＋すぎます","zh":"“太～了”。超过合适的程度（多为负面评价）。","pex":[{"jp":"{多|おお}い → {多|おお}すぎます","say":"多い 、 多すぎます"},{"jp":"{高|たか}い → {高|たか}すぎます","say":"高い 、 高すぎます"}],"ex":[{"jp":"ああ、そうですね。ボタンが{多|おお}すぎますね。","zh":"啊，是啊。按钮太多了。","src":"第2课 p.30","say":"ああ、そうですね。ボタンが多すぎますね。"},{"jp":"{数字|すうじ}が{小|ちい}さすぎます。","zh":"数字太小了。","src":"第2课 别册p.5","say":"数字が小さすぎます。"}],"tips":["すぎます 按Ⅱ类动词变化：すぎました、すぎて。"]},{"id":"2-6","lesson":2,"st":1,"stTitle":"上手に買い物","cat":"degree","pattern":"Ｖやすいです","official":"Ｖやすいです","usage":"","usageR":"","conn":"Vます形（去ます）＋ やすい（按イ形容词变化）","zh":"“容易～／好～”。多说东西用起来方便。","pex":[{"jp":"{持|も}ちます → {持|も}ちやすいです","say":"持ちます 、 持ちやすいです"}],"ex":[{"jp":"あ、{画面|がめん}が{大|おお}きいので、{見|み}やすいです。","zh":"啊，屏幕大，看得清楚。","src":"第2课 p.30","say":"あ、画面が大きいので、見やすいです。"},{"jp":"{持|も}ちやすいですね。じゃ、これをください。","zh":"很好拿啊。那就要这个吧。","src":"第2课 p.32","say":"持ちやすいですね。じゃ、これをください。"}],"tips":["反义：～にくい。注意「{安|やす}い」（便宜）是另一个词。","第12课还有“容易发生”的用法（12-8）。"]},{"id":"2-7","lesson":2,"st":2,"stTitle":"一緒に食事","cat":"aspect","pattern":"Ｖてあります","official":"Ｖてあります","usage":"","usageR":"","conn":"N₁ に N₂ が 他动词 Vて ＋ あります","zh":"“（有人有意地）～着”。表示动作结果留下的状态，常用来描写看到的情景。","pex":[{"jp":"{書|か}く → {書|か}いてあります","say":"書く 、 書いてあります"},{"jp":"{置|お}く → {置|お}いてあります","say":"置く 、 置いてあります"}],"ex":[{"jp":"{壁|かべ}にメニューが{書|か}いてあります。","zh":"墙上写着菜单。","src":"第2课 别册p.8","say":"壁にメニューが書いてあります。"},{"jp":"テーブルの{上|うえ}にチラシが{置|お}いてあります。","zh":"桌子上放着传单。","src":"第2课 别册p.8","say":"テーブルの上にチラシが置いてあります。"}],"tips":["用他动词；自动词的状态用「～ています」：{窓|まど}が{開|あ}いています ↔ {窓|まど}が{開|あ}けてあります（有人打开的）。","第6课还有“已经做好了”的用法（6-7）。"]},{"id":"2-8","lesson":2,"st":2,"stTitle":"一緒に食事","cat":"explain","pattern":"～と{読|よ}みます","official":"～と読みます","usage":"","usageR":"","conn":"「读法」＋ と{読|よ}みます；问：{何|なん}と{読|よ}みますか","zh":"“读作～”。「と」表示引用的内容。","pex":[{"jp":"{何|なん}と{読|よ}みますか","say":"なんと読みますか"}],"ex":[{"jp":"これは{何|なん}と{読|よ}みますか。","zh":"这个怎么读？","src":"第2课 p.36","say":"これはなんと読みますか。"},{"jp":"「りょうがえ」と{読|よ}みます。","zh":"读作“りょうがえ”（兑换）。","src":"第2课 别册p.8","say":"りょうがえと読みます。"}],"tips":["「{何|なん}と」读「なんと」。"]},{"id":"2-9","lesson":2,"st":2,"stTitle":"一緒に食事","cat":"explain","pattern":"～と{書|か}いてあります","official":"～と書いてあります","usage":"","usageR":"","conn":"「原文」／普通形 ＋ と{書|か}いてあります","zh":"“（上面）写着～”。转述告示、菜单、说明书上写的内容。","pex":[{"jp":"「{半額|はんがく}」と{書|か}いてあります","say":"半額と書いてあります"}],"ex":[{"jp":"「{学生|がくせい}の{方|かた}は{半額|はんがく}です」と{書|か}いてあります。","zh":"上面写着“学生半价”。","src":"第2课 别册p.8","say":"学生のかたは半額ですと書いてあります。"},{"jp":"ご{飯|はん}のおかわりができると{書|か}いてあります。","zh":"上面写着米饭可以续碗。","src":"第2课 别册p.8","say":"ご飯のおかわりができると書いてあります。"}],"tips":["原文照引用「　」；转述内容用普通形，名词・ナ形容词可加「だ」。"]},{"id":"2-10","lesson":2,"st":2,"stTitle":"一緒に食事","cat":"explain","pattern":"どういう{意味|いみ}ですか　～という{意味|いみ}です","official":"どういう意味ですか　～という意味です","usage":"","usageR":"","conn":"「词语」はどういう{意味|いみ}ですか ／ 普通形・N ＋ という{意味|いみ}です","zh":"问词义并解释：“～是什么意思？”“是～的意思。”","pex":[{"jp":"どういう{意味|いみ}ですか","say":"どういう意味ですか"}],"ex":[{"jp":"Ａ：「{営業|えいぎょう}{中|ちゅう}」はどういう{意味|いみ}ですか。　Ｂ：{今|いま}、お{店|みせ}が{開|あ}いているという{意味|いみ}です。","zh":"A：“营业中”是什么意思？　B：是店现在开着的意思。","src":"第2课 别册p.8","say":"営業中はどういう意味ですか。 今、お店があいているという意味です。"},{"jp":"Ａ：「{定休日|ていきゅうび}」はどういう{意味|いみ}ですか。　Ｂ：お{店|みせ}が{休|やす}みの{日|ひ}という{意味|いみ}です。","zh":"A：“定休日”是什么意思？　B：是店休息的日子的意思。","src":"第2课 别册p.8","say":"ていきゅうびはどういう意味ですか。 お店が休みの日という意味です。"}],"tips":["「という」前面接名词或普通形：{休|やす}みの{日|ひ}という{意味|いみ}です。"]},{"id":"2-11","lesson":2,"st":2,"stTitle":"一緒に食事","cat":"intent","pattern":"Ｎにします","official":"Ｎにします","usage":"","usageR":"","conn":"N ＋ にします","zh":"“（我）要N／决定选N”。点菜、购物等做选择时用。","pex":[{"jp":"ビールにします","say":"ビールにします"}],"ex":[{"jp":"{私|わたし}はビールにします。","zh":"我要啤酒。","src":"第2课 p.36","say":"わたしはビールにします。"},{"jp":"オレンジジュースにします。","zh":"我要橙汁。","src":"第2课 p.39","say":"オレンジジュースにします。"}],"tips":["「～にします」＝自己选择决定；「～になります」＝自然变成。","第7课「イAくします／ナA・Nにします」是“使之变成～”，见 7-7。"]},{"id":"2-12","lesson":2,"st":2,"stTitle":"一緒に食事","cat":"degree","pattern":"Ｖすぎです","official":"Ｖすぎです","usage":"","usageR":"","conn":"Vます形（去ます）＋ すぎです","zh":"“（你）～得太多了”。把“过度”当作状态指出来，常用于提醒对方：「～すぎですよ」。","pex":[{"jp":"{吸|す}います → {吸|す}いすぎです","say":"吸います 、 吸いすぎです"}],"ex":[{"jp":"お{酒|さけ}を{飲|の}みすぎですよ。","zh":"你喝酒喝太多了啊。","src":"第2课 别册p.8","say":"お酒を飲みすぎですよ。"},{"jp":"{砂糖|さとう}を{入|い}れすぎですよ。","zh":"你糖放太多了啊。","src":"第2课 别册p.8","say":"砂糖を入れすぎですよ。"}],"tips":["「Vすぎです」多用来提醒别人；说自己做过头的一次行为多用「Vすぎました」（2-13）。"]},{"id":"2-13","lesson":2,"st":2,"stTitle":"一緒に食事","cat":"degree","pattern":"Ｖすぎます","official":"Ｖすぎます","usage":"","usageR":"","conn":"Vます形（去ます）＋ すぎます（→すぎました）","zh":"“～得太多／过度了”。说自己做过头的事多用「～すぎました」。","pex":[{"jp":"{飲|の}みます → {飲|の}みすぎました","say":"飲みます 、 飲みすぎました"}],"ex":[{"jp":"Ａ：{料理|りょうり}が{多|おお}かったですね。　Ｂ：そうですね。……{注文|ちゅうもん}しすぎました。","zh":"A：菜真多啊。　B：是啊……点得太多了。","src":"第2课 p.36","say":"料理が多かったですね。 そうですね。、注文しすぎました。"},{"jp":"Ａ：おいしかったですね。　Ｂ：そうですね。……{飲|の}みすぎました。","zh":"A：真好吃啊。　B：是啊……喝得太多了。","src":"第2课 p.36","say":"おいしかったですね。 そうですね。、飲みすぎました。"}],"tips":["すぎる 是Ⅱ类动词：{飲|の}みすぎて、{飲|の}みすぎない。"]},{"id":"3-1","lesson":3,"st":1,"stTitle":"これからの計画","cat":"cond","pattern":"Ｖたら、～　（{確定|かくてい}{条件|じょうけん}）","official":"Ｖたら、～　（確定条件）","usage":"確定条件","usageR":"{確定|かくてい}{条件|じょうけん}","conn":"Vた ＋ ら、～","zh":"“（等）～之后，就～”。前项是一定会发生的事，表示它实现以后做后项。","pex":[{"jp":"{卒業|そつぎょう}する → {卒業|そつぎょう}したら","say":"卒業する 、 卒業したら"}],"ex":[{"jp":"{大学|だいがく}を{卒業|そつぎょう}したら、{翻訳|ほんやく}の{仕事|しごと}をしたいです。","zh":"大学毕业以后，我想做翻译工作。","src":"第3课 别册p.10","say":"大学を卒業したら、翻訳の仕事をしたいです。"},{"jp":"{夏休|なつやす}みになったら、{何|なに}をしますか。","zh":"放暑假以后你做什么？","src":"第3课 p.46","say":"夏休みになったら、なにをしますか。"}],"tips":["假定的「たら」：{雨|あめ}が{降|ふ}ったら（如果下雨）是不一定发生的事。","后项可以是意志、希望、请求。"]},{"id":"3-2","lesson":3,"st":1,"stTitle":"これからの計画","cat":"form","pattern":"{意向|いこう}{形|けい}　Ｖ（よ）うと{思|おも}っています","official":"意向形　Ｖ（よ）うと思っています","usage":"","usageR":"","conn":"意向形：Ⅰ类 う段→お段＋う（{行|い}く→{行|い}こう）；Ⅱ类 去る＋よう；する→しよう，{来|く}る→{来|こ}よう ＋ と{思|おも}っています","zh":"“我打算～／想要～”。说一直在考虑的计划、意图。「と{思|おも}っています」表示想法持续了一段时间。","pex":[{"jp":"{行|い}く → {行|い}こう","say":"行く 、 行こう"},{"jp":"{辞|や}める → {辞|や}めよう","say":"辞める 、 辞めよう"},{"jp":"する → しよう","say":"する 、 しよう"}],"ex":[{"jp":"{授業|じゅぎょう}の{見学|けんがく}に{行|い}こうと{思|おも}っています。","zh":"我打算去旁听课。","src":"第3课 别册p.10","say":"授業の見学に行こうと思っています。"},{"jp":"アルバイトを{辞|や}めようと{思|おも}っています。","zh":"我打算辞掉打工。","src":"第3课 别册p.10","say":"アルバイトを辞めようと思っています。"}],"tips":["「～と{思|おも}います」多指说话时刚做的决定；「～と{思|おも}っています」还可以说第三人称：{兄|あに}は{留学|りゅうがく}しようと{思|おも}っています。"]},{"id":"3-3","lesson":3,"st":1,"stTitle":"これからの計画","cat":"intent","pattern":"Ｖるつもりです　Ｖないつもりです","official":"Ｖるつもりです　Ｖないつもりです","usage":"","usageR":"","conn":"Vる／Vない ＋ つもりです","zh":"“打算～／不打算～”。表示已经决定的计划，意志比「（よ）うと{思|おも}っています」更明确。","pex":[{"jp":"{進学|しんがく}する → {進学|しんがく}するつもりです","say":"進学する 、 進学するつもりです"},{"jp":"{行|い}かない → {行|い}かないつもりです","say":"行かない 、 行かないつもりです"}],"ex":[{"jp":"{専門|せんもん}{学校|がっこう}に{進学|しんがく}するつもりです。","zh":"我打算升入专门学校。","src":"第3课 别册p.10","say":"専門学校に進学するつもりです。"},{"jp":"{今度|こんど}の{週末|しゅうまつ}はどこへも{行|い}かないつもりです。","zh":"这个周末我打算哪儿也不去。","src":"第3课 别册p.10","say":"今度の週末はどこへも行かないつもりです。"}],"tips":["直接问上级「～つもりですか」不太礼貌。"]},{"id":"3-4","lesson":3,"st":1,"stTitle":"これからの計画","cat":"struct","pattern":"〈{疑問|ぎもん}{詞|し}〉か、～","official":"〈疑問詞〉か、～","usage":"","usageR":"","conn":"疑问词 ＋ 普通形 ＋ か、～（ナA・N 不加「だ」）","zh":"把带疑问词的问句放进句子里：“（不知道／在考虑）什么、哪里、多少～”。后面常接 わかりません・{考|かんが}えています・{調|しら}べます 等。","pex":[{"jp":"{何|なに}をするか","say":"なにをするか"}],"ex":[{"jp":"{何|なに}をするか、まだ{決|き}めていません。","zh":"做什么，我还没决定。","src":"第3课 别册p.10","say":"なにをするか、まだ決めていません。"},{"jp":"{授業|じゅぎょう}{料|りょう}はいくらか、わかりません。","zh":"学费多少钱，我不知道。","src":"第3课 别册p.10","say":"授業料はいくらか、わかりません。"}],"tips":["名词・ナ形容词直接接「か」：✗ いくらだか。"]},{"id":"3-5","lesson":3,"st":1,"stTitle":"これからの計画","cat":"struct","pattern":"～かどうか、～","official":"～かどうか、～","usage":"","usageR":"","conn":"普通形 ＋ かどうか、～（ナA・N 不加「だ」）","zh":"“是否～”。把没有疑问词的是非问句放进句子里。","pex":[{"jp":"{進学|しんがく}する → {進学|しんがく}するかどうか","say":"進学する 、 進学するかどうか"}],"ex":[{"jp":"{進学|しんがく}するかどうか、{考|かんが}えています。","zh":"我在考虑要不要升学。","src":"第3课 别册p.10","say":"進学するかどうか、考えています。"},{"jp":"{本当|ほんとう}かどうか、もう{一度|いちど}{聞|き}きます。","zh":"是不是真的，我再问一次。","src":"第3课 别册p.10","say":"本当かどうか、もういちど聞きます。"}],"tips":["有疑问词 →「か」（3-4）；没有疑问词 →「かどうか」。"]},{"id":"3-6","lesson":3,"st":2,"stTitle":"夢に向かって","cat":"purpose","pattern":"Ｖるために、～　Nのために、～（{目的|もくてき}）","official":"Ｖるために、～　Nのために、～（目的）","usage":"目的","usageR":"{目的|もくてき}","conn":"Vる ＋ ために ／ N ＋ のために","zh":"“为了～”。表示有意志的目的，前后主语一般相同。","pex":[{"jp":"{勉強|べんきょう}する → {勉強|べんきょう}するために","say":"勉強する 、 勉強するために"},{"jp":"{将来|しょうらい} → {将来|しょうらい}のために","say":"将来 、 将来のために"}],"ex":[{"jp":"{日本語|にほんご}の{勉強|べんきょう}をするために、{日本|にほん}へ{来|き}ました。","zh":"我是为了学习日语来日本的。","src":"第3课 别册p.12","say":"日本語の勉強をするために、にほんへ来ました。"},{"jp":"{将来|しょうらい}のために、{貯金|ちょきん}しています。","zh":"为了将来，我在存钱。","src":"第3课 别册p.12","say":"将来のために、貯金しています。"}],"tips":["前面是可能动词、わかる、否定等非意志的说法时，用「ように」（9-2）。","第15课的「ために」表示原因（15-6）。"]},{"id":"3-7","lesson":3,"st":2,"stTitle":"夢に向かって","cat":"explain","pattern":"～んですか　〈{疑問|ぎもん}{詞|し}〉～んですか　～んです","official":"～んですか　〈疑問詞〉～んですか　～んです","usage":"","usageR":"","conn":"普通形 ＋ んです（ナA・N：～なんです）","zh":"说明语气。「～んですか」：看到情况后确认或询问理由；「～んです」：说明原因、情况。","pex":[{"jp":"{休|やす}んだんですか","say":"休んだんですか"},{"jp":"{好|す}きなんです","say":"好きなんです"}],"ex":[{"jp":"{田中|たなか}さんが{描|か}いたんですか。","zh":"是田中画的吗？","src":"第3课 别册p.12","say":"田中さんがかいたんですか。"},{"jp":"Ａ：どうして{昨日|きのう}、アルバイトを{休|やす}んだんですか。　Ｂ：{試験|しけん}があったんです。","zh":"A：你昨天为什么没去打工？　B：因为有考试。","src":"第3课 别册p.12","say":"どうして昨日、アルバイトを休んだんですか。 試験があったんです。"}],"tips":["回答「どうして～んですか」时常用「～んです」说明理由。","单纯问事实（{何|なん}{時|じ}ですか）不需要「んですか」。"]},{"id":"3-8","lesson":3,"st":2,"stTitle":"夢に向かって","cat":"advice","pattern":"Ｖなければなりません","official":"Ｖなければなりません","usage":"","usageR":"","conn":"Vない（去い）＋ ければなりません","zh":"“必须～／不得不～”。","pex":[{"jp":"{払|はら}う → {払|はら}わなければなりません","say":"払う 、 払わなければなりません"},{"jp":"する → しなければなりません","say":"する 、 しなければなりません"}],"ex":[{"jp":"{今日中|きょうじゅう}にお{金|かね}を{払|はら}わなければなりません。","zh":"今天之内必须付钱。","src":"第3课 别册p.12","say":"きょうじゅうにお金を払わなければなりません。"},{"jp":"{両親|りょうしん}に{相談|そうだん}しなければなりません。","zh":"必须和父母商量。","src":"第3课 别册p.12","say":"両親に相談しなければなりません。"}],"tips":["“不必～”：「～なくてもいいです」。"]},{"id":"4-1","lesson":4,"st":1,"stTitle":"生活を楽しむ","cat":"explain","pattern":"～んですが、～","official":"～んですが、～","usage":"","usageR":"","conn":"普通形 ＋ んですが、＋ 请求／问题","zh":"开场白：先说明自己的情况，再提出请求、询问或邀请。","pex":[{"jp":"{買|か}いたいんですが","say":"買いたいんですが"}],"ex":[{"jp":"{自転車|じてんしゃ}を{買|か}いたいんですが、いい{店|みせ}を{知|し}りませんか。","zh":"我想买自行车，你知道有什么好店吗？","src":"第4课 别册p.14","say":"自転車を買いたいんですが、いい店を知りませんか。"},{"jp":"おなかが{痛|いた}いんですが、どこか{病院|びょういん}を{知|し}りませんか。","zh":"我肚子疼，你知道哪里有医院吗？","src":"第4课 别册p.14","say":"おなかが痛いんですが、どこか病院を知りませんか。"}],"tips":["后半句常省略，让对方领会：{道|みち}に{迷|まよ}ってしまったんですが……（5-1）。"]},{"id":"4-2","lesson":4,"st":1,"stTitle":"生活を楽しむ","cat":"cond","pattern":"～なら、～","official":"～なら、～","usage":"","usageR":"","conn":"普通形（ナA・N 去「だ」）＋ なら、～","zh":"“如果（你）要～的话，（我建议）～”。接过对方的话题，给出建议或信息。","pex":[{"jp":"{行|い}く → {行|い}くなら","say":"行く 、 行くなら"}],"ex":[{"jp":"Ａ：{歯|は}が{痛|いた}いんですが、いい{歯医者|はいしゃ}を{知|し}りませんか。　Ｂ：{歯|は}が{痛|いた}いなら、{南|みなみ}{歯科|しか}がいいですよ。","zh":"A：我牙疼，你知道好的牙医吗？　B：牙疼的话，南齿科不错。","src":"第4课 别册p.14","say":"歯が痛いんですが、いい歯医者を知りませんか。 歯が痛いなら、南歯科がいいですよ。"},{"jp":"{京都|きょうと}へ{行|い}くなら、{新幹線|しんかんせん}が{便利|べんり}ですよ。","zh":"要去京都的话，坐新干线很方便。","src":"","say":"京都へ行くなら、新幹線が便利ですよ。"}],"tips":["「なら」的后项可以发生在前项之前：{京都|きょうと}へ{行|い}くなら、{切符|きっぷ}を{買|か}っておいたほうがいいです。","比较第1课「Nなら」（限定范围，1-6）。"]},{"id":"4-3","lesson":4,"st":1,"stTitle":"生活を楽しむ","cat":"advice","pattern":"Ｖたらいいです","official":"Ｖたらいいです","usage":"","usageR":"","conn":"（疑问词）＋ Vた ＋ らいいですか","zh":"“～才好呢？”。征求做法、建议。回答可用「～といいですよ」。","pex":[{"jp":"{乗|の}る → {乗|の}ったらいいですか","say":"乗る 、 乗ったらいいですか"}],"ex":[{"jp":"どのバスに{乗|の}ったらいいですか。","zh":"坐哪路公交车好呢？","src":"第4课 别册p.14","say":"どのバスに乗ったらいいですか。"},{"jp":"どこで{予約|よやく}したらいいですか。","zh":"在哪里预约好呢？","src":"第4课 别册p.14","say":"どこで予約したらいいですか。"}],"tips":["常和疑问词一起用：どうしたら・どこで・{誰|だれ}に ～たらいいですか。"]},{"id":"4-4","lesson":4,"st":1,"stTitle":"生活を楽しむ","cat":"advice","pattern":"Ｖるといいです","official":"Ｖるといいです","usage":"","usageR":"","conn":"Vる ＋ といいです（よ）","zh":"“～就好／最好～”。给对方建议、推荐做法。","pex":[{"jp":"{行|い}く → {行|い}くといいですよ","say":"行く 、 行くといいですよ"}],"ex":[{"jp":"{駅|えき}から{遠|とお}いので、{自転車|じてんしゃ}で{行|い}くといいですよ。","zh":"离车站远，骑自行车去比较好。","src":"第4课 别册p.14","say":"駅から遠いので、自転車で行くといいですよ。"},{"jp":"パクさんは{交流|こうりゅう}{会|かい}によく{行|い}っているので、パクさんに{聞|き}くといいですよ。","zh":"朴同学常去交流会，问她就好。","src":"第4课 别册p.14","say":"パクさんは交流会によく行っているので、パクさんに聞くといいですよ。"}],"tips":["「～といいですね」还可以表示愿望：{合格|ごうかく}できるといいですね（希望能考上）。"]},{"id":"4-5","lesson":4,"st":1,"stTitle":"生活を楽しむ","cat":"aspect","pattern":"Ｎまでに～","official":"Ｎまでに～","usage":"","usageR":"","conn":"时间N ＋ までに ＋ 一次性动作","zh":"“在～之前（完成）”，表示期限。","pex":[{"jp":"{今月|こんげつ}31{日|にち}までに","say":"今月31にちまでに"}],"ex":[{"jp":"Ａ：いつまでに{予約|よやく}しなければなりませんか。　Ｂ：{今月|こんげつ}31{日|にち}までに{予約|よやく}しなければなりません。","zh":"A：最晚什么时候之前要预约？　B：必须在本月31日之前预约。","src":"第4课 p.58","say":"いつまでに予約しなければなりませんか。 今月31にちまでに予約しなければなりません。"},{"jp":"{金曜日|きんようび}までにレポートを{出|だ}してください。","zh":"请在星期五之前交报告。","src":"","say":"きんようびまでにレポートを出してください。"}],"tips":["「まで」＝动作一直持续到某时：５{時|じ}まで{働|はたら}きます；「までに」＝在期限前完成：５{時|じ}までに{帰|かえ}ります。"]},{"id":"4-6","lesson":4,"st":2,"stTitle":"行き方を教える","cat":"cond","pattern":"Ｖると、Ｎがあります","official":"Ｖると、Ｎがあります","usage":"","usageR":"","conn":"Vる ＋ と、（场所）に N があります","zh":"“一～，就（能看到）～”。指路时说做了某动作以后会出现什么。","pex":[{"jp":"{渡|わた}る → {渡|わた}ると","say":"渡る 、 渡ると"}],"ex":[{"jp":"この{道|みち}をまっすぐ{行|い}って、1つ{目|め}の{交差点|こうさてん}を{右|みぎ}に{曲|ま}がって、20メートル{行|い}くと、{右|みぎ}に{喫茶店|きっさてん}があります。","zh":"沿这条路直走，在第一个路口右转，再走20米，右边有一家咖啡店。","src":"第4课 别册p.15","say":"この道をまっすぐ行って、1つ目の交差点を右に曲がって、20メートル行くと、右に喫茶店があります。"},{"jp":"その{橋|はし}を{渡|わた}ると、{左|ひだり}に{田中|たなか}{自転車|じてんしゃ}があります。","zh":"过了那座桥，左边是田中自行车店。","src":"第4课 别册p.15","say":"その橋を渡ると、左に田中自転車があります。"}],"tips":["「と」的后项不能是意志、请求：✗ {交差点|こうさてん}を{渡|わた}ると、{右|みぎ}に{曲|ま}がってください。"]},{"id":"4-7","lesson":4,"st":2,"stTitle":"行き方を教える","cat":"struct","pattern":"Ｎじゃなくて、〜　Ｖるんじゃなくて、〜","official":"Ｎじゃなくて、〜　Ｖるんじゃなくて、〜","usage":"","usageR":"","conn":"N ＋ じゃなくて、～ ／ Vる ＋ んじゃなくて、～","zh":"“不是～，而是～”。纠正对方的理解。","pex":[{"jp":"2つ{目|め}じゃなくて","say":"2つ目じゃなくて"},{"jp":"{行|い}くんじゃなくて","say":"行くんじゃなくて"}],"ex":[{"jp":"Ａ：1つ{目|め}の{交差点|こうさてん}を{左|ひだり}ですか。　Ｂ：いいえ、1つ{目|め}の{交差点|こうさてん}じゃなくて、2つ{目|め}の{交差点|こうさてん}です。","zh":"A：是在第一个路口左转吗？　B：不，不是第一个路口，是第二个路口。","src":"第4课 别册p.15","say":"1つ目の交差点を左ですか。 いいえ、1つ目の交差点じゃなくて、2つ目の交差点です。"},{"jp":"Ａ：{交差点|こうさてん}をまっすぐ{行|い}きますか。　Ｂ：あ、まっすぐ{行|い}くんじゃなくて、{右|みぎ}に{曲|ま}がってください。","zh":"A：在路口直走吗？　B：啊，不是直走，请右转。","src":"第4课 别册p.15","say":"交差点をまっすぐ行きますか。 あ、まっすぐ行くんじ "src":"第5课 别册p.19","say":"もう少しゆっくり話していただけませんか。"},{"jp":"{地図|ちず}を{描|か}いていただけませんか。","zh":"能请您画一下地图吗？","src":"第5课 别册p.19","say":"地図をかいていただけませんか。"}],"tips":["礼貌程度：～てください ＜ ～てもらえませんか ＜ ～ていただけませんか。"]},{"id":"5-5","lesson":5,"st":2,"stTitle":"駅で","cat":"reason","pattern":"～て、～（{理由|りゆう}）","official":"～て、～（理由）","usage":"理由","usageR":"{理由|りゆう}","conn":"Vて／Vなくて／イAくて／ナAで ＋ 感情・结果","zh":"前项表示原因，后项多是感情（{困|こま}る・びっくりする・{残念|ざんねん}）或“做不到”的结果。","pex":[{"jp":"なくして、{困|こま}っています","say":"なくして、困っています"},{"jp":"{行|い}けなくて、{残念|ざんねん}です","say":"行けなくて、残念です"}],"ex":[{"jp":"{鍵|かぎ}をなくして、{困|こま}っています。","zh":"钥匙丢了，我很为难。","src":"第5课 别册p.19","say":"鍵をなくして、困っています。"},{"jp":"パーティーに{行|い}けなくて、{残念|ざんねん}です。","zh":"不能去聚会，很遗憾。","src":"第5课 别册p.19","say":"パーティーに行けなくて、残念です。"}],"tips":["后项不能是意志、请求、命令：✗ {雨|あめ}が{降|ふ}って、{帰|かえ}ってください → ✓ {雨|あめ}が{降|ふ}っているので、{帰|かえ}ってください。"]},{"id":"5-6","lesson":5,"st":2,"stTitle":"駅で","cat":"cond","pattern":"Ｖたら、～た（{発見|はっけん}）","official":"Ｖたら、～た（発見）","usage":"発見","usageR":"{発見|はっけん}","conn":"Vた ＋ ら、～た","zh":"“做了～，结果发现～”。后项是意外发现的事实，用过去形。","pex":[{"jp":"{開|あ}けたら、ありませんでした","say":"あけたら、ありませんでした"}],"ex":[{"jp":"かばんを{開|あ}けたら、{財布|さいふ}がありませんでした。","zh":"打开包一看，钱包不见了。","src":"第5课 别册p.19","say":"かばんをあけたら、財布がありませんでした。"},{"jp":"{起|お}きたら、10{時|じ}でした。","zh":"醒来一看，已经10点了。","src":"第5课 别册p.19","say":"起きたら、10時でした。"}],"tips":["后项是说话人无法控制的事实，不能是自己的意志动作。"]},{"id":"6-1","lesson":6,"st":1,"stTitle":"旅行の計画","cat":"advice","pattern":"Ｖましょうか","official":"Ｖましょうか","usage":"","usageR":"","conn":"（疑问词）＋ Vます形（去ます）＋ ましょうか","zh":"“我们～呢？”。和对方商量、一起决定（常和疑问词一起用）。","pex":[{"jp":"{行|い}きます → {行|い}きましょうか","say":"行きます 、 行きましょうか"}],"ex":[{"jp":"いいですね。どこへ{行|い}きましょうか。","zh":"好啊。我们去哪儿呢？","src":"第6课 p.82","say":"いいですね。どこへ行きましょうか。"},{"jp":"いつ{行|い}きましょうか。","zh":"我们什么时候去呢？","src":"第6课 别册p.21","say":"いつ行きましょうか。"}],"tips":["「{持|も}ちましょうか」也可以表示主动提出帮忙（“我来拿吧？”）；这里是商量“我们一起～呢”。"]},{"id":"6-2","lesson":6,"st":1,"stTitle":"旅行の計画","cat":"struct","pattern":"～し、～（{並列|へいれつ}）","official":"～し、～（並列）","usage":"並列","usageR":"{並列|へいれつ}","conn":"普通形 ＋ し、～（ナA・N：～だし）","zh":"“既～又～”。列举几个同类的事实，常和「も」一起用。","pex":[{"jp":"{近|ちか}い → {近|ちか}いし","say":"近い 、 近いし"},{"jp":"{有名|ゆうめい}だ → {有名|ゆうめい}だし","say":"有名だ 、 有名だし"}],"ex":[{"jp":"{箱根|はこね}は{近|ちか}いし、{交通|こうつう}{費|ひ}も{安|やす}いです。","zh":"箱根很近，交通费也便宜。","src":"第6课 别册p.21","say":"箱根は近いし、交通費も安いです。"},{"jp":"このレストランはおいしいし、{雰囲気|ふんいき}もいいし、{飲|の}み{放題|ほうだい}もあります。","zh":"这家餐厅又好吃，气氛又好，还有畅饮。","src":"第6课 别册p.21","say":"このレストランはおいしいし、雰囲気もいいし、飲み放題もあります。"}],"tips":["「し」暗示“不只这一点”，所以常用「も」。"]},{"id":"6-3","lesson":6,"st":1,"stTitle":"旅行の計画","cat":"struct","pattern":"～のは～です（{強調|きょうちょう}{構文|こうぶん}）","official":"～のは～です（強調構文）","usage":"強調構文","usageR":"{強調|きょうちょう}{構文|こうぶん}","conn":"普通形（ナA・N：～な）＋ のは ＋ 要强调的信息 ＋ です","zh":"把想强调的信息放在「です」前面：“～的是……”。","pex":[{"jp":"{温泉|おんせん}に{入|はい}れるのはこのホテルです","say":"温泉にはいれるのはこのホテルです"}],"ex":[{"jp":"{温泉|おんせん}に{入|はい}れるのはこのホテルです。","zh":"能泡温泉的是这家酒店。","src":"第6课 别册p.21","say":"温泉にはいれるのはこのホテルです。"},{"jp":"チェックインできるのは{午後|ごご}3{時|じ}からです。","zh":"能办理入住是从下午3点开始。","src":"第6课 别册p.21","say":"チェックインできるのは午後3時からです。"}],"tips":["与 1-8「VるのはＡ」不同：这里「です」前面是名词等具体信息，不是评价。","ナA・N 用「な」：{出発|しゅっぱつ}が{夜|よる}なのは Ｂツアーです。"]},{"id":"6-4","lesson":6,"st":1,"stTitle":"旅行の計画","cat":"reason","pattern":"～し、～（{理由|りゆう}）","official":"～し、～（理由）","usage":"理由","usageR":"{理由|りゆう}","conn":"普通形 ＋ し、～し、＋ 结论","zh":"列举几个理由，引出结论、提议或判断。只说一个理由也可以，暗示“还有别的理由”。","pex":[{"jp":"{暑|あつ}いし、{虫|むし}も{多|おお}いし","say":"暑いし、虫も多いし"}],"ex":[{"jp":"{暑|あつ}いし、{虫|むし}も{多|おお}いし、キャンプに{行|い}きたくないです。","zh":"又热，虫子又多，我不想去露营。","src":"第6课 别册p.21","say":"暑いし、虫も多いし、キャンプに行きたくないです。"},{"jp":"お{金|かね}もないし、アルバイトもあるし、{冬休|ふゆやす}み、{国|くに}へ{帰|かえ}れません。","zh":"又没钱，又要打工，寒假回不了国。","src":"第6课 别册p.21","say":"お金もないし、アルバイトもあるし、冬休み、国へ帰れません。"}],"tips":["比较 6-2：后面是结论时，「～し」就是在列举理由。"]},{"id":"6-5","lesson":6,"st":2,"stTitle":"旅行の準備","cat":"infer","pattern":"～そうです（{予測|よそく}）","official":"～そうです（予測）","usage":"予測","usageR":"{予測|よそく}","conn":"Vます形（去ます）／イA（去い）／ナA ＋ そうです；动词否定：Vそうにありません","zh":"“（看样子）会～”。根据现在的情况预测将来。","pex":[{"jp":"{遅|おく}れます → {遅|おく}れそうです","say":"遅れます 、 遅れそうです"},{"jp":"やみます → やみそうにありません","say":"やみます 、 やみそうにありません"}],"ex":[{"jp":"{約束|やくそく}の{時間|じかん}に{遅|おく}れそうです。","zh":"看来要迟到了。","src":"第6课 别册p.22","say":"約束の時間に遅れそうです。"},{"jp":"{雨|あめ}がやみそうにありません。","zh":"雨看样子停不了。","src":"第6课 别册p.22","say":"雨がやみそうにありません。"}],"tips":["动词的否定说「Vそうにありません」。","比较：2-1（外观样态）、9-6（马上就要发生）。"]},{"id":"6-6","lesson":6,"st":2,"stTitle":"旅行の準備","cat":"aspect","pattern":"Ｖておきます（{準備|じゅんび}）","official":"Ｖておきます（準備）","usage":"準備","usageR":"{準備|じゅんび}","conn":"Vて ＋ おきます","zh":"“事先～好”。为将来做准备。","pex":[{"jp":"{予約|よやく}する → {予約|よやく}しておきます","say":"予約する 、 予約しておきます"}],"ex":[{"jp":"ホテルを{予約|よやく}しておきます。","zh":"我先把酒店订好。","src":"第6课 别册p.22","say":"ホテルを予約しておきます。"},{"jp":"{飛行機|ひこうき}の{時間|じかん}を{調|しら}べておきます。","zh":"我先把飞机的时间查好。","src":"第6课 别册p.22","say":"飛行機の時間を調べておきます。"}],"tips":["口语：～ておく → ～とく（{予約|よやく}しとく）。","第9课的“放置”用法见 9-7。"]},{"id":"6-7","lesson":6,"st":2,"stTitle":"旅行の準備","cat":"aspect","pattern":"Ｖてあります（{完了|かんりょう}）","official":"Ｖてあります（完了）","usage":"完了","usageR":"{完了|かんりょう}","conn":"（もう）Vて ＋ あります","zh":"“已经～好了”。准备工作已经完成，结果保留着。","pex":[{"jp":"{払|はら}う → もう{払|はら}ってあります","say":"払う 、 もう払ってあります"}],"ex":[{"jp":"はい、もう{払|はら}ってあります。","zh":"是的，已经付好了。","src":"第6课 别册p.22","say":"はい、もう払ってあります。"},{"jp":"はい、もう{調|しら}べてあります。","zh":"是的，已经查好了。","src":"第6课 别册p.22","say":"はい、もう調べてあります。"}],"tips":["「～ておきます」＝（为将来）事先做；「～てあります」＝已经做好的现在状态。"]},{"id":"7-1","lesson":7,"st":1,"stTitle":"初めての訪問","cat":"keigo","pattern":"{特別|とくべつ}な{尊敬|そんけい}{語|ご}","official":"特別な尊敬語","usage":"","usageR":"","conn":"{行|い}く・{来|く}る・いる→いらっしゃる；{食|た}べる・{飲|の}む→{召|め}し{上|あ}がる；{見|み}る→ご{覧|らん}になる；{言|い}う→おっしゃる；する→なさる；{知|し}っている→ご{存|ぞん}じだ","zh":"一部分动词有专门的尊敬语，用于上级、长辈、客人的动作。","pex":[{"jp":"{食|た}べる → {召|め}し{上|あ}がる","say":"食べる 、 召し上がる"},{"jp":"{見|み}る → ご{覧|らん}になる","say":"見る 、 ご覧になる"},{"jp":"{言|い}う → おっしゃる","say":"いう 、 おっしゃる"}],"ex":[{"jp":"{先生|せんせい}は{明日|あした}テストだとおっしゃいました。","zh":"老师说明天考试。","src":"第7课 别册p.24","say":"先生はあしたテストだとおっしゃいました。"},{"jp":"Ａ：{山田|やまだ}さんをご{存|ぞん}じですか。　Ｂ：はい、{知|し}っています。","zh":"A：您认识山田先生吗？　B：是的，认识。","src":"第7课 别册p.24","say":"山田さんをご存じですか。 はい、知っています。"}],"tips":["なさる・おっしゃる・いらっしゃる 的ます形是「～います」：なさいます、おっしゃいます。","回答时说自己的动作不用尊敬语：はい、{見|み}ました。"]},{"id":"7-2","lesson":7,"st":1,"stTitle":"初めての訪問","cat":"keigo","pattern":"おＶになります","official":"おＶになります","usage":"","usageR":"","conn":"お ＋ Vます形（去ます）＋ になります","zh":"尊敬语的一般形式，用于对方或上级的动作。","pex":[{"jp":"{読|よ}みます → お{読|よ}みになります","say":"読みます 、 お読みになります"},{"jp":"{帰|かえ}ります → お{帰|かえ}りになります","say":"帰ります 、 お帰りになります"}],"ex":[{"jp":"{社長|しゃちょう}はよく{外国|がいこく}の{小説|しょうせつ}をお{読|よ}みになります。","zh":"社长经常读外国小说。","src":"第7课 别册p.24","say":"社長はよく外国の小説をお読みになります。"},{"jp":"Ａ：いつも{何時頃|なんじごろ}お{帰|かえ}りになりますか。　Ｂ：9{時|じ}{頃|ごろ}{帰|かえ}ります。","zh":"A：您平时几点左右回家？　B：9点左右回家。","src":"第7课 别册p.24","say":"いつもなんじごろお帰りになりますか。 9時ごろ帰ります。"}],"tips":["ます形只有一拍的动词（{見|み}ます・{寝|ね}ます・います）不能用：✗ お{見|み}になります → ✓ ご{覧|らん}になります。","有专门尊敬语的动词优先用专门的说法（7-1）。"]},{"id":"7-3","lesson":7,"st":1,"stTitle":"初めての訪問","cat":"keigo","pattern":"{尊敬|そんけい}{動詞|どうし}","official":"尊敬動詞","usage":"","usageR":"","conn":"形同被动：Ⅰ类 う段→あ段＋れる（{書|か}く→{書|か}かれる）；Ⅱ类 去る＋られる；する→される，{来|く}る→{来|こ}られる","zh":"用「れる・られる」表示尊敬，敬意比「お～になる」轻一些，用途很广。","pex":[{"jp":"{辞|や}める → {辞|や}められる","say":"辞める 、 辞められる"},{"jp":"{退院|たいいん}する → {退院|たいいん}される","say":"退院する 、 退院される"},{"jp":"{来|く}る → {来|こ}られる","say":"来る 、 来られる"}],"ex":[{"jp":"{佐藤|さとう}さんは3{年|ねん}{前|まえ}に{会社|かいしゃ}を{辞|や}められました。","zh":"佐藤先生3年前辞去了公司的工作。","src":"第7课 别册p.24","say":"佐藤さんは3年前に会社を辞められました。"},{"jp":"Ａ：いつ{日本|にほん}へ{来|こ}られましたか。　Ｂ：3か{月|げつ}{前|まえ}に{来|き}ました。","zh":"A：您什么时候来日本的？　B：3个月前来的。","src":"第7课 别册p.24","say":"いつにほんへ来られましたか。 3か月前に来ました。"}],"tips":["形式和被动（10-1）、可能（{来|こ}られる）一样，要看上下文判断。"]},{"id":"7-4","lesson":7,"st":1,"stTitle":"初めての訪問","cat":"keigo","pattern":"おＶします　ごＮします","official":"おＶします　ごＮします","usage":"","usageR":"","conn":"お ＋ Vます形（去ます）＋ します ／ ご ＋ 汉语动作名词 ＋ します","zh":"谦让语：为对方做事时，把自己的动作说得谦虚，以示尊敬。","pex":[{"jp":"{手伝|てつだ}います → お{手伝|てつだ}いします","say":"手伝います 、 お手伝いします"},{"jp":"{紹介|しょうかい}します → ご{紹介|しょうかい}します","say":"紹介します 、 ご紹介します"}],"ex":[{"jp":"{私|わたし}の{国|くに}についてお{話|はな}しします。","zh":"我来讲讲我的国家。","src":"第7课 别册p.24","say":"わたしの国についてお話しします。"},{"jp":"{私|わたし}の{家族|かぞく}をご{紹介|しょうかい}します。","zh":"我来介绍一下我的家人。","src":"第7课 别册p.24","say":"わたしの家族をご紹介します。"}],"tips":["只用于自己的动作：✗ {先生|せんせい}がお{話|はな}しします。","「ご」多接汉语词（{紹介|しょうかい}・{連絡|れんらく}・{案内|あんない}），「お」多接和语动词；例外：お{電話|でんわ}します。"]},{"id":"7-5","lesson":7,"st":2,"stTitle":"一緒に作りましょう","cat":"struct","pattern":"イＡくＶ　ナＡ・ＮにＶ（{形容|けいよう}{詞|し}の{副詞|ふくし}{的|てき}{用法|ようほう}）","official":"イＡくＶ　ナＡ・ＮにＶ（形容詞の副詞的用法）","usage":"形容詞の副詞的用法","usageR":"{形容|けいよう}{詞|し}の{副詞|ふくし}{的|てき}{用法|ようほう}","conn":"イA：去い＋く＋V ／ ナA・N：＋に＋V","zh":"形容词变成副词来修饰动词：“～地（做）”。","pex":[{"jp":"{薄|うす}い → {薄|うす}く{切|き}ります","say":"薄い 、 薄く切ります"},{"jp":"きれい → きれいに{洗|あら}います","say":"きれい 、 きれいに洗います"}],"ex":[{"jp":"タマネギを{薄|うす}く{切|き}ります。","zh":"把洋葱切薄。","src":"第7课 别册p.26","say":"タマネギを薄く切ります。"},{"jp":"{野菜|やさい}をきれいに{洗|あら}います。","zh":"把蔬菜洗干净。","src":"第7课 别册p.26","say":"野菜をきれいに洗います。"},{"jp":"ジャガイモを{半分|はんぶん}に{切|き}ります。","zh":"把土豆切成两半。","src":"第7课 别册p.26","say":"ジャガイモを半分に切ります。"}],"tips":["名词也可以：{半分|はんぶん}に{切|き}ります。"]},{"id":"7-6","lesson":7,"st":2,"stTitle":"一緒に作りましょう","cat":"aspect","pattern":"Ｖている{間|あいだ}に、～","official":"Ｖている間に、～","usage":"","usageR":"","conn":"Vて ＋ いる{間|あいだ}に、＋ 另一个动作","zh":"“在～的期间（趁着～）做……”。后项是在这段时间里完成的动作。","pex":[{"jp":"{焼|や}いている{間|あいだ}に","say":"焼いているあいだに"}],"ex":[{"jp":"{肉|にく}を{焼|や}いている{間|あいだ}に、ニンジンを{切|き}りましょう。","zh":"烤肉的时候，我们把胡萝卜切了吧。","src":"第7课 p.98","say":"肉を焼いているあいだに、ニンジンを切りましょう。"},{"jp":"パスタをゆでている{間|あいだ}に、ソースを{作|つく}りましょう。","zh":"煮意大利面的时候，我们来做酱汁吧。","src":"第7课 p.98","say":"パスタをゆでているあいだに、ソースを作りましょう。"}],"tips":["「{間|ま}に」＝在这段时间里某个时候做完；「{間|ま}」（不加に）＝整段时间一直：{電車|でんしゃ}に{乗|の}っている{間|あいだ}、ずっと{寝|ね}ていました。"]},{"id":"7-7","lesson":7,"st":2,"stTitle":"一緒に作りましょう","cat":"struct","pattern":"イＡくします　ナＡ・Ｎにします","official":"イＡくします　ナＡ・Ｎにします","usage":"","usageR":"","conn":"イA：去い＋くします ／ ナA・N：＋にします","zh":"“把～弄成／调成～”。人有意地改变事物的状态。","pex":[{"jp":"{濃|こ}い → {濃|こ}くします","say":"濃い 、 濃くします"},{"jp":"きれい → きれいにします","say":"きれい 、 きれいにします"}],"ex":[{"jp":"{味|あじ}を{濃|こ}くします。","zh":"把味道调浓。","src":"第7课 别册p.26","say":"味を濃くします。"},{"jp":"テーブルをきれいにします。","zh":"把桌子收拾干净。","src":"第7课 别册p.26","say":"テーブルをきれいにします。"}],"tips":["「～くなります／～になります」＝自然变成；「～くします／～にします」＝人为使之变成。","比较 2-11「Nにします」（选择、决定）。"]},{"id":"8-1","lesson":8,"st":1,"stTitle":"うれしい出来事","cat":"give","pattern":"Ｖてあげます","official":"Ｖてあげます","usage":"","usageR":"","conn":"（我）は（人）に N を Vて ＋ あげます","zh":"“（我／某人）为别人做～”。帮忙的一方作主语。","pex":[{"jp":"{教|おし}える → {教|おし}えてあげました","say":"教える 、 教えてあげました"}],"ex":[{"jp":"{私|わたし}はパクさんにイタリア{語|ご}を{教|おし}えてあげました。","zh":"我教了朴同学意大利语。","src":"第8课 别册p.27","say":"わたしはパクさんにイタリア語を教えてあげました。"},{"jp":"{私|わたし}はアンナさんのかばんを{持|も}ってあげました。","zh":"我帮安娜提了包。","src":"第8课 别册p.27","say":"わたしはアンナさんのかばんを持ってあげました。"}],"tips":["直接对长辈说「～てあげます」显得施恩，不礼貌：✗ {先生|せんせい}、{荷物|にもつ}を{持|も}ってあげます → ✓ お{持|も}ちします（7-4）。","助词随动词而定：〈人〉に{教|おし}える；〈人〉を{手伝|てつだ}う；〈人〉の〈物〉を{直|なお}す。"]},{"id":"8-2","lesson":8,"st":1,"stTitle":"うれしい出来事","cat":"give","pattern":"Ｖてもらいます","official":"Ｖてもらいます","usage":"","usageR":"","conn":"（我）は（人）に Vて ＋ もらいます","zh":"“（我）请别人为我做～／得到别人的帮助”。受益的人作主语，含感谢。","pex":[{"jp":"{貸|か}す → {貸|か}してもらいました","say":"貸す 、 貸してもらいました"}],"ex":[{"jp":"{私|わたし}はマルコさんに{傘|かさ}を{貸|か}してもらいました。","zh":"马可借给了我伞。","src":"第8课 别册p.27","say":"わたしはマルコさんに傘を貸してもらいました。"},{"jp":"{私|わたし}はマルコさんに{横浜|よこはま}を{案内|あんない}してもらいました。","zh":"马可带我游览了横滨。","src":"第8课 别册p.27","say":"わたしはマルコさんに横浜を案内してもらいました。"}],"tips":["帮忙的人用「に」。"]},{"id":"8-3","lesson":8,"st":1,"stTitle":"うれしい出来事","cat":"give","pattern":"Ｖてくれます","official":"Ｖてくれます","usage":"","usageR":"","conn":"（人）が（{私|わたし}に）Vて ＋ くれます","zh":"“（别人）为我（我方）做～”。帮忙的人作主语，含感谢。","pex":[{"jp":"{教|おし}える → {教|おし}えてくれました","say":"教える 、 教えてくれました"}],"ex":[{"jp":"アンナさんが（{私|わたし}に）{駅|えき}への{行|い}き{方|かた}を{教|おし}えてくれました。","zh":"安娜告诉了我去车站的路。","src":"第8课 别册p.27","say":"アンナさんがわたしに駅への行きかたを教えてくれました。"},{"jp":"アンナさんが（{私|わたし}の）{作文|さくぶん}を{直|なお}してくれました。","zh":"安娜帮我改了作文。","src":"第8课 别册p.27","say":"アンナさんがわたしの作文を直してくれました。"}],"tips":["「くれる」的接受者只能是我或我这一方的人。"]},{"id":"8-4","lesson":8,"st":2,"stTitle":"お世話になりました","cat":"give","pattern":"いただきます","official":"いただきます","usage":"","usageR":"","conn":"（我）は（长辈）に N を いただきます（もらう 的谦让语）","zh":"“（从长辈、上级那里）得到～”。","pex":[{"jp":"もらいました → いただきました","say":"もらいました 、 いただきました"}],"ex":[{"jp":"（{私|わたし}は）{交流|こうりゅう}{会|かい}の{方|かた}に{浴衣|ゆかた}をいただきました。","zh":"我从交流会的人那里得到了一件浴衣。","src":"第8课 别册p.29","say":"わたしは交流会のかたに浴衣をいただきました。"},{"jp":"（{私|わたし}は）{交流|こうりゅう}{会|かい}の{方|かた}にコンサートのチケットをいただきました。","zh":"我从交流会的人那里得到了音乐会的票。","src":"第8课 别册p.29","say":"わたしは交流会のかたにコンサートのチケットをいただきました。"}],"tips":["平辈：もらう；长辈、上级：いただく。"]},{"id":"8-5","lesson":8,"st":2,"stTitle":"お世話になりました","cat":"give","pattern":"くださいます","official":"くださいます","usage":"","usageR":"","conn":"（长辈）が（{私|わたし}に）N を くださいます（くれる 的尊敬语）","zh":"“（长辈、上级）给我～”。","pex":[{"jp":"くれました → くださいました","say":"くれました 、 くださいました"}],"ex":[{"jp":"{木村|きむら}さんが（{私|わたし}に）{机|つくえ}をくださいました。","zh":"木村先生给了我一张桌子。","src":"第8课 别册p.29","say":"木村さんがわたしに机をくださいました。"},{"jp":"{木村|きむら}さんが（{私|わたし}に）{日本|にほん}のお{菓子|かし}をくださいました。","zh":"木村先生给了我日本点心。","src":"第8课 别册p.29","say":"木村さんがわたしににほんのお菓子をくださいました。"}],"tips":["ます形是「くださいます」（✗ くださります）。"]},{"id":"8-6","lesson":8,"st":2,"stTitle":"お世話になりました","cat":"give","pattern":"Ｖていただきます","official":"Ｖていただきます","usage":"","usageR":"","conn":"（我）は（长辈）に Vて ＋ いただきます","zh":"“承蒙（长辈）为我做～”。「～てもらう」的谦让说法。","pex":[{"jp":"{教|おし}えてもらいました → {教|おし}えていただきました","say":"教えてもらいました 、 教えていただきました"}],"ex":[{"jp":"（{私|わたし}は）{近所|きんじょ}の{方|かた}に{日本|にほん}の{料理|りょうり}の{作|つく}り{方|かた}を{教|おし}えていただきました。","zh":"邻居教了我日本菜的做法。","src":"第8课 别册p.29","say":"わたしは近所のかたににほんの料理の作りかたを教えていただきました。"},{"jp":"（{私|わたし}は）{大学|だいがく}の{教授|きょうじゅ}に{本|ほん}を{貸|か}していただきました。","zh":"大学教授借给了我书。","src":"第8课 别册p.29","say":"わたしは大学の教授に本を貸していただきました。"}],"tips":["比较：{友達|ともだち}に{教|おし}えてもらいました ↔ {先生|せんせい}に{教|おし}えていただきました。"]},{"id":"8-7","lesson":8,"st":2,"stTitle":"お世話になりました","cat":"give","pattern":"Ｖてくださいます","official":"Ｖてくださいます","usage":"","usageR":"","conn":"（长辈）が（{私|わたし}に／{私|わたし}を／{私|わたし}の）Vて ＋ くださいます","zh":"“（长辈）为我做～”。「～てくれる」的尊敬说法。","pex":[{"jp":"{紹介|しょうかい}してくれました → {紹介|しょうかい}してくださいました","say":"紹介してくれました 、 紹介してくださいました"}],"ex":[{"jp":"{学校|がっこう}の{先生|せんせい}が（{私|わたし}に）アルバイトを{紹介|しょうかい}してくださいました。","zh":"学校的老师给我介绍了打工。","src":"第8课 别册p.29","say":"学校の先生がわたしにアルバイトを紹介してくださいました。"},{"jp":"{課長|かちょう}が（{私|わたし}を）うちまで{車|くるま}で{送|おく}ってくださいました。","zh":"科长开车把我送到了家。","src":"第8课 别册p.29","say":"課長がわたしをうちまで車で送ってくださいました。"}],"tips":["主语是帮忙的长辈，用「が」。"]},{"id":"9-1","lesson":9,"st":1,"stTitle":"アルバイト先のルール","cat":"advice","pattern":"Ｖることになっています　Vないことになっています（{規則|きそく}）","official":"Ｖることになっています　Vないことになっています（規則）","usage":"規則","usageR":"{規則|きそく}","conn":"Vる／Vない ＋ ことになっています","zh":"“规定要～／规定不能～”。说明团体、场所的规则（不是自己决定的）。","pex":[{"jp":"{出|だ}す → {出|だ}すことになっています","say":"出す 、 出すことになっています"}],"ex":[{"jp":"{燃|も}えるごみは{火曜日|かようび}と{金曜日|きんようび}に{出|だ}すことになっています。","zh":"可燃垃圾规定在星期二和星期五扔。","src":"第9课 别册p.31","say":"燃えるごみはかようびときんようびに出すことになっています。"},{"jp":"{店|みせ}の{中|なか}では、たばこを{吸|す}わないことになっています。","zh":"规定店里不吸烟。","src":"","say":"店の中では、たばこを吸わないことになっています。"}],"tips":["第9课 ST2 还有表示“预定”的用法（9-10）。","比较 12-11「Vることにします」＝自己决定。"]},{"id":"9-2","lesson":9,"st":1,"stTitle":"アルバイト先のルール","cat":"purpose","pattern":"Ｖるように、～　Ｖないように、～","official":"Ｖるように、～　Ｖないように、～","usage":"","usageR":"","conn":"Vる（可能动词・无意志动词）／Vない ＋ ように、～","zh":"“为了（能）～／为了不～”。目的是某种状态或结果，前面常用可能动词、无意志动词或否定形。","pex":[{"jp":"{聞|き}こえる → {聞|き}こえるように","say":"聞こえる 、 聞こえるように"},{"jp":"{忘|わす}れない → {忘|わす}れないように","say":"忘れない 、 忘れないように"}],"ex":[{"jp":"お{客|きゃく}{様|さま}に{聞|き}こえるように、{大|おお}きな{声|こえ}であいさつしてください。","zh":"为了让客人听得见，请大声打招呼。","src":"第9课 别册p.31","say":"お客様に聞こえるように、大きな声であいさつしてください。"},{"jp":"{忘|わす}れないように、カレンダーに{予定|よてい}を{書|か}いておきます。","zh":"为了不忘记，我把安排写在日历上。","src":"第9课 别册p.31","say":"忘れないように、カレンダーに予定を書いておきます。"}],"tips":["「ために」接意志动词（{勉強|べんきょう}するために）；「ように」接可能动词、无意志动词或否定（{話|はな}せるように、{忘|わす}れないように）。"]},{"id":"9-3","lesson":9,"st":1,"stTitle":"アルバイト先のルール","cat":"form","pattern":"{条件|じょうけん}{形|けい}","official":"条件形","usage":"","usageR":"","conn":"Ⅰ类 う段→え段＋ば（{言|い}う→{言|い}えば）；Ⅱ类 去る＋れば；する→すれば，{来|く}る→{来|く}れば；イA：去い＋ければ；否定：～なければ；ナA・N：～なら","zh":"“如果～（就）～”。表示条件，后项多是一般的结果或可能性。","pex":[{"jp":"{働|はたら}く → {働|はたら}けば","say":"働く 、 働けば"},{"jp":"わからない → わからなければ","say":"わからない 、 わからなければ"},{"jp":"{少|すく}ない → {少|すく}なければ","say":"少ない 、 少なければ"}],"ex":[{"jp":"3か{月|げつ}まじめに{働|はたら}けば、{時給|じきゅう}が{上|あ}がります。","zh":"认真工作3个月的话，时薪就会涨。","src":"第9课 别册p.31","say":"3か月まじめに働けば、時給が上がります。"},{"jp":"レジの{使|つか}い{方|かた}がわからなければ、すぐ{聞|き}いてください。","zh":"如果不知道收银机怎么用，请马上问。","src":"第9课 别册p.31","say":"レジの使いかたがわからなければ、すぐ聞いてください。"},{"jp":"お{客|きゃく}{様|さま}が{少|すく}なければ、{早|はや}く{帰|かえ}ってもいいです。","zh":"如果客人少，可以早点回去。","src":"第9课 别册p.31","say":"お客様が少なければ、早く帰ってもいいです。"}],"tips":["前项是动作动词（肯定）时，后项一般不用请求、意志：✗ {駅|えき}に{着|つ}けば、{電話|でんわ}してください → ✓ {着|つ}いたら。","ナA・N 用「なら」：{風邪|かぜ}なら、{休|やす}んでもいいです。"]},{"id":"9-4","lesson":9,"st":1,"stTitle":"アルバイト先のルール","cat":"advice","pattern":"Ｖるようにしてください　Ｖないようにしてください","official":"Ｖるようにしてください　Ｖないようにしてください","usage":"","usageR":"","conn":"Vる／Vない ＋ ようにしてください","zh":"“请注意（尽量）做到～／请注意不要～”。要求对方养成习惯、注意某事，比「～てください」委婉。","pex":[{"jp":"{聞|き}く → {聞|き}くようにしてください","say":"聞く 、 聞くようにしてください"},{"jp":"{走|はし}らない → {走|はし}らないようにしてください","say":"走らない 、 走らないようにしてください"}],"ex":[{"jp":"わからないことがあったら、すぐ{誰|だれ}かに{聞|き}くようにしてください。","zh":"有不懂的事，请马上问别人。","src":"第9课 别册p.31","say":"わからないことがあったら、すぐ誰かに聞くようにしてください。"},{"jp":"ホールでは{走|はし}らないようにしてください。","zh":"在大厅里请不要跑。","src":"第9课 别册p.31","say":"ホールでは走らないようにしてください。"}],"tips":["比较 12-10「～ようにしています」（自己平时坚持）。"]},{"id":"9-5","lesson":9,"st":2,"stTitle":"楽しいアルバイト","cat":"keigo","pattern":"おＶください　ごＮください","official":"おＶください　ごＮください","usage":"","usageR":"","conn":"お ＋ Vます形（去ます）＋ ください ／ ご ＋ 汉语N ＋ ください","zh":"“请～”。比「～てください」郑重，店员对客人、告示中常用。","pex":[{"jp":"{待|ま}ちます → お{待|ま}ちください","say":"待ちます 、 お待ちください"},{"jp":"{利用|りよう}します → ご{利用|りよう}ください","say":"利用します 、 ご利用ください"}],"ex":[{"jp":"こちらのいすにおかけください。","zh":"请坐这边的椅子。","src":"第9课 别册p.33","say":"こちらのいすにおかけください。"},{"jp":"お{手洗|てあら}いはあちらをご{利用|りよう}ください。","zh":"洗手间请使用那边的。","src":"第9课 别册p.33","say":"お手洗いはあちらをご利用ください。"}],"tips":["「{少々|しょうしょう}お{待|ま}ちください」（第1课）也是这个形式。","ます形只有一拍的动词不能用：✗ お{見|み}ください → ✓ ご{覧|らん}ください。"]},{"id":"9-6","lesson":9,"st":2,"stTitle":"楽しいアルバイト","cat":"infer","pattern":"Ｖそうです（{直前|ちょくぜん}の{様態|ようたい}）","official":"Ｖそうです（直前の様態）","usage":"直前の様態","usageR":"{直前|ちょくぜん}の{様態|ようたい}","conn":"Vます形（去ます）＋ そうです","zh":"“眼看就要～了”。根据眼前的情况，判断马上要发生某事（多为不好的事）。","pex":[{"jp":"{消|き}えます → {消|き}えそうです","say":"消えます 、 消えそうです"}],"ex":[{"jp":"{火|ひ}が{消|き}えそうです。","zh":"火快要灭了。","src":"第9课 别册p.33","say":"火が消えそうです。"},{"jp":"{袋|ふくろ}が{破|やぶ}れそうです。","zh":"袋子快要破了。","src":"第9课 别册p.33","say":"袋が破れそうです。"}],"tips":["6-5（预测）是对将来的判断；9-6 是马上就要发生，常用来提醒对方。"]},{"id":"9-7","lesson":9,"st":2,"stTitle":"楽しいアルバイト","cat":"aspect","pattern":"Ｖておきます（{放置|ほうち}）","official":"Ｖておきます（放置）","usage":"放置","usageR":"{放置|ほうち}","conn":"Vて ＋ おきます","zh":"“（就那样）放着／保持～的状态”。为了某个目的让状态保持不变。","pex":[{"jp":"{開|あ}ける → {開|あ}けておきます","say":"あける 、 あけておきます"}],"ex":[{"jp":"{窓|まど}を{開|あ}けておきます。","zh":"窗户就开着吧。","src":"第9课 别册p.33","say":"窓をあけておきます。"},{"jp":"お{皿|さら}をそのままにしておきます。","zh":"盘子就那样放着。","src":"第9课 别册p.33","say":"お皿をそのままにしておきます。"}],"tips":["「そのままにしておいてください」＝请保持原样。","比较 6-6（事先准备）。"]},{"id":"9-8","lesson":9,"st":2,"stTitle":"楽しいアルバイト","cat":"form","pattern":"Ｖ（よ）う","official":"Ｖ（よ）う","usage":"","usageR":"","conn":"意向形（3-2）单独使用","zh":"“～吧”。「～ましょう」的普通形，用于朋友、家人之间的提议，或自言自语的决定。","pex":[{"jp":"{行|い}く → {行|い}こう","say":"行く 、 行こう"},{"jp":"する → しよう","say":"する 、 しよう"}],"ex":[{"jp":"{材料|ざいりょう}を{買|か}いに{行|い}こう。","zh":"去买材料吧。","src":"第9课 别册p.33","say":"材料を買いに行こう。"},{"jp":"{休憩|きゅうけい}しよう。","zh":"休息一下吧。","src":"第9课 别册p.33","say":"休憩しよう。"}],"tips":["对上级说「～ましょう」。"]},{"id":"9-9","lesson":9,"st":2,"stTitle":"楽しいアルバイト","cat":"aspect","pattern":"Ｖてしまいます（{完了|かんりょう}）","official":"Ｖてしまいます（完了）","usage":"完了","usageR":"{完了|かんりょう}","conn":"Vて ＋ しまいます","zh":"“（全部）做完／赶快做掉”。强调动作彻底完成。","pex":[{"jp":"{洗|あら}う → {洗|あら}ってしまいます","say":"洗う 、 洗ってしまいます"}],"ex":[{"jp":"{鍋|なべ}を{洗|あら}ってしまいます。","zh":"我把锅洗完。","src":"第9课 别册p.33","say":"鍋を洗ってしまいます。"},{"jp":"{野菜|やさい}を{切|き}ってしまいます。","zh":"我把蔬菜切完。","src":"第9课 别册p.33","say":"野菜を切ってしまいます。"}],"tips":["比较 5-1（遗憾、后悔，多用过去形）。"]},{"id":"9-10","lesson":9,"st":2,"stTitle":"楽しいアルバイト","cat":"intent","pattern":"Ｖることになっています（{予定|よてい}）","official":"Ｖることになっています（予定）","usage":"予定","usageR":"{予定|よてい}","conn":"Vる ＋ ことになっています","zh":"“已经定好要～”。表示安排好的预定（多半不是自己一个人决定的）。","pex":[{"jp":"{来|く}る → {来|く}ることになっています","say":"来る 、 来ることになっています"}],"ex":[{"jp":"{午前|ごぜん}{中|ちゅう}、インターネットの{会社|かいしゃ}の{人|ひと}が{来|く}ることになっています。","zh":"上午网络公司的人说好要来。","src":"第9课 别册p.33","say":"午前中、インターネットの会社の人が来ることになっています。"},{"jp":"あさって、{大学|だいがく}の{先輩|せんぱい}に{会|あ}うことになっています。","zh":"后天约好了和大学的学长见面。","src":"第9课 别册p.33","say":"あさって、大学の先輩に会うことになっています。"}],"tips":["同一个形式：9-1 是规则，9-10 是预定。"]},{"id":"10-1","lesson":10,"st":1,"stTitle":"ハプニング！","cat":"voice","pattern":"{受身|うけみ}","official":"受身","usage":"","usageR":"","conn":"Ⅰ类 う段→あ段＋れる（{押|お}す→{押|お}される；{誘|さそ}う→{誘|さそ}われる）；Ⅱ类 去る＋られる；する→される，{来|く}る→{来|こ}られる","zh":"被动：“被～”。受到影响的人作主语，动作者用「に」。常表示受害、困扰。","pex":[{"jp":"{押|お}す → {押|お}されました","say":"押す 、 押されました"},{"jp":"{取|と}る → {取|と}られました","say":"取る 、 取られました"},{"jp":"{注意|ちゅうい}する → {注意|ちゅうい}されました","say":"注意する 、 注意されました"}],"ex":[{"jp":"{私|わたし}は{後|うし}ろの{人|ひと}に{押|お}されました。","zh":"我被后面的人推了。","src":"第10课 别册p.35","say":"わたしはうしろの人に押されました。"},{"jp":"パクさんは{泥棒|どろぼう}に{財布|さいふ}を{取|と}られました。","zh":"朴同学的钱包被小偷偷了。","src":"第10课 别册p.35","say":"パクさんは泥棒に財布を取られました。"}],"tips":["东西受害时，常用“人”作主语：{私|わたし}は{泥棒|どろぼう}に{財布|さいふ}を{取|と}られました。","う结尾的动词：{言|い}う→{言|い}われる（✗ {言|い}あれる）。"]},{"id":"10-2","lesson":10,"st":1,"stTitle":"ハプニング！","cat":"reason","pattern":"～のに、～","official":"～のに、～","usage":"","usageR":"","conn":"普通形 ＋ のに、～（ナA・N：～なのに）","zh":"“明明～，却～”。结果与预期相反，带有不满、遗憾、意外的语气。","pex":[{"jp":"{予約|よやく}したのに","say":"予約したのに"},{"jp":"{春|はる}なのに","say":"春なのに"}],"ex":[{"jp":"ツインの{部屋|へや}を{予約|よやく}したのに、シングルの{部屋|へや}でした。","zh":"明明订的是双床房，却是单人房。","src":"第10课 别册p.35","say":"ツインの部屋を予約したのに、シングルの部屋でした。"},{"jp":"{春|はる}なのに、{雪|ゆき}が{降|ふ}っています。","zh":"明明是春天，却在下雪。","src":"第10课 别册p.35","say":"春なのに、雪が降っています。"}],"tips":["后项不能是意志、请求。","比较 12-7「Vるのに」（用途），形同义异。"]},{"id":"10-3","lesson":10,"st":1,"stTitle":"ハプニング！","cat":"infer","pattern":"～みたいです（{様態|ようたい}）","official":"～みたいです（様態）","usage":"様態","usageR":"{様態|ようたい}","conn":"普通形（ナA・N 去「だ」）＋ みたい（です）","zh":"“好像～”。根据看到、听到的情况推断，口语。","pex":[{"jp":"{取|と}られたみたい","say":"取られたみたい"},{"jp":"あるみたい","say":"あるみたい"}],"ex":[{"jp":"{財布|さいふ}を{取|と}られたみたい。","zh":"钱包好像被偷了。","src":"第10课 别册p.35","say":"財布を取られたみたい。"},{"jp":"{近|ちか}くにたこ{焼|や}き{屋|や}があるみたい。","zh":"附近好像有章鱼烧店。","src":"第10课 别册p.35","say":"近くにたこ焼き屋があるみたい。"}],"tips":["「みたいです」是口语，「ようです」较郑重（10-4）。"]},{"id":"10-4","lesson":10,"st":1,"stTitle":"ハプニング！","cat":"infer","pattern":"～ようです（{様態|ようたい}）","official":"～ようです（様態）","usage":"様態","usageR":"{様態|ようたい}","conn":"普通形 ＋ ようです（ナA：～なようです；N：～のようです）","zh":"“好像～”。根据观察做出的推断，比「みたい」正式。","pex":[{"jp":"ぶつかったようです","say":"ぶつかったようです"},{"jp":"けんかのようです","say":"けんかのようです"}],"ex":[{"jp":"{車|くるま}とバスがぶつかったようです。","zh":"好像是汽车和公交车撞了。","src":"第10课 别册p.35","say":"車とバスがぶつかったようです。"},{"jp":"けんかのようです。","zh":"好像在吵架。","src":"第10课 别册p.35","say":"けんかのようです。"}],"tips":["名词：Nのようです；「みたい」直接接名词：けんかみたいです。"]},{"id":"10-5","lesson":10,"st":2,"stTitle":"ガイドブックを片手に","cat":"aspect","pattern":"Ｖるところです　Ｖているところです　Ｖたところです","official":"Ｖるところです　Ｖているところです　Ｖたところです","usage":"","usageR":"","conn":"Vる／Vている／Vた ＋ ところです","zh":"表示动作的阶段：正要～／正在～／刚刚～。","pex":[{"jp":"{乗|の}るところです","say":"乗るところです"},{"jp":"{待|ま}っているところです","say":"待っているところです"},{"jp":"{降|お}りたところです","say":"降りたところです"}],"ex":[{"jp":"{今|いま}から{電車|でんしゃ}に{乗|の}るところです。","zh":"我现在正要上电车。","src":"第10课 别册p.37","say":"今から電車に乗るところです。"},{"jp":"{今|いま}、バスを{待|ま}っているところです。","zh":"我现在正在等公交车。","src":"第10课 别册p.37","say":"今、バスを待っているところです。"},{"jp":"{今|いま}、{電車|でんしゃ}を{降|お}りたところです。","zh":"我刚下电车。","src":"第10课 别册p.37","say":"今、電車を降りたところです。"}],"tips":["「Vたところ」＝动作刚结束的那一刻；「Vたばかり」（11-2）＝说话人觉得时间不长，可以是几个月前。"]},{"id":"10-6","lesson":10,"st":2,"stTitle":"ガイドブックを片手に","cat":"aspect","pattern":"Ｖてきます","official":"Ｖてきます","usage":"","usageR":"","conn":"移动动词 Vて ＋ きます","zh":"“～过来”。动作朝说话人的方向移动。","pex":[{"jp":"{入|はい}る → {入|はい}ってきました","say":"はいる 、 はいってきました"}],"ex":[{"jp":"{窓|まど}から{虫|むし}が{入|はい}ってきました。","zh":"虫子从窗户飞进来了。","src":"第10课 别册p.37","say":"窓から虫がはいってきました。"},{"jp":"ボールが{飛|と}んできました。","zh":"球飞过来了。","src":"第10课 别册p.37","say":"ボールが飛んできました。"}],"tips":["第15课的「Vてきました」表示变化一直持续到现在（15-5）。"]},{"id":"10-7","lesson":10,"st":2,"stTitle":"ガイドブックを片手に","cat":"aspect","pattern":"Ｖていきます","official":"Ｖていきます","usage":"","usageR":"","conn":"移动动词 Vて ＋ いきます","zh":"“～过去／～离去”。动作离开说话人向远处移动。","pex":[{"jp":"{歩|ある}く → {歩|ある}いていきます","say":"歩く 、 歩いていきます"}],"ex":[{"jp":"ペンギンが{向|む}こうへ{歩|ある}いていきます。","zh":"企鹅朝那边走去。","src":"第10课 别册p.37","say":"ペンギンが向こうへ歩いていきます。"},{"jp":"サルが{山|やま}へ{逃|に}げていきます。","zh":"猴子往山里逃去。","src":"第10课 别册p.37","say":"サルが山へ逃げていきます。"}],"tips":["第15课的「Vていきます」表示从现在往后的变化（15-7）。"]},{"id":"10-8","lesson":10,"st":2,"stTitle":"ガイドブックを片手に","cat":"infer","pattern":"ＡそうにＶ","official":"ＡそうにＶ","usage":"","usageR":"","conn":"イA（去い）／ナA ＋ そうに ＋ V","zh":"“看起来很～地（做）”。描写别人做动作时的样子。","pex":[{"jp":"{楽|たの}しい → {楽|たの}しそうに","say":"楽しい 、 楽しそうに"},{"jp":"{心配|しんぱい} → {心配|しんぱい}そうに","say":"心配 、 心配そうに"}],"ex":[{"jp":"{子|こ}どもたちが{楽|たの}しそうに{公園|こうえん}で{遊|あそ}んでいます。","zh":"孩子们在公园里玩得很开心。","src":"第10课 别册p.37","say":"子どもたちが楽しそうに公園で遊んでいます。"},{"jp":"ワンさんが{心配|しんぱい}そうに{時計|とけい}を{見|み}ています。","zh":"小王一脸担心地看着表。","src":"第10课 别册p.37","say":"ワンさんが心配そうに時計を見ています。"}],"tips":["修饰名词用「そうな」：おいしそうなケーキ。"]},{"id":"10-9","lesson":10,"st":2,"stTitle":"ガイドブックを片手に","cat":"struct","pattern":"～みたいです（{比況|ひきょう}）","official":"～みたいです（比況）","usage":"比況","usageR":"{比況|ひきょう}","conn":"N／普通形 ＋ みたいです","zh":"“像～一样”。比喻：实际不是，但很像。","pex":[{"jp":"{鉛筆|えんぴつ}みたいです","say":"鉛筆みたいです"}],"ex":[{"jp":"あのビルは{鉛筆|えんぴつ}みたいです。","zh":"那栋楼像铅笔一样。","src":"第10课 别册p.37","say":"あのビルは鉛筆みたいです。"},{"jp":"{自分|じぶん}のうちにいるみたいです。","zh":"就像在自己家一样。","src":"第10课 别册p.37","say":"自分のうちにいるみたいです。"}],"tips":["同一个「みたい」：10-3 是推测（可能真是这样），10-9 是比喻（明知不是）。","修饰名词：Nみたいな N；修饰动词：Nみたいに V。"]},{"id":"10-10","lesson":10,"st":2,"stTitle":"ガイドブックを片手に","cat":"voice","pattern":"{受身|うけみ}（{無|む}{生物|せいぶつ}{主語|しゅご}）","official":"受身（無生物主語）","usage":"無生物主語","usageR":"{無|む}{生物|せいぶつ}{主語|しゅご}","conn":"物／事 ＋ が／は ＋ 被动形；作者：N によって","zh":"以物或事作主语的被动，用于客观说明（建造、举办、使用等），没有受害的意思。","pex":[{"jp":"{建|た}てる → {建|た}てられました","say":"建てる 、 建てられました"},{"jp":"{行|おこな}う → {行|おこな}われます","say":"行う 、 行われます"}],"ex":[{"jp":"{東京|とうきょう}タワーは1958{年|ねん}に{建|た}てられました。","zh":"东京塔建于1958年。","src":"第10课 别册p.37","say":"東京タワーは1958年に建てられました。"},{"jp":"カップラーメンは{世界中|せかいじゅう}の{人|ひと}に{食|た}べられています。","zh":"杯面被全世界的人吃。","src":"第10课 别册p.37","say":"カップラーメンはせかいじゅうの人に食べられています。"},{"jp":"{電池|でんち}はボルタによって{発明|はつめい}されました。","zh":"电池是由伏打发明的。","src":"第10课 别册p.37","say":"電池はボルタによって発明されました。"}],"tips":["创作、发明、建造的人用「によって」。"]},{"id":"11-1","lesson":11,"st":1,"stTitle":"慣れてくると","cat":"change","pattern":"Ｖるようになります（{習慣|しゅうかん}の{変化|へんか}）　Ｖなくなります","official":"Ｖるようになります（習慣の変化）　Ｖなくなります","usage":"","usageR":"","conn":"Vる ＋ ようになります ／ Vない（去い）＋ くなります","zh":"“开始（经常）～了／不再～了”。表示习惯、行为的变化。","pex":[{"jp":"{洗濯|せんたく}する → {洗濯|せんたく}するようになりました","say":"洗濯する 、 洗濯するようになりました"},{"jp":"{飲|の}まない → {飲|の}まなくなりました","say":"飲まない 、 飲まなくなりました"}],"ex":[{"jp":"{自分|じぶん}で{洗濯|せんたく}するようになりました。","zh":"我开始自己洗衣服了。","src":"第11课 别册p.41","say":"自分で洗濯するようになりました。"},{"jp":"お{酒|さけ}を{飲|の}まなくなりました。","zh":"我不再喝酒了。","src":"第11课 别册p.41","say":"お酒を飲まなくなりました。"}],"tips":["比较 1-9：可能动词＋ようになる＝能力的变化；一般动词＋ようになる＝习惯的变化。","否定的变化一般说「Vなくなりました」。"]},{"id":"11-2","lesson":11,"st":1,"stTitle":"慣れてくると","cat":"aspect","pattern":"Ｖたばかりです","official":"Ｖたばかりです","usage":"","usageR":"","conn":"Vた ＋ ばかりです","zh":"“刚～不久”。说话人觉得时间还不长（实际可能已经过了几天、几个月）。","pex":[{"jp":"{引|ひ}っ{越|こ}しした → {引|ひ}っ{越|こ}ししたばかりです","say":"引っ越しした 、 引っ越ししたばかりです"}],"ex":[{"jp":"{引|ひ}っ{越|こ}ししたばかりです。","zh":"我刚搬家。","src":"第11课 别册p.41","say":"引っ越ししたばかりです。"},{"jp":"{日本|にほん}へ{来|き}たばかりなので、まだ{日本|にほん}の{生活|せいかつ}に{慣|な}れません。","zh":"我刚来日本，还不习惯日本的生活。","src":"第11课 别册p.41","say":"にほんへ来たばかりなので、まだにほんの生活に慣れません。"}],"tips":["后面可接「なので／なのに」：{傘|かさ}を{買|か}ったばかりなのに、もう{折|お}れてしまいました。","比较 10-5「Vたところです」。"]},{"id":"11-3","lesson":11,"st":1,"stTitle":"慣れてくると","cat":"struct","pattern":"Ｖながら、～","official":"Ｖながら、～","usage":"","usageR":"","conn":"Vます形（去ます）＋ ながら、～","zh":"“一边～一边～”。这里指在一段较长的时间里同时做两件事（如边工作边上学）。","pex":[{"jp":"{働|はたら}きます → {働|はたら}きながら","say":"働きます 、 働きながら"}],"ex":[{"jp":"{働|はたら}きながら、{専門|せんもん}{学校|がっこう}に{通|かよ}っています。","zh":"我一边工作一边上专门学校。","src":"第11课 别册p.41","say":"働きながら、専門学校に通っています。"},{"jp":"{日本語|にほんご}{学校|がっこう}で{勉強|べんきょう}しながら、{子|こ}どもを{育|そだ}てています。","zh":"她一边在日语学校学习一边养育孩子。","src":"第11课 别册p.41","say":"日本語学校で勉強しながら、子どもを育てています。"}],"tips":["主要的事放在后面。","11-7 是同一时刻同时做两个动作。"]},{"id":"11-4","lesson":11,"st":2,"stTitle":"スポーツチームに入って","cat":"explain","pattern":"～と{言|い}っていました","official":"～と言っていました","usage":"","usageR":"","conn":"（人）は ＋ 普通形 ＋ と{言|い}っていました","zh":"“（某人）说过～”。把别人说的话转告给第三个人。","pex":[{"jp":"{出発|しゅっぱつ}する → {出発|しゅっぱつ}すると{言|い}っていました","say":"出発する 、 出発するといっていました"}],"ex":[{"jp":"パクさんは{今夜|こんや}、バスで{出発|しゅっぱつ}すると{言|い}っていました。","zh":"朴同学说她今晚坐巴士出发。","src":"第11课 别册p.43","say":"パクさんは今夜、バスで出発するといっていました。"},{"jp":"マルコさんはスポーツが{好|す}きだと{言|い}っていました。","zh":"马可说他喜欢运动。","src":"第11课 别册p.43","say":"マルコさんはスポーツが好きだといっていました。"}],"tips":["名词・ナ形容词要加「だ」：{好|す}きだと。","「～と{言|い}いました」只是叙述说过的话；转告时多用「～と{言|い}っていました」。"]},{"id":"11-5","lesson":11,"st":2,"stTitle":"スポーツチームに入って","cat":"form","pattern":"{命令|めいれい}{形|けい}","official":"命令形","usage":"","usageR":"","conn":"Ⅰ类 う段→え段（{頑張|がんば}る→{頑張|がんば}れ）；Ⅱ类 去る＋ろ（{逃|に}げる→{逃|に}げろ）；する→しろ，{来|く}る→{来|こ}い","zh":"命令：“～！”。语气很强，一般只用于运动加油、紧急情况、标语，或男性之间很随便的说法。","pex":[{"jp":"{頑張|がんば}る → {頑張|がんば}れ","say":"頑張る 、 頑張れ"},{"jp":"{逃|に}げる → {逃|に}げろ","say":"逃げる 、 逃げろ"},{"jp":"{来|く}る → {来|こ}い","say":"来る 、 来い"}],"ex":[{"jp":"そこで{止|と}まれ。","zh":"在那儿站住！","src":"第11课 别册p.43","say":"そこで止まれ。"},{"jp":"{頑張|がんば}れ！あと{少|すこ}しだ！","zh":"加油！就差一点了！","src":"","say":"頑張れ！あと少しだ！"}],"tips":["日常对人说话不要用命令形，礼貌说法是「～てください」。"]},{"id":"11-6","lesson":11,"st":2,"stTitle":"スポーツチームに入って","cat":"form","pattern":"{禁止|きんし}","official":"禁止","usage":"","usageR":"","conn":"Vる（辞书形）＋ な","zh":"禁止：“不许～！／别～！”。语气很强，用于运动、紧急情况、标语。","pex":[{"jp":"{負|ま}ける → {負|ま}けるな","say":"負ける 、 負けるな"}],"ex":[{"jp":"{負|ま}けるな。","zh":"别输！","src":"第11课 别册p.43","say":"負けるな。"},{"jp":"ごみを{捨|す}てるな。","zh":"不许扔垃圾！","src":"第11课 别册p.43","say":"ごみを捨てるな。"}],"tips":["礼貌说法：「～ないでください」。","别和句末感叹的「な」混淆：いいな（真好啊）。"]},{"id":"11-7","lesson":11,"st":2,"stTitle":"スポーツチームに入って","cat":"struct","pattern":"Ｖながら、～({同時|どうじ}{進行|しんこう})","official":"Ｖながら、～(同時進行)","usage":"同時進行","usageR":"{同時|どうじ}{進行|しんこう}","conn":"Vます形（去ます）＋ ながら、～","zh":"“一边～一边～”。同一个人在同一时刻同时做两个动作。","pex":[{"jp":"{飲|の}みます → {飲|の}みながら","say":"飲みます 、 飲みながら"}],"ex":[{"jp":"{電話|でんわ}をしながら、{歩|ある}きます。","zh":"一边打电话一边走路。","src":"第11课 别册p.43","say":"電話をしながら、歩きます。"},{"jp":"{本|ほん}を{見|み}ながら、{料理|りょうり}をします。","zh":"一边看书一边做菜。","src":"第11课 别册p.43","say":"本を見ながら、料理をします。"}],"tips":["两个动作的主语必须相同。"]},{"id":"12-1","lesson":12,"st":1,"stTitle":"体調不良","cat":"degree","pattern":"［～{個|こ}、～{時間|じかん}、～{杯|はい}…］も～","official":"［～個、～時間、～杯…］も～","usage":"","usageR":"","conn":"数量词 ＋ も","zh":"“竟然～之多”。强调数量多（说话人觉得多）。","pex":[{"jp":"６{杯|ぱい}も","say":"６ぱいも"}],"ex":[{"jp":"ワインを６{杯|ぱい}も{飲|の}んでしまいました。","zh":"我竟然喝了6杯葡萄酒。","src":"第12课 别册p.45","say":"ワインを６ぱいも飲んでしまいました。"},{"jp":"ケーキを５{個|こ}も{食|た}べました。","zh":"竟然吃了5个蛋糕。","src":"第12课 别册p.45","say":"ケーキを５個も食べました。"}],"tips":["比较 12-2「しか～ない」（强调少）。"]},{"id":"12-2","lesson":12,"st":1,"stTitle":"体調不良","cat":"degree","pattern":"［～{個|こ}、～{時間|じかん}、～{杯|はい}…／N］しか～ない","official":"［～個、～時間、～杯…／N］しか～ない","usage":"","usageR":"","conn":"数量词／N ＋ しか ＋ 否定","zh":"“只～”。强调少、不够，后面一定是否定。","pex":[{"jp":"３{時間|じかん}しか{寝|ね}られません","say":"３時間しか寝られません"}],"ex":[{"jp":"３{時間|じかん}しか{寝|ね}られません。","zh":"只能睡3个小时。","src":"第12课 别册p.45","say":"３時間しか寝られません。"},{"jp":"{今日|きょう}はパンしか{食|た}べていません。","zh":"今天只吃了面包。","src":"第12课 别册p.45","say":"今日はパンしか食べていません。"}],"tips":["「だけ」可接肯定，比较客观；「しか～ない」必须接否定，强调不足。"]},{"id":"12-3","lesson":12,"st":1,"stTitle":"体調不良","cat":"advice","pattern":"Ｖたらどうですか","official":"Ｖたらどうですか","usage":"","usageR":"","conn":"Vた ＋ らどうですか","zh":"“～怎么样？”。给对方提建议。","pex":[{"jp":"{飲|の}む → {飲|の}んだらどうですか","say":"飲む 、 飲んだらどうですか"}],"ex":[{"jp":"{薬|くすり}を{飲|の}んだらどうですか。","zh":"吃点药怎么样？","src":"第12课 别册p.45","say":"薬を飲んだらどうですか。"},{"jp":"{先生|せんせい}に{聞|き}いてみたらどうですか。","zh":"去问问老师怎么样？","src":"第12课 别册p.45","say":"先生に聞いてみたらどうですか。"}],"tips":["对长辈说更礼貌的「～たらいかがですか」。"]},{"id":"12-4","lesson":12,"st":1,"stTitle":"体調不良","cat":"struct","pattern":"Ｖないで、～","official":"Ｖないで、～","usage":"","usageR":"","conn":"Vない ＋ で、～","zh":"“不做A，而做B”。表示代替：不选前项，而做后项。","pex":[{"jp":"{使|つか}わないで","say":"使わないで"}],"ex":[{"jp":"エレベーターを{使|つか}わないで、{階段|かいだん}を{使|つか}います。","zh":"不坐电梯，走楼梯。","src":"第12课 别册p.45","say":"エレベーターを使わないで、階段を使います。"},{"jp":"コンビニのお{弁当|べんとう}を{買|か}わないで、{自分|じぶん}で{作|つく}ります。","zh":"不买便利店的便当，自己做。","src":"第12课 别册p.45","say":"コンビニのお弁当を買わないで、自分で作ります。"}],"tips":["比较 12-6（伴随状态）。"]},{"id":"12-5","lesson":12,"st":1,"stTitle":"体調不良","cat":"infer","pattern":"～らしいです（{伝聞|でんぶん}）","official":"～らしいです（伝聞）","usage":"伝聞","usageR":"{伝聞|でんぶん}","conn":"普通形（ナA・N 去「だ」）＋ らしいです","zh":"“听说～／据说～”。转述听来、读来的信息，说话人不保证其真实性。","pex":[{"jp":"きれいらしいです","say":"きれいらしいです"},{"jp":"{酔|よ}わないらしいです","say":"酔わないらしいです"}],"ex":[{"jp":"{市民|しみん}{体育|たいいく}{館|かん}のプールはきれいらしいです。","zh":"听说市民体育馆的游泳池很干净。","src":"第12课 别册p.45","say":"市民体育館のプールはきれいらしいです。"},{"jp":"お{酒|さけ}を{飲|の}む{前|まえ}に{牛乳|ぎゅうにゅう}を{飲|の}むと、{酔|よ}わないらしいです。","zh":"听说喝酒前喝牛奶就不容易醉。","src":"第12课 别册p.45","say":"お酒を飲む前に牛乳を飲むと、酔わないらしいです。"}],"tips":["ナA・N 不加「だ」：きれいらしい、{無料|むりょう}らしい。"]},{"id":"12-6","lesson":12,"st":1,"stTitle":"体調不良","cat":"struct","pattern":"Ｖて、～　Ｖないで、～（{付帯|ふたい}{状況|じょうきょう}）","official":"Ｖて、～　Ｖないで、～（付帯状況）","usage":"付帯状況","usageR":"{付帯|ふたい}{状況|じょうきょう}","conn":"Vて／Vないで ＋ 主要动作","zh":"表示做主要动作时的伴随状态、方式：“～着（做）／不～（就做）”。","pex":[{"jp":"かけて{走|はし}ります","say":"かけて走ります"},{"jp":"ささないで{歩|ある}きます","say":"ささないで歩きます"}],"ex":[{"jp":"サングラスをかけて{走|はし}ります。","zh":"戴着太阳镜跑步。","src":"第12课 别册p.45","say":"サングラスをかけて走ります。"},{"jp":"{傘|かさ}をささないで{歩|ある}きます。","zh":"不打伞走路。","src":"第12课 别册p.45","say":"傘をささないで歩きます。"}],"tips":["比较 12-4（代替）：{肉|にく}を{食|た}べないで、{野菜|やさい}を{食|た}べます 是两个可以互换的动作。"]},{"id":"12-7","lesson":12,"st":2,"stTitle":"毎日、元気に！","cat":"purpose","pattern":"Ｖるのに～　Ｎに～（{目的|もくてき}・{用途|ようと}）","official":"Ｖるのに～　Ｎに～（目的・用途）","usage":"目的・用途","usageR":"{目的|もくてき}・{用途|ようと}","conn":"Vる ＋ のに ／ N ＋ に ＋ {使|つか}う・いい・{便利|べんり}だ・{必要|ひつよう}だ","zh":"“用于～／对～有好处”。说明东西的用途、对什么有帮助。","pex":[{"jp":"{歩|ある}くのにいいです","say":"歩くのにいいです"},{"jp":"ダイエットにいいです","say":"ダイエットにいいです"}],"ex":[{"jp":"この{靴|くつ}は{山|やま}を{歩|ある}くのにいいです。","zh":"这双鞋适合走山路。","src":"第12课 别册p.47","say":"この靴は山を歩くのにいいです。"},{"jp":"これは{体|たい}{脂肪|しぼう}{率|りつ}を{測|はか}るのに{使|つか}います。","zh":"这个用来测体脂率。","src":"第12课 别册p.47","say":"これは体脂肪率を測るのに使います。"},{"jp":"この{運動|うんどう}はダイエットにいいです。","zh":"这个运动对减肥有好处。","src":"第12课 别册p.47","say":"この運動はダイエットにいいです。"}],"tips":["和 10-2「のに」（转折）形同义异：后面是 いい・{使|つか}う・{便利|べんり} 时是用途。"]},{"id":"12-8","lesson":12,"st":2,"stTitle":"毎日、元気に！","cat":"degree","pattern":"Ｖやすいです（{傾向|けいこう}　{性質|せいしつ}）","official":"Ｖやすいです（傾向　性質）","usage":"傾向　性質","usageR":"{傾向|けいこう}　{性質|せいしつ}","conn":"Vます形（去ます）＋ やすい","zh":"“容易～”。表示某事容易发生，或人、物有这种倾向、性质。","pex":[{"jp":"{乾|かわ}きます → {乾|かわ}きやすいです","say":"乾きます 、 乾きやすいです"}],"ex":[{"jp":"このシャツは{乾|かわ}きやすいです。","zh":"这件衬衫容易干。","src":"第12课 别册p.47","say":"このシャツは乾きやすいです。"},{"jp":"ストレスがたまりやすいです。","zh":"容易积累压力。","src":"第12课 别册p.47","say":"ストレスがたまりやすいです。"}],"tips":["2-6「Vやすい」是“用起来方便”；这里是“容易发生”。"]},{"id":"12-9","lesson":12,"st":2,"stTitle":"毎日、元気に！","cat":"degree","pattern":"Ｖにくいです（{傾向|けいこう}　{性質|せいしつ}）","official":"Ｖにくいです（傾向　性質）","usage":"傾向　性質","usageR":"{傾向|けいこう}　{性質|せいしつ}","conn":"Vます形（去ます）＋ にくい","zh":"“不容易～”。表示某事不容易发生，或人、物有这种性质。","pex":[{"jp":"{壊|こわ}れます → {壊|こわ}れにくいです","say":"壊れます 、 壊れにくいです"}],"ex":[{"jp":"この{時計|とけい}は{壊|こわ}れにくいです。","zh":"这块表不容易坏。","src":"第12课 别册p.47","say":"この時計は壊れにくいです。"},{"jp":"{風邪|かぜ}をひきにくいです。","zh":"不容易感冒。","src":"第12课 别册p.47","say":"風邪をひきにくいです。"}],"tips":["2-4「Vにくい」是“用起来不方便”；这里是“不容易发生”。"]},{"id":"12-10","lesson":12,"st":2,"stTitle":"毎日、元気に！","cat":"change","pattern":"Ｖるようにしています　Ｖないようにしています","official":"Ｖるようにしています　Ｖないようにしています","usage":"","usageR":"","conn":"Vる／Vない ＋ ようにしています","zh":"“（平时）尽量做到～／尽量不～”。表示为了某个目的长期坚持的努力。","pex":[{"jp":"{歩|ある}くようにしています","say":"歩くようにしています"},{"jp":"{食|た}べないようにしています","say":"食べないようにしています"}],"ex":[{"jp":"できるだけ{歩|ある}くようにしています。","zh":"我尽量多走路。","src":"第12课 别册p.47","say":"できるだけ歩くようにしています。"},{"jp":"{甘|あま}い{物|もの}を{食|た}べないようにしています。","zh":"我尽量不吃甜食。","src":"第12课 别册p.47","say":"甘い物を食べないようにしています。"}],"tips":["比较 9-4「～ようにしてください」（要求别人）。"]},{"id":"12-11","lesson":12,"st":2,"stTitle":"毎日、元気に！","cat":"intent","pattern":"Ｖることにします　Ｖないことにします","official":"Ｖることにします　Ｖないことにします","usage":"","usageR":"","conn":"Vる／Vない ＋ ことにします","zh":"“（我）决定～／决定不～”。说话人自己做的决定。","pex":[{"jp":"{通|かよ}うことにします"
