一次钢琴。","src":"第13课 别册p.48","say":"わたしは子どもの頃、１週間に１回、ピアノを習っていました。"},{"jp":"{私|わたし}は{高校|こうこう}{生|せい}の{頃|ころ}、アルバイトをしていませんでした。","zh":"我高中时没有打工。","src":"第13课 别册p.48","say":"わたしは高校生の頃、アルバイトをしていませんでした。"}],"tips":["常与「{子|こ}どもの{頃|ころ}」「{高校|こうこう}{生|せい}の{頃|ころ}」等一起用。"]},{"id":"13-4","lesson":13,"st":2,"stTitle":"思い出すと","cat":"aspect","pattern":"ＮばかりＶています　Ｖてばかりいます","official":"ＮばかりＶています　Ｖてばかりいます","usage":"","usageR":"","conn":"N ＋ ばかり ＋ Vています ／ Vて ＋ ばかりいます","zh":"“光～／净～”。带着批评、不满说总是做同一件事。","pex":[{"jp":"テレビばかり{見|み}ています","say":"テレビばかり見ています"},{"jp":"{遊|あそ}んでばかりいます","say":"遊んでばかりいます"}],"ex":[{"jp":"{妹|いもうと}は{毎日|まいにち}、テレビばかり{見|み}ています。","zh":"妹妹每天光看电视。","src":"第13课 别册p.50","say":"妹は毎日、テレビばかり見ています。"},{"jp":"{息子|むすこ}は{毎日|まいにち}、{遊|あそ}んでばかりいます。","zh":"儿子每天光知道玩。","src":"第13课 别册p.50","say":"息子は毎日、遊んでばかりいます。"}],"tips":["与 11-2「Vたばかり」（刚刚）不同。"]},{"id":"13-5","lesson":13,"st":2,"stTitle":"思い出すと","cat":"voice","pattern":"{使役|しえき}{受身|うけみ}","official":"使役受身","usage":"","usageR":"","conn":"Ⅰ类 う段→あ段＋される（{通|かよ}う→{通|かよ}わされる）；Ⅱ类 去る＋させられる；する→させられる，{来|く}る→{来|こ}させられる","zh":"“被迫（被人逼着）做～”。主语不情愿地做了别人要他做的事。","pex":[{"jp":"{食|た}べる → {食|た}べさせられました","say":"食べる 、 食べさせられました"},{"jp":"{通|かよ}う → {通|かよ}わされました","say":"通う 、 通わされました"}],"ex":[{"jp":"{私|わたし}は{母|はは}に{野菜|やさい}を{食|た}べさせられました。","zh":"我被妈妈逼着吃蔬菜。","src":"第13课 别册p.50","say":"わたしは母に野菜を食べさせられました。"},{"jp":"{私|わたし}は{姉|あね}に{部屋|へや}を{掃除|そうじ}させられました。","zh":"我被姐姐逼着打扫房间。","src":"第13课 别册p.50","say":"わたしは姉に部屋を掃除させられました。"}],"tips":["Ⅰ类常用短形「～される」：{通|かよ}わされる（＝{通|かよ}わせられる）；す结尾的不缩：{話|はな}させられる。"]},{"id":"13-6","lesson":13,"st":2,"stTitle":"思い出すと","cat":"voice","pattern":"Ｖせてくれます　Ｖせてもらいます","official":"Ｖせてくれます　Ｖせてもらいます","usage":"","usageR":"","conn":"使役的て形 ＋ くれます／もらいます","zh":"“（别人）允许我做～”，带感谢。「～せてもらえませんでした」＝没被允许。","pex":[{"jp":"{運転|うんてん}させてくれました","say":"運転させてくれました"},{"jp":"{行|い}かせてもらいました","say":"行かせてもらいました"}],"ex":[{"jp":"{父|ちち}は{私|わたし}に{車|くるま}を{運転|うんてん}させてくれました。","zh":"父亲让我开了车。","src":"第13课 别册p.50","say":"父はわたしに車を運転させてくれました。"},{"jp":"{私|わたし}は{父|ちち}に{大学|だいがく}へ{行|い}かせてもらいました。","zh":"父亲让我上了大学。","src":"第13课 别册p.50","say":"わたしは父に大学へ行かせてもらいました。"}],"tips":["请求许可：「～させてください」。"]},{"id":"14-1","lesson":14,"st":1,"stTitle":"私の国・町の行事","cat":"explain","pattern":"Ｎって{何|なん}ですか","official":"Ｎって何ですか","usage":"","usageR":"","conn":"N ＋ って{何|なん}ですか（口语）","zh":"“N是什么？”。问不知道的词语，口语说法。","pex":[{"jp":"だしって{何|なん}ですか","say":"だしってなんですか"}],"ex":[{"jp":"ゆかたって{何|なん}ですか。","zh":"“浴衣”是什么？","src":"第14课 别册p.53","say":"ゆかたってなんですか。"},{"jp":"だしって{何|なん}ですか。","zh":"“出汁”是什么？","src":"第14课 p.193","say":"だしってなんですか。"}],"tips":["郑重说法：「～というのは{何|なん}ですか」。"]},{"id":"14-2","lesson":14,"st":1,"stTitle":"私の国・町の行事","cat":"explain","pattern":"Ｎというのは～","official":"Ｎというのは～","usage":"","usageR":"","conn":"N ＋ というのは ＋ 说明 ＋ です","zh":"“所谓N，是～”。用于解释词语的意思、事物是什么。","pex":[{"jp":"{年賀|ねんが}{状|じょう}というのは","say":"年賀状というのは"}],"ex":[{"jp":"{年賀|ねんが}{状|じょう}というのは{新年|しんねん}のあいさつを{書|か}いたはがきです。","zh":"贺年卡是写有新年问候的明信片。","src":"第14课 别册p.53","say":"年賀状というのは新年のあいさつを書いたはがきです。"},{"jp":"ランドセルというのは{小学|しょうがく}{生|せい}が{使|つか}うかばんです。","zh":"“ランドセル”是小学生用的书包。","src":"第14课 别册p.53","say":"ランドセルというのは小学生が使うかばんです。"}],"tips":["回答 14-1 的问题时用。"]},{"id":"14-3","lesson":14,"st":1,"stTitle":"私の国・町の行事","cat":"explain","pattern":"～と{言|い}われています","official":"～と言われています","usage":"","usageR":"","conn":"普通形 ＋ と{言|い}われています","zh":"“据说～／人们都说～”。介绍传说、一般的说法。","pex":[{"jp":"{雨|あめ}が{降|ふ}ると{言|い}われています","say":"雨が降るといわれています"}],"ex":[{"jp":"{店|みせ}に{招|まね}き{猫|ねこ}を{飾|かざ}るとお{客|きゃく}さんがたくさん{来|く}ると{言|い}われています。","zh":"据说店里摆招财猫，客人就会多。","src":"第14课 别册p.53","say":"店に招き猫を飾るとお客さんがたくさん来るといわれています。"},{"jp":"{猫|ねこ}が{顔|かお}を{洗|あら}うと、{雨|あめ}が{降|ふ}ると{言|い}われています。","zh":"据说猫洗脸就会下雨。","src":"第14课 别册p.53","say":"猫が顔を洗うと、雨が降るといわれています。"}],"tips":["「{言|い}われる」是「{言|い}う」的被动形（10-1）。"]},{"id":"14-4","lesson":14,"st":1,"stTitle":"私の国・町の行事","cat":"struct","pattern":"ＮのようなＮ","official":"ＮのようなＮ","usage":"","usageR":"","conn":"N₁ ＋ のような ＋ N₂","zh":"“像N₁一样的N₂”。用熟悉的东西来比喻、说明。","pex":[{"jp":"{着物|きもの}のような{服|ふく}","say":"着物のような服"}],"ex":[{"jp":"Ａ：ゆかたって{何|なん}ですか。　Ｂ：{浴衣|ゆかた}というのは{着物|きもの}のような{服|ふく}です。","zh":"A：浴衣是什么？　B：浴衣是一种像和服的衣服。","src":"第14课 别册p.53","say":"ゆかたってなんですか。 浴衣というのは着物のような服です。"},{"jp":"{将棋|しょうぎ}というのはチェスのような{遊|あそ}びです。","zh":"将棋是一种像国际象棋的游戏。","src":"第14课 别册p.53","say":"将棋というのはチェスのような遊びです。"}],"tips":["口语说「Nみたいな N」（10-9）。"]},{"id":"14-5","lesson":14,"st":2,"stTitle":"贈り物の習慣","cat":"intent","pattern":"～かな　Ｖようかな","official":"～かな　Ｖようかな","usage":"","usageR":"","conn":"普通形 ＋ かな ／ 意向形 ＋ かな","zh":"自言自语的疑问：“～呢？”；「Vようかな」＝“要不要～呢／我～吧”。用于朋友之间或独白。","pex":[{"jp":"{何|なに}にしようかな","say":"なににしようかな"},{"jp":"{暑|あつ}いかな","say":"暑いかな"}],"ex":[{"jp":"プレゼントは{何|なに}にしようかな。","zh":"礼物送什么好呢？","src":"第14课 别册p.54","say":"プレゼントはなににしようかな。"},{"jp":"{明日|あした}も{暑|あつ}いかな。","zh":"明天也会热吗？","src":"第14课 别册p.54","say":"あしたも暑いかな。"}],"tips":["不要对长辈用。"]},{"id":"14-6","lesson":14,"st":2,"stTitle":"贈り物の習慣","cat":"advice","pattern":"Ｎなんかどうですか","official":"Ｎなんかどうですか","usage":"","usageR":"","conn":"N ＋ なんかどうですか（どう？）","zh":"“～之类的怎么样？”。举个例子委婉地建议。","pex":[{"jp":"{時計|とけい}なんかどう？","say":"時計なんかどう？"}],"ex":[{"jp":"あ、{時計|とけい}なんかどう？","zh":"啊，手表之类的怎么样？","src":"第14课 p.194","say":"あ、時計なんかどう？"},{"jp":"{誕生日|たんじょうび}のプレゼントに、{花|はな}なんかどうですか。","zh":"生日礼物送花之类的怎么样？","src":"","say":"たんじょうびのプレゼントに、花なんかどうですか。"}],"tips":["「なんか」是「など」的口语。"]},{"id":"14-7","lesson":14,"st":2,"stTitle":"贈り物の習慣","cat":"infer","pattern":"Ａがっています","official":"Ａがっています","usage":"","usageR":"","conn":"イA・ナA（去い／な）＋ がっています；～たい→～たがっています；ほしい→ほしがっています","zh":"“（第三者）很想～／显得～”。描写别人从外表能看出的感情、愿望。","pex":[{"jp":"ほしい → ほしがっています","say":"ほしい 、 ほしがっています"},{"jp":"{行|い}きたい → {行|い}きたがっています","say":"行きたい 、 行きたがっています"}],"ex":[{"jp":"{妹|いもうと}はおもちゃをほしがっています。","zh":"妹妹很想要玩具。","src":"第14课 别册p.54","say":"妹はおもちゃをほしがっています。"},{"jp":"{母|はは}はフランスへ{行|い}きたがっています。","zh":"妈妈很想去法国。","src":"第14课 别册p.54","say":"母はフランスへ行きたがっています。"}],"tips":["说自己的感情直接说：{私|わたし}は～がほしいです。别人的感情用「～がっています」。","「ほしがる」的对象用「を」：おもちゃをほしがっています。"]},{"id":"14-8","lesson":14,"st":2,"stTitle":"贈り物の習慣","cat":"reason","pattern":"～からです","official":"～からです","usage":"","usageR":"","conn":"普通形 ＋ からです","zh":"“（那）是因为～”。先说结果，再说明原因。","pex":[{"jp":"シンボルだからです","say":"シンボルだからです"}],"ex":[{"jp":"{祖母|そぼ}にカメの{置物|おきもの}をあげました。カメは{長生|ながい}きのシンボルだからです。","zh":"我送了祖母一个乌龟摆件。因为乌龟是长寿的象征。","src":"第14课 别册p.54","say":"祖母にカメの置物をあげました。カメは長生きのシンボルだからです。"},{"jp":"{病気|びょうき}の{人|ひと}にくしをあげるのはよくないです。くしは{悪|わる}い{言葉|ことば}と{同|おな}じ{発音|はつおん}だからです。","zh":"给病人送梳子不好。因为梳子和不吉利的词发音相同。","src":"第14课 别册p.54","say":"病気の人にくしをあげるのはよくないです。くしは悪い言葉と同じ発音だからです。"}],"tips":["不说 ✗ ～のでです。"]},{"id":"15-1","lesson":15,"st":1,"stTitle":"発表の準備","cat":"explain","pattern":"～んだって","official":"～んだって","usage":"","usageR":"","conn":"普通形（ナA・N：～なんだって）＋ んだって","zh":"“听说～（哦）”。朋友之间转告听到、看到的信息，口语。","pex":[{"jp":"{咲|さ}いたんだって","say":"咲いたんだって"}],"ex":[{"jp":"{新聞|しんぶん}で{読|よ}んだんだけど、{東京|とうきょう}で{桜|さくら}の{花|はな}が{咲|さ}いたんだって。","zh":"我在报纸上看到的，听说东京的樱花开了。","src":"第15课 别册p.56","say":"新聞で読んだんだけど、東京で桜の花が咲いたんだって。"},{"jp":"{大学|だいがく}{生|せい}に{聞|き}いたんだけど、{今年|ことし}は{学生|がくせい}の{就職|しゅうしょく}が{大変|たいへん}なんだって。","zh":"我听大学生说的，今年学生找工作很难。","src":"第15课 别册p.56","say":"大学生に聞いたんだけど、今年は学生の就職が大変なんだって。"}],"tips":["「～んだけど」是开场白（引出话题）。","礼貌说法：「～らしいです」（12-5）。"]},{"id":"15-2","lesson":15,"st":1,"stTitle":"発表の準備","cat":"advice","pattern":"Ｖるのはどうですか","official":"Ｖるのはどうですか","usage":"","usageR":"","conn":"Vる ＋ のはどうですか","zh":"“～怎么样？”。在讨论中提出方案。","pex":[{"jp":"{集|あつ}める → {集|あつ}めるのはどうですか","say":"集める 、 集めるのはどうですか"}],"ex":[{"jp":"インターネットで{資料|しりょう}を{集|あつ}めるのはどうですか。","zh":"在网上收集资料怎么样？","src":"第15课 别册p.56","say":"インターネットで資料を集めるのはどうですか。"},{"jp":"{日本|にほん}の{貿易|ぼうえき}について{調|しら}べるのはどうですか。","zh":"调查一下日本的贸易怎么样？","src":"第15课 别册p.56","say":"にほんの貿易について調べるのはどうですか。"}],"tips":["比较：「Vたらどうですか」（12-3）多是为对方着想的劝告；「Vるのはどうですか」多用于讨论时提方案。"]},{"id":"15-3","lesson":15,"st":1,"stTitle":"発表の準備","cat":"struct","pattern":"～だけじゃなくて、～も～","official":"～だけじゃなくて、～も～","usage":"","usageR":"","conn":"N／普通形（ナA：～な）＋ だけじゃなくて、～も","zh":"“不仅～，而且～也～”。","pex":[{"jp":"{子|こ}どもだけじゃなくて、{大人|おとな}にも","say":"子どもだけじゃなくて、大人にも"}],"ex":[{"jp":"この{漫画|まんが}は{子|こ}どもだけじゃなくて、{大人|おとな}にも{人気|にんき}があります。","zh":"这部漫画不仅孩子，大人也喜欢。","src":"第15课 别册p.56","say":"この漫画は子どもだけじゃなくて、大人にも人気があります。"},{"jp":"{意見|いけん}だけじゃなくて、その{理由|りゆう}も{書|か}いてください。","zh":"不仅写意见，也请写出理由。","src":"第15课 别册p.56","say":"意見だけじゃなくて、その理由も書いてください。"}],"tips":["比较 4-7「Nじゃなくて」（不是～而是～）。"]},{"id":"15-4","lesson":15,"st":1,"stTitle":"発表の準備","cat":"cond","pattern":"～ないと、～","official":"～ないと、～","usage":"","usageR":"","conn":"Vない／イAくない／ナA・Nじゃない ＋ と、＋ 否定・消极的结果","zh":"“不～的话，就（不行／做不到）～”。表示必要条件。","pex":[{"jp":"{調|しら}べないと","say":"調べないと"},{"jp":"20{歳|さい}{以上|いじょう}じゃないと","say":"20さい以上じゃないと"}],"ex":[{"jp":"{早|はや}く{調|しら}べないと、{発表|はっぴょう}に{間|ま}に{合|あ}いません。","zh":"不赶快查的话，就赶不上发表了。","src":"第15课 别册p.56","say":"早く調べないと、発表にまに合いません。"},{"jp":"20{歳|さい}{以上|いじょう}じゃないと、お{酒|さけ}が{飲|の}めません。","zh":"不满20岁就不能喝酒。","src":"第15课 别册p.56","say":"20さい以上じゃないと、お酒が飲めません。"}],"tips":["句末单用「～ないと。」＝“必须～”：もう{帰|かえ}らないと。"]},{"id":"15-5","lesson":15,"st":2,"stTitle":"みんなの前で発表","cat":"change","pattern":"Ｖてきました","official":"Ｖてきました","usage":"","usageR":"","conn":"Vて ＋ きました（变化动词：{増|ふ}える・{減|へ}る・{上|あ}がる・{進|すす}む）","zh":"“（一直）～起来了”。变化从过去持续到现在。","pex":[{"jp":"{減|へ}る → {減|へ}ってきました","say":"減る 、 減ってきました"}],"ex":[{"jp":"{交通|こうつう}{事故|じこ}の{数|かず}が{減|へ}ってきました。","zh":"交通事故的数量减少了。","src":"第15课 别册p.58","say":"交通事故の数が減ってきました。"},{"jp":"ボランティアをする{人|ひと}がだんだん{増|ふ}えてきました。","zh":"做志愿者的人渐渐多起来了。","src":"第15课 别册p.58","say":"ボランティアをする人がだんだん増えてきました。"}],"tips":["常与「だんだん」「どんどん」一起用。","比较 10-6（空间上“～过来”）。"]},{"id":"15-6","lesson":15,"st":2,"stTitle":"みんなの前で発表","cat":"reason","pattern":"～ために、～（{原因|げんいん}）","official":"～ために、～（原因）","usage":"原因","usageR":"{原因|げんいん}","conn":"普通形（ナA：～な；N：～の）＋ ために、～","zh":"“由于～”。较书面，说明原因（多用于报告、新闻、发表）。","pex":[{"jp":"{寒|さむ}いために","say":"寒いために"},{"jp":"インフルエンザのために","say":"インフルエンザのために"}],"ex":[{"jp":"{今年|ことし}の{冬|ふゆ}は{大変|たいへん}{寒|さむ}いために、{風邪|かぜ}をひく{人|ひと}が{多|おお}いです。","zh":"由于今年冬天非常冷，感冒的人很多。","src":"第15课 别册p.58","say":"今年の冬は大変寒いために、風邪をひく人が多いです。"},{"jp":"インフルエンザのために、{学校|がっこう}を{欠席|けっせき}する{学生|がくせい}が{多|おお}いです。","zh":"由于流感，缺课的学生很多。","src":"第15课 别册p.58","say":"インフルエンザのために、学校を欠席する学生が多いです。"}],"tips":["后项是结果，不能是意志、请求。","比较 3-6「ために」（目的）：前面是意志动词的辞书形 → 目的；た形、状态 → 原因。"]},{"id":"15-7","lesson":15,"st":2,"stTitle":"みんなの前で発表","cat":"change","pattern":"Ｖていきます","official":"Ｖていきます","usage":"","usageR":"","conn":"Vて ＋ いきます","zh":"“（今后）会～下去”。变化从现在向将来持续。","pex":[{"jp":"{増|ふ}える → {増|ふ}えていきます","say":"増える 、 増えていきます"}],"ex":[{"jp":"{日本|にほん}で{働|はたら}く{外国人|がいこくじん}が{増|ふ}えてきました。そして、これからも{増|ふ}えていくと{思|おも}います。","zh":"在日本工作的外国人增多了。我想今后也会继续增加。","src":"第15课 别册p.58","say":"にほんで働くがいこくじんが増えてきました。そして、これからも増えていくと思います。"},{"jp":"{卵|たまご}の{値段|ねだん}が{上|あ}がってきました。しかし、これからは{下|さ}がっていくと{思|おも}います。","zh":"鸡蛋的价格涨起来了。不过我想今后会降下去。","src":"第15课 别册p.58","say":"卵の値段が上がってきました。しかし、これからは下がっていくと思います。"}],"tips":["「～てきました」（过去→现在）↔「～ていきます」（现在→将来）。"]}],"compare":[{"title":"原因・理由：ので／から／て／し／ために／からです","icon":"💡","rows":[{"pattern":"～ので、～","card":"1-3","basic":false,"point":"客观、礼貌；请求许可、道歉时最得体","jp":"{体|からだ}の{調子|ちょうし}が{悪|わる}いので、アルバイトを{休|やす}んでもいいですか。","zh":"身体不舒服，我可以请假不去打工吗？","src":"第1课 别册p.1","say":"体の調子が悪いので、アルバイトを休んでもいいですか。"},{"pattern":"～から（{初級|しょきゅう}）","card":null,"basic":true,"point":"主观理由；后面可以接命令、邀请、意志","jp":"{時間|じかん}がないから、{急|いそ}ぎましょう。","zh":"没时间了，快点吧。","src":"","say":"時間がないから、急ぎましょう。"},{"pattern":"～て、～（{理由|りゆう}）","card":"5-5","basic":false,"point":"后项是感情或“做不到”的结果","jp":"すぐ{財布|さいふ}が{見|み}つかって、よかったです。","zh":"钱包马上就找到了，太好了。","src":"第5课 别册p.19","say":"すぐ財布が見つかって、よかったです。"},{"pattern":"～し、～（{理由|りゆう}）","card":"6-4","basic":false,"point":"列举几个理由，引出结论或提议","jp":"{観光|かんこう}{地|ち}にも{近|ちか}いし、{交通|こうつう}も{便利|べんり}だし、このホテルにしませんか。","zh":"离景点近，交通又方便，就定这家酒店吧？","src":"第6课 别册p.21","say":"観光地にも近いし、交通も便利だし、このホテルにしませんか。"},{"pattern":"～ために、～（{原因|げんいん}）","card":"15-6","basic":false,"point":"书面语，用于报告、新闻","jp":"{円高|えんだか}のために、{外国|がいこく}からの{観光|かんこう}{客|きゃく}が{少|すく}なくなってきました。","zh":"由于日元升值，外国游客减少了。","src":"第15课 别册p.58","say":"円高のために、外国からの観光客が少なくなってきました。"},{"pattern":"～からです","card":"14-8","basic":false,"point":"先说结果，后补原因","jp":"{食器|しょっき}は{割|わ}れる{物|もの}だからです。","zh":"因为餐具是会碎的东西。","src":"第14课 别册p.54","say":"食器は割れる物だからです。"}],"point":"请求许可、道歉 → ので；命令、邀请 → から；感情・结果 → て；几个理由 → し；书面 → ために；后补原因 → からです。"},{"title":"条件：たら／と／ば／なら／ないと","icon":"🔀","rows":[{"pattern":"Ｖたら、～　（{確定|かくてい}{条件|じょうけん}）","card":"3-1","basic":false,"point":"前项一定会实现，“～之后就…”；后项可以是意志、请求","jp":"{大学|だいがく}を{卒業|そつぎょう}したら、{翻訳|ほんやく}の{仕事|しごと}をしたいです。","zh":"大学毕业后，我想做翻译工作。","src":"第3课 别册p.10","say":"大学を卒業したら、翻訳の仕事をしたいです。"},{"pattern":"Ｖたら、～た（{発見|はっけん}）","card":"5-6","basic":false,"point":"“做了～，发现…”，后项是过去的事实","jp":"{駅|えき}へ{行|い}ったら、{人|ひと}がたくさん{並|なら}んでいました。","zh":"一到车站，发现排着很多人。","src":"第5课 别册p.19","say":"駅へ行ったら、人がたくさん並んでいました。"},{"pattern":"Ｖると、Ｎがあります","card":"4-6","basic":false,"point":"自然、必然的结果（指路）；后项不能是意志、请求","jp":"その{橋|はし}を{渡|わた}ると、{左|ひだり}に{田中|たなか}{自転車|じてんしゃ}があります。","zh":"过了那座桥，左边是田中自行车店。","src":"第4课 别册p.15","say":"その橋を渡ると、左に田中自転車があります。"},{"pattern":"{条件|じょうけん}{形|けい}","card":"9-3","basic":false,"point":"强调条件本身；前项是动作时后项一般不用请求","jp":"バイクが{運転|うんてん}できれば、{配達|はいたつ}の{仕事|しごと}ができます。","zh":"会骑摩托车的话，就能做送货的工作。","src":"第9课 别册p.31","say":"バイクが運転できれば、配達の仕事ができます。"},{"pattern":"～なら、～","card":"4-2","basic":false,"point":"接过对方的话题给建议","jp":"{歯|は}が{痛|いた}いなら、{南|みなみ}{歯科|しか}がいいですよ。","zh":"牙疼的话，南齿科不错哦。","src":"第4课 别册p.14","say":"歯が痛いなら、南歯科がいいですよ。"},{"pattern":"Nなら〜","card":"1-6","basic":false,"point":"“N的话（可以）”，限定范围","jp":"{日常|にちじょう}{会話|かいわ}なら{話|はな}せます。","zh":"日常会话的话我会说。","src":"第1课 p.18","say":"日常会話なら話せます。"},{"pattern":"～ないと、～","card":"15-4","basic":false,"point":"“不～就不行”，必要条件","jp":"グラフを{作|つく}らないと、わかりやすく{説明|せつめい}できません。","zh":"不做图表的话，就没法讲得清楚易懂。","src":"第15课 别册p.56","say":"グラフを作らないと、わかりやすく説明できません。"}],"point":"拿不准时用「たら」最安全；指路、自然结果用「と」；给建议用「なら」。"},{"title":"看起来・好像・听说：そう／みたい／よう／かもしれない／らしい／んだって","icon":"👀","rows":[{"pattern":"Ａそうです（{様態|ようたい}）","card":"2-1","basic":false,"point":"看外表的印象（形容词）","jp":"いいですね。{暖|あたた}かそうですね。","zh":"不错啊，看起来很暖和。","src":"第2课 p.32","say":"いいですね。暖かそうですね。"},{"pattern":"～そうです（{予測|よそく}）","card":"6-5","basic":false,"point":"根据现在的情况预测将来","jp":"このコンサートは{人気|にんき}があるので、{席|せき}がなくなりそうです。","zh":"这个演唱会很受欢迎，座位好像快没了。","src":"第6课 别册p.22","say":"このコンサートは人気があるので、席がなくなりそうです。"},{"pattern":"Ｖそうです（{直前|ちょくぜん}の{様態|ようたい}）","card":"9-6","basic":false,"point":"眼看马上就要发生","jp":"モップが{倒|たお}れそうです。","zh":"拖把快要倒了。","src":"第9课 别册p.33","say":"モップが倒れそうです。"},{"pattern":"～みたいです（{様態|ようたい}）","card":"10-3","basic":false,"point":"根据看到、听到的推断（口语）","jp":"あの{店|みせ}のアイスクリームはおいしいみたい。","zh":"那家店的冰淇淋好像很好吃。","src":"第10课 别册p.35","say":"あの店のアイスクリームはおいしいみたい。"},{"pattern":"～ようです（{様態|ようたい}）","card":"10-4","basic":false,"point":"同上，较郑重","jp":"お{祭|まつ}りがあるようです。","zh":"好像有庙会（祭典）。","src":"第10课 别册p.35","say":"お祭りがあるようです。"},{"pattern":"～かもしれません","card":"5-2","basic":false,"point":"没有把握的推测","jp":"{電車|でんしゃ}はしばらく{動|うご}かないかもしれません。","zh":"电车可能暂时不会开。","src":"第5课 别册p.17","say":"電車はしばらく動かないかもしれません。"},{"pattern":"～らしいです（{伝聞|でんぶん}）","card":"12-5","basic":false,"point":"听来的信息（传闻）","jp":"{駅前|えきまえ}のスポーツジムは{今月|こんげつ}{入会|にゅうかい}{金|きん}が{無料|むりょう}らしいです。","zh":"听说站前的健身房这个月免入会费。","src":"第12课 别册p.45","say":"駅前のスポーツジムは今月入会金が無料らしいです。"},{"pattern":"～んだって","card":"15-1","basic":false,"point":"朋友间转告听到的信息（口语）","jp":"{店|みせ}の{人|ひと}に{聞|き}いたんだけど、{今|いま}はレコードを{売|う}っている{店|みせ}がほとんどないんだって。","zh":"我问了店里的人，听说现在几乎没有卖唱片的店了。","src":"第15课 别册p.56","say":"店の人に聞いたんだけど、今はレコードを売っている店がほとんどないんだって。"}],"point":"眼睛看到的样子 → そう；根据迹象推断 → みたい／よう；没把握 → かもしれない；听来的 → らしい／んだって。"},{"title":"像～一样：みたい（推测）／みたい（比喻）／のような","icon":"🪞","rows":[{"pattern":"～みたいです（{様態|ようたい}）","card":"10-3","basic":false,"point":"推测：可能真是这样","jp":"{映画|えいが}の{撮影|さつえい}みたい。","zh":"好像是在拍电影。","src":"第10课 别册p.35","say":"映画の撮影みたい。"},{"pattern":"～みたいです（{比況|ひきょう}）","card":"10-9","basic":false,"point":"比喻：明知不是，但很像","jp":"このお{酒|さけ}はリンゴジュースみたいです。","zh":"这酒就像苹果汁一样。","src":"第10课 别册p.37","say":"このお酒はリンゴジュースみたいです。"},{"pattern":"ＮのようなＮ","card":"14-4","basic":false,"point":"用熟悉的东西说明：“像N₁一样的N₂”","jp":"テコンドーというのは{空手|からて}のようなスポーツです。","zh":"跆拳道是一种像空手道的运动。","src":"第14课 别册p.53","say":"テコンドーというのは空手のようなスポーツです。"}],"point":"同一个「みたい」要看语境：真的可能是 → 推测；明知不是 → 比喻。"},{"title":"「ように」一家：ように／ようになる／ようにしてください／ようにしている","icon":"🎯","rows":[{"pattern":"Ｖるように、～　Ｖないように、～","card":"9-2","basic":false,"point":"目的：为了（能）～／为了不～","jp":"タオルが{早|はや}く{乾|かわ}くように、ここに{干|ほ}します。","zh":"为了让毛巾快点干，晾在这里。","src":"第9课 别册p.31","say":"タオルが早く乾くように、ここに干します。"},{"pattern":"Ｖるようになります（{能力|のう const catMap = new Map(DATA.categories.map(function(c){ return [c.id, c]; }));
const cardMap = new Map(DATA.cards.map(function(c){ return [c.id, c]; }));
const state = {view:"cards", lesson:"all", cat:"all", q:""};
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toHira(s){ return String(s).replace(/[\u30a1-\u30f6]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }
function ruby(s){ return esc(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>"); }
function plain(s){ return String(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "$1"); }
function yomi(s){ return String(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "$2"); }
function color(cat){ var c = catMap.get(cat); return c ? c.color : "#4f46e5"; }
function spk(say){ return '<button type="button" class="spk" data-say="' + esc(say) + '" aria-label="朗读" title="朗读">🔊</button>'; }
function line(jp, say, cls){ return '<div class="line"><div class="jp' + (cls ? " " + cls : "") + '">' + ruby(jp) + '</div>' + spk(say) + '</div>'; }

/* ---------- 朗读（Web Speech API） ---------- */
const RATE_KEY = "shochukyu_grammar_rate", NOTICE_KEY = "shochukyu_grammar_tts_notice";
const TTS = (function(){
  var synth = window.speechSynthesis;
  var ok = !!(synth && window.SpeechSynthesisUtterance);
  var voice = null, voicesSeen = 0, current = null, curEl = null;
  var r = parseFloat(localStorage.getItem(RATE_KEY));
  var rate = (r === 0.7 || r === 1) ? r : 1;
  var PREF = [/kyoko/i, /otoya/i, /o-ren/i, /google.*(日本語|japanese)/i, /(日本語|japanese)/i];
  function pick(){
    if (!ok) return;
    var vs = synth.getVoices() || [];
    voicesSeen = vs.length;
    var ja = vs.filter(function(v){ return /^ja([-_]|$)/i.test(v.lang || ""); });
    voice = null;
    for (var i = 0; i < PREF.length && !voice; i++) {
      for (var j = 0; j < ja.length; j++) { if (PREF[i].test(ja[j].name || "")) { voice = ja[j]; break; } }
    }
    if (!voice) voice = ja.filter(function(v){ return /ja[-_]jp/i.test(v.lang); })[0] || ja[0] || null;
  }
  if (ok) {
    pick();
    if (synth.addEventListener) synth.addEventListener("voiceschanged", pick);
    else synth.onvoiceschanged = pick;
  }
  function clear(){ if (curEl) curEl.classList.remove("speaking"); curEl = null; }
  function notice(){
    if (localStorage.getItem(NOTICE_KEY)) return;
    localStorage.setItem(NOTICE_KEY, "1");
    document.getElementById("noticeText").innerHTML = (ok ? "没有找到日语语音。" : "这个浏览器不支持朗读。") +
      "请用 Safari / Chrome 打开，微信内置浏览器可能不支持。<br>Android：请在系统「文字转语音（TTS）」设置里安装日语语音。";
    document.getElementById("notice").classList.remove("hidden");
  }
  /* 必须在点击事件里同步调用（iOS 要求） */
  function speak(text, el){
    if (!ok) { notice(); return false; }
    if (!voice) pick();
    synth.cancel();
    clear();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    if (voice) u.voice = voice;
    u.rate = rate;
    current = u; curEl = el || null;
    if (curEl) curEl.classList.add("speaking");
    u.onstart = function(){ if (current === u && curEl) curEl.classList.add("speaking"); };
    u.onend = u.onerror = function(){ if (current === u) { clear(); current = null; } };
    synth.speak(u);
    if (!voice && voicesSeen > 0) notice();
    return true;
  }
  function setRate(v){ rate = v; localStorage.setItem(RATE_KEY, String(v)); }
  return {speak:speak, setRate:setRate, get rate(){ return rate; }, get voice(){ return voice; }, supported:ok, pick:pick};
})();
function syncRate(){ document.querySelectorAll(".rate button").forEach(function(b){ b.classList.toggle("active", +b.dataset.rate === TTS.rate); }); }

/* ---------- 语法卡片 ---------- */
function cardHTML(c){
  var cat = catMap.get(c.cat);
  var pex = c.pex.length ? '<div class="pex"><div class="lab">句型小例</div>' + c.pex.map(function(p){ return line(p.jp, p.say); }).join("") + '</div>' : "";
  var exs = c.ex.map(function(e){
    var badge = e.src ? '<span class="badge tb">课本例句 ' + esc(e.src) + '</span>' : '<span class="badge nw">新例句</span>';
    return '<div class="ex">' + line(e.jp, e.say) + '<div class="exz">' + esc(e.zh) + ' ' + badge + '</div></div>';
  }).join("");
  var tips = c.tips.length ? '<div class="tips">' + c.tips.map(function(t){ return "<div>" + ruby(t) + "</div>"; }).join("") + "</div>" : "";
  return '<article class="card" id="card-' + c.id + '" data-id="' + c.id + '" style="--c:' + color(c.cat) + '">' +
    '<div class="top"><span class="badge id">' + c.id + '</span><span class="badge">ST' + c.st + '</span><span class="badge cat">' + cat.icon + " " + esc(cat.name) + '</span>' +
    (c.usageR ? '<span class="badge use">' + ruby(c.usageR) + '</span>' : '') + '</div>' +
    '<div class="pattern">' + ruby(c.pattern) + '</div>' +
    '<div class="conn"><b>接续</b>　' + ruby(c.conn) + '</div>' +
    '<div class="mean">' + ruby(c.zh) + '</div>' + pex +
    '<div class="exs">' + exs + '</div>' + tips + '</article>';
}
function buildCards(){
  var html = DATA.lessons.map(function(L){
    var cs = DATA.cards.filter(function(c){ return c.lesson === L.n; });
    var sts = L.st.map(function(title, i){
      var s = i + 1, list = cs.filter(function(c){ return c.st === s; });
      if (!list.length) return "";
      return '<div class="st" data-st="' + s + '"><div class="sthead">ST' + s + '　<b>' + ruby(title) + '</b><br>Can-do：' + esc(L.cando[i]) + '</div><div class="grid">' + list.map(cardHTML).join("") + '</div></div>';
    }).join("");
    return '<details class="lesson" id="lesson-' + L.n + '" data-lesson="' + L.n + '" open><summary><span class="lnum">第' + L.n + '课</span><span class="ltitle">' + ruby(L.title) + '<small>' + esc(L.zh) + '</small></span><span class="count"></span></summary>' +
      '<div class="inside"><div class="goal">🎯 本课目标：' + esc(L.goal) + '</div>' + sts + '</div></details>';
  }).join("");
  document.getElementById("content").innerHTML = html;
}
function hay(c){
  var p = [c.id, plain(c.pattern), yomi(c.pattern), c.official, c.usage, plain(c.conn), yomi(c.conn), plain(c.zh), c.stTitle];
  c.pex.forEach(function(e){ p.push(plain(e.jp), yomi(e.jp)); });
  c.ex.forEach(function(e){ p.push(plain(e.jp), yomi(e.jp), e.zh, e.src); });
  c.tips.forEach(function(t){ p.push(plain(t), yomi(t)); });
  return toHira(p.join("\n").toLowerCase());
}
const HAY = new Map(DATA.cards.map(function(c){ return [c.id, hay(c)]; }));
function matchCard(c){
  if (state.lesson !== "all" && c.lesson !== +state.lesson) return false;
  if (state.cat !== "all" && c.cat !== state.cat) return false;
  return !state.q || HAY.get(c.id).indexOf(state.q) !== -1;
}
function filterCards(){
  var total = 0;
  document.querySelectorAll(".lesson").forEach(function(sec){
    var n = 0;
    sec.querySelectorAll(".st").forEach(function(st){
      var k = 0;
      st.querySelectorAll(".card").forEach(function(el){
        var v = matchCard(cardMap.get(el.dataset.id));
        el.classList.toggle("hidden", !v);
        if (v) k++;
      });
      st.classList.toggle("hidden", k === 0);
      n += k;
    });
    sec.classList.toggle("hidden", n === 0);
    sec.querySelector(".count").textContent = n + " 条";
    if (n && state.q) sec.open = true;
    total += n;
  });
  document.getElementById("empty").classList.toggle("hidden", total > 0);
  document.getElementById("resultText").textContent = "显示 " + total + " 条语法";
}

/* ---------- 易混对比 ---------- */
function buildCompare(){
  document.getElementById("v-compare").innerHTML =
    '<div class="legend"><b>易混句型对比：</b>把意思相近、容易用错的句型放在一起比较（含部分初級句型）。点 <b>第N课 →</b> 跳到对应语法卡片。</div>' +
    DATA.compare.map(function(g){
      return '<div class="pblock"><div class="ctitle">' + g.icon + ' ' + ruby(g.title) + '</div>' +
        g.rows.map(function(r){
          var c = r.card ? cardMap.get(r.card) : null;
          var jumpBtn = c ? '<button type="button" class="ljump" data-jump="' + c.id + '">第' + c.lesson + '课 ' + c.id + ' →</button>' : '<span class="badge">初級</span>';
          var badge = r.src ? ' <span class="badge tb">课本例句 ' + esc(r.src) + '</span>' : (r.jp ? ' <span class="badge nw">新例句</span>' : '');
          return '<div class="crow"><div class="pat">' + ruby(r.pattern) + ' ' + jumpBtn + '</div>' +
            '<div class="pt">' + ruby(r.point) + '</div>' +
            (r.jp ? line(r.jp, r.say) + '<div class="exz">' + esc(r.zh) + badge + '</div>' : '') + '</div>';
        }).join("") +
        (g.point ? '<div class="cpoint">' + ruby(g.point) + '</div>' : '') + '</div>';
    }).join("");
}

/* ---------- 活用规则 ---------- */
function buildConj(){
  document.getElementById("v-conj").innerHTML =
    '<div class="legend"><b>活用规则：</b>本书（初中級）新出现的动词活用形与敬语形式。Ⅰ类＝五段动词，Ⅱ类＝一段动词，Ⅲ类＝する・くる。点 🔊 朗读例词。</div>' +
    DATA.conj.map(function(c){
      return '<div class="pblock"><div><span class="pname" style="font-size:22px">' + ruby(c.name) + '</span>' +
        (c.card ? '<button type="button" class="ljump" data-jump="' + c.card + '">第' + c.lesson + '课 ' + c.card + ' →</button>' : '') + '</div>' +
        '<div class="mean">' + ruby(c.rule) + '</div><table class="conj">' +
        c.rows.map(function(r){ return "<tr><td>" + ruby(r[0]) + '</td><td class="cx">' + line(r[1], r[3]) + "</td><td>" + ruby(r[2]) + "</td></tr>"; }).join("") + "</table></div>";
    }).join("");
}

/* ---------- 交互 ---------- */
function buildChips(){
  var ls = [{v:"all", t:"全部课"}].concat(DATA.lessons.map(function(L){ return {v:String(L.n), t:String(L.n)}; }));
  document.getElementById("lchips").innerHTML = ls.map(function(x){ return '<button type="button" class="chip lc' + (x.v === "all" ? " active" : "") + '" data-lesson="' + x.v + '">' + (x.v === "all" ? x.t : "第" + x.t + "课") + "</button>"; }).join("");
  var cs = [{id:"all", name:"全部分类", icon:"🗂️", color:""}].concat(DATA.categories);
  document.getElementById("cchips").innerHTML = cs.map(function(c){ return '<button type="button" class="chip' + (c.id === "all" ? " active" : "") + '" data-cat="' + c.id + '"' + (c.color ? ' style="border-color:' + c.color + '"' : '') + '>' + c.icon + " " + esc(c.name) + "</button>"; }).join("");
}
function refresh(){
  if (state.view === "cards") filterCards();
  else document.getElementById("resultText").textContent = "";
}
function setView(v){
  state.view = v;
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.dataset.view === v); });
  ["cards","compare","conj"].forEach(function(x){ document.getElementById("v-" + x).classList.toggle("hidden", x !== v); });
  var showFilters = v === "cards";
  ["q","lchips","cchips","tExWrap"].forEach(function(id){ document.getElementById(id).classList.toggle("hidden", !showFilters); });
  refresh();
}
function jump(id){
  state.lesson = "all"; state.cat = "all"; state.q = "";
  document.getElementById("q").value = "";
  document.querySelectorAll("#lchips .chip").forEach(function(x){ x.classList.toggle("active", x.dataset.lesson === "all"); });
  document.querySelectorAll("#cchips .chip").forEach(function(x){ x.classList.toggle("active", x.dataset.cat === "all"); });
  setView("cards");
  var el = document.getElementById("card-" + id);
  if (el) { el.closest("details").open = true; if (el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"start"}); el.classList.add("flash"); setTimeout(function(){ el.classList.remove("flash"); }, 1600); }
}
document.addEventListener("click", function(e){
  var t;
  if ((t = e.target.closest(".spk"))) {
    /* 直接在点击处理函数里调用 speak()（iOS 需要） */
    TTS.speak(t.dataset.say, t.closest(".line") || t);
    return;
  }
  if ((t = e.target.closest(".rate button"))) { TTS.setRate(+t.dataset.rate); syncRate(); return; }
  if ((t = e.target.closest("#noticeClose"))) { document.getElementById("notice").classList.add("hidden"); return; }
  if ((t = e.target.closest(".tab"))) { setView(t.dataset.view); return; }
  if ((t = e.target.closest("[data-jump]"))) { jump(t.dataset.jump); return; }
  if ((t = e.target.closest("#lchips .chip"))) {
    state.lesson = t.dataset.lesson;
    document.querySelectorAll("#lchips .chip").forEach(function(x){ x.classList.toggle("active", x === t); });
    refresh();
    if (state.view === "cards" && state.lesson !== "all") { var s = document.getElementById("lesson-" + state.lesson); if (s) { s.open = true; if (s.scrollIntoView) s.scrollIntoView({behavior:"smooth", block:"start"}); } }
    return;
  }
  if ((t = e.target.closest("#cchips .chip"))) {
    state.cat = t.dataset.cat;
    document.querySelectorAll("#cchips .chip").forEach(function(x){ x.classList.toggle("active", x === t); });
    refresh(); return;
  }
});
document.getElementById("q").addEventListener("input", function(e){ state.q = toHira(e.target.value.trim().toLowerCase()); refresh(); });
document.getElementById("tEx").addEventListener("change", function(e){ document.body.classList.toggle("hide-ex", !e.target.checked); });
(function(){
  var s = DATA.stats;
  document.getElementById("stats").innerHTML =
    '<span class="stat">' + s.cards + ' 个语法点</span><span class="stat">' + s.examples + ' 条例句（课本 ' + s.textbook + '）</span>' +
    '<span class="stat">' + s.compareGroups + ' 组易混对比</span><span class="stat">' + s.conj + ' 组活用规则</span><span class="stat">🔊 ' + s.speakButtons + '</span>';
  buildChips(); buildCards(); buildCompare(); buildConj(); syncRate(); setView("cards");
})();
</script>
