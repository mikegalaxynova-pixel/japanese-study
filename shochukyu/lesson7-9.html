","kind":"grammar","gid":"9-7","key":"9-7","pattern":"Ｖておきます（{放置|ほうち}）","word":"Ｖておきます（放置）","reading":"","zh":"“（就那样）放着／保持～的状态”。为了某个目的让状态保持不变。","official":"Ｖておきます（放置）","usage":"放置","conn":"Vて ＋ おきます","tips":["「そのままにしておいてください」＝请保持原样。","比较 6-6（事先准备）。"],"lessons":[9],"lesson":9,"st":2,"stTitle":"楽しいアルバイト","examples":[{"jp":"{窓|まど}を{開|あ}けておきます。","zh":"窗户就开着吧。","src":"课本","say":"窓を開けておきます。","ref":"第9课 别册p.33"},{"jp":"お{皿|さら}をそのままにしておきます。","zh":"盘子就那样放着。","src":"课本","say":"お皿をそのままにしておきます。","ref":"第9课 别册p.33"}],"confuse":[],"note":""},{"id":"g:9-8","kind":"grammar","gid":"9-8","key":"9-8","pattern":"Ｖ（よ）う","word":"Ｖ（よ）う","reading":"","zh":"“～吧”。「～ましょう」的普通形，用于朋友、家人之间的提议，或自言自语的决定。","official":"Ｖ（よ）う","usage":"","conn":"意向形（3-2）单独使用","tips":["对上级说「～ましょう」。"],"lessons":[9],"lesson":9,"st":2,"stTitle":"楽しいアルバイト","examples":[{"jp":"{材料|ざいりょう}を{買|か}いに{行|い}こう。","zh":"去买材料吧。","src":"课本","say":"材料を買いに行こう。","ref":"第9课 别册p.33"},{"jp":"{休憩|きゅうけい}しよう。","zh":"休息一下吧。","src":"课本","say":"休憩しよう。","ref":"第9课 别册p.33"}],"confuse":[],"note":""},{"id":"g:9-9","kind":"grammar","gid":"9-9","key":"9-9","pattern":"Ｖてしまいます（{完了|かんりょう}）","word":"Ｖてしまいます（完了）","reading":"","zh":"“（全部）做完／赶快做掉”。强调动作彻底完成。","official":"Ｖてしまいます（完了）","usage":"完了","conn":"Vて ＋ しまいます","tips":["比较 5-1（遗憾、后悔，多用过去形）。"],"lessons":[9],"lesson":9,"st":2,"stTitle":"楽しいアルバイト","examples":[{"jp":"{鍋|なべ}を{洗|あら}ってしまいます。","zh":"我把锅洗完。","src":"课本","say":"鍋を洗ってしまいます。","ref":"第9课 别册p.33"},{"jp":"{野菜|やさい}を{切|き}ってしまいます。","zh":"我把蔬菜切完。","src":"课本","say":"野菜を切ってしまいます。","ref":"第9课 别册p.33"}],"confuse":[],"note":""}],"jita":[{"a":"驚く","ar":"おどろく","azh":"吃惊","arole":"自动词","astatus":"已学：初中級 L7","b":"驚かす","br":"おどろかす","bzh":"使……吃惊","brole":"他动词","bstatus":"书里没有","tip":"自动词「ニュースに驚く」（自己感到吃惊）↔ 他动词「人を驚かす」（让别人吃惊）。「〜ている」：驚いている＝正处于吃惊的状态。","lessons":[7]},{"a":"変わる","ar":"かわる","azh":"变、变化（自动词）","arole":"自动词","astatus":"已学：初中級 L7","b":"変える","br":"かえる","bzh":"改变、变更","brole":"他动词","bstatus":"已学：初中級 L5","tip":"「色が変わる」事情自己变；「時間を変える」人有意去改。考试常考助词：が＝自、を＝他。","lessons":[7]},{"a":"冷やす","ar":"ひやす","azh":"冰镇、冷却（他动词）","arole":"他动词","astatus":"已学：初中級 L7","b":"冷える","br":"ひえる","bzh":"变凉、发冷","brole":"自动词","bstatus":"课本：初中級 L12（后面的课）","tip":"他动词「ゼリーを冷やす」人把东西冰镇；自动词「体が冷える」自己变冷。","lessons":[7]},{"a":"焼く","ar":"やく","azh":"烤、煎、烧","arole":"他动词","astatus":"已学：初中級 L7","b":"焼ける","br":"やける","bzh":"烤熟、烧掉","brole":"自动词","bstatus":"书里没有","tip":"「パンを焼く」人去烤；「パンが焼ける」面包烤好了／烧着了。","lessons":[7]},{"a":"沸かす","ar":"わかす","azh":"烧开、煮沸","arole":"他动词","astatus":"已学：初中級 L7","b":"沸く","br":"わく","bzh":"沸腾、烧开","brole":"自动词","bstatus":"书里没有","tip":"「お湯を沸かす」人去烧；「お湯が沸く」水自己开了。本课还有「沸騰する」，意思接近「沸く」。","lessons":[7]},{"a":"助ける","ar":"たすける","azh":"帮助、救","arole":"他动词","astatus":"已学：初中級 L8","b":"助かる","br":"たすかる","bzh":"得救、解围","brole":"自动词","bstatus":"书里没有","tip":"「人を助ける」去救别人；「人が助かる」那个人得救了。","lessons":[8]},{"a":"届ける","ar":"とどける","azh":"送到、递交（他动词）","arole":"他动词","astatus":"已学：初中級 L8","b":"届く","br":"とどく","bzh":"（寄的东西）到达","brole":"自动词","bstatus":"已学：初中級 L9","tip":"「荷物を届ける」人去送；「荷物が届く」东西到了。〜ている：届いている＝已经送到了（状态）。","lessons":[8]},{"a":"直す","ar":"なおす","azh":"修理；修改","arole":"他动词","astatus":"已学：初中級 L8","b":"直る","br":"なおる","bzh":"修好、恢复正常","brole":"自动词","bstatus":"书里没有","tip":"「ラジオを直す」人去修；「ラジオが直る」东西好了。","lessons":[8]},{"a":"上がる","ar":"あがる","azh":"上升、上涨（自动词）","arole":"自动词","astatus":"已学：初中級 L9","b":"上げる","br":"あげる","bzh":"抬起、提高","brole":"他动词","bstatus":"已学：初中級 L9","tip":"「時給が上がる」自己上涨；「温度を上げる」人去调高。〜ている：上がっている＝已经处在更高的状态。","lessons":[9]},{"a":"空く","ar":"あく","azh":"空、空出来","arole":"自动词","astatus":"已学：初中級 L9","b":"空ける","br":"あける","bzh":"腾出、空出","brole":"他动词","bstatus":"书里没有","tip":"「席が空く」位子空出来了；「席を空ける」人把位子腾出来。读「あく」。","lessons":[9]},{"a":"かける","ar":"かける","azh":"挂（日历）；浇（调味汁）；坐（おかけください＝请坐）","arole":"他动词","astatus":"已学：初中級 L9","b":"かかる","br":"かかる","bzh":"花费（时间、钱）；挂着","brole":"自动词","bstatus":"已学：初級 L15","tip":"かける／かかる是多义词自他对。本课「いすにかける／おかけください」＝请坐；第2课还有「カレンダーをかける」「ソースをかける」。","lessons":[9]},{"a":"片付ける","ar":"かたづける","azh":"收拾、整理","arole":"他动词","astatus":"已学：初中級 L9","b":"片付く","br":"かたづく","bzh":"收拾好、整洁","brole":"自动词","bstatus":"书里没有","tip":"「部屋を片付ける」人去收拾；「部屋が片付く」房间变整齐了。","lessons":[9]},{"a":"乾く","ar":"かわく","azh":"干（自动词）","arole":"自动词","astatus":"已学：初中級 L9","b":"乾かす","br":"かわかす","bzh":"弄干","brole":"他动词","bstatus":"书里没有","tip":"「タオルが乾く」自己干了。本课他动词常用「干す」（晾、晒）。","lessons":[9]},{"a":"代わる","ar":"かわる","azh":"代替、替换","arole":"自动词","astatus":"已学：初中級 L9","b":"代える","br":"かえる","bzh":"替换、交换","brole":"他动词","bstatus":"书里没有","tip":"课本例句是「アルバイトを代わる」（替别人的班）。标准自他还有「代える」，词表里没有。","lessons":[9]},{"a":"決まる","ar":"きまる","azh":"决定、定下来（自动词）","arole":"自动词","astatus":"已学：初中級 L9","b":"決める","br":"きめる","bzh":"决定","brole":"他动词","bstatus":"已学：初中級 L3","tip":"「注文が決まる」事情定下来了；「学校を決める」人去决定。〜ている：決まっている＝已经定好的状态。","lessons":[9]},{"a":"切れる","ar":"きれる","azh":"断开；用完、（电池）没电","arole":"自动词","astatus":"已学：初中級 L9","b":"切る","br":"きる","bzh":"切、剪；挂断","brole":"他动词","bstatus":"已学：初級 L7","tip":"「ひもが切れる／電池が切れる」自己断了、用完了；「野菜を切る」人去切。","lessons":[9]},{"a":"焦げる","ar":"こげる","azh":"焦、糊","arole":"自动词","astatus":"已学：初中級 L9","b":"焦がす","br":"こがす","bzh":"把……烧焦","brole":"他动词","bstatus":"书里没有","tip":"「料理が焦げる」自己糊了；「料理を焦がす」人给烤糊了。常和「Ｖそうです」（眼看就要～）一起用：焦げそうです。","lessons":[9]},{"a":"下げる","ar":"さげる","azh":"降低；撤下（他动词）","arole":"他动词","astatus":"已学：初中級 L9","b":"下がる","br":"さがる","bzh":"下降","brole":"自动词","bstatus":"课本：初中級 L15（后面的课）","tip":"「温度を下げる」人去调低；「値段が下がる」自己下降。也可表示把碗盘撤下。","lessons":[9]},{"a":"足りる","ar":"たりる","azh":"足够","arole":"自动词","astatus":"已学：初中級 L9","b":"足す","br":"たす","bzh":"补上、加上","brole":"他动词","bstatus":"书里没有","tip":"「お金が足りる」数量够了；不够时说「足りない」。","lessons":[9]},{"a":"出す","ar":"だす","azh":"拿出；（把垃圾）扔出去","arole":"他动词","astatus":"已学：初中級 L9","b":"出る","br":"でる","bzh":"出去、离开；（车）开出","brole":"自动词","bstatus":"已学：初中級 L4、L5","tip":"「ごみを出す」人把垃圾拿出去；「外に出る」自己出去。〜ている：出している＝正在往外拿。","lessons":[9]},{"a":"つける","ar":"つける","azh":"戴、佩戴（首饰等）","arole":"他动词","astatus":"已学：初中級 L9","b":"付く","br":"つく","bzh":"附有、带有","brole":"自动词","bstatus":"已学：初中級 L5","tip":"「アクセサリーをつける」人戴上；「おまけが付く」东西自带附件。","lessons":[9]},{"a":"並べる","ar":"ならべる","azh":"摆放、排列（他动词）","arole":"他动词","astatus":"已学：初中級 L9","b":"並ぶ","br":"ならぶ","bzh":"排队、排列","brole":"自动词","bstatus":"已学：初級 L14","tip":"「人が並ぶ」人自己排队；「はしを並べる」把筷子摆好。","lessons":[9]},{"a":"干す","ar":"ほす","azh":"晾、晒","arole":"他动词","astatus":"已学：初中級 L9","b":"乾く","br":"かわく","bzh":"干","brole":"自动词","bstatus":"已学：初中級 L9","tip":"人去晾是「干す」，晾干的结果是「乾く」。","lessons":[9]},{"a":"燃える","ar":"もえる","azh":"燃烧","arole":"自动词","astatus":"已学：初中級 L9","b":"燃やす","br":"もやす","bzh":"燃烧、烧掉","brole":"他动词","bstatus":"书里没有","tip":"「紙が燃える」自己在烧；「紙を燃やす」人去烧。","lessons":[9]},{"a":"破れる","ar":"やぶれる","azh":"破、破裂（自动词）","arole":"自动词","astatus":"已学：初中級 L9","b":"破る","br":"やぶる","bzh":"弄破、打破（规定）","brole":"他动词","bstatus":"书里没有","tip":"「袋が破れる」自己破了；「紙を破る」人去撕。","lessons":[9]},{"a":"渡す","ar":"わたす","azh":"交给","arole":"他动词","astatus":"已学：初中級 L9","b":"渡る","br":"わたる","bzh":"过（桥、马路）","brole":"自动词","bstatus":"已学：初級 L10","tip":"⚠️ 字形相近、意思不同：渡す＝把东西交给对方（荷物を渡す）；渡る＝自己走过去（橋を渡る）。","lessons":[9]}],"groups":[{"id":"g-atsui","kind":"音近","title":"あつい：厚い／暑い／熱い","items":[{"word":"厚い","reading":"あつい","zh":"厚","status":"已学：初中級 L7"},{"word":"暑い","reading":"あつい","zh":"（天气）热","status":"已学：初級 L4"},{"word":"熱い","reading":"あつい","zh":"（物体）烫","status":"已学：初級 L4"}],"tip":"三个都读「あつい」。看汉字和搭配：厚い本、暑い日、熱いお茶。"},{"id":"g-kawaru","kind":"音近","title":"かわる／かえる：変わる・代わる・変える","items":[{"word":"変わる","reading":"かわる","zh":"变化（自动词）","status":"已学：初中級 L7"},{"word":"代わる","reading":"かわる","zh":"代替、换班（自动词）","status":"已学：初中級 L9"},{"word":"変える","reading":"かえる","zh":"改变（他动词）","status":"已学：初中級 L5"}],"tip":"変わる＝状态变了；代わる＝人／班被替换（同音不同字）。变える读「かえる」，是他动词，人去改。"},{"id":"g-ageru","kind":"音近","title":"あげる：上げる vs 给别人 vs 〜てあげる","items":[{"word":"上げる","reading":"あげる","zh":"抬起、提高","status":"已学：初中級 L9"},{"word":"あげる","reading":"あげる","zh":"给、送","status":"已学：初級 L8"},{"word":"Ｖてあげます","reading":"てあげます","zh":"为别人做～","status":"已学：初中級 L8"}],"tip":"读音相同。提高温度用「上げる」；给人东西用「あげる」；帮人做事用「〜てあげる」。对长辈不要说「てあげます」，改用「お〜します」。"},{"id":"g-toru","kind":"音近","title":"とる：捕る／取る／撮る","items":[{"word":"捕る","reading":"とる","zh":"捕捉（鱼、虫）","status":"已学：初中級 L8"},{"word":"取る","reading":"とる","zh":"取、拿、请假","status":"已学：初級 L7；初中級 L5、L6"},{"word":"撮る","reading":"とる","zh":"拍照","status":"已学：初級 L5"}],"tip":"考试常考汉字：魚を捕る、休みを取る、写真を撮る。"},{"id":"g-naosu","kind":"音近","title":"なおす／なおる：直す・直る・治る","items":[{"word":"直す","reading":"なおす","zh":"修理、修改（他动词）","status":"已学：初中級 L8"},{"word":"直る","reading":"なおる","zh":"修好（自动词）","status":"书里没有"},{"word":"治る","reading":"なおる","zh":"病好了（自动词）","status":"已学：初級 L12"}],"tip":"直す是他动词（人去修）。两个「なおる」汉字不同：直る＝东西好了，治る＝人病好了。"},{"id":"g-tsuku","kind":"音近","title":"つく／つける：付く・着く・つける・気をつける","items":[{"word":"つける","reading":"つける","zh":"戴、佩戴","status":"已学：初中級 L9"},{"word":"付く","reading":"つく","zh":"附有、带有","status":"已学：初中級 L5"},{"word":"着く","reading":"つく","zh":"到达","status":"已学：初中級 L4"},{"word":"気をつける","reading":"きをつける","zh":"当心","status":"已学：初中級 L9"}],"tip":"着く＝到达（駅に着く）；付く＝附着（自）；つける＝戴上（他）。気をつける是固定说法。"},{"id":"g-dasu","kind":"自他","title":"出る／出す、渡る／渡す","items":[{"word":"出す","reading":"だす","zh":"拿出；扔垃圾","status":"已学：初中級 L9"},{"word":"出る","reading":"でる","zh":"出去、离开","status":"已学：初中級 L4、L5"},{"word":"渡す","reading":"わたす","zh":"交给","status":"已学：初中級 L9"},{"word":"渡る","reading":"わたる","zh":"走过（桥、马路）","status":"已学：初級 L10"}],"tip":"出す／渡す是他动词（を）；出る／渡る是自动词。渡す＝交到别人手里，渡る＝自己走过去，字形也容易看混。"},{"id":"g-aku","kind":"音近","title":"あく／ひらく：空く vs 開く","items":[{"word":"空く","reading":"あく","zh":"空出来","status":"已学：初中級 L9"},{"word":"開く","reading":"ひらく","zh":"开店；举行会议","status":"已学：初中級 L3"},{"word":"開く","reading":"あく","zh":"（门等）打开（自动词）","status":"书里没有"},{"word":"開ける","reading":"あける","zh":"打开（他动词）","status":"书里没有"}],"tip":"本课「空く（あく）」＝位子、时间空了。开店、开会读「ひらく」。门开了的「開く（あく）／開ける」不在词表里。"},{"id":"g-hosoi","kind":"形近","title":"細い vs 細かい","items":[{"word":"細い","reading":"ほそい","zh":"细长","status":"已学：初中級 L7"},{"word":"細かい","reading":"こまかい","zh":"细碎","status":"已学：初中級 L7"}],"tip":"細い＝细长的形状；細かい＝碎、不粗。細く切る＝切丝，細かく切る＝切丁、切碎。"},{"id":"g-usui","kind":"义近","title":"厚い・薄い・濃い・弱い","items":[{"word":"厚い","reading":"あつい","zh":"厚","status":"已学：初中級 L7"},{"word":"薄い","reading":"うすい","zh":"薄；淡","status":"已学：初中級 L5、L7"},{"word":"濃い","reading":"こい","zh":"浓","status":"已学：初中級 L7"},{"word":"弱い","reading":"よわい","zh":"弱、小（火）","status":"已学：初中級 L7"},{"word":"強い","reading":"つよい","zh":"强","status":"已学：初級 L15"}],"tip":"厚薄用厚い／薄い；味道、颜色浓淡用濃い／薄い；火力用弱い／強い（弱火・強火）。"},{"id":"g-donata","kind":"义近","title":"だれ／どなた／誰か","items":[{"word":"誰","reading":"だれ","zh":"谁","status":"已学：初級 L2"},{"word":"どなた","reading":"どなた","zh":"哪位","status":"已学：初中級 L7"},{"word":"誰か","reading":"だれか","zh":"某个人、有谁","status":"已学：初中級 L9"}],"tip":"どなた比だれ礼貌。誰か＝不确定是谁，或“有没有人”。"},{"id":"g-sukoshi","kind":"义近","title":"少し／少々／ちょっと","items":[{"word":"少し","reading":"すこし","zh":"稍微、一点","status":"已学：初級 L4"},{"word":"少々","reading":"しょうしょう","zh":"一些、稍微","status":"已学：初中級 L9"},{"word":"ちょっと","reading":"ちょっと","zh":"有点；委婉拒绝","status":"已学：初中級 L2；初級 L10"}],"tip":"少々最郑重（少々お待ちください）。ちょっと最口语，也可用来委婉拒绝。"},{"id":"g-first","kind":"义近","title":"まず／最初に／先に／次に／最後に","items":[{"word":"まず","reading":"まず","zh":"首先","status":"已学：初中級 L1、L7"},{"word":"最初に","reading":"さいしょに","zh":"首先","status":"已学：初中級 L9"},{"word":"先に","reading":"さきに","zh":"先、提前","status":"已学：初中級 L9"},{"word":"次に","reading":"つぎに","zh":"接着","status":"已学：初中級 L7"},{"word":"最後に","reading":"さいごに","zh":"最后","status":"已学：初中級 L7"}],"tip":"讲步骤：まず／最初に → 次に → 最後に。先に带对比（你先请、比某事先做），不完全等于“第一步”。"},{"id":"g-gozonji","kind":"义近","title":"ご存じ／知る／わかる","items":[{"word":"ご存じ","reading":"ごぞんじ","zh":"您知道","status":"已学：初中級 L7"},{"word":"知る","reading":"しる","zh":"知道","status":"已学：初級 L13"},{"word":"わかる","reading":"わかる","zh":"明白、懂","status":"已学：初級 L7"}],"tip":"ご存じだ是知っている的尊敬语，只问对方。自己知道说知っています。わかる强调“懂不懂”。"},{"id":"g-tashika","kind":"义近","title":"確かめる／チェックする／確認する","items":[{"word":"確かめる","reading":"たしかめる","zh":"确认","status":"已学：初中級 L9"},{"word":"チェックする","reading":"チェックする","zh":"检查；打勾（check）","status":"已学：初中級 L9"},{"word":"確認する","reading":"かくにんする","zh":"确认","status":"已学：初中級 L3"}],"tip":"チェックする（check）适合清单核对。確認する稍正式。確かめる＝弄清楚是否无误。"},{"id":"g-chui","kind":"义近","title":"気をつける／注意する","items":[{"word":"気をつける","reading":"きをつける","zh":"当心、留神","status":"已学：初中級 L9"},{"word":"注意する","reading":"ちゅういする","zh":"注意；提醒","status":"已学：初中級 L9"}],"tip":"気をつける多用于自己小心。注意する也可以提醒别人，告示写「ご注意ください」。"},{"id":"g-ookina","kind":"形近","title":"大きな vs 大きい；いろんな","items":[{"word":"大きな","reading":"おおきな","zh":"大的（连体）","status":"已学：初中級 L9"},{"word":"大きい","reading":"おおきい","zh":"大","status":"已学：初級 L4"},{"word":"いろんな","reading":"いろんな","zh":"各种各样的","status":"已学：初中級 L8"}],"tip":"大きな只能修饰名词（大きな声），不能说「大きなです」。大きい可作谓语。いろんな是「いろいろな」的口语形（いろいろな未收入词表）。"},{"id":"g-shikkari","kind":"音近","title":"しっかり vs はっきり","items":[{"word":"しっかり","reading":"しっかり","zh":"用力地、好好地","status":"已学：初中級 L9"},{"word":"はっきり","reading":"はっきり","zh":"清楚、鲜明","status":"已学：初中級 L9"}],"tip":"节奏很像，意思不同：しっかり持って＝抓紧；はっきり言って＝说清楚。"},{"id":"g-jama","kind":"形近","title":"邪魔（な）vs お邪魔します；失礼 vs 丁寧","items":[{"word":"邪魔","reading":"じゃま","zh":"妨碍、碍事","status":"已学：初中級 L9"},{"word":"お邪魔します","reading":"おじゃまします","zh":"打扰了（进门套话）","status":"已学：初中級 L7"},{"word":"失礼","reading":"しつれい","zh":"不礼貌；失礼了","status":"已学：初中級 L7"},{"word":"丁寧","reading":"ていねい","zh":"很有礼貌","status":"已学：初中級 L9"}],"tip":"お邪魔します是进别人家的问候，不是在说自己碍事。失礼（な）↔ 丁寧（な）。"},{"id":"g-kiru","kind":"自他","title":"切れる vs 切る；しまう vs 〜てしまう","items":[{"word":"切れる","reading":"きれる","zh":"断开；用完（自动词）","status":"已学：初中級 L9"},{"word":"切る","reading":"きる","zh":"切、剪（他动词）","status":"已学：初級 L7"},{"word":"しまう","reading":"しまう","zh":"收起、收纳","status":"已学：初中級 L9"},{"word":"Ｖてしまいます","reading":"てしまいます","zh":"做完／不小心做了","status":"已学：初中級 L5、L9"}],"tip":"電池が切れる（自己没电）vs 野菜を切る（人去切）。しまう是把东西收起来；〜てしまう是补助动词，见下方语法对比。"},{"id":"g-kakeru","kind":"义近","title":"かける（请坐）vs 座る vs かかる","items":[{"word":"かける","reading":"かける","zh":"坐（おかけください）；挂；浇","status":"已学：初中級 L2、L9"},{"word":"座る","reading":"すわる","zh":"坐","status":"已学：初級 L10"},{"word":"かかる","reading":"かかる","zh":"花费（时间、钱）","status":"已学：初級 L15"}],"tip":"おかけください更礼貌。かける和かかる是多义词自他对，本课重点记住“请坐”。時間がかかる＝花费时间。"},{"id":"g-sorry","kind":"义近","title":"申し訳ない vs すみません","items":[{"word":"申し訳ないんですが","reading":"もうしわけないんですが","zh":"非常抱歉（开场白）","status":"已学：初中級 L9"},{"word":"すみません","reading":"すみません","zh":"对不起；劳驾","status":"已学：初級 L1、L6、L7"}],"tip":"申し訳ないんですが更郑重，用于开口拜托或拒绝。日常道歉、打招呼用すみません。"},{"id":"gr-youni-tame","kind":"语法","title":"〜ように vs 〜ために vs 〜ようになる","items":[{"word":"Ｖるように／ないように","reading":"","zh":"为了能～／为了不～","status":"已学：初中級 L9"},{"word":"Ｖるために、Nのために","reading":"","zh":"为了～（有意志的目的）","status":"已学：初中級 L3"},{"word":"Ｖるようになります","reading":"","zh":"变得会～了（能力变化）","status":"已学：初中級 L1"}],"tip":"ために：前后主语多相同，后面是有意志的行动（お金を貯めるために働く）。ように：目的是某种状态或结果，前面常用可能动词、无意志动词或否定（聞こえるように、忘れないように）。ようになる是能力／习惯的变化，不是目的。"},{"id":"gr-kudasai","kind":"语法","title":"てください／ようにしてください／おＶください","items":[{"word":"Ｖてください","reading":"","zh":"请～","status":"已学：初級 L7"},{"word":"Ｖるようにしてください","reading":"","zh":"请尽量做到～／请注意不要～","status":"已学：初中級 L9"},{"word":"おＶください／ごＮください","reading":"","zh":"请～（更郑重）","status":"已学：初中級 L9"}],"tip":"てください是直接请求。ようにしてください更委婉，要求养成习惯或注意。お書きください、ご注意ください用于告示、店员对客人，比てください郑重。"},{"id":"gr-teshimau","kind":"语法","title":"てしまう：后悔 vs 完了","items":[{"word":"Ｖてしまいました（後悔）","reading":"","zh":"不小心～了（后悔）","status":"已学：初中級 L5"},{"word":"Ｖてしまいます（完了）","reading":"","zh":"全部做完、赶快做掉","status":"已学：初中級 L9"}],"tip":"同一形式，用法不同。L5 带遗憾、不希望发生；L9 强调彻底做完（宿題を全部してしまう）。看语境和语气。实义动词「しまう」（把东西收起来）不要和补助动词混在一起。"},{"id":"gr-teoku","kind":"语法","title":"ておきます：准备 vs 放置；对比 てあります","items":[{"word":"Ｖておきます（準備）","reading":"","zh":"事先～好","status":"已学：初中級 L6"},{"word":"Ｖておきます（放置）","reading":"","zh":"就那样放着、保持状态","status":"已学：初中級 L9"},{"word":"Ｖてあります","reading":"","zh":"已经～好了／～着（结果留下）","status":"已学：初中級 L2、L6"}],"tip":"L6 ておく＝为将来做准备；L9 ておく＝先放着不管（窓を開けておく）。てあります着眼于已经完成、结果还在（窓が開けてある）。ておく主语常是自己要做的准备；てあります常用来描写看到的状态。"},{"id":"gr-kotonaru","kind":"语法","title":"ことになっています：规则 vs 预定","items":[{"word":"Ｖることになっています（規則）","reading":"","zh":"规定要～／不能～","status":"已学：初中級 L9 ST1"},{"word":"Ｖることになっています（予定）","reading":"","zh":"已经定好要～","status":"已学：初中級 L9 ST2"},{"word":"Ｖることにします","reading":"","zh":"自己决定要～","status":"课本：初中級 L12（后面的课）"}],"tip":"同一个「ことになっている」：ST1 讲公司、店铺的规矩；ST2 讲已经安排好的日程。都不是自己一个人临时决定的。自己决定要用「ことにする」（L12 才学）。"},{"id":"gr-sou","kind":"语法","title":"そうです：样子／预测／眼看就要／听说","items":[{"word":"Ａそうです（様態）","reading":"","zh":"看起来好像～","status":"已学：初中級 L2"},{"word":"～そうです（予測）","reading":"","zh":"看样子会～","status":"已学：初中級 L6"},{"word":"Ｖそうです（直前の様態）","reading":"","zh":"眼看就要～了","status":"已学：初中級 L9"},{"word":"～そうです（伝聞）","reading":"","zh":"听说～","status":"已学：初級 L15"}],"tip":"⚠️ 高频易混。L2 接形容词：美味しそう（看起来好吃）。L9 接动词ます形去ます：雨が降りそう（眼看要下）。L6 是对将来的预测。初級 L15 是传闻（听来的），常有「だ／です」或说明来源。传闻不能用「ます形＋そう」。"},{"id":"gr-jouken","kind":"语法","title":"条件：ば／たら／と／なら","items":[{"word":"条件形（ば）","reading":"","zh":"如果～的话（强调条件）","status":"已学：初中級 L9"},{"word":"Ｖたら","reading":"","zh":"～之后就／如果～","status":"已学：初中級 L3；初級 L15"},{"word":"Ｖると","reading":"","zh":"一～就（自然结果）","status":"已学：初中級 L4"},{"word":"～なら","reading":"","zh":"如果（你要）～的话","status":"已学：初中級 L1、L4"}],"tip":"拿不准时用「たら」最稳。ば强调条件本身，前项是动作时后项一般不用请求。と表示自然、必然结果，后项不能是意志、请求。なら用来接过对方的话题给建议。"},{"id":"gr-aida","kind":"语法","title":"ている間に vs とき；くします vs くなります","items":[{"word":"Ｖている間に","reading":"あいだに","zh":"在～的期间（趁着）做成某事","status":"已学：初中級 L7"},{"word":"～とき","reading":"とき","zh":"……的时候","status":"已学：初級 L11"},{"word":"イＡくします／ナＡにします","reading":"","zh":"把～弄成（人为）","status":"已学：初中級 L7"},{"word":"イＡくなります／ナＡになります","reading":"","zh":"变得～（变化）","status":"已学：初級 L10"}],"tip":"間に＝这段时间里的某个点做完；間（不加に）＝整段时间一直在做。とき只表示时间点。くします是人去改变（味を濃くする）；くなります是自己变成（寒くなる）。"},{"id":"gr-you","kind":"语法","title":"Ｖ（よ）う vs ましょう vs 意向 vs てみる","items":[{"word":"Ｖ（よ）う","reading":"","zh":"～吧（普通形提议／自己决定）","status":"已学：初中級 L9"},{"word":"Ｖましょう","reading":"","zh":"我们一起～吧","status":"已学：初級 L6；初中級 L6"},{"word":"Ｖ（よ）うと思っています","reading":"","zh":"打算～","status":"已学：初中級 L3"},{"word":"Ｖてみます","reading":"","zh":"试着做～看看","status":"已学：初中級 L2"},{"word":"Ｖ（よ）うとする","reading":"","zh":"正要做／想要做（未必要做成）","status":"书里没有"}],"tip":"（よ）う是ましょう的普通形，朋友间提议或自己下决心。加上「と思っています」表示一段时间以来的打算（L3）。てみる是先试一下看结果。书里没有「〜ようとする」，但考试常见：表示即将做或试图做，不一定成功，和てみる、意向形都容易混，要看清是不是课文条目。"},{"id":"gr-juju","kind":"语法","title":"授受：てあげる／てくれる／てもらう 和敬语","items":[{"word":"あげる／くれる／もらう","reading":"","zh":"给／给我／得到","status":"已学：初級 L8"},{"word":"Ｖてあげます／てくれます／てもらいます","reading":"","zh":"为别人做／为我做／请人做","status":"已学：初中級 L8"},{"word":"Ｖていただきます／てくださいます","reading":"","zh":"承蒙尊长为我做","status":"已学：初中級 L8"},{"word":"いただく／くださる","reading":"","zh":"领受（谦让）／给我（尊敬）","status":"已学：初中級 L8"}],"tip":"先分清方向：我为别人→てあげる；别人主动为我→てくれる；我请别人／承蒙别人→てもらう。对长辈：てあげる显得施恩，改用お〜します；てくれる→てくださる；てもらう→ていただく。不要和本课动词「上げる」（提高）混在一起。"},{"id":"gr-sonkei","kind":"语法","title":"尊敬语・谦让语・请…：おＶになります／します／ください","items":[{"word":"特別な尊敬語","reading":"","zh":"いらっしゃる、おっしゃる等","status":"已学：初中級 L7（L1 已出现いらっしゃいます）"},{"word":"おＶになります","reading":"","zh":"对方做～（一般尊敬）","status":"已学：初中級 L7"},{"word":"れる・られる（尊敬）","reading":"","zh":"尊敬，语气较轻","status":"已学：初中級 L7"},{"word":"おＶします／ごＮします","reading":"","zh":"我为对方做～（谦让）","status":"已学：初中級 L7"},{"word":"おＶください","reading":"","zh":"请对方～","status":"已学：初中級 L9"}],"tip":"⚠️ 长得很像：お書きになります＝对方写（尊敬）；お書きします＝我为您写（谦让）；お書きください＝请您写（请求）。主语不同，千万别混。"},{"id":"gr-reru","kind":"语法","title":"れる・られる：尊敬 vs 受身（后面的课）","items":[{"word":"れる・られる（尊敬）","reading":"","zh":"对对方动作的尊敬","status":"已学：初中級 L7"},{"word":"受身","reading":"うけみ","zh":"被～","status":"课本：初中級 L10（后面的课）"},{"word":"使役","reading":"しえき","zh":"让／叫某人做～","status":"课本：初中級 L13（后面的课）"}],"tip":"第7课的「れる・られる」是尊敬，不是被动。受身、使役要到 L10、L13 才学。看见「書かれました」先看主语：是上司写了（尊敬），还是东西被写了（被动）。现在考第7〜9课，先按尊敬掌握。"}],"counts":{"verbs":65,"adjs":14,"nouns":99,"others":28,"phrases":10,"grammar":24,"jita":26,"groups":34,"vocab_tsv":217,"by_lesson_vocab":{"7":76,"9":97,"8":44},"by_lesson_gram":{"7":7,"8":7,"9":10}},"lessons":{"7":{"title":"第7课","st":["初めての訪問","一緒に作りましょう"]},"8":{"title":"第8课","st":["うれしい出来事","お世話になりました"]},"9":{"title":"第9课","st":["アルバイト先のルール","楽しいアルバイト"]}}};
const STAR_KEY = "shochukyu_l7_9_stars_v1";
const state = { view:"overview", lesson:"all", onlyJita:false, onlyConf:false, onlyStar:false, q:"", slow:false, stars:new Set() };

try {
  const raw = JSON.parse(localStorage.getItem(STAR_KEY) || "[]");
  raw.forEach(id => state.stars.add(id));
} catch (e) {}

function saveStars(){
  localStorage.setItem(STAR_KEY, JSON.stringify([...state.stars]));
}
function hasStar(id){ return state.stars.has(id); }
function toggleStar(id){
  if (state.stars.has(id)) state.stars.delete(id); else state.stars.add(id);
  saveStars();
  render();
}

function ruby(s){
  if (!s) return "";
  return String(s).replace(/\{([^|{}]+)\|([^|{}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
}
function stripRuby(s){
  if (!s) return "";
  return String(s).replace(/\{([^|{}]+)\|([^|{}]+)\}/g, "$1");
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function safeRuby(s){ return ruby(escapeHtml(s).replace(/\{([^|{}]+)\|([^|{}]+)\}/g, "{$1|$2}").replace(/&lt;/g,"<").replace(/&gt;/g,">") ); }
/* escape then restore ruby braces content: do escape on raw then ruby on unescaped? Better: escape outside of ruby tokens */
function fmt(s){
  if (!s) return "";
  const parts = String(s).split(/(\{[^|{}]+\|[^|{}]+\})/g);
  return parts.map(p => {
    const m = p.match(/^\{([^|{}]+)\|([^|{}]+)\}$/);
    if (m) return "<ruby>"+escapeHtml(m[1])+"<rt>"+escapeHtml(m[2])+"</rt></ruby>";
    return escapeHtml(p);
  }).join("");
}

function speak(text){
  if (!window.speechSynthesis) return;
  const t = stripRuby(text);
  if (!t) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "ja-JP";
  u.rate = state.slow ? 0.7 : 1;
  window.speechSynthesis.speak(u);
}

function lessonBadge(n){
  return '<span class="badge b-l'+n+'">第'+n+'课</span>';
}
function viBadge(v){
  if (!v) return "";
  const map = {"自动词":"b-vi","他动词":"b-vt","自他兼用":"b-vp","尊敬语":"b-ho","谦让语":"b-hu"};
  return '<span class="badge '+(map[v]||"")+'">'+escapeHtml(v)+'</span>';
}

function inLesson(item){
  if (state.lesson === "all") return true;
  const n = Number(state.lesson);
  return (item.lessons || []).map(Number).includes(n) || Number(item.lesson)===n;
}
function matchesQuery(item, q){
  if (!q) return true;
  const blob = [
    item.key, item.word, item.reading, item.zh, item.en, item.note, item.tip,
    item.particle, item.pattern, item.conn, item.official, item.usage,
    ...(item.tips||[]),
    ...((item.confuse||[]).flatMap(c => [c.word,c.reading,c.zh,c.tip,c.status])),
    item.jita && [item.jita.word,item.jita.reading,item.jita.zh,item.jita.tip,item.jita.status],
    ...((item.examples||[]).flatMap(e => [e.jp,e.zh,e.say])),
    item.stTitle
  ].flat().filter(Boolean).join("\n").toLowerCase();
  return blob.includes(q);
}
function passFilters(item){
  if (!inLesson(item)) return false;
  if (state.onlyStar && !hasStar(item.id)) return false;
  if (state.onlyJita && !item.jita) return false;
  if (state.onlyConf && !(item.confuse && item.confuse.length) && item.kind!=="grammar") {
    /* grammar comparisons live in groups; still allow grammar if query hits */
    if (item.kind !== "grammar") return false;
  }
  if (!matchesQuery(item, state.q)) return false;
  return true;
}

function exHtml(ex){
  return (ex||[]).map(e =>
    '<div class="ex"><div class="meta">'+escapeHtml(e.src||"")+(e.ref?" · "+escapeHtml(e.ref):"")+'</div>'+
    '<div class="jp">'+fmt(e.jp)+' <button type="button" class="speak" data-say="'+escapeHtml(e.say||stripRuby(e.jp))+'">🔊</button></div>'+
    (e.zh?'<div class="zh">'+escapeHtml(e.zh)+'</div>':'')+'</div>'
  ).join("");
}
function confuseHtml(list){
  if (!list || !list.length) return "";
  return list.map(c =>
    '<div class="warn"><b>⚠️ 易混提示：</b>'+escapeHtml(c.word)+
    (c.reading?('（'+escapeHtml(c.reading)+'）'):'')+
    (c.zh?(' '+escapeHtml(c.zh)):'')+
    (c.status?(' · '+escapeHtml(c.status)):'')+
    (c.tip?('<br>'+escapeHtml(c.tip)):'')+
    '</div>'
  ).join("");
}
function jitaHtml(v){
  const j=v.jita; if(!j) return "";
  return '<div class="pair"><div class="lab">自他对照</div>'+
    '<div>'+escapeHtml(v.word)+'（'+escapeHtml(v.vi_vt||"")+'）↔ <b>'+escapeHtml(j.word)+'</b>'+
    (j.reading?('（'+escapeHtml(j.reading)+'）'):'')+' '+escapeHtml(j.zh||"")+
    ' · '+escapeHtml(j.role||"")+' · '+escapeHtml(j.status||"")+'</div>'+
    (j.tip?'<div class="tip">'+escapeHtml(j.tip)+'</div>':'')+'</div>';
}

function starBtn(id){
  return '<button type="button" class="star-btn'+(hasStar(id)?" on":"")+'" data-star="'+escapeHtml(id)+'" aria-label="收藏">⭐</button>';
}
function speakBtn(text){
  return '<button type="button" class="speak" data-say="'+escapeHtml(stripRuby(text))+'" aria-label="朗读">🔊</button>';
}

function vocabCard(item){
  const badges = (item.lessons||[]).filter(n=>n>=7&&n<=9).map(lessonBadge).join("") +
    viBadge(item.vi_vt) +
    (item.group?'<span class="badge">'+escapeHtml({5:"五段",1:"一段",s:"サ变",k:"カ变"}[item.group]||item.group)+'</span>':'')+
    (item.en?'<span class="badge b-loan">'+escapeHtml(item.word)+" → "+escapeHtml(item.en)+'</span>':'')+
    (hasStar(item.id)?'<span class="badge b-star">⭐</span>':'');
  return '<article class="card" data-id="'+escapeHtml(item.id)+'">'+
    '<div class="card-head"><div style="flex:1">'+
    '<h3>'+fmt(item.word)+'</h3>'+
    (item.reading?'<div class="reading">'+escapeHtml(item.reading)+'</div>':'')+
    '<div class="zh">'+escapeHtml(item.zh||"")+'</div></div>'+
    speakBtn(item.word)+starBtn(item.id)+'</div>'+
    '<div class="badges">'+badges+'</div>'+
    (item.particle?'<div class="particle">搭配：'+escapeHtml(item.particle)+'</div>':'')+
    (item.note?'<div class="note">'+escapeHtml(item.note)+'</div>':'')+
    (item.tip?'<div class="tip">'+escapeHtml(item.tip)+'</div>':'')+
    jitaHtml(item)+
    confuseHtml(item.confuse)+
    exHtml(item.examples)+
    '</article>';
}

function grammarCard(g){
  const badges = lessonBadge(g.lesson)+
    (g.st?('<span class="badge">ST'+g.st+' '+escapeHtml(g.stTitle||"")+'</span>'):'')+
    (g.usage?'<span class="badge">'+escapeHtml(stripRuby(g.usage))+'</span>':'')+
    (hasStar(g.id)?'<span class="badge b-star">⭐</span>':'');
  return '<article class="card" data-id="'+escapeHtml(g.id)+'">'+
    '<div class="card-head"><div style="flex:1">'+
    '<h3>'+fmt(g.pattern)+'</h3>'+
    '<div class="zh">'+escapeHtml(g.zh||"")+'</div></div>'+
    speakBtn(g.pattern)+starBtn(g.id)+'</div>'+
    '<div class="badges">'+badges+'</div>'+
    (g.conn?'<div class="particle">接续：'+fmt(g.conn)+'</div>':'')+
    (g.tips&&g.tips.length?'<div class="tip">'+g.tips.map(t=>fmt(t)).join("<br>"):'')+(g.tips&&g.tips.length?'</div>':'')+
    exHtml(g.examples)+
    '</article>';
}

function groupCard(gr){
  const blob = [gr.title, gr.tip, ...(gr.items||[]).flatMap(i=>[i.word,i.reading,i.zh,i.status])].join("\n").toLowerCase();
  if (state.q && !blob.includes(state.q)) return "";
  /* lesson filter: show if any item mentions L7/8/9 matching, or always for grammar groups when all */
  return '<article class="card group">'+
    '<div class="kind-tag">⚠️ '+escapeHtml(gr.kind)+'</div>'+
    '<h3>'+escapeHtml(gr.title)+'</h3>'+
    (gr.items||[]).map(i=>'<div class="item-line"><b>'+escapeHtml(i.word)+'</b>'+
      (i.reading?('（'+escapeHtml(i.reading)+'）'):'')+' '+escapeHtml(i.zh||"")+
      (i.status?(' <span class="reading">'+escapeHtml(i.status)+'</span>'):'')+'</div>').join("")+
    (gr.tip?'<div class="warn"><b>⚠️ 怎么区分：</b>'+escapeHtml(gr.tip)+'</div>':'')+
    '</article>';
}

function renderOverview(){
  const c = DATA.counts;
  let jita = DATA.jita.filter(row => {
    if (state.lesson==="all") return true;
    return (row.lessons||[]).map(Number).includes(Number(state.lesson));
  });
  if (state.q){
    const q=state.q;
    jita = jita.filter(r => JSON.stringify(r).toLowerCase().includes(q));
  }
  let html = '<p class="note">这一页按《できる日本語 初中級》第2版第7〜9课整理：动词 '+c.verbs+'、形容词 '+c.adjs+'、名词 '+c.nouns+'、副词／表达 '+c.others+'、词表例句 '+c.phrases+'，语法 '+c.grammar+' 条。词表合计 '+c.vocab_tsv+' 项。</p>';
  html += '<h2>🔄 第7〜9课 自他动词对照表</h2>';
  if (!jita.length) html += '<div class="empty">没有符合筛选的自他对。</div>';
  else {
    html += '<div class="jita-wrap"><table class="jita"><thead><tr><th>本课词</th><th>搭配</th><th>对照词</th><th>出处</th></tr></thead><tbody>';
    jita.forEach(r => {
      html += '<tr><td><b>'+escapeHtml(r.a)+'</b>（'+escapeHtml(r.ar)+'）'+escapeHtml(r.azh)+'<br>'+escapeHtml(r.arole)+'</td>'+
        '<td>'+escapeHtml(r.tip)+'</td>'+
        '<td><b>'+escapeHtml(r.b)+'</b>（'+escapeHtml(r.br)+'）'+escapeHtml(r.bzh)+'<br>'+escapeHtml(r.brole)+'</td>'+
        '<td>'+escapeHtml(r.bstatus)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '<h2>🔗 考前近义词・⚠️ 易混词／语法辨析</h2>';
  const kinds = ["音近","形近","义近","自他","语法"];
  kinds.forEach(k => {
    const gs = DATA.groups.filter(g => g.kind===k);
    if (!gs.length) return;
    const cards = gs.map(groupCard).filter(Boolean);
    if (!cards.length) return;
    html += '<h2 style="font-size:1.05rem">'+escapeHtml(k)+'</h2>'+cards.join("");
  });
  return html;
}

function listOrEmpty(items, renderFn){
  if (!items.length) return '<div class="empty">没有符合筛选的条目。</div>';
  return items.map(renderFn).join("");
}

function allItems(){
  return [].concat(DATA.verbs, DATA.adjs, DATA.others, DATA.phrases, DATA.nouns, DATA.grammar);
}

function render(){
  const stats = document.getElementById("stats");
  const c = DATA.counts;
  stats.innerHTML =
    '<span class="stat">词表 '+c.vocab_tsv+'</span>'+
    '<span class="stat">语法 '+c.grammar+'</span>'+
    '<span class="stat">自他对 '+c.jita+'</span>'+
    '<span class="stat">易混组 '+c.groups+'</span>'+
    '<span class="stat">⭐ '+state.stars.size+'</span>';

  document.getElementById("view-overview").innerHTML = renderOverview();
  document.getElementById("view-verbs").innerHTML = listOrEmpty(DATA.verbs.filter(passFilters), vocabCard);
  document.getElementById("view-adjs").innerHTML = listOrEmpty(
    DATA.adjs.concat(DATA.others, DATA.phrases).filter(passFilters), vocabCard);
  document.getElementById("view-nouns").innerHTML = listOrEmpty(DATA.nouns.filter(passFilters), vocabCard);
  document.getElementById("view-grammar").innerHTML = listOrEmpty(DATA.grammar.filter(passFilters), grammarCard);
  const starred = allItems().filter(it => hasStar(it.id) && inLesson(it) && matchesQuery(it, state.q));
  document.getElementById("view-stars").innerHTML = listOrEmpty(starred, it => it.kind==="grammar"?grammarCard(it):vocabCard(it));

  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id==="view-"+state.view));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view===state.view));
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => { state.view = btn.dataset.view; render(); window.scrollTo(0,0); });
});
document.querySelectorAll("#lesson-pills .pill").forEach(btn => {
  btn.addEventListener("click", () => {
    state.lesson = btn.dataset.lesson;
    document.querySelectorAll("#lesson-pills .pill").forEach(b => b.classList.toggle("active", b===btn));
    render();
  });
});
document.getElementById("f-jita").addEventListener("click", e => { state.onlyJita=!state.onlyJita; e.currentTarget.classList.toggle("active", state.onlyJita); render(); });
document.getElementById("f-conf").addEventListener("click", e => { state.onlyConf=!state.onlyConf; e.currentTarget.classList.toggle("active", state.onlyConf); render(); });
document.getElementById("f-star").addEventListener("click", e => { state.onlyStar=!state.onlyStar; e.currentTarget.classList.toggle("active", state.onlyStar); render(); });
document.getElementById("speed").addEventListener("click", e => {
  state.slow=!state.slow;
  e.currentTarget.textContent = state.slow ? "🔊 慢速" : "🔊 正常";
  e.currentTarget.classList.toggle("active", state.slow);
});
document.getElementById("search").addEventListener("input", e => {
  state.q = (e.target.value||"").trim().toLowerCase();
  render();
});
document.body.addEventListener("click", e => {
  const sp = e.target.closest("[data-say]");
  if (sp){ speak(sp.getAttribute("data-say")); return; }
  const st = e.target.closest("[data-star]");
  if (st){ toggleStar(st.getAttribute("data-star")); }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register(new URL("../sw.js", location.href)).catch(function(){});
}
render();
</script>
</body>
</html>
